.mov-lin .mq{flex:1;min-width:0}
.mov-lin .mq small{display:block;color:var(--tenue);font-size:11px;font-weight:700}
/* ---- menu de administracion ---- */
/* La tarjeta de aviso: se tiñe con los colores del tema, nunca fijos. */
.adm-card.adm-ojo{border-color:var(--senal);background:var(--f-cambio)}
.adm-card.adm-ojo b{color:var(--c-cambio)}
.adm-card.adm-ojo span{color:var(--c-cambio);opacity:.85}
/* ===== Cuadros tipo cajero =====
   En vez de una lista larga de tarjetas, cuadros grandes: se ve todo de
   un golpe y se toca a dónde entrar. El área de toque es el cuadro
   entero, para que sirva con el pulgar y sin puntería. */
/* Las opciones pasaron de bloques altos de dos columnas a renglones de
   uno. Con la descripcion tapada, un bloque alto queda medio vacio; en
   renglon caben LAS SIETE en una pantalla, que era el punto: ya no hay
   que bajar para ver que hay. */
.cajero{display:grid;grid-template-columns:1fr;gap:8px;margin-top:4px}
.caja{display:flex;flex-direction:row;align-items:center;gap:11px;
  padding:9px 12px;text-align:left;color:inherit;cursor:pointer;
  background:var(--carta);border:1.5px solid var(--linea);border-radius:13px;
  transition:transform .12s,background .16s;min-width:0}
.caja:active{transform:scale(.985);background:var(--verde-claro)}
.caja .ico{flex:0 0 auto;width:34px;height:34px;border-radius:10px;background:var(--verde-claro);
  display:flex;align-items:center;justify-content:center;font-size:20px;line-height:1;color:var(--verde)}
.caja .qq{flex:1;min-width:0}
.caja .nom{display:block;font-size:15px;font-weight:800;line-height:1.25;letter-spacing:-.012em}
.caja .des{display:block;font-size:11.5px;color:var(--tenue);line-height:1.35;margin-top:2px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
/* El display:block de arriba le gana al atributo hidden y la descripcion
   no se esconderia nunca. Ya paso una vez con .mv-cap en el mapa en vivo;
   se deja dicho para no volver a caer. */
.caja .des[hidden]{display:none}
.caja .cheu{flex:0 0 auto;color:var(--tenue);font-size:17px;opacity:.5;line-height:1}
.caja.ojo{border-color:var(--senal);background:var(--f-cambio)}
.caja.ojo .ico{background:var(--senal);color:#fff}
.caja.ojo .nom,.caja.ojo .des,.caja.ojo .cheu{color:var(--c-cambio)}
@media(min-width:760px){ .cajero{grid-template-columns:repeat(2,minmax(0,1fr))} }

/* La flechita. Va del tamano de la letra chiquita a proposito: es un
   ayudante, no un boton principal. */
.destapa{display:inline-flex;align-items:center;gap:6px;flex:0 0 auto;
  background:none;border:0;cursor:pointer;font:inherit;font-size:12px;font-weight:800;
  color:var(--tenue);padding:5px 4px;border-radius:8px}
.destapa .fl{display:inline-block;transition:transform .18s ease;font-size:11px;line-height:1}
.destapa[aria-expanded="true"]{color:var(--verde)}
.destapa[aria-expanded="true"] .fl{transform:rotate(90deg)}
.destapa:focus-visible{outline:2px solid var(--senal);outline-offset:2px}
.fila-destapa{display:flex;align-items:center;justify-content:space-between;gap:10px;
  margin:18px 0 8px}
.fila-destapa .eyebrow{margin:0}
.fila-destapa.fila-atras{margin:0 0 10px}
@media (prefers-reduced-motion:reduce){ .destapa .fl{transition:none} }

.adm-card{display:block;width:100%;text-align:left;border:1.5px solid var(--linea);

.adm-card b{display:block;font-size:17px;font-weight:800;letter-spacing:-.015em}
.adm-card span{display:block;font-size:13px;color:var(--tenue);margin-top:4px;line-height:1.4}
.adm-atras{background:none;border:0;color:var(--verde);font-size:14px;font-weight:800;
  padding:0 0 10px;letter-spacing:-.01em}
.adm-guia{font-size:13.5px;color:var(--tenue);line-height:1.5;margin:0 0 14px}
.vistas{display:flex;gap:6px;margin:0 0 10px}
.vistas button{flex:1;padding:9px;border-radius:10px;font-size:13px;font-weight:700;
  background:var(--carta);border:1.5px solid var(--linea)}
.vistas button[aria-pressed=true]{background:var(--tinta);border-color:var(--tinta);color:#fff}
.crono{position:fixed;left:10px;right:10px;bottom:calc(58px + env(safe-area-inset-bottom));z-index:36;
  background:var(--senal);color:var(--tinta);border-radius:13px;padding:11px 15px;display:flex;
  align-items:center;justify-content:space-between;gap:10px;box-shadow:0 5px 18px rgba(20,32,28,.28)}
.crono>div{min-width:0;flex:1}
.crono .eyebrow{display:block;color:#5A4408;margin-bottom:1px}
.crono b{display:block;font-size:17px;font-weight:800;letter-spacing:-.01em;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.crono button{flex:0 0 auto}
.crono button{background:var(--tinta);color:#fff;border-radius:9px;padding:8px 12px;font-size:13px;font-weight:800}
.foto-caja{margin-top:12px;position:relative}
.foto-caja img{width:100%;border-radius:11px;display:block;border:1px solid var(--linea)}
.foto-caja .quitar-f{position:absolute;top:8px;right:8px;background:var(--rojo);color:#fff;
  border-radius:8px;padding:6px 10px;font-size:12px;font-weight:800}
.tabla-eq{width:100%;border-collapse:collapse;font-size:13px;margin-top:8px}
.tabla-eq th{text-align:left;font-size:10px;letter-spacing:.08em;text-transform:uppercase;
  color:var(--tenue);padding:6px 5px;border-bottom:1px solid var(--linea)}
.tabla-eq td{padding:9px 5px;border-bottom:1px solid var(--linea)}
.tabla-eq td:last-child,.tabla-eq th:last-child{text-align:right}
.medalla{display:inline-flex;width:22px;height:22px;border-radius:50%;background:var(--papel);
  align-items:center;justify-content:center;font-size:11px;font-weight:800;margin-right:7px;color:var(--tenue)}
.medalla.o1{background:#FDF3D9;color:#7A5B00}
.barra.chica{height:6px;margin-top:7px}
.barra i.meta{background:linear-gradient(90deg,var(--c-cambio),var(--senal))}
#impresion{display:none}

@media print{.acciones,.kpi::before{display:none}}
@media print{
  body>*{display:none !important}
  #impresion{display:block !important;padding:0;font-family:ui-monospace,monospace;font-size:12px}
  .ticket{width:100%;max-width:280px;page-break-after:always;color:#000;
    font-family:ui-sans-serif,system-ui,sans-serif;font-size:11px;line-height:1.25}
  .ticket:last-child{page-break-after:auto}
  .ticket .logo{display:block;width:150px;margin:0 auto 4px}
  .ticket .cab{text-align:center;font-size:10px;line-height:1.2}
  .ticket .cab b{font-size:11px}
  .ticket .tit{text-align:center;font-size:13px;font-weight:800;margin:8px 0 2px}
  .ticket .ch{font-size:10px}
  /* Anchos fijos: sin esto, un nombre largo de producto empujaba las
     columnas de precio y total y todo se encimaba en el papel. */
  .ticket .det{width:100%;table-layout:fixed;border-collapse:collapse;margin-top:6px;font-size:10px}
  .ticket .det .enc td{font-weight:800;font-size:10px;padding-bottom:2px;
    border-bottom:1px solid #000}
  .ticket .det .nom{padding-top:4px;font-weight:600;overflow-wrap:anywhere;
    word-break:break-word;white-space:normal}
  .ticket .det td{vertical-align:top;padding:0 2px 0 0;overflow-wrap:anywhere}
  .ticket .det td:nth-child(1){width:16%}
  .ticket .det td:nth-child(2){width:34%}
  .ticket .det td:nth-child(3){width:24%}
  .ticket .det td:nth-child(4){width:26%;padding-right:0}
  .ticket .det .nom td, .ticket .det tr.nom{width:auto}
  .ticket .aviso-tk{border:1px solid #000;padding:3px 4px;margin-top:6px;
    font-size:9px;line-height:1.2;text-align:center;font-weight:700}
  .ticket .tot{width:100%;border-collapse:collapse;margin-top:6px;font-size:11px}
  .ticket .tot td{padding:1px 0}
  .ticket .tot .gran td{border-top:1px solid #000;border-bottom:3px double #000;
    font-size:13px;padding:2px 0}
  /* .cli es tambien la tarjeta del cliente en la ruta (fondo, borde, esquinas
     redondas, padding): en el papel salia una caja redonda alrededor de
     CLIENTE. Aqui se apaga todo eso. */
  .ticket .cli{display:block;background:none;border:0;border-radius:0;padding:0;
    margin:8px 0 0;font-size:11px;font-weight:700}
  .ticket .firma{margin-top:12px;border-bottom:1px solid #000;font-size:10px;padding-bottom:1px}
  .ticket .grax{text-align:center;font-size:10px;margin-top:8px}
  .ticket .der{text-align:right}
}
.apilada{display:flex;height:26px;border-radius:8px;overflow:hidden;background:var(--linea);margin:10px 0 0}
.apilada i{display:block;height:100%;transition:width .35s ease;position:relative}
.apilada i.v{background:var(--ok)} .apilada i.a{background:var(--senal)} .apilada i.r{background:var(--rojo)}
.apilada i span{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
  color:#fff;font-size:12px;font-weight:800}
.leyenda{display:flex;gap:14px;flex-wrap:wrap;margin-top:10px}
.leyenda span{display:flex;align-items:center;gap:6px;font-size:12px;font-weight:700;color:var(--tenue)}
.leyenda i{width:11px;height:11px;border-radius:3px;display:block}
.leyenda i.v{background:var(--ok)} .leyenda i.a{background:var(--senal)} .leyenda i.r{background:var(--rojo)}
.leyenda b{color:var(--tinta)}
.fila-eq{margin-top:14px;padding-top:12px;border-top:1px solid var(--linea)}
.fila-eq .cab{display:flex;justify-content:space-between;align-items:baseline;gap:9px}
.fila-eq .cab b{font-size:15px}
.fila-eq .cab span{font-size:12px;font-weight:700;color:var(--tenue)}
.apilada.fina{height:16px;margin-top:7px}
.apilada.fina i span{font-size:10px}
/* Las tarjetas se salian de la pantalla cuando el numero era largo
   (un monto con centavos, "0/1"): la rejilla no encogia y el texto
   empujaba. Con minmax(0,1fr) y el corte de palabra, se acomodan. */
.kpis{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-bottom:12px}
.kpi .num{overflow-wrap:anywhere;word-break:break-word;display:block}
.kpi span{display:block;overflow-wrap:anywhere}
.kpi{background:var(--carta);border:1px solid var(--linea);border-radius:var(--r);padding:13px;
  position:relative;overflow:hidden;min-width:0}
/* Las filas de botones tambien: si no caben dos, que bajen. */
#dia-cuerpo .fila{flex-wrap:wrap}
#dia-cuerpo .fila > *{flex:1 1 45%;min-width:0}
.kpi::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--c-vender)}
.kpis .kpi:nth-child(2)::before{background:var(--c-cambio)}
.kpis .kpi:nth-child(3)::before{background:var(--c-listo)}
.kpis .kpi:nth-child(4)::before{background:var(--c-mover)}
.kpi b{color:var(--tinta)}
.kpi b{display:block;font-size:26px;font-weight:800;letter-spacing:-.03em;margin-top:3px}
.poco{display:inline-block;margin-left:6px;font-size:10px;font-weight:800;background:#FBEDE9;color:var(--rojo);
  border-radius:5px;padding:2px 6px;vertical-align:2px}
@media (prefers-reduced-motion:reduce){*{transition:none !important}}

/* ============ vestido del panel de administracion ============
   La identidad ya existe: navy y dorado del logo sobre papel frio.
   Aqui solo se ordena y se firma: cada seccion abre con el hilo
   dorado, como asiento en el libro mayor de la oficina. */

#pant-admin header{
  box-shadow:0 1px 0 var(--linea), 0 8px 18px -16px rgba(19,24,38,.35)}
#pant-admin .marca b{font-size:21px;letter-spacing:-.02em}

/* pestañas: estante corrido con bordes que se desvanecen */
#pant-admin .pestanas{
  padding:2px 2px 12px;
  -webkit-mask-image:linear-gradient(90deg,transparent,#000 14px,#000 calc(100% - 22px),transparent);
  mask-image:linear-gradient(90deg,transparent,#000 14px,#000 calc(100% - 22px),transparent)}
#pant-admin .pestana{
  background:transparent;border:1.5px solid var(--linea);color:var(--tenue);
  transition:background .15s ease,color .15s ease,border-color .15s ease}
#pant-admin .pestana[aria-pressed=true]{
  background:var(--tinta);border-color:var(--tinta);color:#fff;
  box-shadow:0 3px 10px -4px rgba(19,24,38,.45)}

/* cuerpo: una sola columna comoda, tambien en tablet */
#admin-cuerpo{max-width:min(740px,100vw);margin:0 auto;
  padding:14px 14px calc(30px + env(safe-area-inset-bottom))}
/* Con la barra de abajo visible, el ultimo boton quedaba tapado. */
body.con-nav #admin-cuerpo{padding-bottom:calc(120px + env(safe-area-inset-bottom))}

/* tarjetas con relieve de papel */
#pant-admin .pasos,
#pant-admin .meta{
  box-shadow:0 1px 2px rgba(19,24,38,.05);
  padding:15px 16px}
#pant-admin .pasos{margin-top:14px}

/* la firma: el hilo dorado que abre cada seccion */
#pant-admin .pasos > .eyebrow,
#pant-admin .meta > .eyebrow{
  display:flex;align-items:center;gap:8px;color:var(--tinta)}
#pant-admin .pasos > .eyebrow::before,
#pant-admin .meta > .eyebrow::before{
  content:"";flex:0 0 16px;height:3px;border-radius:2px;background:var(--senal)}

/* cifras del dia */
#pant-admin .kpis{gap:11px}
#pant-admin .kpi{
  box-shadow:0 1px 2px rgba(19,24,38,.05);
  border-top:3px solid var(--verde-claro)}
#pant-admin .kpi .eyebrow{font-size:10px}
#pant-admin .kpi b{font-size:27px}

/* tablas: renglones de libro, con sombra alterna */
#pant-admin table.lista thead th{background:var(--papel);border-bottom:1.5px solid var(--linea)}
#pant-admin table.lista tbody tr:nth-child(even) td{background:#FAFBFD}
#pant-admin table.lista td{padding:10px 5px}

/* selector Hoy / Este mes: un solo riel */
#pant-admin .vistas{
  background:var(--carta);border:1.5px solid var(--linea);border-radius:12px;padding:3px;gap:3px}
#pant-admin .vistas button{border:none;border-radius:9px;background:transparent;color:var(--tenue)}
#pant-admin .vistas button[aria-pressed=true]{background:var(--tinta);color:#fff}

/* filas de cuentas, cargos y transferencias */
#pant-admin .cuota-fila{
  padding:8px 0;border-bottom:1px solid var(--verde-claro)}
#pant-admin .cuota-fila:last-child{border-bottom:none}

#pant-admin .abc{display:inline-block;min-width:17px;text-align:center;border-radius:5px;
  font-size:10px;padding:1px 3px;color:#fff;margin-right:5px}
#pant-admin .abc-A{background:var(--ok)}
#pant-admin .abc-B{background:var(--senal)}
#pant-admin .abc-C{background:var(--tenue)}
#pant-admin .conteo{line-height:1.55}
#pant-admin .btn.chico{min-height:34px}

/* transferencia: un renglon por toque, con todo lo que hace falta para cotejar */
#pg-lista .pg-fila{
  display:block;width:100%;text-align:left;background:transparent;border:none;
  padding:11px 0;border-bottom:1px solid var(--verde-claro);cursor:pointer}
#pg-lista .pg-fila:last-child{border-bottom:none}
#pg-lista .pg-arriba{
  display:flex;justify-content:space-between;gap:10px;align-items:baseline;
  font-size:15px;font-weight:800;color:var(--tinta)}
#pg-lista .pg-abajo{
  display:block;margin-top:3px;font-size:11.5px;color:var(--tenue);font-weight:700}

@media (prefers-reduced-motion: reduce){
  #pant-admin .pestana{transition:none}
}

/* ---- la cabecera de oficina: tinta y dorado del logo ---- */
#pant-admin header{
  background:var(--tinta);border-bottom:1px solid #232A44;
  box-shadow:0 10px 22px -16px rgba(19,24,38,.6)}
#pant-admin .marca b{color:#fff}
#pant-admin header .cat{
  background:rgba(255,255,255,.08);border-color:rgba(255,255,255,.24);color:#E8EBF4}
#pant-admin .pestana{border-color:rgba(255,255,255,.2);color:#AAB2C8}
#pant-admin .pestana[aria-pressed=true]{
  background:var(--senal);border-color:var(--senal);color:var(--tinta);
  box-shadow:0 4px 14px -5px rgba(216,154,22,.65)}

/* ---- TODA la app queda quieta en horizontal: nada se corre ni se tapa ---- */
.pantalla{overflow-x:clip}
#ruta-cuerpo,#dia-cuerpo,#cat-cuerpo,#hoja-cuerpo{overflow-x:clip}
#hoja-cuerpo .lin,.tarjeta-cli{min-width:0}
#hoja-cuerpo .n,#hoja-cuerpo .d,.tarjeta-cli h3{overflow-wrap:anywhere}
#pant-admin{overflow-x:clip;max-width:100vw}
#admin-cuerpo{overflow-x:clip}
/* ningun hijo directo de la pantalla puede pasarse del ancho */
#admin-cuerpo>*{max-width:100%;min-width:0}
/* Un <select> sin ancho se estira hasta donde le da su opcion mas
   larga, y de ahi empuja todo lo demas. Que se quede en su caja. */
#admin-cuerpo select{width:100%;min-width:0}
#admin-cuerpo table.lista{max-width:100%}
#admin-cuerpo input,#admin-cuerpo select,#admin-cuerpo textarea{max-width:100%}
#admin-cuerpo pre,#admin-cuerpo img{max-width:100%}
#pant-admin .cuota-fila{min-width:0}
#pant-admin .cuota-fila .quien{min-width:0;overflow-wrap:anywhere}
#pant-admin .conteo{overflow-wrap:anywhere}

/* ===================== Administrar: el tablero =====================
   La pantalla que pidio Brayan (3 sep 2026): menu lateral, seis
   tarjetas, grafica de la semana, dona de estados, actividad, tablas y
   acciones rapidas. En telefono el menu se esconde y sale con las tres
   rayas. Todo con prefijo tb- para no chocar con lo demas. */
#pant-admin{flex-direction:row;align-items:stretch}
.tb-lado{flex:0 0 226px;width:226px;background:#1D2340;color:#C9CFE0;display:flex;flex-direction:column;
  position:sticky;top:0;height:100dvh;overflow:auto;z-index:30;scrollbar-width:thin}
html[data-estilo="noche"] .tb-lado{background:#080B14}
.tb-logo{padding:18px 18px 10px;display:flex;align-items:center}
.tb-logo img{height:30px;width:auto;display:block}
.tb-sec{font-size:10.5px;letter-spacing:.11em;text-transform:uppercase;color:rgba(255,255,255,.45);padding:14px 20px 5px;font-weight:800}
.tb-nav{display:flex;flex-direction:column;gap:2px;padding:0 10px}
.tb-nav button{display:flex;align-items:center;gap:11px;padding:8px 11px;border-radius:9px;color:#C9CFE0;font-size:13.5px;font-weight:600;text-align:left;width:100%}
.tb-nav button svg,.tb-ico{width:17px;height:17px;flex:0 0 17px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.tb-nav button:hover{background:rgba(255,255,255,.08);color:#fff}
.tb-nav button[aria-pressed=true]{background:#D89A16;color:#1D2340}
.tb-pie{margin-top:auto;padding:14px 16px 16px;border-top:1px solid rgba(255,255,255,.12);font-size:12px;color:rgba(255,255,255,.55)}
.tb-pie b{display:block;color:#fff;font-size:13px}
.tb-pie .tb-version{display:flex;justify-content:space-between;align-items:center;margin-top:10px;font-variant-numeric:tabular-nums}
.tb-pie .tb-version button{color:#D89A16;font-weight:800;font-size:12.5px}
.tb-cuerpo{flex:1;min-width:0;display:flex;flex-direction:column}
/* La cabecera de Administrar era navy con letra blanca; el tablero la
   pide blanca, como la foto. Se corrige aqui lo que venia de esa regla. */
#pant-admin header{background:var(--carta);border-bottom-color:var(--linea);box-shadow:none}
html[data-estilo="noche"] #pant-admin header{background:var(--carta);border-bottom-color:var(--linea)}
#pant-admin .marca b{color:var(--tinta)}
#pant-admin header .cat{background:var(--papel);border-color:var(--linea);color:var(--tinta)}
#pant-admin .pestana{border-color:var(--linea);color:var(--tenue);background:var(--papel)}
#pant-admin.tb-portada #admin-cuerpo{max-width:none}
.tb-cab{gap:12px}
.tb-ham{display:none;width:36px;height:36px;border-radius:9px;align-items:center;justify-content:center;flex:0 0 36px}
.tb-ham svg{width:20px;height:20px;stroke:currentColor;stroke-width:2;stroke-linecap:round;fill:none}
.tb-titulo{flex-direction:column;align-items:flex-start;gap:0;min-width:0}
.tb-titulo b{font-size:19px;line-height:1.15;white-space:nowrap}
#pant-admin .tb-sub{font-size:12px;color:var(--tenue);font-weight:600;letter-spacing:0;text-transform:none;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.tb-busca{position:relative;margin-left:auto;width:300px;max-width:38%}
.tb-busca input{width:100%;border-radius:10px;border:1px solid var(--linea);background:var(--papel);padding:8px 12px;font-size:13px}
.tb-res{position:absolute;top:calc(100% + 6px);left:0;right:0;background:var(--carta);border:1px solid var(--linea);border-radius:12px;
  box-shadow:0 8px 24px rgba(0,0,0,.16);z-index:60;max-height:60vh;overflow-y:auto}
.tb-res button{display:flex;align-items:center;gap:10px;width:100%;text-align:left;padding:9px 12px;border-bottom:1px solid var(--linea);font-size:13px}
.tb-res button:last-child{border-bottom:0}
.tb-res button:hover{background:var(--papel)}
.tb-res .tb-tipo{font-size:10.5px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--tenue);flex:0 0 64px}
.tb-res b{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tb-res .num{color:var(--tenue);font-weight:700;white-space:nowrap}
.tb-res .tb-nada{padding:10px 12px;font-size:13px;color:var(--tenue)}
.tb-ic{position:relative;width:36px;height:36px;border-radius:9px;display:flex;align-items:center;justify-content:center;color:var(--tenue);flex:0 0 36px}
.tb-ic svg{width:19px;height:19px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.tb-ic .globo{top:2px;left:auto;right:1px;margin:0}
.tb-quien{display:flex;align-items:center;gap:9px;padding-left:10px;border-left:1px solid var(--linea);cursor:pointer;border-radius:9px}
.tb-quien:hover{background:var(--papel)}
.tb-av{width:34px;height:34px;border-radius:99px;background:var(--verde);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:12.5px;flex:0 0 34px}
.tb-quien b{display:block;font-size:13px;line-height:1.15;white-space:nowrap}
.tb-quien small{color:var(--tenue);font-size:11.5px;font-weight:600}
.tb{display:grid;gap:14px}
.tb-fecha{display:flex;justify-content:flex-end}
.tb-fecha span{display:inline-flex;align-items:center;gap:8px;background:var(--carta);border:1px solid var(--linea);border-radius:9px;padding:6px 12px;font-size:12.5px;font-weight:600;color:var(--tenue)}
.tb-fecha b{color:var(--tinta)}
.tb-fecha svg{width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:2}
.tb-card{background:var(--carta);border:1px solid var(--linea);border-radius:14px;min-width:0;box-shadow:0 1px 2px rgba(19,24,38,.04)}
.tb-tit{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:14px 16px 6px}
.tb-tit h2{font-size:14.5px;margin:0;font-weight:800;letter-spacing:0}
.tb-sel{font-size:12px;color:var(--tenue);border:1px solid var(--linea);border-radius:8px;padding:3px 9px;background:var(--papel);font-weight:700;white-space:nowrap}
.tb-ver{display:block;width:100%;text-align:center;padding:10px 16px 13px;font-size:12.5px;font-weight:800;color:#1A6FE0}
html[data-estilo="noche"] .tb-ver{color:#5A9BFF}
.tb-kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
@media (min-width:1400px){ .tb-kpis{grid-template-columns:repeat(6,1fr)} }
.tb-kpi{display:flex;align-items:center;gap:13px;padding:15px 15px 13px;position:relative;overflow:hidden;text-align:left;width:100%}
.tb-kpi>div{min-width:0}
.tb-cir{width:46px;height:46px;border-radius:99px;display:flex;align-items:center;justify-content:center;flex:0 0 46px}
.tb-kpi .tb-cir svg{width:22px;height:22px;stroke:#fff;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.tb-et{font-size:12px;color:var(--tenue);font-weight:700}
.tb-kpi .tb-n{font-size:23px;font-weight:800;letter-spacing:-.02em;font-variant-numeric:tabular-nums;line-height:1.1;margin:2px 0 3px}
.tb-kpi .tb-n small{font-size:13px;color:var(--tenue);font-weight:700}
.tb-d{font-size:11.5px;font-weight:700;color:var(--tenue);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tb-d.up{color:var(--c-listo)} .tb-d.dn{color:var(--c-perdido)} .tb-d.ir{color:#1A6FE0}
.tb-kpi.hoy::after{content:"";position:absolute;left:0;right:0;bottom:0;height:3px;background:var(--senal)}
.c-senal{background:#D89A16}.c-navy{background:#1D2340}.c-mover{background:#5B6BA6}.c-azul{background:#1A6FE0}.c-ok{background:#1F7A4D}.c-perdido{background:#A93226}
.tb-f2{display:grid;grid-template-columns:1.55fr 1fr 1.05fr;gap:14px}
.tb-f3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:14px}
.tb-f4{display:grid;grid-template-columns:1.7fr 1fr;gap:14px}
.tb-col{display:grid;gap:14px;align-content:start}
.tb-graf{padding:0 12px 8px}
.tb-graf svg{width:100%;height:auto;display:block}
.tb-graf text{font-size:11px;fill:var(--tenue)}
.tb-graf .g{stroke:var(--linea);stroke-width:1}
.tb-graf .l{stroke:#1A6FE0;stroke-width:2.5;fill:none;stroke-linejoin:round;stroke-linecap:round}
.tb-graf .a{fill:#1A6FE0;opacity:.1}
.tb-graf .p{fill:var(--carta);stroke:#1A6FE0;stroke-width:2.5}
.tb-graf .p.hoy{fill:#1A6FE0}
.tb-graf .o{stroke:var(--linea);stroke-width:2.5;stroke-dasharray:3 5}
.tb-graf .n{font-size:10.5px}
.tb-dona{display:flex;flex-direction:column;align-items:stretch;gap:12px;padding:6px 16px 16px}
.tb-dona svg{margin:0 auto}
.tb-dona svg{width:132px;height:132px;flex:0 0 132px}
.tb-dona ul{list-style:none;margin:0;padding:0;display:grid;gap:7px;flex:1;min-width:0}
.tb-dona li{display:flex;align-items:center;gap:7px;font-size:12px;min-width:0}
.tb-dona li span{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tb-dona li i{width:9px;height:9px;border-radius:99px;flex:0 0 9px}
.tb-dona li b{margin-left:auto;font-variant-numeric:tabular-nums;white-space:nowrap}
.tb-dona li small{color:var(--tenue);font-weight:700}
.tb-dona .c1{font-size:22px;font-weight:800;fill:var(--tinta)}
.tb-dona .c2{font-size:10px;fill:var(--tenue)}
.tb-acti{list-style:none;margin:0;padding:4px 16px}
.tb-acti li{display:flex;gap:11px;padding:8px 0;border-bottom:1px solid var(--linea);align-items:flex-start}
.tb-acti li:last-child{border-bottom:0}
.tb-acti .tb-cir{width:32px;height:32px;border-radius:9px;flex-basis:32px}
.tb-acti .tb-cir svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.tb-acti>li>div{min-width:0;flex:1}
.tb-acti b{display:block;font-size:12.5px;line-height:1.25}
.tb-acti small{display:block;color:var(--tenue);font-size:11.5px;margin-top:1px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tb-acti time{margin-left:auto;font-size:11px;color:var(--tenue);white-space:nowrap;padding-top:2px}
.tb-tabla{padding:0 8px;overflow-x:auto}
.tb-t{width:100%;border-collapse:collapse;font-size:12.5px}
.tb-t th{font-size:11px;color:var(--tenue);font-weight:700;text-align:left;padding:7px 8px;border-bottom:1px solid var(--linea);white-space:nowrap}
.tb-t td{padding:8px;border-bottom:1px solid var(--linea);vertical-align:middle}
.tb-t tr:last-child td{border-bottom:0}
.tb-t .n{text-align:right;white-space:nowrap}
.tb-t .b{font-weight:800}
.tb-t .idx{color:var(--tenue);width:22px}
.tb-t .nom{max-width:190px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tb-f3 .tb-t .nom{max-width:132px}
.tb-t .tb-av{display:inline-flex;width:22px;height:22px;flex-basis:22px;background:var(--verde-claro);color:var(--verde);font-size:10px;margin-right:7px;vertical-align:middle}
.tb-t .fam{display:inline-block;width:8px;height:8px;border-radius:2px;margin-right:7px;vertical-align:middle}
.tb-pill{display:inline-block;padding:2px 9px;border-radius:99px;font-size:11px;font-weight:800;white-space:nowrap}
.tb-pill.listo{background:var(--f-listo);color:var(--c-listo)}.tb-pill.cambio{background:var(--f-cambio);color:var(--c-cambio)}
.tb-pill.perdido{background:var(--f-perdido);color:var(--c-perdido)}.tb-pill.mover{background:var(--f-mover);color:var(--c-mover)}
.tb-pill.senal{background:#FAF0DA;color:#8A6210}.tb-pill.marcar{background:var(--f-marcar);color:var(--c-marcar)}
html[data-estilo="noche"] .tb-pill.senal{background:#2E2617;color:#E0A33A}
.tb-ojo{width:28px;height:28px;border-radius:7px;background:#E4EEFC;color:#1A6FE0;display:inline-flex;align-items:center;justify-content:center}
html[data-estilo="noche"] .tb-ojo{background:#16233D;color:#5A9BFF}
.tb-ojo svg{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.tb-acc{display:grid;grid-template-columns:1fr 1fr 1fr;gap:9px;padding:6px 16px 16px}
.tb-acc button{display:flex;flex-direction:column;align-items:center;gap:6px;padding:12px 6px 10px;border-radius:11px;border:1px solid var(--linea);font-size:11.5px;font-weight:800;background:var(--papel)}
.tb-acc button svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.tb-acc .a1{color:var(--c-vender);background:var(--f-vender)}.tb-acc .a2{color:var(--c-listo);background:var(--f-listo)}
.tb-acc .a3{color:var(--c-mover);background:var(--f-mover)}.tb-acc .a4{color:#1A6FE0;background:#E4EEFC}
.tb-acc .a5{color:var(--c-cambio);background:var(--f-cambio)}.tb-acc .a6{color:var(--c-perdido);background:var(--f-perdido)}
html[data-estilo="noche"] .tb-acc .a4{background:#16233D;color:#5A9BFF}
.tb-res4{display:grid;grid-template-columns:1fr 1fr;padding:4px 16px 14px}
.tb-res4 div{padding:9px 0;border-bottom:1px solid var(--linea);min-width:0}
.tb-res4 div:nth-child(odd){border-right:1px solid var(--linea);padding-right:12px}
.tb-res4 div:nth-child(even){padding-left:12px}
.tb-res4 div:nth-last-child(-n+2){border-bottom:0}
.tb-res4 .tb-n{font-size:19px;font-weight:800;font-variant-numeric:tabular-nums;letter-spacing:-.02em;margin:2px 0}
.tb-res4 .tb-d{font-size:11px}
.tb-pieapp{text-align:center;font-size:12px;color:var(--tenue);padding:6px 0 4px}
.tb-vacio{padding:12px 16px 18px;font-size:13px;color:var(--tenue)}
.tb-velo{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:1440;display:none}
.tb-avisos{display:grid;gap:10px;margin-bottom:12px}
@media (min-width:900px){
  #pant-admin #pestanas{display:none !important}
  /* en PC el menu lateral ya lleva todo; la barra de abajo solo tapaba */
  body.con-nav .nav{display:none}
  body.con-nav #admin-cuerpo{padding-bottom:40px}
}
@media (max-width:899px){
  #pant-admin{flex-direction:column}
  .tb-lado{position:fixed;left:0;top:0;bottom:0;width:262px;height:100dvh;transform:translateX(-100%);transition:transform .2s;z-index:1450}
  #pant-admin.tb-abierto .tb-lado{transform:none}
  #pant-admin.tb-abierto .tb-velo{display:block}
  .tb-ham{display:flex}
  .tb-titulo b{font-size:17px}
  .tb-sub{display:none}
  .tb-cab{flex-wrap:wrap}
  .tb-busca{order:10;width:100%;max-width:100%;margin:6px 0 0;flex:1 1 100%}
  .tb-quien{display:none}
  .tb-titulo{flex:1;min-width:0}
  .tb-ic{margin-left:auto}
  .tb-d{white-space:normal;font-size:11px;line-height:1.25}
  .tb-kpis{grid-template-columns:1fr 1fr;gap:9px}
  .tb-kpi{padding:12px 12px 11px;gap:10px}
  .tb-kpi .tb-cir{width:40px;height:40px;flex-basis:40px}
  .tb-kpi .tb-n{font-size:20px}
  .tb-f2,.tb-f3,.tb-f4{grid-template-columns:1fr}
  .tb-fecha{justify-content:flex-start}
}
@media (prefers-reduced-motion:reduce){.tb-lado{transition:none}}
/* ===== Ficha por persona (modelo: Detalles de usuario de Handy) ===== */
.fi-cab{display:flex;align-items:center;gap:12px;background:var(--carta);border:1px solid var(--linea);border-radius:14px;padding:14px 16px;flex-wrap:wrap}
.fi-av{width:48px;height:48px;flex-basis:48px;font-size:16px}
.fi-quien{flex:1;min-width:200px;display:grid;gap:2px}
.fi-quien>b{font-size:17px;line-height:1.15}
.fi-quien small{font-size:12.5px;color:var(--tenue);font-weight:600}
.fi-quien small b{color:var(--tinta)}
.fi-sel{max-width:240px;border:1px solid var(--linea);border-radius:10px;padding:8px 10px;background:var(--papel);font-size:13.5px;font-weight:700}
.fi-rango{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-top:10px}
.fi-rango label{display:flex;align-items:center;gap:6px;font-size:12.5px;font-weight:700;color:var(--tenue)}
.fi-rango input{border:1px solid var(--linea);border-radius:9px;padding:6px 8px;background:var(--carta);font-size:13px}
.fi-atajos{display:flex;gap:6px;flex-wrap:wrap}
.fi-atajos button{padding:6px 11px;border-radius:99px;border:1px solid var(--linea);background:var(--carta);font-size:12.5px;font-weight:700}
.fi-atajos button:hover{background:var(--papel)}
.fi-act{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:16px}
.fi-act h2{font-size:16px;margin:0;display:flex;align-items:center;gap:8px}
.fi-act h2 svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.fi-tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:10px}
.fi-tile{background:var(--carta);border:1px solid var(--linea);border-radius:12px;padding:12px 14px 11px;min-width:0}
.fi-tile .tb-et{display:flex;justify-content:space-between;gap:8px}
.fi-tile .tb-et span{color:var(--tinta)}
.fi-n{font-size:22px;font-weight:800;letter-spacing:-.02em;font-variant-numeric:tabular-nums;line-height:1.1;margin:3px 0 2px}
.fi-n small{font-size:13px;color:var(--tenue);font-weight:700}
.fi-tabs{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;margin-top:14px;border-bottom:1px solid var(--linea);padding-bottom:0}
.fi-tabs::-webkit-scrollbar{display:none}
.fi-tabs button{flex:0 0 auto;padding:9px 12px;font-size:13px;font-weight:700;color:var(--tenue);border-bottom:2px solid transparent;margin-bottom:-1px;display:flex;align-items:center;gap:6px}
.fi-tabs button i{font-style:normal;font-size:11px;background:var(--papel);border:1px solid var(--linea);border-radius:6px;padding:1px 6px;color:var(--tenue)}

<script src="leaflet.js"></script>
<script>
/* ---- Trampa del mapa muerto ----
   El error "_leaflet_pos" nace siempre en el mismo lugar de Leaflet:
   _getMapPanePos, que va a leer la posicion del panel del mapa. Si ese
   panel ya no existe, truena. Lo que el reporte NO dice es QUIEN lo
   mando a llamar, porque la lista de llamadas se corta en las tres
   lineas de adentro de Leaflet.

   Esto se mete en medio de esa funcion. Cuando el panel falta hace dos
   cosas: anota la lista COMPLETA de llamadas, con el nombre de la
   funcion nuestra que empezo todo, y devuelve cero en vez de tronar,
   para que el pintado siga y no se rompa la pantalla.

   Es temporal. Cuando el reporte diga el nombre, se arregla ahi y esto
   se quita. */
(function(){
  function poner(){
    if (!window.L || !L.Map || !L.Map.prototype._getMapPanePos) return false;
    if (L.Map.prototype._getMapPanePos.__trampa) return true;
    var original = L.Map.prototype._getMapPanePos;
    var nueva = function(){
      if (!this._mapPane){
        try {
          window.TRAMPA_MAPA = window.TRAMPA_MAPA || [];
          if (window.TRAMPA_MAPA.length < 6){
            var pila = "";
            try { pila = String(new Error("mapa muerto").stack || ""); } catch(e){}
            // se quitan las lineas de adentro de leaflet para que quede
            // a la vista la funcion nuestra que lo llamo
            var utiles = pila.split("\n").filter(function(l){
              return l.indexOf("leaflet.js") === -1 && l.indexOf("Error") === -1;
            }).slice(0, 6).join(" | ");
            window.TRAMPA_MAPA.push({
              hora: new Date().toLocaleTimeString(),
              quien: utiles || "(sin pila)"
            });
          }
        } catch(e){}
        return L.point(0, 0);
      }
      return original.apply(this, arguments);
    };
    nueva.__trampa = true;
    L.Map.prototype._getMapPanePos = nueva;
    return true;
  }
  if (!poner()){
    var t = setInterval(function(){ if (poner()) clearInterval(t); }, 200);
    setTimeout(function(){ clearInterval(t); }, 8000);
  }
})();
</script>
<script>
/* ---- De donde sale Leaflet ----
   ANTES venia de unpkg.com, o sea de internet. En la calle, con senal
   mala o sin senal, no bajaba: el objeto L no existia, y todo lo que lo
   tocaba tronaba. Ese es el "L is not defined" y el mapa gris.

   AHORA viaja dentro de la app, junto al index.html. No depende de nadie
   y el service worker lo guarda igual que los iconos. Los dos servidores
   de abajo quedan de respaldo por si el archivo local se corrompiera:
   se prueban en orden y solo si el de adentro no sirve. */
(function(){
  function sirve(){ return window.L && L.version && typeof L.map === "function"; }
  if (sirve()) return;
  var respaldos = [
    "https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.js",
    "https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
  ];
  (function siguiente(i){
    if (i >= respaldos.length) return;
    var sc = document.createElement("script");
    sc.src = respaldos[i];
    sc.crossOrigin = "anonymous";
    sc.onload = function(){
      if (sirve()){ if (window.LEAFLET_LISTO) window.LEAFLET_LISTO(); }
      else siguiente(i + 1);
    };
    sc.onerror = function(){ siguiente(i + 1); };
    document.head.appendChild(sc);
  })(0);
})();
</script>

<script>
"use strict";
const VERSION = "5.4.7";
/* La jornada que de verdad manda esta en las reglas de Firestore, no aqui.
   Este texto es SOLO para poder decirselo a la gente en el aviso de error.
   Si algun dia se mueve enJornada() en las reglas, hay que moverlo aqui.
   Hoy: 19800000 ms = 5:30 a. m. y 67500000 ms = 6:45 p. m. */
const JORNADA_SERVIDOR = "4:30 a. m. a 9:30 p. m.";

/* ===================== Cazador de errores =====================
   Cuando algo revienta a medio pintar, la pantalla se queda dibujada
   pero los botones nunca se conectan: parece que la app "se trabo".
   Antes eso se perdia en silencio. Ahora se guarda, se avisa en
   pantalla y queda en el Diagnostico para poder arreglarlo. */
const ERRORES = [];
function anotarError(donde, e){
  const msj = (e && (e.message || e.reason || e)) + "";
  const linea = (e && e.filename ? (" · linea " + e.lineno) : "");
  ERRORES.unshift({
    cuando: new Date().toLocaleTimeString(),
    donde: donde,
    msj: msj.slice(0, 200) + linea,
    pila: (e && e.error && e.error.stack ? e.error.stack : (e && e.stack ? e.stack : "")).split("\n").slice(0,4).join(" | ")
  });
  if (ERRORES.length > 8) ERRORES.pop();
  try {
    let c = document.getElementById("err-aviso");
    if (!c){
      c = document.createElement("div");
      c.id = "err-aviso";
      c.style.cssText = "position:fixed;left:10px;right:10px;bottom:calc(74px + env(safe-area-inset-bottom));" +
        "z-index:120;background:#8E1B10;color:#fff;border-radius:12px;padding:11px 13px;" +
        "font-size:13px;font-weight:700;line-height:1.35;box-shadow:0 8px 24px rgba(0,0,0,.35)";
      document.body.appendChild(c);
      c.onclick = () => c.remove();
    }
    /* El aviso DICE que fue. Antes solo decia "algo fallo" y para saber
       que era habia que ir a Diagnostico, buscarlo y mandarlo. Con el
       mensaje aqui, una foto de la pantalla ya sirve para arreglarlo. */
    c.innerHTML = '<b>Algo falló y la pantalla quedó a medias.</b>' +
      '<div style="font-weight:600;opacity:.92;margin-top:4px;font-size:12px;' +
      'word-break:break-word">' + escapar(msj.slice(0, 120)) + '</div>' +
      '<div style="font-weight:600;opacity:.75;margin-top:4px;font-size:11px">' +
      'Cierre y vuelva a abrir · el detalle está en Diagnóstico · toque para cerrar</div>';
  } catch(x){}
}
window.addEventListener("error", e => anotarError("pantalla", e));
window.addEventListener("unhandledrejection", e => anotarError("nube", e));

/* ===================== estado ===================== */
const S = {
  usuario:null, rol:null, nombre:"",
  catalogo:[], catVersion:0,
  costos:null,            // solo se carga si la cuenta es admin
  miCuenta:null,          // su comision del mes, ya calculada por oficina
  abc:null,               // clasificacion A/B/C del mes, solo en administracion
  /* La jornada tiene que ser la misma que la de las reglas de Firestore
     (5:30 a 18:45). Si aqui va vacia, el telefono cree que esta abierto,
     manda el pedido normal y el servidor se lo rebota. */
  catAbiertas:{},
  ajustes:{margenGeneral:25, pin:"", oficinaLleva:{}, diasEntrega:2, noLaborables:[0,6], horaInicio:"05:30", horaCierre:"18:45",
    /* dias para recuperar el capital, por familia; "*" es el resto. Oficina: pollo 8, lo demas 30 */
    diasCapital:{"*":30, "Crudos":8},
    codPrefijo:"", codDesde:1, cuentas:[],
    /* Geocerca: radio en metros alrededor del punto del cliente.
       modo "apagado" (por defecto) deja todo como antes. */
    geocerca:{modo:"apagado", metros:300}},
  costosVisibles:false,   // se apaga al cerrar la app
  filtroCat:"", busqueda:"", abierto:null, toques:0,
  /* --- pedidos --- */
  pagina:"ruta", sectores:[], clientes:[], exist:{}, sectorSel:"",
  visitasHoy:[], pedidosHoy:[], cliente:null, carrito:[], tipoDoc:"pedido",
  vista:(function(){ try { return localStorage.getItem("vistaRuta") || "lista"; } catch(e){ return "lista"; } })(),
  usuarios:[], metas:{}, pedidosMes:[], visita:null, foto:null, tempCrono:null, editando:null, fecha:null, miPos:null, quienes:"ruta", filtroCli:"todos", jornada:null,
  /* Lo que bodega dice que SI va hoy, por codigo. Manda sobre las
     existencias: es una persona mirando el estante, no un numero. */
  cortes:{},
  listas:[], preciosEsp:{}, agenda:[], motivos:[], foco:null, comis:null, pedidosDia:[],
  jornadasDia:[]
};

const $ = s => document.querySelector(s);
const $$ = s => Array.from(document.querySelectorAll(s));
const money = n => "$" + (Number(n)||0).toFixed(2);
/* La clave identifica al negocio aunque le cambien el nombre o el codigo:
   nombre normalizado + telefono. Sirve de id en la coleccion "bloqueados",
   que es lo que impide volver a abrir a un cliente dado de baja. */
const claveCliente = (nombre, tel) =>
  ((nombre||"").toString().toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"")
    .replace(/[^a-z0-9]/g,"").slice(0,40) || "sinnombre") +
  "-" + ((tel||"").toString().replace(/\D/g,"").slice(-8) || "sintel");

/* La zona: el negocio se puede llamar distinto, pero la esquina no se mueve.
   Se parte el mapa en cuadros de unos 55 metros. Al dar de baja se bloquean
   el cuadro del cliente y los 8 de alrededor, asi no sirve correrse un poco. */
const CELDA = 0.0005;
function celdaDe(lat, lng){
  if (lat == null || lng == null) return "";
  return "g" + Math.round(lat/CELDA) + "_" + Math.round(lng/CELDA);
}
function celdasAlrededor(lat, lng){
  const a = Math.round(lat/CELDA), b = Math.round(lng/CELDA), r = [];
  for (let i = -1; i <= 1; i++)
    for (let j = -1; j <= 1; j++) r.push("g" + (a+i) + "_" + (b+j));
  return r;
}

/* Codigo de cliente: corrido, como lo han manejado siempre.
   El prefijo y el numero de arranque se configuran en Administrar -> Ajustes,
   para que calce con la numeracion que ya trae la distribuidora. */
/* Lo que este aparato alcanza a ver del padron: el numero mas alto y con
   cuantos digitos se viene escribiendo. OJO: cada preventa carga solo los
   clientes de SU sector, asi que esto es un pedazo, no el padron entero. */
function escaneoCodigos(){
  const pre = (S.ajustes.codPrefijo || "").trim();
  const re = new RegExp("^" + pre.replace(/[.*+?^${}()|[\]\\]/g, "\\$&") + "(\\d+)$");
  let alto = 0, ancho = 0;
  S.clientes.forEach(c => {
    const m = re.exec((c.codigo || "").trim());
    if (!m) return;
    alto = Math.max(alto, Number(m[1]));
    ancho = Math.max(ancho, m[1].length);
  });
  return {pre: pre, alto: alto, ancho: ancho};
}

/* SOLO PARA MOSTRAR. Es un calculo local y puede quedar corto, porque este
   aparato no ve los clientes de los otros sectores. El codigo de verdad lo
   entrega reservarCodigo() al momento de guardar. */
function siguienteCodigo(){
  const e = escaneoCodigos();
  const desde = Math.max(1, Number(S.ajustes.codDesde) || 1);
  const n = Math.max(e.alto + 1, desde);
  return e.pre + String(n).padStart(Math.max(e.ancho, String(desde).length), "0");
}

/* EL CODIGO DE VERDAD.
   Antes el numero se sacaba mirando el padron que tuviera cargado el
   telefono. Como cada preventa ve solo su sector, dos vendedores en
   sectores distintos sacaban el MISMO numero casi todos los dias, sin
   hacer nada raro. Ahora el numero se reserva en Firestore dentro de una
   transaccion: dos aparatos pidiendo al mismo tiempo reciben numeros
   distintos, siempre.
   El contador nunca baja. Si va abajo de lo que este aparato ya ve en su
   pedazo del padron, se sube al mayor de los dos: asi arranca solo, sin
   tener que sembrarlo a mano, y no pisa codigos que ya existen. */
async function reservarCodigo(){
  const e = escaneoCodigos();
  const desde = Math.max(1, Number(S.ajustes.codDesde) || 1);
  const ancho = Math.max(e.ancho, String(desde).length);
  const ref = db.collection("contadores").doc("clientes");
  const n = await db.runTransaction(async tx => {
    const d = await tx.get(ref);
    const guardado = d.exists ? (Number(d.data().alto) || 0) : 0;
    const sig = Math.max(guardado, e.alto, desde - 1) + 1;
    tx.set(ref, {alto: sig, actualizado: firebase.firestore.FieldValue.serverTimestamp()}, {merge:true});
    return sig;
  });
  return e.pre + String(n).padStart(ancho, "0");
}

// devuelve el cliente que choca, si lo hay
function clienteQueChoca(nombre, tel){

/* ---------------- Clientes repetidos ----------------
   Handy no tenia como evitarlos y por eso el padron viene con tiendas
   dobladas. Aqui hay dos cosas distintas y conviene no confundirlas:

   BLOQUEO  - cuando es el mismo negocio sin lugar a dudas (mismo nombre y
              mismo telefono, o el mismo telefono a pocos metros). No se
              crea y se manda a buscar el que ya existe.
   SOSPECHA - cuando se parece pero puede ser de verdad otro (dos tiendas
              del mismo dueno, un nombre corriente como "La Bendicion").
              Ahi si se crea, pero queda marcado y le sale al admin en
              "Repetidos" para que decida el, uno por uno.                */

const nomNorm = t => (t||"").toString().toLowerCase().normalize("NFD")
  .replace(/[\u0300-\u036f]/g,"").replace(/[^a-z0-9 ]/g," ")
  .replace(/\b(tienda|comedor|venta|super|abarroteria|sala|la|el|los|las|de|del|y)\b/g," ")
  .replace(/\s+/g," ").trim();
/* Handy trae basura en el telefono: un cero suelto, un guion, un "N/A".
   Si eso se toma por numero de verdad, todos los que tengan el mismo cero
   quedan emparejados entre si — y salen tiendas a 28 kilometros una de
   otra. Un telefono sirve si tiene 7 digitos o mas y no es el mismo
   digito repetido. */
const telNorm = t => {
  const d = (t||"").toString().replace(/\D/g,"");
  if (d.length < 7) return "";
  if (/^(\d)\1+$/.test(d)) return "";
  return d.slice(-8);
};
const nomVacio = t => { const x = nomNorm(t); return x.length < 3; };

// Que tanto se parecen dos nombres: 0 nada, 1 iguales. Por pares de letras.
function parecido(a, b){
  a = nomNorm(a); b = nomNorm(b);
  if (!a || !b) return 0;
  if (a === b) return 1;
  const pares = t => { const r = {}; for (let i=0;i<t.length-1;i++) r[t.slice(i,i+2)] = (r[t.slice(i,i+2)]||0)+1; return r; };
  const A = pares(a), B = pares(b);
  let comunes = 0, ta = 0, tb = 0;
  Object.keys(A).forEach(k => { ta += A[k]; if (B[k]) comunes += Math.min(A[k], B[k]); });
  Object.keys(B).forEach(k => { tb += B[k]; });
  return (ta + tb) ? (2*comunes)/(ta+tb) : 0;
}

function metrosEntre(a, b){
  if (a.lat == null || b.lat == null) return null;
  return distMetros(a.lat, a.lng, b.lat, b.lng);
}

/* Los que se parecen a uno que se esta por crear.
   Devuelve {c, motivo, duro}. duro = no dejarlo pasar. */
function clientesParecidos(nom, tel, lat, lng, excluirId){
  const t = telNorm(tel), nn = nomNorm(nom), res = [];
  S.clientes.forEach(c => {
    if (c.id === excluirId || c.activo === false) return;
    const tc = telNorm(c.telefono), d = (lat != null) ? metrosEntre({lat:lat,lng:lng}, c) : null;
    const par = parecido(nom, c.nombre);
    if (t && tc && t === tc){
      res.push({c:c, motivo:"mismo teléfono", duro: par >= 0.5 || (d != null && d <= 120)});
      return;
    }
    if (nn && nomNorm(c.nombre) === nn){
      res.push({c:c, motivo: d != null && d <= 150 ? "mismo nombre, a " + d + " m" : "mismo nombre",
                duro: d != null && d <= 60});
      return;
    }
    if (d != null && d <= 40 && par >= 0.55)
      res.push({c:c, motivo:"a " + d + " m y nombre parecido", duro:false});
  });
  return res;
}

/* Las parejas sospechosas de todo el padron, para la pantalla de admin.
   Se recorre por indices y no todos contra todos: con 2,200 clientes
   comparar uno por uno serian millones de vueltas y el telefono se traba. */
function parejasDup(){
  const act = S.clientes.filter(c => c.activo !== false);
  if (act.length > 6000) return [];   // tope de seguridad
  const salta = {};
  act.forEach(c => (c.noDup || []).forEach(id => { salta[[c.id,id].sort().join("|")] = 1; }));
  const vistas = {}, out = [];
  const meter = (a, b, motivo, peso) => {
    if (a.id === b.id) return;
    const k = [a.id,b.id].sort().join("|");
    if (salta[k]) return;
    if (vistas[k]){ if (peso > vistas[k].peso){ vistas[k].motivo = motivo; vistas[k].peso = peso; } return; }
    const par = {a:a, b:b, motivo:motivo, peso:peso, metros:metrosEntre(a,b), k:k};
    vistas[k] = par; out.push(par);
  };
  const porTel = {}, porNom = {}, porCelda = {};
  act.forEach(c => {
    const t = telNorm(c.telefono); if (t) (porTel[t] = porTel[t] || []).push(c);
    const nn = nomNorm(c.nombre);  if (nn) (porNom[nn] = porNom[nn] || []).push(c);
    if (c.lat != null){ const g = celdaDe(c.lat, c.lng); (porCelda[g] = porCelda[g] || []).push(c); }
  });
  const cruzar = (grupo, motivo, peso, filtro) => {
    if (grupo.length < 2 || grupo.length > 8) return;   // 9 o mas no es repetido: es un punto mal dado de alta
    for (let i=0;i<grupo.length;i++)
      for (let j=i+1;j<grupo.length;j++)
        if (!filtro || filtro(grupo[i], grupo[j])) meter(grupo[i], grupo[j], motivo, peso);
  };
  /* Mismo telefono NO basta: un dueno puede tener dos tiendas en dos
     pueblos, y esas son dos negocios distintos. Se pide ademas que esten
     cerca o que el nombre se parezca. */
  Object.keys(porTel).forEach(t => cruzar(porTel[t], "mismo teléfono", 3,
    (a,b) => {
      const d = metrosEntre(a,b);
      return parecido(a.nombre, b.nombre) >= 0.5 || d == null || d <= 1500;
    }));
  Object.keys(porNom).forEach(x => cruzar(porNom[x], "mismo nombre", 2));
  // pegados en el mapa: solo si ademas el nombre se parece
  Object.keys(porCelda).forEach(g => cruzar(porCelda[g], "pegados en el mapa", 1,
    (a,b) => { const d = metrosEntre(a,b); return d != null && d <= 45 && parecido(a.nombre, b.nombre) >= 0.5; }));
  // los que quedaron marcados al crearse en la calle
  act.forEach(c => (c.revisarCon || []).forEach(id => {
    const o = act.find(x => x.id === id); if (o) meter(c, o, "avisado al crearlo", 4);
  }));
  return out.sort((x,y) => y.peso - x.peso);
}

/* Con 2,200 clientes esto son decenas de miles de comparaciones. Hecho de
   un solo golpe congela la pantalla varios segundos: el telefono no puede
   ni dibujar ni responder mientras corre. Se parte en tandas y entre
   tanda y tanda se le suelta el turno al navegador. */
function dupCalcular(listo){
  const sello = dupSelloAhora();
  if (sello === dupSello && dupCache){ listo(dupCache); return; }
  if (dupTrabajando) return;
  dupTrabajando = true;
  setTimeout(() => {
    let res = [];
    try { res = parejasDup(); } catch(e){ anotarError("repetidos", e); }
    dupSello = sello; dupCache = res; dupTrabajando = false;
    listo(res);
  }, 60);
}

/* precio mínimo = costo + margen sobre el costo */
function precioDe(p){
  if (S.cliente){
    const esp = S.preciosEsp[S.cliente.id];
    if (esp && esp[p.cod] != null) return Number(esp[p.cod]);
    const l = S.listas.find(x => x.id === S.cliente.listaId);
    if (l && Number(l.descuento)) return Math.round(p.precio * (1 - Number(l.descuento)/100) * 100)/100;
  }
  return p.precio;
}
function etiquetaPrecio(p){
  if (!S.cliente) return "";
  const esp = S.preciosEsp[S.cliente.id];
  if (esp && esp[p.cod] != null) return "precio especial";
  const l = S.listas.find(x => x.id === S.cliente.listaId);
  if (l && Number(l.descuento)) return l.nombre;
  return "";
}
/* El costo dejo de ser un solo numero: oficina manda DOS, el costo promedio
   y el de la ultima compra. Se sigue leyendo el formato viejo (un numero
   suelto) para que nada de lo ya guardado se rompa. */
function costoDe(cod){
  const c = S.costos ? S.costos[cod] : null;
  if (c == null) return null;
  if (typeof c === "number") return {prom:c, ult:c};
  if (typeof c !== "object") return null;
  const num = x => (x == null || isNaN(Number(x))) ? null : Number(x);
  const prom = num(c.prom != null ? c.prom : c.promedio);
  const ult  = num(c.ult  != null ? c.ult  : (c.ultima != null ? c.ultima : c.ultimaCompra));
  if (prom == null && ult == null) return null;
  return {prom: prom != null ? prom : ult, ult: ult != null ? ult : prom};
}
/* El piso de descuento sale del costo PROMEDIO: la ultima compra sube y baja
   con cada factura y dejaria el minimo bailando de un dia para otro. */
function costoBase(cod){ const c = costoDe(cod); return c ? c.prom : null; }

/* La unidad de venta la manda el catalogo de oficina. Mientras no venga,
   se dice UNIDAD, que es lo que se venia imprimiendo. */
function unidadDe(cod){
  const p = (S.catalogo || []).find(x => x.cod === cod);
  return (p && p.unidad) ? String(p.unidad) : "UNIDAD";
}

/* El pin del cliente en el mapa. Dos estilos: "numero" (la gota verde con
   el numero) y "casita" (la gota azul con la cajita, como Handy). Se
   escoge en Ajustes; si no hay nada puesto, casita. */
const SVG_CAJA = '<svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" ' +
  'stroke-linejoin="round" stroke-linecap="round"><path d="M12 3 3 7.5v9L12 21l9-4.5v-9z"/>' +
  '<path d="M3 7.5 12 12l9-4.5M12 12v9"/></svg>';
function estiloPin(){ return (S.ajustes && S.ajustes.pinEstilo) === "numero" ? "numero" : "casita"; }
function htmlPin(clase, numero){
  if (estiloPin() === "numero")
    return '<div class="pin ' + clase + '"><span>' + numero + '</span></div>';
  return '<div class="pin casa ' + clase + '"><span class="ico">' + SVG_CAJA + '</span>' +
    '<span class="num">' + numero + '</span></div>';
}
function pisoDe(p){
  const c = costoBase(p.cod);
  if (p.precioMin != null) return p.precioMin;
  if (c != null) return Math.round(c * (1 + (p.margen ?? S.ajustes.margenGeneral)/100) * 100)/100;
  return null;
}
function descMaxDe(p){
  const piso = pisoDe(p);
  if (!piso || !p.precio) return null;
  return Math.max(0, Math.round((p.precio - piso)/p.precio*1000)/10);
}

/* ===================== arranque ===================== */
let db, auth;
function sinCache(){
  try { return localStorage.getItem("preventa_sin_cache") === "1"; } catch(e){ return false; }
}
function ponerSinCache(on){
  try { on ? localStorage.setItem("preventa_sin_cache","1") : localStorage.removeItem("preventa_sin_cache"); } catch(e){}
}
/* Deja el telefono como recien instalado: borra la copia local de
   Firestore, la sesion guardada y los archivos del service worker. */
async function arranqueLimpio(conSinCache){
  ponerSinCache(!!conSinCache);
  try { await db.terminate(); } catch(e){}
  try { await db.clearPersistence(); } catch(e){}
  try {
    if (indexedDB.databases){
      const lista = await indexedDB.databases();
      for (const d of lista){
        if (!d.name) continue;
        await new Promise(r => {
          const q = indexedDB.deleteDatabase(d.name);
          q.onsuccess = q.onerror = q.onblocked = () => r();
        });
      }
    } else {
      const pid = (window.FIREBASE_CONFIG || {}).projectId || "";
      ["firebaseLocalStorageDb", "firestore/[DEFAULT]/" + pid + "/main"]
        .forEach(n => { try { indexedDB.deleteDatabase(n); } catch(e){} });
    }
  } catch(e){}
  try {
    const regs = await navigator.serviceWorker.getRegistrations();
    for (const r of regs) await r.unregister();
  } catch(e){}
  try { for (const k of await caches.keys()) await caches.delete(k); } catch(e){}
  location.reload();
}
/* La pestana y el nombre instalado llevan la empresa, y sale de
   empresa.js. Se pone aqui y no en el HTML para que sea UN solo
   lugar. */

/* Los rótulos del nombre del programa se llenan al abrir: están en el
   HTML fijo, así que no pasan por ninguna función que los pinte. */
try { Array.prototype.forEach.call(document.querySelectorAll(".marca-app"),
  function(n){ n.textContent = empApp(); }); } catch(e){}
(function arranque(){
  const cfg = window.FIREBASE_CONFIG;
  if (!cfg || !cfg.apiKey || /^(PEGUE|PONGA)/.test(String(cfg.apiKey))){
    /* Se espera un instante: esta funcion corre antes de que el resto del
       archivo termine de leerse, y quitarArranque() usa variables que
       todavia no existen. Sin esta espera, la app se queda cargando. */
    setTimeout(() => { quitarArranque(); ver("#pant-config", true); }, 0);
    return;
  }
  firebase.initializeApp(cfg);
  auth = firebase.auth(); db = firebase.firestore();
  /* Modo sin cache: cuando la copia local se envenena (por ejemplo, una
     lista en vivo que quedo negada con reglas viejas), Firestore repite el
     error desde el telefono aunque el servidor ya diga que si. Con este
     modo la app trabaja siempre contra el servidor. Se pierde el trabajo
     sin senal, por eso solo se enciende a proposito desde el Diagnostico. */
  if (!sinCache()) db.enablePersistence({synchronizeTabs:true}).catch(()=>{});
  auth.setPersistence(firebase.auth.Auth.Persistence.LOCAL).catch(()=>{});
  auth.onAuthStateChanged(async u => {
    S.usuario = u;
    quitarArranque();
    if (!u){
      S.rol=null; S.costos=null; S.costosVisibles=false; S.nombre=""; S.miCuenta=null; S.abc=null;
      S.visita=null; S.foto=null;          // el cronometro no puede seguir a otra cuenta
      pararGPS();                          // y el rastreo se apaga al salir
      soltarPedidos();
      try { cerrarHoja(); } catch(e){}
      ver("#nav", false); ver("#carro", false);
      ver("#pant-app", false); ver("#pant-admin", false);
      ver("#pant-ruta", false); ver("#pant-dia", false);
      $("#pant-ruta").classList.remove("lleno");
      ver("#pant-login", true);
      return;
    }
    ver("#pant-login", false);
    await entrarAlSistema();
  });
})();

  // rol: se pide al servidor. Si no hay senal, se usa lo guardado en el telefono.
  // Todo lo que pasa aqui queda anotado en S.diag para la hoja de Diagnostico.
  S.diag = { pasos: [], doc: null, desdeCache: null, error: null };
  /* Hora en que empezo esta sesion en este aparato. Se compara contra
     cerrarAntes para saber si administracion la mando a cerrar. */
  S.sesionDesde = Date.now();
  let d = null;
  try {
    d = await db.collection("usuarios").doc(S.usuario.uid).get({source:"server"});
    S.diag.pasos.push("servidor · " + (d.exists ? "documento leído" : "el documento NO existe con ese UID"));
  } catch(e){
    S.diag.error = e.code || e.message;
    S.diag.pasos.push("servidor · FALLA [" + (e.code || e.message) + "]");
    try {
      d = await db.collection("usuarios").doc(S.usuario.uid).get();
      S.diag.pasos.push("guardado en el teléfono · " + (d.exists ? "documento leído" : "no existe"));
    } catch(e2){
      S.diag.pasos.push("guardado en el teléfono · FALLA [" + (e2.code || e2.message) + "]");
    }
  }
  if (d && d.exists){
    const u = d.data();
    S.diag.doc = u;
    S.diag.desdeCache = d.metadata.fromCache;
    S.rol = u.rol || "preventa";
    /* Permiso extra: sigue siendo preventa y sale a la calle igual, pero
       ademas ve como va el equipo. Sin tocar el puesto, para no perder su
       ruta, sus metas ni sus comisiones. */
    S.verEquipo = u.verEquipo === true;
    S.nombre = u.nombre || S.usuario.email;
    if (u.activo === false){
      await auth.signOut();
      return mostrarAviso($("#login-aviso"), "Esta cuenta está desactivada. Hable con el administrador.");
    }
  } else {
    S.rol = "preventa";
    S.verEquipo = false;
    S.nombre = S.usuario.email;
  }
  S.diag.pasos.push("rol que tomó la app · " + JSON.stringify(S.rol));

  $("#chip-usuario").textContent = S.nombre;
  aplicarPuesto(true);
  // el punto en vivo no depende de que abran el mapa: arranca con la sesion
  /* El supervisor tambien: vende, y oficina lo vigila a el (Supervisores). */
  if (S.rol === "preventa" || S.rol === "despacho" || S.rol === "supervisor") vigilarGPS();

  // catálogo (en vivo)
  escucharCatalogo();
  /* El catalogo de departamentos y municipios de Hacienda. Vive en la
     base y NO dentro de la app, porque Hacienda lo cambia: quito los 262
     municipios viejos y en julio de 2026 volvio a moverlo. Cargandolo
     aqui, oficina lo actualiza sin que haya que subir la app otra vez.
     Mientras no exista, el preventa escribe el lugar a mano. */
  db.collection("configuracion").doc("catalogoGeo").onSnapshot(d => {
    S.catalogoGeo = d.exists ? d.data() : null;
  }, () => {});
  // los días de entrega los necesita todo el mundo
  db.collection("configuracion").doc("ajustes").onSnapshot(d => {
    if (!d.exists) return;
    const a = d.data();
    if (a.diasEntrega != null) S.ajustes.diasEntrega = Number(a.diasEntrega);
    // hoy solo lo usa una pantalla de administración, pero si algún día
    // se comparte el costo con más roles, este campo tiene que venir ya
    // sincronizado y no quedar pegado al 25% por defecto.
    if (a.margenGeneral != null) S.ajustes.margenGeneral = Number(a.margenGeneral);
    if (a.minimoExistencia != null) S.ajustes.minimoExistencia = Number(a.minimoExistencia);
    if (Array.isArray(a.noLaborables)) S.ajustes.noLaborables = a.noLaborables.map(Number);
    if (a.horaCierre != null) S.ajustes.horaCierre = a.horaCierre;
    if (a.horaInicio != null) S.ajustes.horaInicio = a.horaInicio;
    if (a.codPrefijo != null) S.ajustes.codPrefijo = a.codPrefijo;
    if (a.codDesde != null) S.ajustes.codDesde = Number(a.codDesde) || 1;
    if (a.diasCapital && typeof a.diasCapital === "object") S.ajustes.diasCapital = a.diasCapital;
    // el estilo del pin lo necesita todo el que abre el mapa
    if (a.pinEstilo != null){ S.ajustes.pinEstilo = a.pinEstilo; if (S.pagina === "ruta") pintarRuta(); }
    // las cuentas las necesita el motorista, no solo el administrador
    if (Array.isArray(a.cuentas)) S.ajustes.cuentas = a.cuentas;
    // la geocerca la necesita el preventa: sin esto solo la veria el admin
    if (a.geocerca) S.ajustes.geocerca = a.geocerca;
  }, ()=>{});
  // costos y ajustes: solo el administrador tiene permiso
  if (S.rol === "admin"){
    db.collection("configuracion").doc("costos").onSnapshot(d => {
      S.costos = d.exists ? (d.data().costos || {}) : {};
      if (!$("#pant-admin").classList.contains("oculto")) pintarAdmin();
    }, ()=>{});
    db.collection("configuracion").doc("ajustes").onSnapshot(d => {
      if (d.exists) S.ajustes = Object.assign(S.ajustes, d.data());
    }, ()=>{});
  }
  escucharPedidos();
  seguirPosicion();
  ver("#btn-admin2", puedeVerEquipo());
  $("#chip-usuario2").textContent = S.nombre;
  $("#chip-usuario3").textContent = S.nombre;
  $("#chip-usuario4").textContent = S.nombre;   // se quedaba en "…"
  ver("#nav", true);
  /* Antes el catalogo se escondia de la barra y solo se entraba desde el
     cliente. Handy lo lleva como pestana (Productos) y el vendedor lo usa
     para consultar precio y existencia sin abrir visita: ahora va a la
     vista. Si se quiere volver a esconder, este es el lugar. */
  /* Este era el error: se mandaba a todos a Ruta al final del arranque, y
     eso pisaba el irA("dia") de bodega. Bodega no tiene ruta. */
  irA(S.rol === "bodega" ? "dia" : "ruta");
  // el administrador vive en la oficina: entra directo a su panel
  // y su Ruta arranca siempre en Lista (el mapa queda a un toque).
  if (S.rol === "admin"){
    S.vista = "lista";
    grupoActual = null;
  ver("#pant-admin", true); pintarAdmin();
  }
}

/* El boton ATRAS del telefono ya no saca de la app de un golpe:

/* Doble colchon en el historial + doble toque para salir:

history.pushState({app:2}, "");
let ultimoAtras = 0;

  // raiz: solo dos toques seguidos sacan de la app

  if (ahora - ultimoAtras < 2000){
    history.go(-2);
    return;
  }
  ultimoAtras = ahora;
  nota("Toque atr\u00e1s otra vez para salir de la app.");

});

/* ===================== navegacion ===================== */
let arranqueFuera = false;
const arranqueDesde = Date.now();
function quitarArranque(){
  if (arranqueFuera) return;
  arranqueFuera = true;
  const el = $("#arranque");
  if (!el) return;
  const falta = Math.max(0, 1300 - (Date.now() - arranqueDesde));
  setTimeout(() => {
    el.classList.add("fuera");
    setTimeout(() => el.remove(), 450);
  }, falta);
}

/* ===================== estilo de la app =====================
   Cada telefono guarda el suyo. No toca Firebase: es cosa del aparato,
   no de la cuenta, porque el mismo correo puede andar en dos telefonos. */
const OPCIONES_ESTILO = [
  { clave:"navy",  nombre:"Navy",  muestra:"#1D2340", barra:"#1D2340",
    nota:"El de siempre. Navy y dorado del logo." },
  { clave:"sol",   nombre:"Sol",   muestra:"#FFFFFF", barra:"#FFFFFF",
    nota:"Blanco y negro con bordes gruesos, para leer bajo el sol." },
  { clave:"noche", nombre:"Noche", muestra:"#0C0F1C", barra:"#0C0F1C",
    nota:"Fondo oscuro para el arranque temprano y el cierre." },
  { clave:"cielo", nombre:"Cielo", muestra:"#2563EB", barra:"#FFFFFF",
    nota:"Blanco y azul, con las tarjetas de borde fino." }
];

function estiloActual(){
  try { return localStorage.getItem("estiloApp") || "cielo"; } catch(e){ return "navy"; }
}

function ponerEstilo(clave){
  const op = OPCIONES_ESTILO.find(o => o.clave === clave) || OPCIONES_ESTILO[0];
  document.documentElement.setAttribute("data-estilo", op.clave);
  try { localStorage.setItem("estiloApp", op.clave); } catch(e){}
  const meta = document.querySelector('meta[name="theme-color"]');
  if (meta) meta.setAttribute("content", op.barra);
}

function cablearEstilos(){
  const nota = $("#m-estilo-nota");
  const pintarNota = () => {
    const op = OPCIONES_ESTILO.find(o => o.clave === estiloActual());
    if (nota && op) nota.textContent = op.nota;
  };
  $$(".estilo-op").forEach(b => {
    b.onclick = () => {
      ponerEstilo(b.dataset.e);
      $$(".estilo-op").forEach(x => x.setAttribute("aria-pressed", x.dataset.e === b.dataset.e));
      pintarNota();
    };
  });
  pintarNota();
}

// al abrir: la barra del sistema del color que toca
ponerEstilo(estiloActual());

function irA(pag){
  if (pag === "admin") return $("#btn-admin").click();
  /* El perfil no es una pagina: es la hoja del usuario de siempre.
     La pestana solo la pone a un toque, como en Handy. */
  if (pag === "perfil") return $("#chip-usuario").onclick();
  /* Clientes es la misma ruta en vista de lista. La pestana no estrena
     pantalla: destapa la que ya vivia detras del boton "Lista". */
  if (pag === "clientes"){
    S.vista = "lista";
    try { localStorage.setItem("vistaRuta", "lista"); } catch(e){}
    pag = "ruta";
  }
  /* Oficina no vende. Antes se le colaba la pantalla del preventa por
     varios caminos (al volver de Administrar, al salir de un pedido).
     Se ataja aqui, que es por donde pasan todos.
     El supervisor SI vende, asi que ya no se le ataja. */
  if (S.rol === "admin" && pag !== "admin") return $("#btn-admin").click();
  if (S.pagina === "vivo" && pag !== "vivo") soltarVivo();   // soltar la escucha al salir
  S.pagina = pag;
  if (pag !== "ruta") $("#pant-ruta").classList.remove("lleno");
  if (pag !== "admin") document.body.classList.remove("zo-lleno");
  ver("#pant-ruta", pag === "ruta");
  ver("#pant-app",  pag === "catalogo");
  ver("#pant-dia",  pag === "dia");
  ver("#pant-oficina", pag === "vivo" || pag === "hoy");
  ver("#pant-admin", false);
  ver("#nav", true);
  marcarNav();
  pintarCarro();
  if (pag === "ruta") pintarRuta();
  if (pag === "dia") pintarDia();
  if (pag === "catalogo") pintarLista();
  document.body.classList.remove("con-nav");
  if (pag === "vivo" || pag === "hoy") pintarOficina(pag);
  window.scrollTo(0,0);
}
/* Mapa y Clientes comparten la pagina de ruta: los separa la vista.
   Por eso la pestana puesta no puede salir solo de S.pagina. */
function marcarNav(){
  const marca = (S.pagina === "ruta") ? (S.vista === "mapa" ? "ruta" : "clientes") : S.pagina;
  $$("#nav button").forEach(b => b.setAttribute("aria-pressed", b.dataset.p === marca));
}
function amarrarNav(){
  $$("#nav button").forEach(b => b.onclick = () => {
    const p = b.dataset.p;
    if (p === "ruta" || p === "clientes"){
      S.vista = (p === "clientes") ? "lista" : "mapa";

    irA(p);

}

/* ===================== La pantalla de oficina =====================
   Administracion y supervision no salen a vender, asi que no tienen por
   que ver "Mi ruta" ni "Mi dia": eso es del preventa y confunde. En su
   lugar, lo que si ocupan: donde anda la gente y como va el dia.
   Las dos se mueven solas — Firestore deja la conexion abierta y avisa
   cuando algo cambia, no hay que refrescar nada. */
function pintarOficina(pag){
  const m = $("#ofi-cuerpo"), t = $("#ofi-titulo");
  if (!m) return;
  if (pag === "vivo"){
    if (t) t.textContent = "En vivo";
    /* La bandeja va de primero: es lo que espera respuesta. El mapa de
       quien anda donde queda debajo, que es para mirar, no para actuar. */
    m.innerHTML = '<div id="ofi-avisos"></div>';
    pintarBandeja();

    m.appendChild(abajo);
    bloqueEnVivo(abajo);
    marcarAvisosVistos();
    return;

  if (t) t.textContent = "Hoy";

  m.innerHTML = '<div id="ofi-hoy"></div>';

}

/* ============ Seguimiento de entregas (solo oficina) ============
   La pantalla "Hoy" decia los numeros -"12 entregados, 8 por entregar"- pero
   no los nombres. Esto pone los nombres detras de esos numeros: cual salio,
   cual falta y cual no se pudo, con la hora y quien la hizo.
   Es de MIRAR, no de tocar: oficina no cierra entregas desde aqui, eso es
   del motorista en la calle. Y no pide ni una lectura nueva: sale de
   S.pedidosDia, que esta pantalla ya escucha. */
var segFiltro = "todas";

function segEstado(p){
  if (p.estado === "entregado" || p.estado === "entregado parcial") return "bien";
  if (p.estado === "no entregado") return "mal";
  return "ojo";
}
function segRotulo(e){
  return e === "bien" ? "Entregada" : (e === "mal" ? "No se entregó" : "Por entregar");
}
/* entregadoEn viene como marca de tiempo del servidor. Recien guardado puede
   llegar nulo por un instante, asi que hay que aguantar ese caso. */
function segHora(p){
  const t = p.entregadoEn;
  if (!t) return "";
  try {
    const d = t.toDate ? t.toDate() : new Date(t);
    if (isNaN(d.getTime())) return "";
    return d.toLocaleTimeString("es-SV", {hour:"numeric", minute:"2-digit"});
  } catch(e){ return ""; }
}

function bloqueSeguimiento(peds){
  /* Los adicionales no entran: no estan programados para entregarse hoy,
     estan esperando que oficina los apruebe. Contarlos como incumplidos
     seria culpar al motorista de algo que no le tocaba.
     Los anulados tampoco: la pantalla que llama ya los quita, pero si un dia
     la llama otra, un anulado saldria como "Por entregar" y eso es mentira. */
  const prog = (peds || []).filter(p =>
    p.estado !== "adicional" && !p.adicional && p.estado !== "anulado");
  if (!prog.length) return "";

  const hechas = prog.filter(p => segEstado(p) === "bien").length;
  const pct = Math.round(hechas / prog.length * 1000) / 10;
  /* Umbrales del negocio: 90 o mas va bien; de 75 a 90 hay que mirarlo;
     abajo de 75 se quedaron entregas sin hacer. */
  const eC = pct >= 90 ? "bien" : (pct >= 75 ? "ojo" : "mal");
  const rotC = eC === "bien" ? "Va bien" : (eC === "ojo" ? "Ojo" : "Se quedó corto");

  const cuenta = e => prog.filter(p => segEstado(p) === e).length;
  const FILTROS = [["todas","Todas",prog.length],["ojo","Por entregar",cuenta("ojo")],
                   ["bien","Entregadas",cuenta("bien")],["mal","No entregadas",cuenta("mal")]];

  // lo pendiente va primero: es lo que espera accion; lo hecho es archivo
  const orden = {ojo:0, mal:1, bien:2};
  const lista = prog.filter(p => segFiltro === "todas" || segEstado(p) === segFiltro)
    .slice().sort((a,b) => orden[segEstado(a)] - orden[segEstado(b)]);

  const nombreSector = id => {
    const s = (S.sectores || []).find(x => x.id === id);
    return s ? s.nombre : "";
  };

  return '<div class="pasos"><div class="eyebrow">Seguimiento de entregas</div>' +
    '<div class="t-medidor" style="margin-top:10px"><div class="fila">' +
      '<span class="num">' + pct.toFixed(1) + '%</span>' +
      '<span class="eyebrow">Cumplimiento</span>' +
      '<span class="t-chip ' + eC + '">' + rotC + '</span></div>' +
      '<div class="t-barra"><i class="' + eC + '" style="width:' + Math.min(100, pct) + '%"></i></div>' +
      '<div class="det">' + hechas + ' de ' + prog.length + ' entregas de hoy</div></div>' +

    '<div class="seg-filtros" id="seg-filtros">' +
      FILTROS.map(f => '<button data-f="' + f[0] + '" aria-pressed="' +
        (segFiltro === f[0]) + '">' + f[1] + ' · ' + f[2] + '</button>').join("") +
    '</div>' +

    (lista.length
      ? '<div class="seg-lista">' + lista.map(p => {
          const e = segEstado(p);
          const h = segHora(p);
          const monto = e === "bien" ? (p.totalEntregado != null ? p.totalEntregado : p.total) : p.total;
          const quien = p.entregadoPorNombre || p.preventaNombre || "";
          const sec = nombreSector(p.sectorId);
          return '<div class="seg-ent ' + e + '">' +
            '<div class="seg-top"><span class="seg-est ' + e + '">' + segRotulo(e) + '</span>' +
              (h ? '<span class="seg-hora">' + escapar(h) + '</span>' : '') + '</div>' +
            '<div class="seg-nom">' + escapar(p.clienteNombre || "sin nombre") + '</div>' +
            '<div class="seg-dir">' + escapar(p.clienteCodigo || "") +
              (p.clienteDireccion ? ' · ' + escapar(p.clienteDireccion) : '') + '</div>' +
            (e === "mal" && p.motivoNoEntrega
              ? '<div class="seg-motivo">Motivo: ' + escapar(p.motivoNoEntrega) + '</div>' : '') +
            '<div class="seg-pie"><small>' + escapar(quien) +
              (sec ? ' · ' + escapar(sec) : '') + '</small>' +
              '<b class="num">' + money(Number(monto) || 0) + '</b></div>' +
          '</div>';
        }).join("") + '</div>'
      : '<div class="seg-vacio">Ninguna entrega con ese filtro.</div>') +
  '</div>';
}

function pintarOficinaHoy(){
  const cont = $("#ofi-hoy");
  if (!cont || S.pagina !== "hoy") return;
  const hoy = hoyISO();
  const peds = (S.pedidosDia || []).filter(x => (x.fecha || "") === hoy && x.estado !== "anulado");
  const total = peds.reduce((a,x) => a + (Number(x.total) || 0), 0);
  const entregados = peds.filter(x => x.estado === "entregado").length;
  const noEntregados = peds.filter(x => x.estado === "no entregado").length;
  const pendientes = peds.length - entregados - noEntregados;
  /* El nombre se toma del propio pedido. S.usuarios solo se carga para
     administracion: al supervisor le salia "sin nombre" en toda la lista. */
  const conPedido = {}, nombreDe = {};
  peds.forEach(x => {
    const uid = x.preventaUid || "?";
    conPedido[uid] = (conPedido[uid] || 0) + (Number(x.total)||0);
    if (!nombreDe[uid]) nombreDe[uid] = x.preventaNombre || "";
  });

  const secsHoy = S.sectores.filter(x => x.activo !== false && tieneDia(x) &&
    Number(x.dia) === new Date().getDay());

  cont.innerHTML =
    '<div class="pasos"><div class="eyebrow">' + fechaBonita(hoy) + '</div>' +
      '<div class="conteo" style="text-align:left;margin-top:6px">Se actualiza solo. No hace falta refrescar.</div>' +
      '<div class="fila" style="margin-top:10px;gap:10px;flex-wrap:wrap">' +
        '<div style="flex:1 1 45%"><b class="num" style="font-size:24px">' + peds.length + '</b>' +
          '<div class="conteo" style="text-align:left;margin:0">pedidos de hoy</div></div>' +
        '<div style="flex:1 1 45%"><b class="num" style="font-size:24px">' + money(total) + '</b>' +
          '<div class="conteo" style="text-align:left;margin:0">vendido</div></div>' +
      '</div>' +
      '<div class="conteo" style="text-align:left;margin-top:10px">' +
        entregados + ' entregados \u00b7 ' + pendientes + ' por entregar' +
        (noEntregados ? ' \u00b7 ' + noEntregados + ' no entregados' : '') + '</div>' +
      '<div class="conteo" style="text-align:left;margin-top:4px">' +
        (secsHoy.length
          ? "Rutas de hoy: " + secsHoy.map(x => escapar(x.nombre)).join(", ")
          : "Ninguna ruta tiene puesto el d\u00eda de hoy.") + '</div>' +
    '</div>' +
    (peds.length
      ? '<div class="pasos"><div class="eyebrow">Qui\u00e9n vendi\u00f3</div>' +
          Object.keys(conPedido).map(uid => {
            const u = (S.usuarios || []).find(x => x.uid === uid);
            return '<div class="cuota-fila"><span class="quien">' +
              escapar(nombreDe[uid] || (u ? (u.nombre || u.correo) : "sin nombre")) + '</span>' +
              '<b class="num">' + money(conPedido[uid]) + '</b></div>';
          }).join("") + '</div>'
      : '<div class="pasos"><div class="conteo">Todav\u00eda no ha entrado ning\u00fan pedido hoy.</div></div>') +
    (function(){
      /* El camion del dia: kilometraje y gastos, tal como los anota cada
         motorista desde la calle. Se mueve solo, igual que lo demas. */
      const js = (S.jornadasDia || []).filter(j =>
        j.kmSalida != null || (Array.isArray(j.gastos) && j.gastos.length));
      if (!js.length) return '';
      const totalG = js.reduce((a,j) =>
        a + (j.gastos||[]).reduce((b,g) => b + (Number(g.monto)||0), 0), 0);
      const totalKm = js.reduce((a,j) => a + (Number(j.kmRecorrido)||0), 0);
      return '<div class="pasos"><div class="eyebrow">Los camiones hoy</div>' +
        '<div class="fila" style="margin-top:8px;gap:10px;flex-wrap:wrap">' +
          '<div style="flex:1 1 45%"><b class="num" style="font-size:22px">' + totalKm + ' km</b>' +

function aplicarPuesto(alEntrar){
  ver("#btn-admin", puedeVerEquipo());
  /* Oficina lleva otra barra: no vende, monitorea.
     El SUPERVISOR no entra aqui: se da por hecho que el supervisor TAMBIEN
     vende y sale a la calle. Le queda la barra de venta, y todo lo de
     supervisar entra por el boton Administrar, que ya tenia.
     🔴 DECISION DE CADA EMPRESA: si aca el supervisor NO vende, esta linea
     tiene que decir tambien supervisor, o va a andar con una barra que no
     usa. Salio de una empresa donde si vendia; no se hereda sin mirar. */
  const oficina = S.rol === "admin";
  const nav = $("#nav");
  const marca = oficina ? "ofi" : (S.rol || "calle");
  if (nav && nav.dataset.modo !== marca){
    nav.dataset.modo = marca;
    nav.innerHTML = oficina
      ? '<button data-p="vivo"><b>\u25c9</b>En vivo</button>' +
        '<button data-p="hoy"><b>\u25a4</b>Hoy</button>' +
        '<button data-p="admin"><b>\u2699</b>Administrar</button>'
      /* El motorista no levanta pedidos: el catalogo le estorba y lo
         confunde. Bodega tampoco. Solo el preventa lo ocupa. */
      /* Los cinco lugares con los nombres de Handy: Mapa, Productos,
         Clientes, Actividad y Perfil. Los vendedores llevan anios
         buscandolos ahi y con esas palabras. El motorista tambien lleva
         Productos: le sirve para consultar precio parado en la tienda. */
      : '<button data-p="ruta"><b>\u25c9</b>Mapa</button>' +
        '<button data-p="catalogo"><b>\u25eb</b>Productos</button>' +
        '<button data-p="clientes"><b>\u2637</b>' + (S.rol === "despacho" ? "Entregas" : "Clientes") + '</button>' +
        '<button data-p="dia"><b>\u25c8</b>' +
          (S.rol === "bodega" ? "Bodega" : "Actividad") +
        '</button>' +
        '<button data-p="perfil"><b>\u2630</b>Perfil</button>';
    amarrarNav();
  }
  /* Oficina vive en Administrar: el tablero es su pantalla de entrada y
     ya no hay barra de abajo (Hoy y En vivo estan adentro). */
  if (oficina && (alEntrar || S.pagina !== "admin")) return irA("admin");
  // bodega no sale a la calle: sin mapa y directo a su pantalla
  const bRuta = document.querySelector('#nav button[data-p="ruta"]');
  if (bRuta) bRuta.classList.toggle("oculto", S.rol === "bodega");
  const bCli = document.querySelector('#nav button[data-p="clientes"]');
  if (bCli) bCli.classList.toggle("oculto", S.rol === "bodega");
  if (S.rol === "bodega" && (alEntrar || S.pagina === "ruta")) irA("dia");
}
