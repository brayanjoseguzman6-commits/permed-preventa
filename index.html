/* Contrasena generada: sin letras ni numeros que se confundan (O/0, I/1, l).
   Sale en dos bloques de cuatro para que se dicte facil por telefono. */
function claveNueva(){
  const A = "ABCDEFGHJKLMNPQRSTUVWXYZ23456789";
  const dado = () => A[Math.floor(Math.random() * A.length)];
  let a = "", b = "";
  for (let i = 0; i < 4; i++){ a += dado(); b += dado(); }
  return a + "-" + b;
}

/* Crear la cuenta SIN botar la sesion del administrador: se abre una segunda
   conexion aparte, se crea el usuario ahi y se cierra. La sesion de esta
   pantalla no se toca. */
let appAlta = null;
async function crearCuenta(correo, clave){
  /* La conexion "alta" se REUSA; ya no se borra al terminar.
     Antes esto hacia app2.delete() despues de cada cuenta. Firebase deja
     andando por dentro un refresco de token, y borrar la conexion corre
     carrera con el: esa promesa se rechaza sola, nadie la agarra, y sale
     el aviso rojo de "algo fallo" aunque la cuenta se haya creado bien.
     Reusarla quita la carrera, y ademas no levanta una conexion nueva por
     cada persona. La sesion sigue sin guardarse (Persistence.NONE) y se
     cierra despues de cada alta, asi que el administrador nunca pierde
     la suya. */
  if (!appAlta){
    appAlta = firebase.apps.filter(a => a.name === "alta")[0] ||
              firebase.initializeApp(window.FIREBASE_CONFIG, "alta");
    try { await appAlta.auth().setPersistence(firebase.auth.Auth.Persistence.NONE); } catch(e){}
  }
  const cred = await appAlta.auth().createUserWithEmailAndPassword(correo, clave);
  const uid = cred.user.uid;
  try { await appAlta.auth().signOut(); } catch(e){}
  return uid;
}

/* =================== Portafolio (Productos › Portafolio) ===================
   Aplica el documento de oficina "Estrategia de Optimizacion de Portafolio
   (350 SKUs)": cruza VOLUMEN de venta con MARGEN, pone cada producto en un
   cuadrante, y aplica tres reglas de corte. La pantalla NO decide: marca
   "a revisar" con el numero de la regla; sacar un producto sigue siendo un
   boton que toca una persona.

   Con que se calcula (todo ya estaba en la app):
   - volumen: los pedidos ENTREGADOS de los ultimos N dias (90 por defecto),
     con lo que de verdad se entrego (l.entregado), no lo pedido. Es la
     misma fuente que el puente porFacturar.
   - margen: precio promedio al que se vendio menos el costo de Costos.
     Oficina mando los costos YA con IVA (x1.13); el precio tambien lleva
     IVA adentro, asi que quedan en la misma base. NO se multiplica aqui.
   - "alto volumen": A o B en la misma cuenta A/B/C de las comisiones
     (80% / 95% de la venta acumulada); C es bajo.
   - "alto margen": el % de margen del producto contra la MEDIANA del
     catalogo. El corte se ajusta solo a su catalogo.
   - regla 1: utilidad del producto < 0.1% de la utilidad total.
   - regla 2: dias de inventario (existencia / unidades por dia) > dias
     para recuperar el capital de su familia (Ajustes; 8 pollo, 30 resto).
   - regla 3: canibalizacion, con las 39 equivalencias reales de oficina
     (producto base -> presentaciones): si una presentacion lleva mas del
     90% de la venta de su familia, las otras se marcan.
   Los productos SIN costo real (sin costo, o costo "provisional") no
   entran al cruce: salen aparte, para que se sepa que faltan. */

/* Equivalencias base -> presentacion. Se cargan en Ajustes -> Avanzado
   (ajustes.presentaciones). Vacia hasta que PERMED cargue las suyas:
   cada producto baja como su propio codigo, igual que antes de que
   existiera esta tabla -- nunca con datos de otra empresa. */
const EQUIVALENCIAS = [];
function equivalencias(){
  const e = S.ajustes && Array.isArray(S.ajustes.presentaciones) && S.ajustes.presentaciones.length
    ? S.ajustes.presentaciones : EQUIVALENCIAS;
  return e.map(x => Array.isArray(x) ? {base:x[0], pres:x[1], factor:Number(x[2])||1} : x);
}
function diasCapitalDe(cat){
  const d = (S.ajustes && S.ajustes.diasCapital) || {};
  if (cat && d[cat] != null) return Number(d[cat]);
  return d["*"] != null ? Number(d["*"]) : 30;
}

/* El motor. Funcion pura: entra la lista de pedidos y el catalogo, sale la
   clasificacion. Sin Firestore adentro, para poderla probar con datos
   reales sin la app. */
function calcularPortafolio(pedidos, catalogo, costoDeFn, existencias, dias, diasCapFn, equivs){
  const cat = {}; (catalogo||[]).forEach(p => { cat[p.cod] = p; });
  const v = {};
  (pedidos||[]).forEach(ped => {
    if (!ped || !esVenta(ped)) return;
    const est = String(ped.estado || "");
    if (est.indexOf("entregado") !== 0) return;              // solo lo entregado (total o parcial)
    (ped.lineas||[]).forEach(l => {
      if (!l || !l.cod) return;
      const u = Number(l.entregado != null ? l.entregado : l.cant) || 0;
      if (u <= 0) return;
      const f = v[l.cod] = v[l.cod] || {cod:l.cod, unidades:0, venta:0};
      f.unidades += u; f.venta += u * (Number(l.precio)||0);
    });
  });
  const filas = [], sinCosto = [];
  Object.keys(cat).forEach(cod => {
    const p = cat[cod]; if (p.visible === false && !v[cod]) return;
    const s = v[cod] || {unidades:0, venta:0};
    const c = costoDeFn(cod);
    const fila = {cod:cod, nombre:p.nombre||cod, cat:p.cat||"", unidades:s.unidades, venta:dosDec(s.venta),
                  precio: s.unidades ? s.venta/s.unidades : (Number(p.precio)||0), existencia: Number(existencias && existencias[cod]) || 0};
    if (c == null || c.prom == null || p.provisional){ sinCosto.push(fila); return; }
    fila.costo = Number(c.prom);
    fila.margenU = fila.precio - fila.costo;
    fila.margenPct = fila.precio > 0 ? fila.margenU / fila.precio : 0;
    fila.utilidad = dosDec(fila.margenU * fila.unidades);
    filas.push(fila);
  });
  // volumen: A/B/C por venta acumulada (80 / 95), sobre todo el catalogo
  const porVenta = filas.slice().sort((a,b) => b.venta - a.venta);
  const totalVenta = porVenta.reduce((a,x) => a + x.venta, 0);
  let acum = 0;
  porVenta.forEach(x => {
    const antes = totalVenta ? acum/totalVenta*100 : 100;
    acum += x.venta;
    x.abc = x.venta > 0 ? (antes < 80 ? "A" : antes < 95 ? "B" : "C") : "C";
    x.altoVolumen = x.abc !== "C";
  });
  // margen: contra la mediana del % de margen
  const pcts = filas.map(x => x.margenPct).sort((a,b) => a-b);
  const mediana = pcts.length ? (pcts.length % 2 ? pcts[(pcts.length-1)/2] : (pcts[pcts.length/2-1] + pcts[pcts.length/2])/2) : 0;
  filas.forEach(x => {
    x.altoMargen = x.margenPct >= mediana;
    x.cuadrante = x.altoVolumen ? (x.altoMargen ? "estrella" : "volumen") : (x.altoMargen ? "oportunidad" : "revisar");
    x.reglas = [];
  });
  // regla 1: utilidad < 0.1% del total
  const utilTotal = filas.reduce((a,x) => a + Math.max(0, x.utilidad), 0);
  filas.forEach(x => { if (utilTotal > 0 && x.utilidad < utilTotal * 0.001) x.reglas.push(1); });
  // regla 2: dias de inventario > dias para recuperar el capital
  filas.forEach(x => {
    const porDia = dias > 0 ? x.unidades / dias : 0;
    x.diasInv = x.existencia > 0 ? (porDia > 0 ? x.existencia / porDia : Infinity) : 0;
    x.diasCap = diasCapFn(x.cat);
    if (x.existencia > 0 && x.diasInv > x.diasCap) x.reglas.push(2);
  });
  // regla 3: canibalizacion entre presentaciones del mismo producto base
  const fam = {}; const porCod = {}; filas.forEach(x => { porCod[x.cod] = x; });
  (equivs||[]).forEach(e => { fam[e.base] = fam[e.base] || new Set([e.base]); fam[e.base].add(e.pres); });
  Object.keys(fam).forEach(base => {
    const miembros = Array.from(fam[base]).map(c => porCod[c]).filter(Boolean);
    if (miembros.length < 2) return;
    const tot = miembros.reduce((a,x) => a + x.venta, 0); if (tot <= 0) return;
    const lider = miembros.slice().sort((a,b) => b.venta - a.venta)[0];
    if (lider.venta / tot > 0.9) miembros.forEach(x => { if (x !== lider){ x.reglas.push(3); x.lider = lider.nombre; } });
  });
  const cuad = {estrella:[], volumen:[], oportunidad:[], revisar:[]};
  filas.forEach(x => cuad[x.cuadrante].push(x));
  const conteo = {};
  Object.keys(cuad).forEach(k => {
    const u = cuad[k].reduce((a,x) => a + Math.max(0,x.utilidad), 0);
    conteo[k] = {n: cuad[k].length, pct: filas.length ? Math.round(cuad[k].length/filas.length*100) : 0,
                 utilPct: utilTotal > 0 ? Math.round(u/utilTotal*100) : 0};
  });
  const marcados = filas.filter(x => x.reglas.length)
    .sort((a,b) => b.reglas.length - a.reglas.length || a.utilidad - b.utilidad);
  return {filas:filas, sinCosto:sinCosto, cuadrantes:conteo, mediana:mediana, utilTotal:dosDec(utilTotal),
          reglas:{1: filas.filter(x=>x.reglas.indexOf(1)>=0).length, 2: filas.filter(x=>x.reglas.indexOf(2)>=0).length, 3: filas.filter(x=>x.reglas.indexOf(3)>=0).length},
          marcados:marcados, dias:dias};
}

  const hoy = hoyISO(), desde = corrido(hoy, -portafolioDias);
  m.innerHTML = '<div class="conteo">Calculando con los pedidos entregados de los últimos ' + portafolioDias + ' días…</div>';
  db.collection("pedidos").where("fecha", ">=", desde).where("fecha", "<=", hoy).get().then(q => {
    const peds = q.docs.map(d => Object.assign({id:d.id}, d.data()));
    const r = calcularPortafolio(peds, S.catalogo, costoDe, S.exist, portafolioDias, diasCapitalDe, equivalencias());
    const idx = {}; (S.catalogo||[]).forEach((p,i) => { idx[p.cod] = i; });
    const OBJ = {estrella:"15–20 %", volumen:"45–50 %", oportunidad:"15 %", revisar:"10–15 %"};

      : n === 2 ? (x.diasInv === Infinity ? "hay existencia y no se vendió" : Math.round(x.diasInv) + " días de inventario (tope " + x.diasCap + ")")
      : "otra presentación lleva más del 90 % (" + escapar(x.lider||"") + ")").join(" · ");
    m.innerHTML =
      '<div class="t-tira" id="pf-tira">' + [30,60,90].map(d => '<button data-d="' + d + '" aria-pressed="' + (portafolioDias===d) + '">' + d + ' días</button>').join("") + '</div>' +

      '<div class="lista" style="margin-top:12px">' +
        [[1,"Utilidad menor al 0.1 %","del total del período"],[2,"Rotación insuficiente","más días en bodega que los de recuperar el capital"],[3,"Canibalización","otra presentación del mismo producto lleva más del 90 %"]]

      '<div class="eyebrow" style="margin-top:16px">A revisar · ' + r.marcados.length + '</div>' +
      (r.marcados.length ? '<div class="lista">' + r.marcados.map(x =>
        '<button class="pf-fila" data-cod="' + escapar(x.cod) + '"><span class="q"><b>' + escapar(x.nombre) + '</b><small>' +

        : '<div class="conteo">Ningún producto disparó una regla en este período.</div>') +

        '<p style="font-size:13px;color:var(--tenue);margin:6px 0 8px">No entran al cruce: sin costo, o costo marcado provisional. Cárguelos en Costos.</p>' +

/* ===================================================================
   MODULO DE PEDIDOS
   Colecciones nuevas: sectores, clientes, existencias, visitas, pedidos.
   Nada de esto toca "configuracion" ni "usuarios".
=================================================================== */

const DIAS = ["Domingo","Lunes","Martes","Miercoles","Jueves","Viernes","Sabado"];

/* Las opciones de dia para los selectores de sector, con los que no se
   trabajan marcados. Lee el MISMO noLaborables de Ajustes, asi que si
   algun dia se decide trabajar sabado se cambia alla y estos se acomodan
   solos, sin tocar codigo.

   Se MARCAN, no se esconden, por dos razones. Una: un sector viejo puede
   traer un dia que hoy quedo libre, y si lo escondiera ese sector no
   podria ni mostrar su propio dia. Y dos: la marca queda a la vista
   tambien con el selector cerrado, o sea que si alguien escoge domingo
   lo va a estar leyendo todo el tiempo.

   Antes ofrecian los siete dias parejos, y si oficina le ponia domingo a
   un sector ese sector no lo visitaba nadie NUNCA — y sin avisar,
   porque al preventista sectorDeHoy() le abre el primero de su lista y
   el trabaja normal sin enterarse. */
function opcionesDia(sel){
  const libres = S.ajustes.noLaborables || [0,6];
  return DIAS.map((d,i) => '<option value="' + i + '"' +
    (sel != null && sel !== "" && Number(sel) === i ? " selected" : "") + '>' + d +
    (libres.indexOf(i) >= 0 ? " \u2014 no se trabaja" : "") + '</option>').join("");
}

/* El dia de una ruta lo pone el supervisor de preventa, no oficina, y cambia.
   Por eso un sector puede existir SIN dia: dia = null. Ojo con Number(null),
   que da 0 y haria que un sector sin dia saliera todos los domingos. */
const tieneDia = x => x && x.dia != null && x.dia !== "";
const ordenDia = x => tieneDia(x) ? Number(x.dia) : 9;
const nombreDia = x => tieneDia(x) ? DIAS[Number(x.dia)] : "sin día";
const RAZONES = ["Cerrado","Sin dinero","Tiene producto","No quiso","No estaba el dueno","Otro"];
function fechaVista(){ return S.fecha || hoyISO(); }
function esHoy(){ return fechaVista() === hoyISO(); }
function correrDia(pasos){
  const [a,m,d] = fechaVista().split("-").map(Number);
  const f = new Date(a, m-1, d + pasos);
  S.fecha = f.getFullYear() + "-" + String(f.getMonth()+1).padStart(2,"0") + "-" + String(f.getDate()).padStart(2,"0");
  /* El sector sigue a la fecha. Antes se quedaba el de hoy: al correr los
     dias, todos decian la misma ruta ("todos los dias dice Lolotique"). */
  S.sectorSel = sectorDeHoy();
  escucharDia();
  pintarRuta();
}
function minutosAhora(){ const d = new Date(); return d.getHours()*60 + d.getMinutes(); }
function minutosDeHora(h){
  if (!h || h.indexOf(":") < 0) return null;
  const [a,b] = h.split(":").map(Number);
  return a*60 + b;
}
// pasada la hora de cierre, el preventista ya no factura
function estaCerrado(){
  if (S.rol === "admin" || S.rol === "supervisor") return false;
  const ahora = minutosAhora();
  const ini = minutosDeHora(S.ajustes.horaInicio);
  if (ini != null && ahora < ini) return true;
  const t = minutosDeHora(S.ajustes.horaCierre);
  if (t == null) return false;
  return ahora >= t;
}
// para explicarle al preventista por que no puede
function motivoCierre(){
  const ini = minutosDeHora(S.ajustes.horaInicio);
  if (ini != null && minutosAhora() < ini)
    return "La jornada todavia no abre (abre a las " + S.ajustes.horaInicio + ")";
  return "Ya paso la hora de cierre (" + S.ajustes.horaCierre + ")";
}
function faltaParaCerrar(){
  const t = minutosDeHora(S.ajustes.horaCierre);
  if (t == null) return null;
  return t - minutosAhora();
}
function esLaborable(iso){
  const [a,m,d] = iso.split("-").map(Number);
  const dia = new Date(a, m-1, d).getDay();
  const libres = S.ajustes.noLaborables || [0,6];
  return libres.indexOf(dia) < 0;
}
// suma días de trabajo: se salta los que la empresa no labora
function sumarHabiles(iso, n){
  let f = iso, faltan = Math.max(0, Number(n) || 0);
  if (!faltan) return f;
  let tope = 0;
  while (faltan > 0 && tope < 60){
    f = corrido(f, 1); tope++;
    if (esLaborable(f)) faltan--;
  }
  return f;
}
function fechaEntregaDe(iso){ return sumarHabiles(iso, S.ajustes.diasEntrega); }
function fechaBonita(iso){
  const [a,m,d] = iso.split("-").map(Number);
  const f = new Date(a, m-1, d);
  const t = f.toLocaleDateString("es-SV", {weekday:"long", day:"numeric", month:"long"});
  return t.charAt(0).toUpperCase() + t.slice(1);
}
function mesISO(){
  const d = new Date();
  return d.getFullYear() + "-" + String(d.getMonth()+1).padStart(2,"0");
}
function seguirPosicion(){
  if (!navigator.geolocation) return;
  navigator.geolocation.getCurrentPosition(pos => {
    S.miPos = {lat:pos.coords.latitude, lng:pos.coords.longitude};
    if (S.pagina === "ruta" && S.vista === "lista") pintarRuta();
  }, ()=>{}, {enableHighAccuracy:true, timeout:15000, maximumAge:30000});
}
function aQueDistancia(c){
  if (!S.miPos || c.lat == null) return null;
  return distMetros(S.miPos.lat, S.miPos.lng, c.lat, c.lng);
}
function textoDist(m){
  if (m == null) return "";
  return m < 1000 ? "A " + m + " m" : "A " + (Math.round(m/100)/10) + " km";
}
/* La misma distancia pero sin el "A " adelante, para meterla en medio
   de un renglon. */
function tramo(m){
  if (m == null) return "";
  return m < 1000 ? m + " m" : (Math.round(m/100)/10) + " km";
}
/* Un rato en milisegundos, dicho como lo diria uno: "8 min", "1 h 12 min".
   Menos de un minuto se dice en segundos, o "12 min" para 40 segundos
   pareceria que estuvo parado un rato largo cuando no. */
function ratos(ms){
  const seg = Math.max(0, Math.round((Number(ms) || 0) / 1000));
  if (seg < 60) return seg + " s";
  const min = Math.round(seg / 60);
  if (min < 60) return min + " min";
  const h = Math.floor(min / 60), r = min % 60;
  return h + " h" + (r ? " " + r + " min" : "");
}
function distMetros(a, b, c, d){
  const R = 6371000, r = x => x*Math.PI/180;
  const dl = r(c-a), dg = r(d-b);
  const x = Math.sin(dl/2)**2 + Math.cos(r(a))*Math.cos(r(c))*Math.sin(dg/2)**2;
  return Math.round(2*R*Math.asin(Math.sqrt(x)));
}
function hoyISO(){
  const d = new Date();
  return d.getFullYear() + "-" + String(d.getMonth()+1).padStart(2,"0") + "-" + String(d.getDate()).padStart(2,"0");
}
const dosDec = n => Math.round((Number(n)||0) * 100) / 100;
let yaAvise = false;
function avisoNube(coleccion, e){
  S.nube = S.nube || {};
  S.nube[coleccion] = { n:0, cache:null, cuando:new Date().toLocaleTimeString(), error:(e && (e.code || e.message)) || "?" };

      "del archivo PASOS-FIRESTORE y darle Publicar.");
  }
}

/* ---- Reconexion automatica ----
   Cuando una lista en vivo muere por permisos, Firestore NO la vuelve a
   intentar sola: queda callada para siempre aunque despues se publiquen
   las reglas buenas. Antes habia que cerrar la app entera. Ahora se
   vuelve a conectar sola, sin perder el carrito ni el cliente abierto. */
let reintentos = 0, relojReintento = null;
function programarReintento(){
  if (relojReintento || reintentos >= 6) return;
  const espera = Math.min(30000, 5000 * (reintentos + 1));
  relojReintento = setTimeout(() => {
    relojReintento = null; reintentos++;
    reconectar();
  }, espera);
}
function reconectar(){
  if (!S.usuario || !db) return;
  // lo que el preventista tiene a medias no se pierde en la reconexion
  const cli = S.cliente, carro = S.carrito, edit = S.editando,
        vis = S.visita, fot = S.foto, nt = S.notaGuardada;
  try { escucharPedidos(); } catch(e){ return; }
  S.cliente = cli; S.carrito = carro; S.editando = edit;
  S.visita = vis; S.foto = fot; S.notaGuardada = nt;
  try { pintarCarro(); } catch(e){}
}
function conexionSana(){
  reintentos = 0; yaAvise = false;
  if (relojReintento){ clearTimeout(relojReintento); relojReintento = null; }
}
async function guardarEn(coleccion, fn, boton){
  if (boton){ boton.disabled = true; }
  try { await fn(); return true; }
  catch(e){
    /* El "permiso denegado" casi nunca es un problema de reglas: la mayoria
       de las veces es que la jornada no esta abierta, y el mensaje viejo
       mandaba al vendedor a revisar roles de Firestore, que no es cosa suya
       ni la puede arreglar parado en una tienda. Primero se le dice lo que
       de verdad esta pasando. */
    const m = e.code === "permission-denied"
      ? (estaCerrado()
          ? motivoCierre() + ".\n\nPor eso no se dej\u00f3 guardar. Int\u00e9ntelo dentro del horario, o p\u00eddale a oficina que lo haga."
          : (S.rol === "admin" || S.rol === "supervisor"
              ? "Firestore no deja escribir en \"" + coleccion + "\".\n\nRevise que las reglas publicadas sean las \u00faltimas y que su cuenta siga con rol admin y activo en verdadero."
              : "No tiene permiso para guardar esto.\n\nAv\u00edsele a oficina: puede ser que su cuenta est\u00e9 desactivada o que este dato solo lo pueda cambiar administraci\u00f3n."))
      : "No se pudo guardar (" + (e.code || e.message) + ").";
    alert(m);
    return false;
  }
  finally { if (boton) boton.disabled = false; }
}

/* Espera una escritura de Firestore, pero no para siempre. Con la
   persistencia encendida, sin senal la escritura queda guardada en el
   telefono y la promesa no contesta hasta que el servidor la confirme: un
   boton "Guardando..." eterno. Devuelve true si se agoto la espera (quedo
   pendiente en el telefono) y false si el servidor ya confirmo. Si el
   servidor RECHAZA (permiso, hora), la promesa revienta igual que antes. */
function esperarEscritura(promesa, ms){
  let reloj;
  const espera = new Promise(r => { reloj = setTimeout(() => r("__sin_senal__"), ms || 6000); });
  return Promise.race([promesa.then(() => "ok"), espera])
    .then(res => { clearTimeout(reloj); return res === "__sin_senal__"; },
          err => { clearTimeout(reloj); throw err; });
}

// La lista en vivo puede quedarse callada (caché local trabado, varias
// pestañas peleando por la misma base). Si pasa, se pide directo al servidor.
async function rescatar(){
  if (!S.usuario || !db) return;
  S.nube = S.nube || {};
  if (!S.sectores.length){
    try {
      const q = await db.collection("sectores").get({source:"server"});
      S.nube.rescateSectores = q.size + " del servidor · " + new Date().toLocaleTimeString();
      if (q.size){
        S.sectores = q.docs.map(d => Object.assign({id:d.id}, d.data()));
        pintarSectores();
        if (S.pagina === "ruta") pintarRuta();
        refrescarAdmin(["sectores","clientes"]);
      }
    } catch(e){ S.nube.rescateSectores = "FALLA [" + (e.code || e.message) + "]"; }
  }
  /* El rescate tambien respeta el reparto: al preventa se le rescatan
     solo sus sectores, y a oficina solo si esta en Administrar. */
  /* Igual que arriba: el supervisor rescata los suyos como preventista. */
  const oficinaR = S.rol === "admin";
  if (!S.clientes.length && !(oficinaR && !adminAbierto)){
    try {
      const idsR = oficinaR ? null : misSectores().map(x => x.id).slice(0,30);
      if (idsR && !idsR.length) return;
      const q = idsR
        ? await db.collection("clientes").where("sectorId","in",idsR).get({source:"server"})
        : await db.collection("clientes").get({source:"server"});
      S.nube.rescateClientes = q.size + " del servidor · " + new Date().toLocaleTimeString();
      if (q.size){
        S.clientes = q.docs.map(d => Object.assign({id:d.id}, d.data()));
        if (S.pagina === "ruta") pintarRuta();
        refrescarAdmin(["sectores","clientes"]);
      }
    } catch(e){ S.nube.rescateClientes = "FALLA [" + (e.code || e.message) + "]"; }
  }
}

/* Envoltorio: corre la funcion y, si truena, lo deja anotado en el
   Taller en vez de tumbar todo lo que venga despues. */
function sinTumbar(nombre, fn){
  try { return fn(); }
  catch(e){
    try {
      console.error("[arranque] fallo " + nombre + ":", e);
    } catch(_){}
    return null;
  }
}

function escucharClientes(){
  /* Quien carga que, y cuando:
     - admin: nada en la calle (no vende), TODOS al abrir Administrar.
     - supervisor: LOS SUYOS en la calle, porque tambien vende, y TODOS al
       abrir Administrar, que ahi zonifica y ocupa verlos completos.
     - preventa y motorista: los de sus sectores.
     Sin la parte del supervisor, al abrir el mapa se le cargaba "nada" y
     la ruta le salia vacia. */
  const esAdmin = S.rol === "admin", esSuper = S.rol === "supervisor";
  const modo = (esAdmin || esSuper) && adminAbierto ? "todos"
             : esAdmin ? "nada"
             : "mios:" + misSectores().map(x => x.id).sort().join(",");
  if (modo === clientesModo) return;      // ya esta escuchando lo correcto
  clientesModo = modo;
  soltarClientes();

  const recibir = (docs, cuantos) => {
    S.nube = S.nube || {};
    S.nube.clientes = {n:cuantos, cache:false, cuando:new Date().toLocaleTimeString(), error:null};
    S.clientes = docs;
    if (S.pagina === "ruta") pintarRuta();
    if (S.pagina === "dia") pintarDia();
    refrescarAdmin(["sectores","clientes","repetidos","zonas"]);
    /* La portada de Administrar cuenta clientes activos y nuevos: si los
       clientes llegan despues de pintarla, se quedaba en 0 (4 sep 2026). */
    if (S.pagina === "admin" && !grupoActual) pintarAdmin();
  };

  if (modo === "nada"){ S.clientes = []; recibir([], 0); return; }

  if (modo === "todos"){
    cortesClientes.push(db.collection("clientes").onSnapshot(q => {
      anotarLectura("clientes (todos)", q);
      recibir(q.docs.map(d => Object.assign({id:d.id}, d.data())), q.size);
      if (S.nube.clientes) S.nube.clientes.cache = q.metadata.fromCache;
    }, e => { avisoNube("clientes", e); }));
    return;
  }

  const ids = misSectores().map(x => x.id);
  if (!ids.length){ S.clientes = []; recibir([], 0); return; }
  const tandas = [];
  for (let i = 0; i < ids.length; i += 30) tandas.push(ids.slice(i, i + 30));
  const partes = tandas.map(() => []);
  tandas.forEach((t, i) => {
    cortesClientes.push(db.collection("clientes").where("sectorId","in",t).onSnapshot(q => {
      anotarLectura("clientes (mis sectores)", q);
      partes[i] = q.docs.map(d => Object.assign({id:d.id}, d.data()));
      const todos = [].concat.apply([], partes);
      recibir(todos, todos.length);
      if (S.nube.clientes) S.nube.clientes.cache = q.metadata.fromCache;
    }, e => { avisoNube("clientes", e); }));
  });
}

function escucharPedidos(){
  soltarPedidos();
  const refrescar = () => {
    if (S.pagina === "ruta") pintarRuta();
    if (S.pagina === "dia") pintarDia();
    if (S.pagina === "hoy") pintarOficinaHoy();   // oficina: se mueve sola
  };
  S.nube = S.nube || {};
  const anotar = (nombre, q) => {
    S.nube[nombre] = { n:q.size, cache:q.metadata.fromCache, cuando:new Date().toLocaleTimeString(), error:null };
    if (!q.metadata.fromCache) conexionSana();
  };
  /* El rol EN VIVO. Antes se decidia una sola vez al entrar: si en ese
     momento el servidor no contestaba (reglas a medio publicar, senal
     floja), la cuenta se quedaba de preventa hasta cerrar sesion. Ahora
     la app vigila su propio documento y se acomoda sola. */
  cortes.push(db.collection("usuarios").doc(S.usuario.uid).onSnapshot(d => {
    if (!d.exists) return;
    const u = d.data();
    const rolNuevo = u.rol || "preventa";
    S.nombre = u.nombre || S.usuario.email;
    ["#chip-usuario","#chip-usuario2","#chip-usuario3","#chip-usuario4"].forEach(k => {
      const c = $(k); if (c) c.textContent = S.nombre;
    });
    S.nube.miRol = rolNuevo + (d.metadata.fromCache ? " (del teléfono)" : " (del servidor)");
    /* ---- La baja y el cierre de sesion, en vivo ----
       Antes esto solo se miraba al entrar: si a alguien le daban de baja
       con la app ya abierta, se quedaba adentro hasta que la cerrara. El
       servidor ya no le dejaba guardar nada, pero el seguia viendo todo.
       Ahora el aparato vigila su propio documento y se sale solo.

       No se hace con datos guardados en el telefono (fromCache): si anda
       sin senal, la copia vieja lo sacaria sin razon. */
    if (!d.metadata.fromCache){
      if (u.activo === false) return sacarSesion(
        "Su cuenta fue desactivada. Hable con el administrador.");
      /* cerrarAntes: la hora que puso administracion. Toda sesion que
         empezo antes de esa hora se cae. La que entre despues, no. */
      const corte = u.cerrarAntes && u.cerrarAntes.toMillis ? u.cerrarAntes.toMillis() : 0;
      if (corte && S.sesionDesde && S.sesionDesde < corte) return sacarSesion(
        "Administración cerró la sesión en este aparato. Vuelva a entrar.");
    }
    if (rolNuevo === S.rol) return;
    S.rol = rolNuevo;
    ver("#btn-admin", S.rol === "admin" || S.rol === "supervisor");
    nota("Su cuenta quedó como " + S.rol + ".");
    // con otro rol cambia lo que puede ver: se rearman las listas
    setTimeout(() => { try { reconectar(); } catch(e){} }, 0);
  }, ()=>{}));
  cortes.push(db.collection("sectores").onSnapshot(q => {
    anotar("sectores", q);
    S.sectores = q.docs.map(d => Object.assign({id:d.id}, d.data()));
    pintarSectores(); refrescar(); refrescarAdmin(["sectores","clientes"]);
    escucharClientes();   // si le asignaron otra ruta, cambia lo que trae
  }, e => { avisoNube("sectores", e); rescatar(); }));
  /* ===== Los clientes, solo los que hacen falta =====
     Con el padron completo son 2,204. Traerlos todos a cada arranque
     ahoga el telefono y gasta datos, y un preventa nunca ocupa mas que
     los de sus rutas. Ahora:
       - preventa y motorista: solo los de sus sectores (Firestore admite
         hasta 30 por consulta, asi que se parte en tandas);
       - oficina: no se traen al arrancar. En vivo y Hoy no los ocupan.
         Se traen enteros cuando entra a Administrar, que ahi si.       */
  sinTumbar("clientes", escucharClientes);
  // si la lista en vivo no llega, se piden al servidor y la pantalla igual funciona
  setTimeout(rescatar, 4000);
  cortes.push(db.collection("listas").onSnapshot(q => {
    S.listas = q.docs.map(d => Object.assign({id:d.id}, d.data()));
    refrescarAdmin(["precios"]);
    if (S.pagina === "catalogo") pintarLista();
  }, ()=>{}));
  cortes.push(db.collection("preciosCliente").onSnapshot(q => {
    S.preciosEsp = {};
    q.docs.forEach(d => { S.preciosEsp[d.id] = d.data().precios || {}; });
    refrescarAdmin(["precios"]);
    if (S.pagina === "catalogo") pintarLista();
  }, ()=>{}));
  cortes.push(db.collection("foco").doc(mesISO()).onSnapshot(d => {
    S.foco = d.exists ? d.data() : null;
    if (S.pagina === "dia") pintarDia();
    refrescarAdmin(["foco"]);
  }, ()=>{}));
  cortes.push(db.collection("configuracion").doc("comisiones").onSnapshot(d => {
    S.comis = d.exists ? d.data() : null;
    if (S.pagina === "dia") pintarDia();
    refrescarAdmin(["foco","tablero"]);
  }, ()=>{}));
  cortes.push(db.collection("motivos").onSnapshot(q => {
    S.motivos = q.docs.map(d => Object.assign({id:d.id}, d.data()));
    refrescarAdmin(["precios"]);
  }, ()=>{}));
  /* Cada oyente se registra por su cuenta. Si uno falla, se anota y los
     demas siguen: antes un tropiezo aqui arriba dejaba sin datos a todo
     lo que venia despues, y en pantalla parecia que fallaba otra cosa. */
  cortes.push(db.collection("existencias").onSnapshot(q => {
    /* Deja constancia de que llegó. Sin esta línea el oyente trabajaba
       bien pero el Taller lo reportaba como "NUNCA LLEGÓ", porque
       buscaba una constancia que nadie escribía. */
    anotar("existencias", q);
    S.exist = {}; S.existDoc = {};
    q.docs.forEach(d => {
      S.exist[d.id] = d.data().disponible;
      S.existDoc[d.id] = Object.assign({cod:d.id}, d.data());
    });
    if (S.pagina === "catalogo") pintarLista();
    refrescarAdmin(["existencias"]);
  }, e => avisoNube("existencias", e)));
  /* El kardex: todo lo que entra y sale de bodega. Solo lo cargan
     quienes lo usan, para no gastarle datos al preventa en la calle. */
  if (S.rol === "bodega" || S.rol === "admin"){
    cortes.push(db.collection("movimientos").limit(400).onSnapshot(q => {
      anotarLectura("movimientos de bodega", q);
      S.movs = q.docs.map(d => Object.assign({id:d.id}, d.data()))
        .sort((a,b) => (b.creadoMs || 0) - (a.creadoMs || 0));
      if (S.pagina === "dia" && S.rol === "bodega") pintarDia();
    }, ()=>{}));
  }
  sinTumbar("dia", escucharDia);
  cortes.push(db.collection("pedidos")
    .where("mes","==",mesISO()).where("preventaUid","==",S.usuario.uid)
    .onSnapshot(q => {
      S.pedidosMes = q.docs.map(d => Object.assign({id:d.id}, d.data())).filter(esVenta);
      if (S.pagina === "dia") pintarDia();
    }, ()=>{}));
  cortes.push(db.collection("metas").where("mes","==",mesISO())
    .onSnapshot(q => {
      S.metas = {};
      q.docs.forEach(d => { S.metas[d.data().preventaUid] = d.data(); });
      if (S.pagina === "dia") pintarDia();
      refrescarAdmin(["metas"]);
    }, ()=>{}));
  if (S.rol === "admin"){
    cortes.push(db.collection("usuarios").onSnapshot(q => {
      S.usuarios = q.docs.map(d => Object.assign({uid:d.id}, d.data()));
      refrescarAdmin(["sectores","metas","usuarios","agenda"]);
    }, ()=>{}));
  }
  /* Su propia cuenta del mes, ya calculada por oficina. Solo resultados:
     aqui no llega ningun costo. */
  cortes.push(db.collection("comisiones").doc(mesISO() + "_" + S.usuario.uid)
    .onSnapshot(d => {
      S.miCuenta = d.exists ? d.data() : null;
      if (S.pagina === "dia") pintarDia();
    }, ()=>{}));
}

let cortesDia = [];
function escucharDia(){
  cortesDia.forEach(f => { try { f(); } catch(e){} });
  cortesDia = [];
  const f = fechaVista();
  const refrescar = () => {
    if (S.pagina === "ruta") pintarRuta();
    if (S.pagina === "dia") pintarDia();
    if (S.pagina === "hoy") pintarOficinaHoy();   // oficina: se mueve sola
    /* La portada de Administrar tambien vive de estos datos (vendido hoy,
       entregas, pedidos). Antes no estaba aqui: se pintaba una vez al abrir
       y si los pedidos llegaban despues, se quedaba en $0.00 para siempre.
       Solo la portada: adentro de una pestana ya repinta refrescarAdmin. */
    if (S.pagina === "admin" && !grupoActual) pintarAdmin();
  };
  cortesDia.push(db.collection("visitas")
    .where("fecha","==",f).where("preventaUid","==",S.usuario.uid)
    .onSnapshot(q => { S.visitasHoy = q.docs.map(d => Object.assign({id:d.id}, d.data())); refrescar(); }, ()=>{}));
  if (S.rol === "despacho"){
    // el motorista ve lo que le toca ENTREGAR ese día
    cortesDia.push(db.collection("pedidos")
      .where("fechaEntrega","<=",f).orderBy("fechaEntrega","desc").limit(300)
      .onSnapshot(q => {
        let lista = q.docs.map(d => Object.assign({id:d.id}, d.data()))
          .filter(p => p.fechaEntrega === f ||
                       p.estado === "pendiente" || p.estado === "aprobado" ||
                       p.estado === "entregado parcial");
        /* camion amarrado a sector: si este motorista tiene sectores
           asignados, solo ve los pedidos de SUS sectores. Sin asignacion,
           ve todo, como antes. */
        const mios = S.sectores.filter(x => x.motoristaUid === S.usuario.uid).map(x => x.id);
        if (mios.length){
          lista = lista.filter(p => {
            const c = S.clientes.find(x => x.id === p.clienteId);
            return c && mios.indexOf(c.sectorId) >= 0;
          });
        }
        S.pedidosDia = lista;
        revisarAvisos();
        refrescar();
      }, ()=>{}));
  } else if (S.rol === "admin" || S.rol === "supervisor"){
    cortesDia.push(db.collection("pedidos").where("fecha","==",f)
      .onSnapshot(q => {
        anotarLectura("pedidos de hoy", q);
        S.pedidosDia = q.docs.map(d => Object.assign({id:d.id}, d.data()));
        revisarAvisos();
        refrescar();
      }, ()=>{}));
    /* OJO: pedidosDia son los pedidos LEVANTADOS hoy, y con diasEntrega en 2
       esos se entregan pasado manana. Para el seguimiento hace falta lo otro:
       lo que toca ENTREGAR hoy, que va por fechaEntrega. Son dos conjuntos
       distintos y confundirlos hacia que el cumplimiento saliera en cero. */
    cortesDia.push(db.collection("pedidos").where("fechaEntrega","==",f)
      .onSnapshot(q => {
        anotarLectura("entregas de hoy", q);
        S.entregasHoy = q.docs.map(d => Object.assign({id:d.id}, d.data()));
        refrescar();
      }, ()=>{}));
    /* Las jornadas del dia: de aqui salen el kilometraje y los gastos que
       anota el motorista. Sin esto, lo que el escribe se queda guardado
       pero nadie de oficina lo ve nunca. */
    cortesDia.push(db.collection("jornadas").where("fecha","==",f)
      .onSnapshot(q => {
        S.jornadasDia = q.docs.map(d => Object.assign({id:d.id}, d.data()));
        revisarAvisos();
        refrescar();
      }, ()=>{}));
  }
  cortesDia.push(db.collection("bodegaDia").doc(f)
    .onSnapshot(d => { S.cortes = (d.exists && d.data().cortes) || {}; refrescar(); }, ()=>{}));
  /* Las devoluciones que esperan respuesta. Unica escucha que se agrega,
     y solo para oficina: los de la calle ya ven las suyas por otro lado. */
  if (S.rol === "admin" || S.rol === "supervisor")
    cortesDia.push(db.collection("cargos").where("mes", "==", mesISO())
      .onSnapshot(q => {
        /* Las que faltan por decidir en oficina. Una devolucion pasa por
           dos manos: primero la contesta el preventa, despues oficina la
           resuelve. Aqui interesan las que oficina no ha cerrado, que se
           reconocen porque no tienen resueltoPor. */
        cargosAbiertos = q.docs.map(d => Object.assign({id:d.id}, d.data()))
          .filter(c => !c.resueltoPor);
        revisarAvisos();
      }, () => {}));
  cortesDia.push(db.collection("jornadas").doc(f + "_" + S.usuario.uid)
    .onSnapshot(d => { S.jornada = d.exists ? d.data() : null; refrescar(); }, ()=>{}));
  cortesDia.push(db.collection("agenda").where("fecha","==",f)
    .onSnapshot(q => {
      S.agenda = q.docs.map(d => Object.assign({id:d.id}, d.data()));
      refrescar();
    }, ()=>{}));
  cortesDia.push(db.collection("pedidos")
    .where("fecha","==",f).where("preventaUid","==",S.usuario.uid)
    .onSnapshot(q => {
      S.pedidosHoy = q.docs.map(d => Object.assign({id:d.id}, d.data())).filter(esVenta);
      refrescar();
    }, ()=>{}));
}

/* ------------------- existencias ------------------- */
function selloExist(cod){
  const d = S.exist[cod];
  if (d == null) return "";
  if (d <= 0) return '<span class="poco">agotado</span>';
  return '<span class="poco">quedan ' + d + '</span>';
}

/* ------------------- ruta del dia ------------------- */
function misSectores(){
  if (!S.usuario) return [];
  const vivos = S.sectores.filter(x => x.activo !== false);
  /* El motorista va por CAMION, no por preventista. Antes esto filtraba
     solo por preventaUid, y para un motorista esa comparacion no da nunca:
     en cuanto oficina le pusiera preventista a cada sector, el se quedaba
     con la lista vacia — y con ella escucharClientes() le cargaba CERO
     clientes, o sea mapa y lista en blanco. Funcionaba de casualidad
     porque ningun sector tenia preventista todavia. Se alinea con la
     lista de pedidos, que ya filtraba bien: sin camion asignado, ve todo. */
  if (S.rol === "despacho"){
    const mios = vivos.filter(x => x.motoristaUid === S.usuario.uid);
    return mios.length ? mios : vivos;
  }

  /* El preventista va por SUS CLIENTES, no solo por el dueno del sector.
     Un sector es suyo si se lo asignaron entero (preventaUid) o si adentro
     tiene al menos un cliente suyo.

     Esto hace falta porque una ruta la comparten DOS preventistas: el
     sector queda en "Todos lo ven" y cada quien ve su mitad por sus
     clientes. Sin esto, con tres rutas que visitan un sector cada lunes,
     al preventista le abria el sector de OTRA ruta — probado: a Jose
     Argueta le abria la ruta de Luis Perdomo. */
  if (S.rol === "preventa" || S.rol === "supervisor"){
    const conMisClientes = {};
    (S.clientes || []).forEach(c => {
      if (c.activo !== false && c.sectorId && c.preventaUid === S.usuario.uid)
        conMisClientes[c.sectorId] = true;
    });
    const mios = vivos.filter(x => x.preventaUid === S.usuario.uid || conMisClientes[x.id]);
    /* Si todavia no le han asignado ni un cliente, se le muestran los
       sectores sin dueno. Si no, el que entra nuevo no veria nada y no
       podria ni empezar a trabajar. */
    return mios.length ? mios : vivos.filter(x => !x.preventaUid);
  }

  return vivos.filter(x => S.rol === "admin" || !x.preventaUid || x.preventaUid === S.usuario.uid);
}
function sectorDeHoy(){
  const [a,me,d] = fechaVista().split("-").map(Number);
  const hoy = new Date(a, me-1, d).getDay(), m = misSectores();
  const s1 = m.find(x => tieneDia(x) && Number(x.dia) === hoy);
  if (s1) return s1.id;
  /* Otro dia sin ruta: no se inventa una. Solo HOY cae al primer sector,
     para que el que no tiene dias puestos no amanezca en blanco. */
  if (!esHoy()) return "";
  return m.length ? m[0].id : "";
}
function pintarSectores(){
  const c = $("#sectores");
  if (!c) return;
  if (!S.sectorSel || !S.sectores.some(x => x.id === S.sectorSel)) S.sectorSel = sectorDeHoy();
  c.innerHTML = "";
  /* MISMA regla que misSectores(): un sector es tuyo si te lo asignaron
     entero o si adentro tiene clientes tuyos. Antes este filtro miraba
     solo preventaUid del sector, y como el preventa va en el CLIENTE (no
     en el sector), o mostraba de mas (sectores sin dueno a todos) o de
     menos (el 2o preventista de una ruta compartida no veia su sector). */
  misSectores()
    .sort((a,b) => ordenDia(a) - ordenDia(b))
    .forEach(sec => {
      const b = document.createElement("button");
      b.className = "cat";
      b.textContent = sec.nombre + (tieneDia(sec) ? " · " + DIAS[Number(sec.dia)].slice(0,3) : "");
      b.setAttribute("aria-pressed", S.sectorSel === sec.id);
      b.onclick = () => { S.sectorSel = sec.id; pintarSectores(); pintarRuta(); };
      c.appendChild(b);
    });
}
function hayAgenda(){
  return S.agenda.some(a => S.rol === "admin" || !a.preventaUid || a.preventaUid === S.usuario.uid);
}
function ordenarPorCercania(lista){
  if (!S.miPos) return lista;
  return lista.slice().sort((a,b) => {
    const da = aQueDistancia(a), dbb = aQueDistancia(b);
    if (da == null && dbb == null) return 0;
    if (da == null) return 1;
    if (dbb == null) return -1;
    return da - dbb;
  });
}
function pedidosDeCliente(id){
  return S.pedidosDia.filter(p => p.clienteId === id && p.tipo !== "cambio");
}
function entregaPendiente(p){ return !p.estado || p.estado === "pendiente" || p.estado === "aprobado"; }
function estaAtrasado(p){ return p.fechaEntrega && p.fechaEntrega < fechaVista() && entregaPendiente(p); }
function clientesDeReparto(){
  const ids = {};
  S.pedidosDia.forEach(p => { ids[p.clienteId] = true; });
  return S.clientes.filter(c => c.activo !== false && ids[c.id])
    .sort((a,b) => (Number(a.orden)||999) - (Number(b.orden)||999));
}
function clientesDelSector(){
  if (S.rol === "despacho") return clientesDeReparto();
  if (hayAgenda()){
    const mios = S.agenda.filter(a => S.rol === "admin" || !a.preventaUid || a.preventaUid === S.usuario.uid);
    const ids = mios.filter(a => !S.sectorSel || a.sectorId === S.sectorSel).map(a => a.clienteId);
    return S.clientes.filter(c => c.activo !== false && ids.indexOf(c.id) >= 0 && esMio(c))
      .sort((a,b) => (Number(a.orden)||999) - (Number(b.orden)||999));
  }
  return S.clientes
    .filter(c => c.activo !== false && c.sectorId === S.sectorSel && esMio(c))
    .sort((a,b) => (Number(a.orden)||999) - (Number(b.orden)||999));
}
// dentro de un sector, cada cliente puede tener su preventista
function esMio(c){
  if (!S.usuario) return false;
  /* El supervisor tambien vende, asi que en la calle ve SU parte de la
     ruta, igual que un preventista. Para supervisar entra a Administrar,
     y ahi si se le cargan todos. */
  if (S.rol !== "preventa" && S.rol !== "supervisor") return true;
  return !c.preventaUid || c.preventaUid === S.usuario.uid;
}
function estadoCli(c){
  if (S.rol === "despacho"){
    const ps = pedidosDeCliente(c.id);
    if (!ps.length) return {clase:"libre", texto:"Sin pedido"};
    const faltan = ps.filter(entregaPendiente).length;
    const total = ps.reduce((a,p) => a + (Number(p.total)||0), 0);
    if (!faltan) return {clase:"hecho", texto:"Entregado · " + money(total)};
    return {clase:"prog", texto:faltan + (faltan === 1 ? " pedido por entregar" : " pedidos por entregar")};
  }
  const v = visitaDe(c.id);
  const prog = S.agenda.some(a => a.clienteId === c.id);
  if (v) return {clase:"hecho", texto: prog ? "Programado y visitado" : "Visitado"};
  if (prog) return {clase:"prog", texto:"Programado para hoy"};
  return {clase:"libre", texto:"No programado"};
}
function visitaDe(clienteId){ return S.visitasHoy.find(v => v.clienteId === clienteId); }

function pintarRuta(){
  if (arrastrando) return;   // no tocar el mapa a media arrastrada
  const m = $("#ruta-cuerpo");
  if (!m) return;
  pintarSectores();
  if (!S.sectores.length){
    m.innerHTML = '<div class="vacio"><p>Todavia no hay sectores.</p><p style="font-size:14px">' +
      (S.rol === "admin" ? "Cree los sectores en Administrar &rarr; Sectores." : "Avisele al administrador.") + '</p></div>';
    return;
  }
  const lista = clientesDelSector();
  const visitados = lista.filter(c => visitaDe(c.id)).length;
  const conPedido = lista.filter(c => { const v = visitaDe(c.id); return v && v.resultado === "pedido"; }).length;
  const monto = S.pedidosHoy.reduce((a,p) => a + (Number(p.total)||0), 0);

  /* El despacho no levanta visitas ni pedidos: sus tres numeros salen de lo
     que le toca ENTREGAR y de lo que entrego de verdad, no de lo pedido. */
  const esDesp = S.rol === "despacho";
  /* Antes las cifras contaban TODAS sus entregas y la lista solo las del
     sector elegido: por eso salia "0/4 entregadas" junto a "ruta terminada".
     Ahora las dos hablan de lo mismo. */
  const idsSector = {};
  if (esDesp) lista.forEach(c => { idsSector[c.id] = 1; });
  const repartos = esDesp
    ? S.pedidosDia.filter(p => p.tipo !== "cambio" && idsSector[p.clienteId])
    : [];
  const cerradas = repartos.filter(p => p.estado === "entregado" || p.estado === "entregado parcial");
  const cobrado = cerradas.reduce((a,p) => a + montoEntregado(p), 0);
  /* Lo que le FALTA por cobrar en la calle. Es con lo que el motorista
     cuadra al final del dia, y antes no salia por ningun lado. */
  const porCobrar = repartos.filter(entregaPendiente)
    .reduce((a,p) => a + (Number(p.total)||0), 0);
  /* Las fichas del pie del mapa se cuentan adentro de pintarMapaLleno,
     sobre los mismos clientes que se pintan: por eso pueden filtrar. */
  const pct = esDesp
    ? (repartos.length ? Math.round(cerradas.length / repartos.length * 100) : 0)
    : (lista.length ? Math.round(visitados / lista.length * 100) : 0);

  const falta = (S.rol === "preventa") ? faltaParaCerrar() : null;
  const avisoCierre = (falta != null && falta > 0 && falta <= 45)
    ? '<div class="aviso dato">Faltan ' + falta + ' minutos para el cierre de las ' +
      escapar(S.ajustes.horaCierre) + '.</div>'
    : (falta != null && falta <= 0
        ? '<div class="aviso">Cerrado desde las ' + escapar(S.ajustes.horaCierre) + '.</div>' : '');
  const enMapa = S.vista === "mapa";
  $("#pant-ruta").classList.toggle("lleno", enMapa);
  marcarNav();
  if (enMapa) return pintarMapaLleno(lista, visitados, conPedido, monto, avisoCierre, {cobrado, porCobrar});
  m.innerHTML =
    avisoCierre + avisoDeVoz() +
    ('<div class="meta">' +
      /* Andar para atras y adelante en las fechas es cosa de oficina y del
         motorista, que reparte lo de ayer. Al preventa le estorbaba y lo
         tocaba sin querer: el trabaja hoy. */
      '<div class="dia" style="margin-bottom:6px">' +
        (S.rol === "preventa" ? '' :
          '<button id="l-ayer" style="font-size:19px;color:var(--verde);padding:0 8px">‹</button>') +
        '<span style="flex:1;text-align:center">' + fechaBonita(fechaVista()) + '</span>' +
        (S.rol === "preventa" ? '' :
          '<button id="l-manana" style="font-size:19px;color:var(--verde);padding:0 8px">›</button>') +
      '</div>' +
      '<div class="meta-cifras" style="margin-top:6px">' +
        '<div><b class="num">' + (esDesp ? cerradas.length + "/" + repartos.length : visitados + "/" + lista.length) + '</b>' +
          '<span style="font-size:12px;color:var(--tenue);font-weight:700">' +
          (esDesp ? "entregadas" : "visitados") + '</span></div>' +
        '<div style="text-align:right"><b class="num">' + (esDesp ? money(cobrado) : money(monto)) + '</b>' +
          '<span style="font-size:12px;color:var(--tenue);font-weight:700">' +
          (esDesp ? (porCobrar ? "cobrado \u00b7 falta " + money(porCobrar) : "cobrado")
                  : conPedido + " con pedido") + '</span></div>' +
      '</div>' +
      '<div class="barra"><i style="width:' + pct + '%"></i></div>' +
    '</div>') +
    /* Antes habia dos filas de botones iguales pegadas: Lista/Mapa y
       Mi ruta/Cercanos. Son cosas distintas — una es COMO se ve y la otra
       A QUIENES se ve — asi que ahora solo Lista/Mapa va arriba, y los
       filtros van como fichas, que se entienden de un vistazo. */
    '<div class="vistas">' +
      '<button data-v="lista" aria-pressed="true">Lista</button>' +
      '<button data-v="mapa" aria-pressed="false">Mapa</button>' +
    '</div>' +
    '<div class="filtros-cli" id="ruta-filtros">' +
      '<button data-f="todos" aria-pressed="' + (S.filtroCli !== "pend" && S.filtroCli !== "hechos" && S.quienes !== "cerca") + '">' +
        (esDesp ? "Todas" : "Toda la ruta") + '</button>' +
      '<button data-f="pend" aria-pressed="' + (S.quienes !== "cerca" && S.filtroCli === "pend") + '">' +
        (esDesp ? "Por entregar" : "Por visitar") + '</button>' +
      '<button data-f="hechos" aria-pressed="' + (S.quienes !== "cerca" && S.filtroCli === "hechos") + '">' +
        (esDesp ? "Entregadas" : "Ya visitados") + '</button>' +
      /* Al motorista no le sirve buscar tiendas cercanas: el lleva una
         lista fija de entregas. Solo le sale al preventa. */
      (esDesp ? '' :
        '<button data-f="cerca" aria-pressed="' + (S.quienes === "cerca") + '">Cercanos</button>') +
    '</div>' +
    '<div id="ruta-lista"></div>';

  cablearAvisoVoz();
  $$("#ruta-cuerpo .vistas button").forEach(b => b.onclick = () => {
    S.vista = b.dataset.v;
    try { localStorage.setItem("vistaRuta", S.vista); } catch(e){}
    pintarRuta();
  });
  if ($("#l-ayer")) $("#l-ayer").onclick = () => correrDia(-1);
  if ($("#l-manana")) $("#l-manana").onclick = () => correrDia(1);
  $$("#ruta-cuerpo .filtros-cli button").forEach(b => b.onclick = () => {
    const f = b.dataset.f;
    S.quienes = (f === "cerca") ? "cerca" : "ruta";
    S.filtroCli = (f === "cerca") ? "todos" : f;
    pintarRuta();
  });

  const cont = $("#ruta-lista");
  const cerca = S.quienes === "cerca";
  /* El que sigue: antes solo salia en el mapa, y es lo mas util que tiene
     la app. Ahora la lista lo marca con su cinta y lo pone de primero. */
  const sig = cerca ? null : siguienteCliente(lista);
  sigId = sig ? sig.id : null;
  if (!cerca && esHoy()) avisarSiguiente(sig);
  let gente = cerca
    ? ordenarPorCercania(S.clientes.filter(c => c.activo !== false && esMio(c))).slice(0, 40)
    : lista;
  if (!cerca && S.filtroCli === "pend")   gente = gente.filter(pendiente);
  if (!cerca && S.filtroCli === "hechos") gente = gente.filter(c => !pendiente(c));
  if (sig && gente.indexOf(sig) > 0)
    gente = [sig].concat(gente.filter(c => c.id !== sig.id));

  if (!gente.length){
    cont.innerHTML = '<div class="vacio"><p>' +
      (cerca ? "No hay clientes cargados todavía."
       : S.filtroCli === "pend" ? (!esHoy() ? "Nada pendiente en este d\u00eda."
                                  : lista.length ? "No queda nadie pendiente. Ruta terminada."
                                  : "Este sector no tiene clientes para hoy.")
       : S.filtroCli === "hechos" ? "Todavía no hay ninguno hecho hoy."
       : "Este sector no tiene clientes.") + '</p></div>';
    return;
  }
  if (cerca && !S.miPos){
    cont.innerHTML = '<div class="aviso dato">Buscando su ubicación para ordenarlos por cercanía…</div>';
  }
  gente.forEach(c => cont.appendChild(tarjetaCliente(c)));
}

/* ===================== Voz en la calle =====================
   El preventa y el motorista andan en moto y no pueden ir mirando la
   pantalla. La app les DICE quien sigue y a cuantos metros, para que no
   tengan que tocar nada andando.
   Viene APAGADA. Cada quien la enciende en su telefono desde su nombre,
   y queda guardada ahi. Nadie se la impone a nadie.
   Solo habla cuando cambia el que sigue: si repitiera cada rato en vez
   de ayudar seria un fastidio y la iban a apagar el primer dia. */
const VOZ_LLAVE = "vozCalle", VOZ_AVISO = "vozAvisada";
/* Viene ENCENDIDA. A la gente no se le puede andar explicando cosa por cosa:
   que funcione sola, y el que no la quiera la apaga. Solo queda apagada si
   la persona la apago a proposito. */
function vozEncendida(){
  try { return localStorage.getItem(VOZ_LLAVE) !== "0"; } catch(e){ return false; }
}
function ponerVoz(v){
  try { localStorage.setItem(VOZ_LLAVE, v ? "1" : "0"); } catch(e){}
  if (!v) callarVozCalle();
}
function hayVoz(){ return typeof window !== "undefined" && !!window.speechSynthesis; }
function callarVozCalle(){
  try { window.speechSynthesis && window.speechSynthesis.cancel(); } catch(e){}
}
function vozEspanolCalle(){
  try {
    const l = window.speechSynthesis.getVoices() || [];
    return l.find(v => /es[-_]SV|es[-_]MX|es[-_]US/i.test(v.lang))
        || l.find(v => /^es/i.test(v.lang)) || null;
  } catch(e){ return null; }
}
function decir(texto){
  if (!vozEncendida() || !hayVoz() || !texto) return;
  try {
    window.speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(String(texto).slice(0, 220));
    const v = vozEspanolCalle(); if (v) u.voice = v;
    u.lang = (v && v.lang) || "es-ES";
    u.rate = 1; u.pitch = 1;
    window.speechSynthesis.speak(u);
  } catch(e){}
}

/* La primera vez que habla, se avisa en pantalla como apagarla. Asi nadie
   tiene que sentarse a explicarle a cada quien. Sale una sola vez. */
function vozYaAvisada(){
  try { return localStorage.getItem(VOZ_AVISO) === "1"; } catch(e){ return true; }
}
function avisoDeVoz(){
  if (!vozEncendida() || vozYaAvisada()) return "";
  if (S.rol !== "preventa" && S.rol !== "despacho") return "";
  return '<div class="aviso dato" id="voz-aviso">' +
    '<b>La app le va diciendo qui\u00e9n sigue.</b><br>' +
    'Es para que no tenga que ir mirando el tel\u00e9fono. Si no la quiere, ap\u00e1guela aqu\u00ed.' +
    '<div class="fila" style="margin-top:9px;gap:8px">' +
      '<button class="btn linea chico" id="voz-off" style="width:auto">Apagar la voz</button>' +
      '<button class="btn linea chico" id="voz-ok" style="width:auto">Dejarla</button>' +
    '</div></div>';
}
function cablearAvisoVoz(){
  const off = $("#voz-off"), ok = $("#voz-ok");
  const cerrar = () => { try { localStorage.setItem(VOZ_AVISO, "1"); } catch(e){} pintarRuta(); };
  if (off) off.onclick = () => { ponerVoz(false); cerrar(); };
  if (ok)  ok.onclick  = cerrar;
}

/* Lo ultimo que se dijo, para no repetirlo. */
let vozUltimoSig = "";
function avisarSiguiente(sig){
  if (!vozEncendida()) return;
  // solo a quien anda en la calle
  if (S.rol !== "preventa" && S.rol !== "despacho") return;
  if (!sig){
    if (vozUltimoSig !== "FIN"){
      vozUltimoSig = "FIN";
      decir(S.rol === "despacho" ? "Ya no queda ninguna entrega." : "Ruta terminada. No queda nadie pendiente.");
    }
    return;
  }
  if (vozUltimoSig === sig.id) return;      // ya se dijo, no repetir
  vozUltimoSig = sig.id;
  const d = aQueDistancia(sig);
  const dist = d == null ? "" : (d < 1000 ? ", a " + d + " metros"
    : ", a " + (Math.round(d/100)/10).toString().replace(".", " punto ") + " kilómetros");
  decir((S.rol === "despacho" ? "Siguiente entrega: " : "Sigue ") + (sig.nombre || "") + dist);
}

/* Abre el navegador del telefono en el punto del negocio. Anda con Google
   Maps, con Waze o con el que tenga puesto: se deja que el sistema elija. */
function comoLlegar(c){
  if (c.lat == null || c.lng == null)
    return alert("Este negocio todav\u00eda no tiene punto en el mapa.");
  const u = "https://www.google.com/maps/dir/?api=1&destination=" + c.lat + "," + c.lng +
            "&travelmode=driving";
  window.open(u, "_blank");
}

function tarjetaCliente(c){
  const v = visitaDe(c.id);
  const est = estadoCli(c);
  const d = aQueDistancia(c);
  const t = document.createElement("div");
  t.className = "tarjeta-cli toca" + (c.id === sigId ? " es-sig" : "");
  t.innerHTML =
    (c.id === sigId ? '<span class="sig-cinta">SIGUE</span>' : '') +
    '<div class="arriba">' +
      (c.foto ? '<img class="mini-foto" src="' + c.foto + '" alt="">'
              : '<div class="mini-foto vacia">▣</div>') +

      (esHoy()

  /* Tocar la tarjeta abre al cliente. Antes habia un boton "Mas" que no
     decia nada; el area de toque grande es mas facil con una mano ocupada. */
  t.onclick = e => { if (!e.target.closest(".pie button")) hojaCliente(c); };

  };
  return t;
}

/* Guarda un texto como archivo en Descargas. Sirve para el catálogo
   y para cualquier cosa que haya que sacar del sistema. */
function bajarArchivo(nombre, tipo, texto){
  const url = URL.createObjectURL(new Blob([texto], { type: tipo }));
  const a = document.createElement("a");
  a.href = url; a.download = nombre;
  document.body.appendChild(a);
  a.click();
  setTimeout(() => { try { document.body.removeChild(a); URL.revokeObjectURL(url); } catch(e){} }, 1500);
}

/* ¿Aguanta este telefono el mapa nitido? Se pregunta UNA vez y se
   recuerda: crear un lienzo WebGL cuesta, y esto se llama al armar cada
   mapa. Si no aguanta, la opcion ni se ofrece. */
let webglSirve = null;
function aguantaNitido(){
  if (webglSirve !== null) return webglSirve;
  try {
    const c = document.createElement("canvas");
    const g = c.getContext("webgl2") || c.getContext("webgl") ||
              c.getContext("experimental-webgl");
    webglSirve = !!(g && typeof g.getParameter === "function");
    /* Se suelta a proposito: un lienzo WebGL colgado se queda ocupando
       memoria de video en telefonos chiquitos. */
    try { const p = g && g.getExtension("WEBGL_lose_context"); if (p) p.loseContext(); } catch(_){}
  } catch(e){ webglSirve = false; }
  return webglSirve;
}

/* Las librerias del mapa nitido se bajan la PRIMERA vez que alguien
   escoge esa capa, no al abrir la app. Asi el que nunca la use no paga
   los 780 kB. Despues el service worker las deja guardadas. */
let cargandoNitido = null;
function cargarNitido(){
  if (window.L && L.maplibreGL) return Promise.resolve(true);
  if (cargandoNitido) return cargandoNitido;
  const traer = src => new Promise((ok, mal) => {
    const t = document.createElement("script");
    t.src = src; t.async = true;
    t.onload = () => ok(true);
    t.onerror = () => mal(new Error("no bajo " + src));
    document.head.appendChild(t);
  });
  cargandoNitido = traer("./maplibre-gl.js")
    .then(() => traer("./leaflet-maplibre-gl.js"))
    .then(() => !!(window.L && L.maplibreGL))
    .catch(e => { cargandoNitido = null; throw e; });
  return cargandoNitido;
}

/* ---- Las calles del mapa Nitido, oscurecidas -----------------------
   Brayan: "el motorista arregla los tickets guiandose por el mapa, pero
   si al buscar sus puntos no ve los caminos como deben ser, como hara?"

   Tenia razon, y se midio. La calle no la dibuja el relleno blanco -ese
   contra el fondo da 1.08 a 1, y 1.00 es invisible-: la dibuja la rayita
   de las orillas. Y esa rayita, en las cuatro capas, anda igual de mal:

       Calles   1.90 a 1      Nitido, calle menor   1.45 a 1
       Caminos  1.76 a 1      Oscuro                1.69 a 1

   Lo minimo que se pide para que una raya gruesa se distinga es 3.00.
   Ninguna llega ni a 2, asi que CAMBIAR DE CAPA no arregla nada.

   Tres de las cuatro son fotos ya pintadas: nos llegan hechas y su color
   no se toca. El Nitido no: manda las lineas y el telefono las dibuja.
   Por eso es el unico que se puede arreglar, y se arregla aqui.

   #8e8e8b es el gris MAS SUAVE que llega a 3.00 contra el fondo #f8f4f0
   del estilo. Mas oscuro se veria sucio; mas claro no cumple.

   No se tocan las calles grandes -su naranja #e9ac77 ya se distingue por
   color, no solo por claridad- ni nada que no sea una raya de color fijo:
   si el estilo trae una expresion, se deja como esta. */
const GRIS_CALLE = "#8e8e8b";
const GRIS_ORIGINAL = /^#cfcdca$/i;

function oscurecerCalles(capa){
  let gl = null;
  try { gl = capa && capa.getMaplibreMap && capa.getMaplibreMap(); } catch(e){}
  if (!gl) return;
  const aplicar = () => {
    let capas = [];
    try { capas = (gl.getStyle() || {}).layers || []; } catch(e){ return; }
    let tocadas = 0;
    capas.forEach(l => {
      if (!l || l.type !== "line") return;
      let color;
      try { color = gl.getPaintProperty(l.id, "line-color"); } catch(e){ return; }
      if (typeof color !== "string" || !GRIS_ORIGINAL.test(color)) return;
      try { gl.setPaintProperty(l.id, "line-color", GRIS_CALLE); tocadas++; } catch(e){}
    });
    return tocadas;
  };
  /* El estilo puede no haber terminado de bajar. Si no esta listo, se
     espera el aviso; si truena, el mapa se queda como venia y ya. */
  try {
    if (gl.isStyleLoaded && gl.isStyleLoaded()) aplicar();
    else gl.once("styledata", () => { try { aplicar(); } catch(e){} });
  } catch(e){}
}

function ponerCapa(clave){
  if (!mapa) return;
  const c = CAPAS[clave] || CAPAS.calles;

  /* El mapa nitido va por otro camino: hay que bajarle las librerias y
     eso puede fallar por senal. Se deja la capa de antes puesta MIENTRAS
     baja — asi no se queda la pantalla en blanco a medio camino — y si
     algo truena se cae a Calles y se avisa. En la calle no se puede
     quedar nadie sin mapa. */
  if (c.vector){
    if (!aguantaNitido()) return ponerCapa("calles");
    const antes = capaBase, antesEncima = capaEncima;
    cargarNitido().then(() => {
      if (!mapaVive()) return;
      let capa;
      try { capa = L.maplibreGL({style: c.estilo}).addTo(mapa); }
      catch(e){ throw e; }
      if (antes){ try { mapa.removeLayer(antes); } catch(e){} }
      if (antesEncima){ try { mapa.removeLayer(antesEncima); } catch(e){} }
      capaBase = capa; capaEncima = null;
      oscurecerCalles(capa);
      guardarCapa(clave); marcarCapa(clave);
    }).catch(() => {
      if (!mapaVive()) return;
      nota("El mapa nítido necesita señal la primera vez. Se dejó el de siempre.");
      ponerCapa("calles");
    });
    return;
  }

  if (capaBase) mapa.removeLayer(capaBase);
  if (capaEncima){ mapa.removeLayer(capaEncima); capaEncima = null; }
  capaBase = L.tileLayer(c.url, c.ops).addTo(mapa);
  if (c.encima) capaEncima = L.tileLayer(c.encima, c.encimaOps || {maxZoom:21, maxNativeZoom:16}).addTo(mapa);
  guardarCapa(clave);
  marcarCapa(clave);
}

}
