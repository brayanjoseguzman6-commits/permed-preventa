// 1) lo que sube al camión, sumado por producto
/* ===================== Lo que no va =====================
   Cuando la existencia de bodega esta en negativo, se pidio mas de lo que
   hay. Aqui se decide QUIEN se queda sin que: se sirve siguiendo el orden
   de la ruta, asi los primeros clientes van completos y el faltante lo
   absorben los ultimos. Es lo mismo que hace bodega a mano, pero ya
   repartido pedido por pedido para que el motorista no llame a preguntar. */
function ordenDeCliente(ped){
  const c = S.clientes.find(x => x.id === ped.clienteId);
  return c && c.orden != null ? Number(c.orden) : 999;
}

function ajustesReparto(pedidos){
  const reales = (pedidos || []).filter(p => p.tipo !== "cambio");
  const pedido = {};
  reales.forEach(p => (p.lineas || []).forEach(l => {
    pedido[l.cod] = (pedido[l.cod] || 0) + (Number(l.cant) || 0);
  }));
  const queda = {}, porque = {};
  Object.keys(pedido).forEach(cod => {
    const corte = S.cortes[cod];
    if (corte && corte.va != null){          // bodega lo miro y lo dijo
      queda[cod] = Math.max(0, Number(corte.va) || 0);
      porque[cod] = corte.motivo || "no hay en bodega";
      return;
    }
    const d = S.exist[cod];
    queda[cod] = (d != null && d < 0) ? Math.max(0, pedido[cod] + d) : pedido[cod];
    porque[cod] = "no hay en bodega";
  });
  const res = {};
  reales.slice().sort((a,b) => ordenDeCliente(a) - ordenDeCliente(b)).forEach(p => {
    (p.lineas || []).forEach(l => {
      const c = Number(l.cant) || 0;
      const hay = queda[l.cod] != null ? queda[l.cod] : c;
      const va = Math.max(0, Math.min(c, hay));
      queda[l.cod] = Math.max(0, hay - va);
      if (va < c){
        res[p.id] = res[p.id] || {};
        res[p.id][l.cod] = {pedida:c, va:va, falta:c - va, motivo:porque[l.cod] || "no hay en bodega"};
      }
    });
  });
  return res;
}

function totalAjustado(ped, aj){
  return dosDec((ped.lineas || []).reduce((t,l) => {
    const a = aj && aj[l.cod];
    return t + (a ? a.va : (Number(l.cant)||0)) * (Number(l.precio)||0);
  }, 0));
}

/* La pantalla que el motorista lleva en la mano. Una tarjeta por cliente:
   lo que va, lo que no va y por que, y el total ya descontado. */
function pintarHojaEntrega(m, mios){
  const ajustes = ajustesReparto(mios);
  const recortados = Object.keys(ajustes).length;
  const orden = mios.slice().sort((a,b) => ordenDeCliente(a) - ordenDeCliente(b));

  m.insertAdjacentHTML("beforeend",
    (recortados
      ? '<div class="aviso dato">Bodega no alcanza para todo. <b>' + recortados +
        (recortados === 1 ? ' pedido va</b> recortado' : ' pedidos van</b> recortados') +
        '. Ya está descontado aquí abajo: lo que dice el papel amarillo es lo que va.</div>'
      : '<div class="aviso bien">Todo lo del día va completo. No hay faltantes de bodega.</div>') +
    '<div id="he-lista" style="margin-top:12px"></div>');

  $("#he-lista").innerHTML = orden.map(p => {
    const aj = ajustes[p.id];
    const listo = !entregaPendiente(p);
    const tot = totalAjustado(p, aj);
    const cambio = Math.abs(tot - (Number(p.total)||0)) > 0.001;
    const fuera = [];
    const lineas = (p.lineas || []).map(l => {
      const a = aj && aj[l.cod];
      if (!a) return '<div class="he-lin"><span class="cn">' + l.cant + '</span>' +
        '<span class="nm">' + escapar(l.nombre) + '</span></div>';
      if (a.va === 0){
        fuera.push("no va " + l.nombre + " (" + (a.motivo || "no hay") + ")");
        return '<div class="he-lin fuera"><span class="cn">0</span>' +
          '<span class="nm">' + escapar(l.nombre) + '</span></div>';
      }
      fuera.push("menos " + a.falta + " " + l.nombre + " (" + (a.motivo || "no hay") + ")");
      return '<div class="he-lin menos"><span class="cn">' + a.va + '</span>' +
        '<span class="nm">' + escapar(l.nombre) +
        ' <s>(pidió ' + a.pedida + ')</s></span></div>';
    }).join("");

    return '<div class="he-cli' + (aj ? ' recortado' : '') + (listo ? ' hecho' : '') +
        '" data-id="' + p.id + '">' +
      '<div class="he-top">' +
        '<span class="qui"><b>' + escapar(p.clienteNombre || "") + '</b>' +
        '<small>' + escapar(p.clienteCodigo || "") +
          (p.clienteTelefono ? ' · ' + escapar(p.clienteTelefono) : '') +
          (p.adicional ? ' · ADICIONAL' : '') + '</small></span>' +
        '<span class="mon"><b class="num">' + money(tot) + '</b>' +
          (cambio ? '<s class="num">antes ' + money(p.total) + '</s>' : '') + '</span>' +
      '</div>' +
      '<div style="margin-top:9px">' + lineas + '</div>' +
      (fuera.length
        ? '<div class="he-nota">' + escapar(fuera.join(" · ")) +
          ' — avísele al cliente.</div>'
        : '') +
      (listo
        ? '<div class="he-nota nada" style="background:var(--f-listo);color:var(--c-listo)">' +
          escapar(p.estado) + '</div>'
        : '<button class="btn" data-e="' + p.id + '" style="margin-top:11px">Entregar</button>') +
    '</div>';
  }).join("") || '<div class="vacio"><p>No hay pedidos para repartir hoy.</p></div>';

  $$("#he-lista button[data-e]").forEach(b => b.onclick = () => {
    const ped = mios.find(x => x.id === b.dataset.e);
    if (!ped) return;
    const aj = ajustes[ped.id];
    // lo que no hay entra ya descontado en la entrega
    if (aj) (ped.lineas || []).forEach(l => {
      if (aj[l.cod] && l.entregado == null) l.entregado = aj[l.cod].va;
    });
    const c = S.clientes.find(x => x.id === ped.clienteId) ||
      {id:ped.clienteId, nombre:ped.clienteNombre, codigo:ped.clienteCodigo};
    hojaEntrega(ped, c);
  });
}

function hojaCarga(pedidos, motorista, fecha){
  const acum = {};
  pedidos.forEach(p => (p.lineas||[]).forEach(l => {
    const k = l.cod;
    acum[k] = acum[k] || {cod:l.cod, nombre:l.nombre, cant:0, total:0};
    acum[k].cant += Number(l.cant)||0;
    acum[k].total += Number(l.total)||0;
  }));

  /* Existencia en negativo = se pidio mas de lo que hay en bodega.
     Ese faltante se reparte aqui para que el motorista sepa desde
     ANTES de salir que es lo que no va, sin andar adivinando. */
  const filas = Object.keys(acum).map(k => {
    const f = acum[k];
    const disp = S.exist[f.cod];
    f.falta = (disp != null && disp < 0) ? Math.min(f.cant, -disp) : 0;
    f.va = f.cant - f.falta;
    return f;
  }).sort((a,b) => a.cod.localeCompare(b.cod));

  const valor = filas.reduce((a,x) => a + x.total, 0);
  const unidades = filas.reduce((a,x) => a + x.cant, 0);
  const faltantes = filas.filter(f => f.falta > 0);

  cajaImpresion().innerHTML =
    '<div class="hoja-ruta">' +
      encabezadoHoja("INVENTARIO INICIAL DE RUTA", motorista, fecha,
        pedidos.length + " pedidos · valor " + money(valor)) +
      '<table><thead><tr>' +
        '<th style="width:64px">Código</th><th>Producto</th>' +
        '<th class="num" style="width:52px">Pedido</th>' +
        '<th class="num" style="width:44px">Va</th>' +
        '<th class="num" style="width:48px">Falta</th>' +
        '<th class="num" style="width:66px">Valor</th>' +
        '<th style="width:52px">Cargado</th>' +
      '</tr></thead><tbody>' +
      filas.map(f => '<tr><td>' + escapar(f.cod) + '</td><td>' + escapar(f.nombre) + '</td>' +
        '<td class="num">' + f.cant + '</td>' +
        '<td class="num">' + f.va + '</td>' +
        '<td class="num">' + (f.falta ? '<b>' + f.falta + '</b>' : '—') + '</td>' +
        '<td class="num">' + money(f.total) + '</td>' +
        '<td></td></tr>').join("") +
      '<tr class="totalfila"><td colspan="2">TOTAL · ' + filas.length + ' productos</td>' +
        '<td class="num">' + unidades + '</td>' +
        '<td class="num">' + filas.reduce((a,x) => a + x.va, 0) + '</td>' +
        '<td class="num">' + filas.reduce((a,x) => a + x.falta, 0) + '</td>' +
        '<td class="num">' + money(valor) + '</td><td></td></tr>' +
      '</tbody></table>' +
      (faltantes.length
        ? '<div style="border:2px solid #000;padding:8px 10px;margin-top:10px">' +
          '<b>NO VA · SIN EXISTENCIA EN BODEGA</b><br>' +
          faltantes.map(f => escapar(f.nombre) + ": faltan " + f.falta).join("<br>") +
          '<br><i>Avisar al cliente al entregar: ese producto no viene en el cami\u00f3n.</i></div>'
        : '') +
      '<div class="firma">Entregó bodega</div>' +
      '<div class="firma">Recibió motorista</div>' +
    '</div>';
  window.print();
}

// 2) el recorrido: qué le toca a cada cliente
function hojaEntregas(pedidos, motorista, fecha){
  const porCliente = {};
  pedidos.forEach(p => {
    porCliente[p.clienteId] = porCliente[p.clienteId] || {pedidos:[], nombre:p.clienteNombre,
      codigo:p.clienteCodigo, tel:p.clienteTelefono, dir:p.clienteDireccion};
    porCliente[p.clienteId].pedidos.push(p);
  });
  const ids = Object.keys(porCliente).sort((a,b) => {
    const ca = S.clientes.find(x => x.id === a) || {}, cb = S.clientes.find(x => x.id === b) || {};
    return (Number(ca.orden)||999) - (Number(cb.orden)||999);
  });
  const total = pedidos.reduce((a,p) => a + (Number(p.total)||0), 0);

  cajaImpresion().innerHTML =
    '<div class="hoja-ruta">' +
      encabezadoHoja("HOJA DE ENTREGAS", motorista, fecha,
        ids.length + " clientes · " + money(total)) +
      ids.map((id, i) => {
        const c = porCliente[id];
        const cl = S.clientes.find(x => x.id === id) || {};
        const suma = c.pedidos.reduce((a,p) => a + (Number(p.total)||0), 0);
        return '<div class="cli">' +
          '<h2>' + (i+1) + '. ' + escapar(c.nombre) + ' · ' + money(suma) + '</h2>' +
          '<div class="dat">' + escapar(c.codigo || "sin codigo") +
            (c.tel ? ' · Tel ' + escapar(c.tel) : '') +
            (c.dir || cl.direccion ? ' · ' + escapar(c.dir || cl.direccion) : '') +
            (cl.referencia ? ' · ' + escapar(cl.referencia) : '') + '</div>' +
          '<table><thead><tr>' +
            '<th style="width:65px">Código</th><th>Producto</th>' +
            '<th class="num" style="width:45px">Cant.</th>' +
            '<th class="num" style="width:55px">Precio</th>' +
            '<th class="num" style="width:60px">Total</th>' +
            '<th style="width:50px">Entreg.</th>' +
          '</tr></thead><tbody>' +
          c.pedidos.map(p => (p.lineas||[]).map(l =>
            '<tr><td>' + escapar(l.cod) + '</td><td>' + escapar(l.nombre) + '</td>' +
            '<td class="num">' + l.cant + '</td><td class="num">' + money(l.precio) + '</td>' +
            '<td class="num">' + money(l.total) + '</td><td></td></tr>').join("")).join("") +
          '</tbody></table>' +
          (c.pedidos.some(p => p.nota) ? '<div class="dat">Nota: ' +
            escapar(c.pedidos.map(p => p.nota).filter(Boolean).join(" · ")) + '</div>' : '') +
          '<div class="firma">Recibí conforme</div>' +
        '</div>';
      }).join("") +
    '</div>';
  window.print();
}

/* ------------------- comprobante ------------------- */
/* ===================== tickets =====================
   Se imprimen en OFICINA con la tiquetera, no en la calle. El ticket sale
   del pedido guardado (no del carrito), asi que se puede sacar cualquier dia
   y con el nombre del preventista que lo levanto, no el de quien imprime.
   El formato es copia de un ticket de tiquetera real. */
function dosDecTxt(n){ return (Number(n)||0).toFixed(2); }
function cuatroDec(n){ return (Number(n)||0).toFixed(4); }

function encabezadoTicket(){
  /* Ajustes manda; lo que falte cae en empresa.js. Antes aqui habia
     quemado el nombre del dueno de OTRA empresa. */
  const t = datosTicket();
  return marcaImg("logo", "logo-oscuro.png") +
    '<div class="cab"><b>' + escapar(t.razon || empNombre()) + '</b><br>' +
    escapar(t.direccion || "") + '<br>' +
    (t.iva ? 'IVA REG. # ' + escapar(t.iva) + '&nbsp;&nbsp;' : '') +
    (t.nit ? 'NIT ' + escapar(t.nit) : '') +
    (t.giro ? '<br>GIRO: ' + escapar(t.giro) : '') + '</div>';
}

function bloqueTicket(ped, cliente){
  const c = cliente || {};
  /* Si la entrega ya se cerro, el ticket dice lo ENTREGADO, no lo pedido:
     en una entrega parcial el papel que firma el cliente decia de mas. */
  const entregada = !!(ped.estado && ped.estado.indexOf("entregado") === 0);
  const lineas = (ped.lineas || [])
    .map(l => entregada && l.entregado != null
      ? Object.assign({}, l, {cant: l.entregado, total: dosDec(l.entregado * l.precio)})
      : l)
    .filter(l => Number(l.cant) > 0);
  const sec = S.sectores.find(x => x.id === (ped.sectorId || c.sectorId));
  const total = entregada && ped.totalEntregado != null ? Number(ped.totalEntregado) || 0 : Number(ped.total) || 0;
  const numero = ped.ticketNo || ped.numero || "";
  const f = ped.creado && ped.creado.toDate ? ped.creado.toDate() : null;
  const fechaTxt = f
    ? String(f.getDate()).padStart(2,"0") + "-" + String(f.getMonth()+1).padStart(2,"0") + "-" +
      f.getFullYear() + " " + String(f.getHours()).padStart(2,"0") + ":" +
      String(f.getMinutes()).padStart(2,"0") + ":" + String(f.getSeconds()).padStart(2,"0")
    : (ped.fecha ? ped.fecha.split("-").reverse().join("-") : "");

  return '<div class="ticket">' +
      encabezadoTicket() +
      /* Lo pide la casa: sin el ticket no hay reclamo. Va arriba, donde
         se lee antes de firmar, no perdido al final. */
      '<div class="aviso-tk">NO SE ACEPTAN RECLAMOS NI DEVOLUCIONES<br>' +
        'SIN PRESENTAR ESTE TICKET</div>' +
      '<div class="tit">' + (ped.tipo === "cambio" ? "CAMBIO NO.:" : "PEDIDO NO.:") +
        '&nbsp;&nbsp;<b>' + escapar(String(numero)) + '</b></div>' +
      '<div class="ch">Fecha: ' + escapar(fechaTxt) + '</div>' +
      '<div class="ch">Vendedor: ' + escapar(ped.preventaNombre || "") + '</div>' +
      '<div class="ch">Caja: ' + escapar(sec ? sec.nombre : "") + '</div>' +

      '<table class="det"><tr class="enc">' +
        '<td>CANT.</td><td>PRODUCTO</td><td class="der">PRE.UNIT.</td><td class="der">TOTAL</td></tr>' +
      lineas.map(l =>
        '<tr class="nom"><td colspan="4" class="nom">' + escapar(l.nombre) + '</td></tr>' +
        '<tr><td>' + dosDecTxt(l.cant) + '</td>' +
        '<td>' + escapar(l.unidad || "UNIDAD") + '</td>' +
        '<td class="der">' + cuatroDec(l.precio) + '</td>' +
        '<td class="der">' + dosDecTxt(l.total) + ' G</td></tr>').join("") +
      '</table>' +

      '<table class="tot">' +
        '<tr><td>VENTA GRAVADA</td><td class="der">' + dosDecTxt(total) + '</td></tr>' +
        '<tr><td>VENTA EXENTA</td><td class="der">0.00</td></tr>' +
        '<tr><td>VENTA NO SUJETA</td><td class="der">0.00</td></tr>' +
        '<tr class="gran"><td><b>VENTA TOTAL</b></td><td class="der"><b>' + dosDecTxt(total) + '</b></td></tr>' +
      '</table>' +
      '<div class="ch">(G) = Gravadas&nbsp; (E) = Exentas&nbsp; (N) = No Sujetas</div>' +

      '<div class="cli">CLIENTE: ' + escapar(ped.clienteNombre || c.nombre || "") + '</div>' +
      /* Decia c.dui, y ese campo no existe: aparece una sola vez en todo
         el archivo, justo aqui donde se lee. El documento del cliente se
         captura en cliente.fiscal.nit, que es el rotulado "NIT o DUI" en
         FISCAL_CAMPOS. El ticket salia SIEMPRE con el DUI en blanco.
         El rotulo tambien se acomoda: al contribuyente lo que se le pide
         es el NIT, no el DUI. */
      /* NIT y DUI en dos lineas, siempre: son documentos distintos y el
         papel lleva las dos casillas aunque una vaya en blanco. */
      '<div class="ch">NIT: ' + escapar((c.fiscal && c.fiscal.nit) || "") + '</div>' +
      '<div class="ch">DUI: ' + escapar((c.fiscal && c.fiscal.dui) || c.dui || "") + '</div>' +
      '<div class="ch">Direccion: ' + escapar(ped.clienteDireccion || c.direccion || "") + '</div>' +
      '<div class="firma">FIRMA.:</div>' +
      (ped.nota ? '<div class="ch">Nota: ' + escapar(ped.nota) + '</div>' : '') +
      '<div class="grax">"&iexcl;gracias por su compra!"</div>' +
      '<div class="ch">NOTA: Pedido No. ' + escapar(String(numero)) + '</div>' +
    '</div>';
}

/* El numero corre en OFICINA, que es donde se imprime: asi no hay saltos ni
   repetidos por los telefonos que trabajan sin senal. Se asigna una sola vez
   y queda pegado al pedido; una reimpresion saca el mismo numero. */
async function numerarTickets(lista){
  const sinNumero = lista.filter(p => !p.ticketNo);
  if (!sinNumero.length) return true;
  let n = Math.max(1, Number(S.ajustes.ticketDesde) || 1);
  sinNumero.forEach(p => { p.ticketNo = String(n); n++; });
  try {
    const lote = db.batch();
    sinNumero.forEach(p => lote.update(db.collection("pedidos").doc(p.id), {ticketNo: p.ticketNo}));
    lote.update(db.collection("configuracion").doc("ajustes"), {ticketDesde: n});
    await lote.commit();
    S.ajustes.ticketDesde = n;
    return true;
  } catch(e){
    sinNumero.forEach(p => { delete p.ticketNo; });
    alert("No se pudieron numerar los tickets (" + (e.code||e.message) + ").");
    return false;
  }
}

async function imprimirTickets(lista){
  if (!lista.length) return;
  if (!await numerarTickets(lista)) return;
  cajaImpresion().innerHTML = lista.map(p =>
    bloqueTicket(p, S.clientes.find(c => c.id === p.clienteId))).join("");
  window.print();
  try {
    const lote = db.batch();
    lista.forEach(p => lote.update(db.collection("pedidos").doc(p.id), {
      ticketImpreso: true,
      ticketImpresoPorNombre: S.nombre,
      ticketImpresoEn: firebase.firestore.FieldValue.serverTimestamp()
    }));
    await lote.commit();
  } catch(e){}
  lista.forEach(p => { p.ticketImpreso = true; p.ticketImpresoPorNombre = S.nombre; });
}

   tienen numero, para que oficina vea de una vez con que numero va a salir

  const lista = grupo.ped.slice().sort((a,b) =>

  pintarHojaTickets(lista, grupo, fecha);

      '<button class="pg-fila tk-uno" data-i="' + i + '">' +

          '<b class="num">' + money(p.total) + '</b></span>' +
        '<span class="pg-abajo">' + escapar(p.clienteNombre || "") +
          (p.ticketImpreso ? ' &middot; impreso' + (p.ticketImpresoPorNombre
            ? ' por ' + escapar(p.ticketImpresoPorNombre) : '') : ' &middot; sin imprimir') +
        '</span></button>').join("") + '</div>' +
    (faltan.length
      ? '<button class="btn" id="tk-faltan" style="margin-top:14px">Imprimir los ' + faltan.length + ' que faltan</button>'
      : '') +
    '<button class="btn linea" id="tk-todos" style="margin-top:9px">Reimprimir los ' + lista.length + '</button>' +
    '<button class="btn secundario" id="tk-volver" style="margin-top:9px">Volver</button>';

  const luego = async ped => {
    await imprimirTickets(ped);

  $$("#tk-cuerpo .tk-uno").forEach(b => b.onclick = () => luego([lista[Number(b.dataset.i)]]));

    if (confirm("Se vuelven a sacar los " + lista.length + " tickets, incluso los ya impresos.\n\n¿Sigue?"))
      luego(lista);
  };
  $("#tk-volver").onclick = () => { cerrarHoja(); pintarAdmin(); };
}

/* ------------------- mi dia ------------------- */
function clientesDelDia(){
  const [a,me,d] = fechaVista().split("-").map(Number);
  const dia = new Date(a, me-1, d).getDay();
  const ids = misSectores().filter(x => tieneDia(x) && Number(x.dia) === dia).map(x => x.id);
  const r = S.clientes.filter(c => c.activo !== false && ids.indexOf(c.sectorId) >= 0);
  return r.length ? r : clientesDelSector();
}

/* Arranca en la linea del tiempo: es la pantalla que el motorista tiene
   en la cabeza de Handy. */
let vistaReparto = "linea";
/* Los filtros de la tira de iconos, en el orden de Handy. */
const FILTROS_LT = [
  ["todo",  "\u2637", "Todo el d\u00eda"],
  ["cobro", "\u25a4", "Lo cobrado"],
  ["falta", "\u25f4", "Programadas"],
  ["hecho", "\u25a3", "Entregadas"],
  ["no",    "\u25b3", "No recibieron"]
];
let filtroLT = "todo";

/* ===== La linea del tiempo del motorista =========================
   El total del dia en verde arriba y debajo cada entrega colgando de
   una linea, con lo entregado, lo cobrado, la forma de pago y la hora.
   El boton de navegar en cada una, que es lo que tocan en la calle. */
function lineaDelTiempo(mios, hechos, entregado){
  if (!mios.length)
    return '<div class="vacio"><p>No hay <b>entregas</b> registradas para este d\u00eda.</p></div>';
  const contado = hechos.filter(p => !p.pago || p.pago.metodo !== "transferencia").length;
  const pasa = p => {
    if (filtroLT === "hecho" || filtroLT === "cobro") return !entregaPendiente(p) && p.estado !== "no entregado";
    if (filtroLT === "falta") return entregaPendiente(p);
    if (filtroLT === "no")    return p.estado === "no entregado";
    return true;
  };
  const orden = mios.filter(pasa).sort((a,b) => {
    const ha = a.entregadoEn && a.entregadoEn.seconds ? a.entregadoEn.seconds : 0;
    const hb = b.entregadoEn && b.entregadoEn.seconds ? b.entregadoEn.seconds : 0;
    return hb - ha;
  });
  const tope = '<div class="lt-tope"><b class="num">' + money(entregado) + '</b>' +
    '<button class="lt-resumen" id="lt-prods">\u25a6 VER RESUMEN DE PRODUCTOS</button>' +
    '<span>' + hechos.length + (hechos.length === 1 ? " entrega realizada" : " entregas realizadas") +
      ' \u00b7 ' + contado + ' de contado</span></div>';
  if (!orden.length)
    return tope + '<div class="vacio"><p>Nada de eso en este d\u00eda.</p></div>';
  return tope + '<div class="lt">' + orden.map(p => {
    const cli = (S.clientes || []).find(x => x.id === p.clienteId) || {};
    const hecho = !entregaPendiente(p);
    const noEnt = p.estado === "no entregado";
    let hora = "";
    try { if (p.entregadoEn && p.entregadoEn.toDate)
      hora = p.entregadoEn.toDate().toTimeString().slice(0,5) + " hrs"; } catch(e){}
    const cobro = (p.pago && p.pago.metodo === "transferencia") ? "transferencia" : "contado";
    const plata = p.totalEntregado != null ? p.totalEntregado : p.total;
    return '<div class="lt-fila' + (hecho ? " si" : "") + (noEnt ? " no" : "") + '">' +
      '<span class="lt-punto"></span><div class="lt-caja">' +
        '<div class="lt-tit">' + (noEnt ? "No se entreg\u00f3" : hecho ? "Entrega" : "Entrega programada") + '</div>' +
        '<div class="lt-cli">' + (cli.codigo ? escapar(cli.codigo) + ' \u00b7 ' : '') +
          escapar(p.clienteNombre || "") + '</div>' +
        (cli.direccion ? '<div class="lt-dir">' + escapar(cli.direccion) + '</div>' : '') +
        (hecho
          ? '<div class="lt-plata">Entregado ' + money(plata) + '</div>' +
            '<div class="lt-cobro"><b>Cobrado: ' + money(plata) + '</b></div>' +
            '<div class="lt-modo">(Pago de ' + cobro + ')</div>'
          : '<div class="lt-plata">Por entregar ' + money(p.total) + '</div>') +
        (noEnt ? '<div class="lt-modo">' + escapar(p.motivoNoEntrega || "sin motivo") + '</div>' : '') +
        (hora ? '<div class="lt-hora">' + hora + '</div>' : '') +
        (cli.lat != null
          ? '<button class="lt-btn" data-lat="' + cli.lat + '" data-lng="' + cli.lng + '">NAVEGAR</button>' : '') +
      '</div></div>';
  }).join("") + '</div>';
}

/* Lo que Handy llama "ver resumen de productos": cuanto de cada cosa se
   movio hoy en todo el camion. */
function resumenProductosDia(){
  const suma = {};
  (S.pedidosDia || []).filter(p => p.tipo !== "cambio").forEach(p => {
    (p.lineas || []).forEach(l => {
      const cant = l.entregado != null ? Number(l.entregado) : Number(l.cant) || 0;
      if (!cant) return;
      if (!suma[l.cod]) suma[l.cod] = {nombre: l.nombre, unidad: l.unidad || "", cant: 0, total: 0};
      suma[l.cod].cant += cant;
      /* por linea redondeada, para que si algun dia se muestra este total
         no salga con centavos corridos */
      suma[l.cod].total = dosDec(suma[l.cod].total + dosDec(cant * (Number(l.precio) || 0)));
    });
  });
  const filas = Object.keys(suma).sort((a,b) => suma[b].cant - suma[a].cant);
  $("#hoja-cuerpo").innerHTML =
    '<div class="eyebrow">Resumen del d\u00eda</div><h2>Productos que salieron</h2>' +
    (filas.length
      ? '<div class="meta" style="margin-top:12px">' + filas.map(k =>

function pintarDiaReparto(){
  const m = $("#dia-cuerpo");
  const cab = $("#pant-dia .marca b");
  if (cab) cab.textContent = esHoy() ? "Reparto de hoy" : "Reparto · " + fechaBonita(fechaVista());
  const mios = S.pedidosDia.filter(p => p.tipo !== "cambio");
  const hechos = mios.filter(p => !entregaPendiente(p));
  const entregado = hechos.reduce((a,p) => a + (Number(p.totalEntregado != null ? p.totalEntregado : p.total)||0), 0);
  const porEntregar = mios.filter(entregaPendiente).reduce((a,p) => a + (Number(p.total)||0), 0);
  const fallidos = mios.filter(p => p.estado === "no entregado").length;
  const pct = mios.length ? Math.round(hechos.length / mios.length * 100) : 0;

  const pestanas =
    '<div class="lt-tabs">' +
      '<button data-v="linea" aria-pressed="' + (vistaReparto === "linea") + '">LÍNEA DEL TIEMPO</button>' +
      '<button data-v="resumen" aria-pressed="' + (vistaReparto === "resumen") + '">TABLERO</button>' +
      '<button data-v="hoja" aria-pressed="' + (vistaReparto === "hoja") + '">HOJA DE ENTREGA</button>' +
      '<button data-v="camion" aria-pressed="' + (vistaReparto === "camion") + '">CAMIÓN</button>' +
    '</div>' +
    (vistaReparto === "linea"
      ? '<div class="lt-iconos">' + FILTROS_LT.map(x =>
          '<button data-f="' + x[0] + '" title="' + x[2] + '" aria-pressed="' +
          (filtroLT === x[0]) + '">' + x[1] + '</button>').join("") + '</div>'
      : '');
  const cablearPest = () => $$("#dia-cuerpo .lt-tabs button").forEach(b => b.onclick = () => {
    vistaReparto = b.dataset.v; pintarDiaReparto();
  });

  if (vistaReparto === "linea"){
    m.innerHTML = pestanas + lineaDelTiempo(mios, hechos, entregado);
    cablearPest();
    cablearLinea();
    return;
  }
  if (vistaReparto === "hoja"){
    m.innerHTML = pestanas;
    pintarHojaEntrega(m, mios);
    cablearPest();
    return;
  }
  if (vistaReparto === "camion"){
    m.innerHTML = pestanas;
    pintarCamion(m);
    cablearPest();
    return;
  }

  m.innerHTML = pestanas +
    '<div class="kpis">' +
      '<div class="kpi"><span class="eyebrow">Entregado hoy</span><b class="num">' + money(entregado) + '</b></div>' +
      '<div class="kpi"><span class="eyebrow">Por entregar</span><b class="num">' + money(porEntregar) + '</b></div>' +
      '<div class="kpi"><span class="eyebrow">Pedidos</span><b class="num">' + hechos.length + '/' + mios.length + '</b></div>' +
      '<div class="kpi"><span class="eyebrow">No entregados</span><b class="num">' + fallidos + '</b></div>' +
    '</div>' +
    bloqueRecibirCarga() +
    '<div class="meta"><div class="eyebrow">Avance del reparto</div>' +
      '<div class="barra" style="margin-top:8px"><i style="width:' + pct + '%"></i></div>' +
      '<div class="conteo">' + pct + '% de los pedidos de este día</div></div>' +
    (function(){
      /* El camion, en una linea. Si falta el marcador de salida se le
         recuerda: despues del dia nadie se acuerda del numero. */
      const c = datosCamion();
      const g = c.gastos.reduce((a,x) => a + (Number(x.monto)||0), 0);
      const rec = (c.kmSalida != null && c.kmRegreso != null) ? c.kmRegreso - c.kmSalida : null;
      if (c.kmSalida == null && esHoy())
        return '<div class="aviso dato">Falta anotar el <b>marcador del camión</b> al salir. ' +
          'Está en la pestaña <b>Camión</b>, aquí arriba.</div>';
      return '<div class="meta"><div class="eyebrow">El camión hoy</div>' +
        '<div class="meta-cifras" style="margin-top:6px">' +
          '<div><b class="num">' + (rec != null ? rec + " km" : "en ruta") + '</b>' +
            '<span style="font-size:12px;color:var(--tenue);font-weight:700">' +
            (rec != null ? "recorrido" : "salió con " + c.kmSalida) + '</span></div>' +
          '<div style="text-align:right"><b class="num">' + money(g) + '</b>' +
            '<span style="font-size:12px;color:var(--tenue);font-weight:700">' +
            c.gastos.length + (c.gastos.length === 1 ? " gasto" : " gastos") + '</span></div>' +
        '</div></div>';
    })() +
    (mios.length
      ? '<div class="fila" style="margin-bottom:12px">' +
          '<button class="btn secundario" id="h-carga">Hoja de carga</button>' +
          '<button class="btn secundario" id="h-entregas">Hoja de entregas</button>' +
        '</div>' +
        '<div class="meta"><div class="eyebrow">Pedidos del día</div>' +
        mios.map(p => '<div class="lin"><div style="flex:1;min-width:0">' +
          '<div class="n">' + escapar(p.clienteNombre) + '</div>' +
          '<div class="d">' + (p.adicional ? '<b style="color:var(--c-cambio)">ADICIONAL</b> \u00b7 ' : '') +
            escapar(p.estado || "pendiente") +
            (p.clienteTelefono ? ' · ' + escapar(p.clienteTelefono) : '') + '</div></div>' +
          '<div class="t"><b class="num">' +
            money(p.totalEntregado != null ? p.totalEntregado : p.total) + '</b></div></div>').join("") +
        '</div>'
      : '<div class="vacio"><p>No hay pedidos para repartir hoy.</p></div>');

  $$("#dia-cuerpo .lt-tabs button").forEach(b => b.onclick = () => {
    vistaReparto = b.dataset.v; pintarDiaReparto();
  });
  cablearRecibirCarga();
  if ($("#h-carga")) $("#h-carga").onclick = () => hojaCarga(mios, S.nombre, fechaVista());
  if ($("#h-entregas")) $("#h-entregas").onclick = () => hojaEntregas(mios, S.nombre, fechaVista());

  /* --- reporte de no recibidos: cada cliente con sus motivos, este mes --- */
  const noHoy = mios.filter(p => p.estado === "no entregado");
  m.insertAdjacentHTML("beforeend",
    '<div class="meta" style="margin-top:12px"><div class="eyebrow">No recibieron</div>' +
    (noHoy.length
      ? noHoy.map(p => '<div class="lin"><div style="flex:1;min-width:0">' +
          '<div class="n">' + escapar(p.clienteNombre || "") + '</div>' +
          '<div class="d">' + escapar(p.motivoNoEntrega || "sin motivo") + '</div></div></div>').join("")
      : '<div class="conteo">Hoy nadie ha rechazado.</div>') +
    '<div class="eyebrow" style="margin-top:14px">Clientes que no reciben \u00b7 este mes</div>' +
    '<div id="rep-norec" class="conteo" style="margin-top:6px">Cargando\u2026</div></div>');

  /* --- mi quincena: lo devuelto a mi cargo y el bono que llevo --- */
  m.insertAdjacentHTML("beforeend",
    '<div class="meta" style="margin-top:12px"><div class="eyebrow">Mi bono de eficiencia \u00b7 quincena</div>' +
    '<div id="rep-quin" class="conteo" style="margin-top:6px">Cargando\u2026</div></div>');

  /* Los cargos van junto con las entregas: si oficina ya decidio de quien
     fue la culpa, el motorista tiene que ver EN SU TELEFONO el mismo bono
     que ve oficina. Antes aqui se contaba solo por el motivo y los dos
     numeros se separaban sin que nadie se enterara. */
  Promise.all([
    db.collection("entregas").where("mes","==",mesISO()).where("estado","==","no entregado").get(),
    db.collection("cargos").where("mes","==",mesISO()).get()
  ]).then(([q, qc2]) => {
      const todas = q.docs.map(d => d.data());
      const cargosDePedido = {};
      qc2.docs.forEach(d => { const c = d.data(); if (c.pedidoId) cargosDePedido[c.pedidoId] = c; });

      const qc = $("#rep-quin");
      if (qc){
        const mias = todas.filter(e => e.repartoUid === S.usuario.uid &&
          mismaQuincena(e.fecha) && culpaDelMotorista(e, cargosDePedido[e.pedidoId]));
        const dev = dosDec(mias.reduce((a,e) => a + (Number(e.totalPedido != null ? e.totalPedido : e.total) || 0), 0));
        const t = bonoTramo(dev);
        qc.innerHTML =
          '<div class="meta-cifras"><b style="font-size:15px">Devuelto a mi cargo: ' + money(dev) + '</b>' +
          '<b class="num" style="font-size:19px;color:var(--' + (t.bono >= 25 ? 'verde' : (t.bono > 0 ? 'c-cambio' : 'rojo')) + ')">' +
            money(t.bono) + '</b></div>' +
          '<div class="conteo" style="margin-top:4px">Tramo ' + t.nombre +
            ' \u00b7 hasta $50 devueltos cobra los $25 completos</div>' +
          '<div class="conteo" style="margin-top:2px">Errores del preventista y producto da\u00f1ado van aparte y no cuentan aqu\u00ed, ' +
            'salvo que oficina haya decidido que la devoluci\u00f3n fue del motorista.</div>';
      }

      const cont = $("#rep-norec");
      if (!cont) return;
      const por = {};
      todas.forEach(e => {
        const k = e.clienteNombre || e.clienteId || "?";
        const g = por[k] || (por[k] = {n:0, motivos:{}});
        g.n++;
        const mo = e.motivo || "sin motivo";
        g.motivos[mo] = (g.motivos[mo] || 0) + 1;
      });
      const noms = Object.keys(por).sort((a,b) => por[b].n - por[a].n);
      cont.innerHTML = !noms.length ? "Ninguno este mes."
        : noms.map(n => {
            const g = por[n];
            const mot = Object.keys(g.motivos).map(x =>
              escapar(x) + (g.motivos[x] > 1 ? " \u00d7" + g.motivos[x] : "")).join(", ");
            return '<div class="lin"><div style="flex:1;min-width:0">' +
              '<div class="n">' + escapar(n) + '</div>' +
              '<div class="d">' + mot + '</div></div>' +
              '<div class="t"><b class="num">' + g.n + '</b></div></div>';
          }).join("");
    })
    .catch(e => {
      const msj = "No se pudo leer (" + (e.code||e.message) + ").";
      const c = $("#rep-norec"); if (c) c.textContent = msj;
      /* Tambien el bono: antes se quedaba en "Cargando..." para siempre. */
      const b = $("#rep-quin"); if (b) b.textContent = msj;
    });
}

/* ===================== Control del camión =====================
   El kilometraje y los gastos del dia iban en un papelito que se perdia.
   Aqui quedan con fecha y con nombre, y oficina los ve al instante.
   Se guardan dentro de la jornada del dia, que ya existe: un documento
   por persona y por dia, asi que no se puede duplicar. */
const GASTOS_TIPO = ["Combustible", "Peaje", "Comida", "Llanta o repuesto",
                     "Lavado", "Parqueo", "Otro"];

function datosCamion(){
  const j = S.jornada || {};
  return {
    placa: j.camionPlaca || "",
    kmSalida: j.kmSalida != null ? Number(j.kmSalida) : null,
    kmRegreso: j.kmRegreso != null ? Number(j.kmRegreso) : null,
    gastos: Array.isArray(j.gastos) ? j.gastos : []
  };
}

async function guardarCamion(datos, boton){
  return guardarEn("jornadas", () => db.collection("jornadas").doc(jornadaId()).set(
    Object.assign({
      fecha: hoyISO(), mes: mesISO(),
      preventaUid: S.usuario.uid, preventaNombre: S.nombre
    }, datos), {merge:true}), boton);
}

/* ===================== Recibir la carga =====================
   Antes bodega cargaba y el motorista solo veia su hoja: no habia un
   momento donde el dijera "recibi conforme". Y ese momento importa,
   porque es cuando se decide de quien es la responsabilidad si despues
   falta producto. Si acepto, lo que sale del camion es suyo; si reporto
   diferencias, quedo dicho ANTES de arrancar y con su motivo.        */
function miCarga(){
  /* Lo que va en el camion de este motorista: sus pedidos del dia, con
     el recorte que haya hecho bodega ya aplicado. */
  const mios = (S.pedidosDia || []).filter(p =>
    p.tipo !== "cambio" && (!p.motoristaUid || p.motoristaUid === S.usuario.uid));
  const acum = {};
  mios.forEach(p => (p.lineas || []).forEach(l => {
    acum[l.cod] = acum[l.cod] || {cod:l.cod, nombre:l.nombre, pedido:0};
    acum[l.cod].pedido += Number(l.cant) || 0;
  }));
  return Object.keys(acum).map(k => {
    const f = acum[k];
    const c = S.cortes[f.cod];
    f.va = (c && c.va != null) ? Math.max(0, Number(c.va) || 0) : f.pedido;
    f.motivo = (c && c.va != null && c.va < f.pedido) ? (c.motivo || "no hay en bodega") : "";
    return f;
  }).sort((a,b) => a.nombre.localeCompare(b.nombre, "es"));
}

function cargaRecibida(){
  return !!(S.jornada && S.jornada.cargaRecibida);
}

async function guardarRecibido(datos, boton){
  return guardarEn("jornadas", () => db.collection("jornadas").doc(jornadaId()).set(
    Object.assign({
      fecha: hoyISO(), mes: mesISO(),
      preventaUid: S.usuario.uid, preventaNombre: S.nombre, rol: S.rol
    }, datos), {merge:true}), boton);
}

function bloqueRecibirCarga(){
  if (S.rol !== "despacho" || !esHoy()) return "";
  const carga = miCarga();
  if (!carga.length) return "";
  if (cargaRecibida()){
    const j = S.jornada || {};
    const dif = Array.isArray(j.cargaDiferencias) ? j.cargaDiferencias : [];
    return '<div class="aviso ' + (dif.length ? "dato" : "bien") + '">' +
      '<b>Carga revisada a las ' + escapar(j.cargaHora || "") + '.</b>' +
      (dif.length
        ? '<br>Report\u00f3 ' + dif.length + ' diferencia(s): ' +
          dif.map(d => escapar(d.nombre) + " " + d.dif).join(" \u00b7 ")
        : '<br>Recibi\u00f3 conforme, sin diferencias.') + '</div>';
  }
  return '<div class="pasos" id="rec-carga" style="border-color:var(--senal)">' +
    '<div class="eyebrow">Bodega le carg\u00f3 esto</div>' +
    '<p style="font-size:14px;margin:8px 0 0">Rev\u00edselo <b>antes de arrancar</b>. ' +
    'Si acepta, lo que salga del cami\u00f3n queda a su cargo.</p>' +
    '<div style="margin-top:10px">' +
      carga.map(f =>
        '<div class="lin"><div style="flex:1;min-width:0">' +
          '<div class="n">' + escapar(f.nombre) + '</div>' +
          (f.motivo ? '<div class="d">bodega recort\u00f3: ' + escapar(f.motivo) + '</div>' : '') +
        '</div><div class="t"><b class="num">' + f.va + '</b>' +
        (f.va < f.pedido ? '<div class="d">de ' + f.pedido + '</div>' : '') +
        '</div></div>').join("") +
    '</div>' +
    '<button class="btn" id="rec-ok" style="margin-top:12px">Recib\u00ed conforme</button>' +
    '<button class="btn linea" id="rec-dif" style="margin-top:9px">Hay diferencias</button>' +
  '</div>';
}

function cablearRecibirCarga(){
  const ok = $("#rec-ok"), dif = $("#rec-dif");
  if (ok) ok.onclick = async () => {
    if (!confirm("Va a aceptar la carga tal como est\u00e1.\n\n" +
      "Despu\u00e9s de esto, lo que salga del cami\u00f3n queda a su cargo.")) return;
    const r = await guardarRecibido({
      cargaRecibida: true, cargaHora: horaCorta(new Date()), cargaDiferencias: []
    }, ok);
    if (r) pintarDia();
  };
  if (dif) dif.onclick = () => hojaDiferenciasCarga();
}

function hojaDiferenciasCarga(){
  const carga = miCarga();
  $("#hoja-cuerpo").innerHTML =
    '<div class="eyebrow">Diferencias en la carga</div>' +
    '<h2>\u00bfQu\u00e9 no cuadra?</h2>' +
    '<p style="font-size:14px;color:var(--tenue);margin:6px 0 0">Escriba cu\u00e1ntos ' +
    '<b>hay de verdad</b> en el cami\u00f3n. Deje en blanco los que est\u00e9n bien.</p>' +
    '<div style="margin-top:12px">' +
      carga.map((f,i) =>
        '<div class="lin"><div style="flex:1;min-width:0">' +
          '<div class="n">' + escapar(f.nombre) + '</div>' +
          '<div class="d">deber\u00edan ir ' + f.va + '</div></div>' +
        '<input class="dif-c" data-i="' + i + '" type="number" inputmode="numeric" min="0" ' +
          'style="flex:0 0 74px;height:38px;text-align:center" placeholder="' + f.va + '">' +
        '</div>').join("") +
    '</div>' +
    '<label class="campo" style="margin-top:12px"><span>\u00bfQu\u00e9 pas\u00f3? (opcional)</span>' +
      '<input id="dif-nota" type="text" placeholder="Ej: venia mojada la caja"></label>' +
    '<button class="btn" id="dif-guardar" style="margin-top:12px">Reportar y recibir</button>' +
    '<button class="btn secundario" id="dif-cerrar" style="margin-top:9px">Volver</button>';
  $("#fondo").classList.add("abierto"); $("#hoja").classList.add("abierta");
  $("#dif-cerrar").onclick = cerrarHoja;
  $("#dif-guardar").onclick = async () => {
    const dif = [];
    $$("#hoja-cuerpo .dif-c").forEach(inp => {
      const v = inp.value.trim(); if (v === "") return;
      const f = carga[Number(inp.dataset.i)];
      const hay = parseInt(v);
      if (isNaN(hay) || hay === f.va) return;
      dif.push({cod:f.cod, nombre:f.nombre, deberia:f.va, hay:hay, dif:(hay - f.va > 0 ? "+" : "") + (hay - f.va)});
    });
    if (!dif.length) return alert("No anot\u00f3 ninguna diferencia. Si todo est\u00e1 bien, " +
      "use \u00abRecib\u00ed conforme\u00bb.");
    const r = await guardarRecibido({
      cargaRecibida: true, cargaHora: horaCorta(new Date()),
      cargaDiferencias: dif, cargaNota: $("#dif-nota").value.trim()
    }, $("#dif-guardar"));
    if (r){ cerrarHoja(); pintarDia();
      alert("Reportado. Bodega lo ve al instante."); }
  };
}

    if (na != null && nb != null && nb < na)
      return mostrarAviso(av, "El marcador de regreso no puede ser menor que el de salida. " +
        "Revise los números.");
    /* Un salto enorme casi siempre es un digito de mas. Se avisa, pero se
       deja pasar: puede haber sido un viaje largo de verdad. */
    if (na != null && nb != null && (nb - na) > 500 &&
        !confirm("Son " + (nb - na) + " km en un día. ¿Está seguro de los números?")) return;
    const ok = await guardarCamion({
      camionPlaca: $("#cm-placa").value.trim(),
      kmSalida: na, kmRegreso: nb,
      kmRecorrido: (na != null && nb != null) ? nb - na : null
    }, $("#cm-guardar"));

  };

  $("#cm-add").onclick = async () => {
    const monto = dosDec(parseFloat($("#cm-monto").value));
    if (!monto || monto <= 0) return alert("Escriba cuánto gastó.");
    const d = new Date();
    const gasto = {
      tipo: $("#cm-tipo").value,
      monto: monto,
      nota: $("#cm-nota").value.trim(),
      hora: ("0"+d.getHours()).slice(-2) + ":" + ("0"+d.getMinutes()).slice(-2),
      porNombre: S.nombre
    };
    const ok = await guardarCamion({gastos: c.gastos.concat([gasto])}, $("#cm-add"));

  };

  $$("#dia-cuerpo .cm-quita").forEach(b => b.onclick = async () => {
    const i = Number(b.dataset.i);
    const g = c.gastos[i];
    if (!confirm("¿Quitar el gasto de " + money(g.monto) + " en " + (g.tipo||"") + "?")) return;
    const quedan = c.gastos.filter((x,j) => j !== i);
    await guardarCamion({gastos: quedan}, b);
  });
}

function cargarMisCargos(m){
  m.insertAdjacentHTML("beforeend",

      (S.cargosPendientes ? ';border:2px solid var(--rojo)' : '') +

    '<div id="mis-cargos" class="conteo" style="margin-top:6px">Cargando\u2026</div></div>');
  db.collection("cargos").where("mes","==",mesISO()).where("paraUid","==",S.usuario.uid).get()
    .then(q => {
      const cont = $("#mis-cargos");
      if (!cont) return;
      const cs = q.docs.map(d => Object.assign({id:d.id}, d.data()));
      const prop = cs.filter(x => x.estado === "propuesto");
      S.cargosPendientes = prop.length;
      const acep = cs.filter(x => x.estado === "aceptado" && mismaQuincena(x.fecha));
      const tot  = dosDec(acep.reduce((a,x) => a + (Number(x.monto)||0), 0));

      /* Rechazar no puede ser un boton suelto: quien rechaza tiene que
         decir QUE paso, con causa y con detalle. El sistema no puede juzgar
         si la explicacion es cierta -- eso lo decide administracion -- pero
         si puede exigir que sea una explicacion y no un "porque si". */
      const responder = async (c, estado) => {
        let razon = "";
        if (estado === "rechazado"){
          const causa = prompt(
            "\u00bfPor qu\u00e9 NO es suyo este cargo?\n\n" +
            "1  El cliente s\u00ed lo pidi\u00f3\n" +
            "2  Lo pidi\u00f3 otro preventa\n" +
            "3  Bodega mand\u00f3 lo que no era\n" +
            "4  El motorista se equivoc\u00f3 de cliente\n" +
            "5  Otro\n\n" +
            "Escriba el n\u00famero:");
          if (causa == null) return;
          const CAUSAS = {"1":"el cliente sí lo pidió", "2":"lo pidió otro preventa",
            "3":"bodega mandó lo que no era", "4":"se equivocaron de cliente", "5":"otro"};
          const nombreCausa = CAUSAS[String(causa).trim()];
          if (!nombreCausa) return alert("Escriba uno de los números de la lista.");
          const detalle = prompt("Cuente qué pasó, para que administración pueda revisarlo.\n\n" +
            "Ejemplo: «el cliente pidió 2 fardos el lunes, está en la nota del pedido».");
          if (detalle == null) return;
          const d = detalle.trim();
          if (d.length < 15)
            return alert("Muy corto. Escriba qué pasó con detalle: administración lo va a leer " +
              "y con esto decide si el cargo se le quita o se le queda.");
          razon = nombreCausa + " · " + d;
        }
        const ok = await guardarEn("cargos", () => db.collection("cargos").doc(c.id).update({
          estado: estado, respuesta: razon || "",
          respondidoEn: firebase.firestore.FieldValue.serverTimestamp()
        }));
        if (ok) pintarDia();
      };

      cont.innerHTML =
        (prop.length
          ? prop.map(c =>
              '<div class="cuota-fila" style="flex-wrap:wrap;gap:6px" data-id="' + c.id + '">' +
                '<span class="quien" style="flex:1 1 100%">' + escapar(c.clienteNombre || "") +
                  ' \u00b7 <b>' + money(c.monto) + '</b>' +
                  '<br><span style="color:var(--tenue);font-size:11px">' + escapar(c.motivo || "") +
                  ' \u00b7 lo manda ' + escapar(c.deNombre || "") + '</span></span>' +
                '<button class="btn linea chico cg-si" style="width:auto">Aceptar</button>' +
                '<button class="btn linea chico cg-no" style="width:auto;color:var(--rojo)">Rechazar</button>' +
              '</div>').join("")
          : '<div class="conteo">Nada pendiente por responder.</div>') +
        '<div class="conteo" style="margin-top:8px">Aceptado esta quincena: <b>' + money(tot) +
          '</b>' + (acep.length ? ' (' + acep.length + ')' : '') + ' \u00b7 esto es lo que va al d\u00eda de pago.</div>';

      $$("#mis-cargos .cg-si").forEach(b => b.onclick = () => {
        const c = cs.find(x => x.id === b.closest("[data-id]").dataset.id);
        if (c && confirm("\u00bfAcepta el cargo de " + money(c.monto) + " por \u00ab" + c.motivo + "\u00bb?\n\nQueda de constancia para el d\u00eda de pago.")) responder(c, "aceptado");
      });
      $$("#mis-cargos .cg-no").forEach(b => b.onclick = () => {
        const c = cs.find(x => x.id === b.closest("[data-id]").dataset.id);
        if (c) responder(c, "rechazado");

    })
    .catch(e => { const c = $("#mis-cargos"); if (c) c.textContent = "No se pudo leer (" + (e.code||e.message) + ")."; });
}

/* ===================== Bodega =====================
   Una sola pregunta por producto: de lo que se pidio hoy, cuanto va.
   Lo que escriba aqui manda sobre las existencias, porque es una persona
   viendo el estante. Queda guardado en bodegaDia/<fecha>. */
const MOTIVOS_BODEGA = ["no hay en bodega", "dañado", "vencido", "no llegó del proveedor"];

function demandaDelDia(){
  const acum = {};
  (S.pedidosDia || []).filter(p => p.tipo !== "cambio").forEach(p =>
    (p.lineas || []).forEach(l => {
      acum[l.cod] = acum[l.cod] || {cod:l.cod, nombre:l.nombre, pedido:0, clientes:0};
      acum[l.cod].pedido += Number(l.cant) || 0;
      acum[l.cod].clientes += 1;
    }));
  return Object.keys(acum).map(k => acum[k]).sort((a,b) => a.nombre.localeCompare(b.nombre,"es"));
}

/* ===================== Bodega =====================
   La existencia NO se escribe a mano: se mueve sola con cada entrada y
   cada salida, y todo movimiento queda firmado con quien lo hizo. Si hay
   que corregir un numero, se hace un ajuste con su motivo, que tambien
   queda anotado. Asi siempre se puede responder "por que hay 37 y no 40".
   Las presentaciones (caja, fardo, paquete) se convierten a unidades al
   momento de anotarlas: adentro todo el sistema sigue contando unidades,
   que es como se piden y como se venden. */
const PRESENTACIONES = ["unidad","caja","fardo","paquete","bolsa","display"];
const AREAS_SALIDA = ["reparto","venta de mostrador","muestra","consumo interno",
  "dañado", "vencido", "devolución a proveedor"];

let vistaBodega = "hoy";
let invBusca = "";

/* Lo que ya lleva oficina no se borra: se vuelve de solo mirar. Asi el
   dato viejo sigue ahi y, si algo sale mal con el puente, se apaga la
   llave y todo vuelve a funcionar como antes. */
function loLlevaOficina(que){
  const o = (S.ajustes && S.ajustes.oficinaLleva) || {};
  return o[que] === true;
}
function avisoOficina(que){
  return '<div class="aviso dato"><b>Esto ya lo lleva oficina.</b><br>' +
    (que === "inventario"
      ? "La existencia llega desde all\u00e1 y aqu\u00ed solo se mira. Si hay que corregir un n\u00famero, se corrige en el sistema de oficina."
      : que === "costos"
      ? "Los precios y los costos se escriben en el sistema de oficina y bajan solos a los tel\u00e9fonos."
      : "El c\u00e1lculo de la comisi\u00f3n se hace en el sistema de incentivos. Aqu\u00ed solo se muestra el avance.") +
    '</div>';
}

function nombreProd(cod){
  const p = (S.catalogo || []).find(x => x.cod === cod);
  return p ? p.nombre : cod;
}
function existDe(cod){ const d = S.exist[cod]; return d == null ? 0 : Number(d); }
function minimoDe(cod){
  const d = S.existDoc[cod];
  return d && d.minimo != null ? Number(d.minimo) : null;
}
/* Una ficha recien creada por la carga masiva vale 0 porque NADIE la ha
   contado todavia, no porque el producto se haya acabado. Avisar "agotado"
   por eso seria gritar en falso en cientos de productos, y a la semana
   nadie le hace caso a la alarma de verdad. Mientras la ficha este SIN
   CONTAR, la existencia se sigue moviendo con el kardex pero no avisa. */
function existAvisable(cod){
  const f = (S.existDoc || {})[cod];
  if (!f || f.contado === false) return null;
  return S.exist[cod];
}

function bajoMinimo(cod){
  const min = minimoDe(cod);
  return min != null && existDe(cod) <= min;
}
function movsDe(cod){ return (S.movs || []).filter(m => m.cod === cod); }

/* Correlativo sencillo: se cuenta lo que ya hay de ese tipo y se le suma uno.
   El numero es para que la gente se entienda ("la entrada 184"); quien manda
   de verdad es el id del documento, asi que si dos coinciden no se rompe nada. */
function correlativo(tipo, corrimiento){
  const n = (S.movs || []).filter(m => m.tipo === tipo).length + 1 + (Number(corrimiento) || 0);
  return String(n).padStart(6, "0");
}

/* Arma el documento de un movimiento, sin escribirlo. Lo usan los dos
   caminos: el de bodega (anotarMovimiento, que escribe de una) y el del
   reparto (movimientosDeEntrega, que lo mete en el lote de la entrega).
   "corrimiento" existe porque cuando se anotan VARIAS lineas de golpe,
   S.movs todavia no trae ninguna de las nuevas y todas sacarian el mismo
   correlativo. */
function docMovimiento(mov, corrimiento){
  const cod = mov.cod;
  return {
    tipo: mov.tipo,
    num: correlativo(mov.tipo, corrimiento || 0),
    cod: cod,
    nombre: nombreProd(cod),
    unidades: Number(mov.unidades) || 0,
    unidad: mov.unidad || unidadDe(cod),
    presentacion: mov.presentacion || "unidad",
    porBulto: Number(mov.porBulto) || 1,
    bultos: Number(mov.bultos) || 0,
    proveedor: mov.proveedor || "",
    area: mov.area || "",
    lote: mov.lote || "",
    vence: mov.vence || "",
    nota: mov.nota || "",
    pedidoId: mov.pedidoId || null,
    clienteId: mov.clienteId || null,
    fecha: hoyISO(),
    uid: S.usuario.uid,
    por: S.nombre,
    creadoMs: Date.now(),
    creado: firebase.firestore.FieldValue.serverTimestamp()
  };
}

async function anotarMovimiento(mov){
  const signo = mov.tipo === "salida" ? -1 : 1;
  const doc = docMovimiento(mov, 0);
  await db.collection("movimientos").add(doc);
  // la existencia se mueve sola; si el producto no tenia ficha, se le abre
  const ref = db.collection("existencias").doc(doc.cod);
  try {
    await ref.update({
      disponible: firebase.firestore.FieldValue.increment(signo * doc.unidades),
      actualizado: firebase.firestore.FieldValue.serverTimestamp()
    });
  } catch(e){
    await ref.set({
      disponible: signo * doc.unidades, nombre: doc.nombre, unidad: doc.unidad,
      actualizado: firebase.firestore.FieldValue.serverTimestamp()
    }, {merge:true});
  }
  return doc;
}

/* --- el panel de arriba: lo que el encargado quiere ver de un vistazo --- */
function panelBodega(){

  const hoy = (S.movs || []).filter(m => m.fecha === hoyISO());
  const ent = hoy.filter(m => m.tipo === "entrada").reduce((a,m) => a + (m.unidades||0), 0);
  const sal = hoy.filter(m => m.tipo === "salida").reduce((a,m) => a + (m.unidades||0), 0);
  return '<div class="kpis">' +
    '<div class="kpi"><span class="eyebrow">Con ficha</span><b class="num">' + conFicha.length + '</b></div>' +
    '<div class="kpi"><span class="eyebrow">Bajo mínimo</span><b class="num" style="color:var(--' +
      (bajos.length ? 'rojo' : 'verde') + ')">' + bajos.length + '</b></div>' +
    '<div class="kpi"><span class="eyebrow">Entró hoy</span><b class="num">' + ent + '</b></div>' +
    '<div class="kpi"><span class="eyebrow">Salió hoy</span><b class="num">' + sal + '</b></div>' +
  '</div>' +
  (bajos.length
    ? '<div class="aviso dato" style="margin-top:10px"><b>Se está acabando:</b> ' +
      escapar(bajos.slice(0,6).map(nombreProd).join(" · ")) +
      (bajos.length > 6 ? " y " + (bajos.length-6) + " más" : "") + '</div>'
    : '');
}

function lineaMov(m){
  const clase = m.tipo === "entrada" ? "ent" : (m.tipo === "salida" ? "sal" : "aju");
  const signo = m.tipo === "salida" ? "\u2212" : (m.tipo === "entrada" ? "+" : "\u00b1");
  const bultos = m.bultos && m.porBulto > 1
    ? " (" + m.bultos + " " + m.presentacion + (m.bultos === 1 ? "" : "s") + ")" : "";
  return '<div class="mov-lin ' + clase + '"><span class="mc">' + signo + (m.unidades||0) + '</span>' +
    '<span class="mq">' + escapar(m.nombre || nombreProd(m.cod)) + escapar(bultos) +
    '<small>' + escapar(m.fecha || "") + ' · ' + escapar(m.por || "") +
    (m.proveedor ? ' · ' + escapar(m.proveedor) : '') +
    (m.area ? ' · ' + escapar(m.area) : '') +
    (m.nota ? ' · ' + escapar(m.nota) : '') + '</small></span></div>';
}

  };

/* --- la ficha de un producto: existencia, minimo y su historial --- */
function hojaProducto(cod){
  const p = (S.catalogo || []).find(x => x.cod === cod) || {cod:cod, nombre:cod};
  const min = minimoDe(cod);
  const hist = movsDe(cod).slice(0, 30);
  $("#hoja-cuerpo").innerHTML =
    '<div class="eyebrow">' + escapar(cod) + '</div><h2>' + escapar(p.nombre) + '</h2>' +
    '<div class="meta-cifras" style="margin-top:12px">' +
      '<span class="eyebrow">Hay ahora</span>' +
      '<b class="num" style="font-size:32px' + (bajoMinimo(cod) ? ';color:var(--rojo)' : '') + '">' +
        existDe(cod) + '</b></div>' +
    '<label class="campo" style="margin-top:14px"><span>Avisar cuando baje de</span>' +
      '<input id="pr-min" type="number" inputmode="numeric" min="0" value="' +
      (min != null ? min : "") + '" placeholder="sin aviso"></label>' +
    '<button class="btn secundario" id="pr-min-g" style="margin-top:10px">Guardar el mínimo</button>' +
    '<div class="eyebrow" style="margin-top:22px">Movimientos</div>' +
    '<div style="margin-top:8px">' +
      (hist.length ? hist.map(lineaMov).join("")
        : '<div class="conteo">Todavía no hay movimientos de este producto.</div>') + '</div>' +
    (loLlevaOficina("inventario")
      ? avisoOficina("inventario")
      : '<button class="btn linea" id="pr-aj" style="margin-top:16px">Corregir la existencia</button>') +
    '<button class="btn secundario" id="pr-cerrar" style="margin-top:9px">Volver</button>';
  $("#fondo").classList.add("abierto"); $("#hoja").classList.add("abierta");
  $("#pr-cerrar").onclick = cerrarHoja;
  if ($("#pr-min-g")) $("#pr-min-g").onclick = async () => {
    const v = $("#pr-min").value.trim();
    const b = $("#pr-min-g");
    b.disabled = true; b.textContent = "Guardando…";
    try {
      await db.collection("existencias").doc(cod).set(
        {minimo: v === "" ? null : Number(v), nombre: p.nombre}, {merge:true});
      b.textContent = "Guardado";
      setTimeout(() => { b.disabled = false; b.textContent = "Guardar el mínimo"; }, 1200);
    } catch(e){
      b.disabled = false; b.textContent = "Guardar el mínimo";
      alert("No se pudo guardar (" + (e.code || e.message) + ").");
    }
  };
  /* Corregir no es escribir el numero encima: se anota la diferencia y el
     motivo, para que manana se sepa quien la movio y por que. */
  if ($("#pr-aj")) $("#pr-aj").onclick = async () => {
    const real = prompt("¿Cuántas hay de verdad en el estante?\n\nAhora el sistema dice " +
      existDe(cod) + ".");
    if (real == null) return;
    const n = parseInt(real, 10);
    if (isNaN(n) || n < 0) return alert("Escriba un número.");
    const dif = n - existDe(cod);
    if (!dif) return alert("Es el mismo número: no hay nada que corregir.");
    const motivo = prompt("¿Por qué la diferencia de " + (dif > 0 ? "+" : "") + dif + "?\n\n" +
      "Ej: mal contado, se quebró, apareció, no se anotó una salida.");
    if (motivo == null || !motivo.trim()) return alert("Sin motivo no se guarda la corrección.");
    try {
      await anotarMovimiento({tipo:"ajuste", cod:cod, unidades:Math.abs(dif),
        porBulto:1, bultos:0, nota:motivo.trim(), area: dif > 0 ? "sobró" : "faltó"});
      // el ajuste suma en positivo; si falta, se resta a mano
      if (dif < 0) await db.collection("existencias").doc(cod)
        .update({disponible: firebase.firestore.FieldValue.increment(-2 * Math.abs(dif))});
      cerrarHoja();
    } catch(e){ alert("No se pudo guardar (" + (e.code || e.message) + ")."); }
  };
}

/* --- entrada de mercaderia --- */
function vistaEntrada(m){
  m.insertAdjacentHTML("beforeend",
    '<div class="pasos"><div class="eyebrow">Pegar lo que entró</div>' +
    '<p style="font-size:14px;margin:8px 0 0">Copie del sistema de oficina el listado de lo que ' +
      'ingresó y péguelo aquí. Un renglón por producto: <b>código, cantidad</b>. ' +
      'Sirve separado por coma, por punto y coma o por tabulación.</p>' +
    '<label class="campo"><span>Listado</span><textarea id="e-pega" rows="5" ' +
      'placeholder="1001, 600&#10;1002, 240"></textarea></label>' +
    '<label class="campo"><span>Proveedor o referencia (opcional)</span>' +
      '<input id="e-pprov" type="text"></label>' +
    '<button class="btn" id="e-pg" style="margin-top:12px">Revisar el listado</button>' +
    '<div id="e-pav" class="aviso oculto"></div></div>' +
    '<div class="pasos" style="margin-top:12px"><div class="eyebrow">O anotar una entrada suelta</div>' +
    '<p style="font-size:14px;margin:8px 0 0">Para lo que llega fuera del listado. La existencia sube sola.</p>' +
    '<label class="campo"><span>Proveedor</span><input id="e-prov" type="text" placeholder="De quién vino"></label>' +
    selectorProducto("e-cod") +
    '<label class="campo"><span>Presentación</span><select id="e-pres">' +
      PRESENTACIONES.map(x => '<option value="' + x + '">' + x + '</option>').join("") +
    '</select></label>' +
    '<div class="fila">' +
      '<label class="campo" style="flex:1"><span>Cuántos bultos</span>' +
        '<input id="e-bul" type="number" inputmode="numeric" min="1" value="1"></label>' +
      '<label class="campo" style="flex:1"><span>Unidades por bulto</span>' +
        '<input id="e-por" type="number" inputmode="numeric" min="1" value="1"></label>' +
    '</div>' +
    '<div class="conteo" id="e-total" style="margin:2px 0 0">Entran 1 unidades</div>' +
    '<label class="campo"><span>Lote (opcional)</span><input id="e-lote" type="text"></label>' +
    '<label class="campo"><span>Vence (opcional)</span><input id="e-vence" type="date"></label>' +
    '<label class="campo"><span>Observación (opcional)</span><input id="e-nota" type="text"></label>' +
    '<button class="btn" id="e-g" style="margin-top:14px">Guardar la entrada</button>' +
    '<div id="e-av" class="aviso oculto"></div></div>' +
    '<div class="meta" style="margin-top:12px"><div class="eyebrow">Últimas entradas</div>' +
      ((S.movs||[]).filter(x => x.tipo === "entrada").slice(0,8).map(lineaMov).join("") ||
        '<div class="conteo">Todavía no se ha anotado ninguna.</div>') + '</div>');

  /* Importar: se revisa TODO antes de tocar nada. Si un codigo no existe
     en el catalogo, se dice cual y no se guarda ni un renglon: mas vale
     corregir el listado que dejar el inventario a medio subir. */
  $("#e-pg").onclick = async () => {
    const av = $("#e-pav"); av.classList.remove("oculto");
    const txt = ($("#e-pega").value || "").trim();
    if (!txt) return mostrarAviso(av, "Pegue primero el listado.");
    const buenos = [], malos = [];
    txt.split(/\r?\n/).forEach(ren => {
      const t = ren.trim();
      if (!t) return;
      const partes = t.split(/[,;\t]+/).map(x => x.trim());
      if (partes.length < 2) return malos.push(t + " → le falta la cantidad");
      const cod = partes[0];
      const cant = parseInt(partes[partes.length-1].replace(/[^0-9-]/g,""), 10);
      if (!(S.catalogo||[]).some(p => p.cod === cod))
        return malos.push(t + " → el código " + cod + " no está en el catálogo");
      if (isNaN(cant) || cant <= 0) return malos.push(t + " → la cantidad no se entiende");
      buenos.push({cod:cod, cant:cant});
    });
    if (malos.length)
      return mostrarAviso(av, "No se guardó nada. Corrija esto:<br>" +
        malos.map(escapar).join("<br>"));
    if (!buenos.length) return mostrarAviso(av, "El listado quedó vacío.");
    if (!confirm("Van a entrar " + buenos.length + " productos, " +
      buenos.reduce((a,x)=>a+x.cant,0) + " unidades en total.\n\n¿Guardar?")) return;
    const b = $("#e-pg"); b.disabled = true; b.textContent = "Guardando…";
    const prov = $("#e-pprov").value.trim();
    let listo = 0;
    for (const x of buenos){
      try {
        await anotarMovimiento({tipo:"entrada", cod:x.cod, unidades:x.cant,
          presentacion:"unidad", porBulto:1, bultos:0, proveedor:prov,
          nota:"del listado de oficina"});
        listo++;
      } catch(e){ /* se sigue con los demas y se avisa al final */ }
    }
    b.disabled = false; b.textContent = "Revisar el listado";
    if (listo === buenos.length){
      av.className = "aviso bien";
      av.innerHTML = "<b>" + listo + " entradas anotadas.</b> La existencia ya subió.";
      $("#e-pega").value = "";
    } else mostrarAviso(av, "Se guardaron " + listo + " de " + buenos.length +
      ". Revise el inventario antes de volver a pegar el listado.");
  };

  const recalc = () => {
    const t = (parseInt($("#e-bul").value)||0) * (parseInt($("#e-por").value)||0);
    $("#e-total").textContent = "Entran " + t + " unidades";
  };
  $("#e-bul").oninput = recalc; $("#e-por").oninput = recalc;
  $("#e-pres").onchange = () => {
    if ($("#e-pres").value === "unidad") $("#e-por").value = 1;
    recalc();
  };
  $("#e-g").onclick = async () => {
    const av = $("#e-av"); av.classList.remove("oculto");
    const cod = $("#e-cod").value;
    if (!cod) return mostrarAviso(av, "Elija el producto.");
    const bultos = parseInt($("#e-bul").value) || 0;
    const porB = parseInt($("#e-por").value) || 0;
    const tot = bultos * porB;
    if (tot <= 0) return mostrarAviso(av, "La cantidad tiene que ser mayor que cero.");
    const b = $("#e-g"); b.disabled = true; b.textContent = "Guardando…";
    try {
      const d = await anotarMovimiento({tipo:"entrada", cod:cod, unidades:tot,
        presentacion:$("#e-pres").value, porBulto:porB, bultos:bultos,
        proveedor:$("#e-prov").value.trim(), lote:$("#e-lote").value.trim(),
        vence:$("#e-vence").value, nota:$("#e-nota").value.trim()});
      b.disabled = false; b.textContent = "Guardar la entrada";
      av.className = "aviso bien";
      av.innerHTML = "<b>Entrada #" + d.num + "</b><br>" + bultos + " " + d.presentacion +
        " de " + escapar(d.nombre) + "<br>" + tot + " unidades ingresadas · recibió " + escapar(S.nombre);
      $("#e-lote").value = ""; $("#e-nota").value = ""; $("#e-bul").value = 1;
    } catch(e){
      b.disabled = false; b.textContent = "Guardar la entrada";
      mostrarAviso(av, "No se pudo guardar (" + (e.code || e.message) + ").");
    }
  };
}
