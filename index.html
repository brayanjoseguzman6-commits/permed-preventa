        /* El preventa no cambia de dia (igual que en la lista): un toque
           accidental lo mandaba a otra fecha y el cliente se abria sin
           botones. */
        (S.rol === "preventa" ? '<span style="width:35px"></span>'
          : '<button id="d-ayer" style="font-size:19px;color:var(--verde);padding:0 8px">‹</button>') +
        '<span style="flex:1;text-align:center;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">' +
          fechaBonita(fechaVista()) + (sec ? ' · ' + escapar(sec.nombre) : (esHoy() ? '' : ' · Sin ruta este día')) + '</span>' +
        '<button class="plata num" id="m-plata">' + money(esDesp ? plata.cobrado : monto) + '</button>' +
        (S.rol === "preventa" ? '<span style="width:35px"></span>'
          : '<button id="d-manana" style="font-size:19px;color:var(--verde);padding:0 8px">›</button>') +
      '</div>' +
      (esHoy() ? '' : '<button class="btn secundario" id="d-hoy" style="margin-bottom:9px;padding:8px">Volver a hoy</button>') +
      /* Las tres fichas filtran el mapa: se toca una y quedan solo esos
         pines; se vuelve a tocar y se apaga. Antes abrian una lista, que
         ahora vive en la pestana Clientes. */
      '<div class="pills">' +
        fichas.map(f =>
          '<button class="pill filtro" data-k="' + f[2] + '" aria-pressed="' + (filtroMapa() === f[2]) + '">' +
          f[0] + ' <b class="num">' + f[1] + '</b></button>').join("") +
      '</div>' +
      (sig
        ? '<button class="siguiente" id="m-siguiente">' +
            '<span class="no num">' + (sig.orden != null ? sig.orden : "→") + '</span>' +
            '<span class="qui"><b>' + escapar(sig.nombre) + '</b>' +
              /* tramo() y no textoDist(): textoDist ya trae "A " adelante, y
                 puesto detras del " · a " de aqui salia "a A 29.5 km". Se le
                 escapo a esta sesion cuando escribio tramo() justo para esto. */
              '<small>Sigue' + (distSig != null ? ' · a ' + tramo(distSig) : '') +
              (sig.codigo ? ' · ' + escapar(sig.codigo) : '') + '</small></span>' +
            '<span class="ir">›</span>' +
          '</button>'
        /* "Ruta terminada" solo puede decirse DE HOY. En otra fecha no hay
           nada terminado: hay un dia que ya paso o uno que no ha llegado.
           El mismo esHoy() que ya usa el boton "Volver a hoy" de arriba.
           Y tampoco puede decirse con el dia VACIO: si no hay ni un cliente
           en la ruta, no hay nada que terminar. Eso pasa cuando al sector
           todavia no se le asignaron clientes, y decirle al vendedor que ya
           acabo es justo lo contrario de lo que necesita saber. */
        : (esHoy() && total === 0)
        ? '<div class="siguiente" style="background:var(--f-cambio);border-color:var(--c-cambio)">' +
            '<span class="no">\u2205</span>' +
            '<span class="qui"><b>Sin ruta</b>' +
            '<small>Este sector no tiene clientes para hoy</small></span>' +
          '</div>'
        : esHoy()
        ? '<div class="siguiente" style="background:var(--f-listo);border-color:var(--c-listo)">' +
            '<span class="no" style="background:var(--c-listo)">✓</span>' +
            '<span class="qui"><b>Ruta terminada</b>' +
            '<small style="color:var(--c-listo)">No queda nadie pendiente hoy</small></span>' +
          '</div>'
        : '<div class="siguiente" style="background:var(--f-cambio);border-color:var(--c-cambio)">' +
            '<span class="no">' + (fechaVista() < hoyISO() ? '\u21ba' : '\u2192') + '</span>' +
            '<span class="qui"><b>' + (fechaVista() < hoyISO() ? 'D\u00eda pasado' : 'Todav\u00eda no toca') + '</b>' +
            '<small>' + (fechaVista() < hoyISO()
              ? 'Se est\u00e1 viendo un d\u00eda que ya pas\u00f3'
              : 'Esta ruta es de otro d\u00eda') + '</small></span>' +
          '</div>') +
      '<div class="barra"><i style="width:' + pct + '%"></i></div>' +
    '</div>';

  // sectores: el menu completo detras del boton de cambio
  const menuSec = $("#m-sector-menu");
  if (menuSec){
    misSectores().sort((a,b) => ordenDia(a) - ordenDia(b)).forEach(x => {
      const b = document.createElement("button");
      b.textContent = x.nombre + (tieneDia(x) ? " · " + DIAS[Number(x.dia)].slice(0,3) : "");
      b.setAttribute("aria-pressed", S.sectorSel === x.id);
      b.onclick = () => { S.sectorSel = x.id; pintarRuta(); };
      menuSec.appendChild(b);
    });
    $("#m-sector").onclick = () => {
      const abierto = menuSec.classList.toggle("on");
      $("#m-sector").setAttribute("aria-pressed", abierto);
    };
  }

  $("#m-lista").onclick = () => {
    S.vista = "lista";
    try { localStorage.setItem("vistaRuta", "lista"); } catch(e){}
    pintarRuta();
  };
  cablearAvisoVoz();
  if ($("#m-admin")) $("#m-admin").onclick = () => $("#btn-admin").click();
  if ($("#m-llegar")) $("#m-llegar").onclick = () => comoLlegar(sig);
  $("#m-cuenta").onclick = () => $("#chip-usuario").onclick();
  $("#m-mas").onclick = () => {
    const caja = $("#m-mas-caja"), abierto = caja.classList.toggle("on");
    $("#m-mas").setAttribute("aria-pressed", abierto);
    if (!abierto){ const mn = $("#m-capas-menu"); if (mn) mn.classList.remove("on"); }
    acomodarFabs();
  };
  $$(".cap-pie .pill").forEach(b => b.onclick = () => {
    S.filtroMapa = (filtroMapa() === b.dataset.k) ? "todos" : b.dataset.k;
    pintarRuta();
  });
  /* La plata abre su detalle, como antes lo hacia la ficha de Vendido. */
  $("#m-plata").onclick = () => hojaCifra(esDesp ? "cobrado" : "vendido", lista);
  $("#m-agarradera").onclick = () => {
    const pie = $("#m-pie");
    pie.classList.toggle("encogida");
    try { localStorage.setItem("pieMapa", pie.classList.contains("encogida") ? "1" : "0"); } catch(e){}
    acomodarFabs();
  };
  if ($("#m-siguiente") && sig) $("#m-siguiente").onclick = () => {
    if (sig.lat != null && mapaVive()) try { mapa.setView([sig.lat, sig.lng], 18); } catch(e){}
    hojaCliente(sig);
  };
  if ($("#d-ayer"))   $("#d-ayer").onclick = () => correrDia(-1);
  if ($("#d-manana")) $("#d-manana").onclick = () => correrDia(1);
  if ($("#d-hoy")) $("#d-hoy").onclick = () => { S.fecha = hoyISO(); S.sectorSel = sectorDeHoy(); escucharDia(); pintarRuta(); };

  // buscador de clientes
  const inp = $("#m-buscar"), caja = $("#m-hallazgos");
  inp.addEventListener("input", () => {
    const q = limpiaTexto(inp.value).trim();
    if (!q){ caja.classList.add("oculto"); return; }
    const hits = S.clientes.filter(c => c.activo !== false && esMio(c) &&
      limpiaTexto(c.nombre + " " + (c.codigo||"") + " " + (c.direccion||"")).includes(q)).slice(0, 12);
    if (!hits.length){
      caja.innerHTML = '<button disabled style="color:var(--tenue)">Nadie con ese nombre</button>';
    } else {
      caja.innerHTML = "";
      hits.forEach(c => {
        const b = document.createElement("button");
        const sx = S.sectores.find(x => x.id === c.sectorId);
        b.innerHTML = escapar(c.nombre) + '<small>' + escapar(c.codigo || "sin codigo") +
          (sx ? ' · ' + escapar(sx.nombre) : '') + (c.lat == null ? ' · sin punto' : '') + '</small>';
        b.onclick = () => {
          inp.value = ""; caja.classList.add("oculto"); inp.blur();
          if (c.sectorId !== S.sectorSel){ S.sectorSel = c.sectorId; pintarRuta(); }
          if (c.lat != null && mapaVive()) try { mapa.setView([c.lat, c.lng], 18); } catch(e){}
          hojaCliente(c);
        };
        caja.appendChild(b);
      });
    }
    caja.classList.remove("oculto");
  });

  dibujarMapa(lista.filter(pasaFiltroMapa));
}

/* El aviso de que el motorista ve entregas que no son suyas. Vive aparte
   porque el trazo del camino reescribe #mapa-nota, y antes lo borraba:
   uno apretaba un boton y se perdia justo el aviso que le importa. */
function avisoTodasLasRutas(){
  if (S.rol !== "despacho" || !S.usuario) return "";
  if ((S.sectores || []).some(x => x.motoristaUid === S.usuario.uid)) return "";
  return '<div class="conteo" style="color:var(--c-cambio);font-weight:700">' +
    'Está viendo las entregas de TODAS las rutas, no solo las suyas. ' +
    'Oficina todavía no le asignó camión a ninguna.</div>';
}

function dibujarMapa(lista){
  const conPunto = lista.filter(c => c.lat != null && c.lng != null);
  const nota = $("#mapa-nota");
  if (!window.L){
    $("#mapa").innerHTML = '<div class="vacio"><p>El mapa necesita conexión la primera vez que se abre. ' +
      'Conéctese y vuelva a entrar.</p></div>';
    return;
  }
  if (nota){
    nota.innerHTML = (conPunto.length
      ? '<div class="conteo">' + conPunto.length + ' de ' + lista.length + ' clientes en el mapa</div>'
      : '<div class="conteo">Sin clientes todavía</div>') +
      /* El motorista sin sectores asignados ve los pedidos de TODOS. Es lo
         que hace el filtro, y hasta hoy no habia como saberlo: la pantalla
         se veia igual que si fueran solo suyos. */
      avisoTodasLasRutas();
  }
  const centro = conPunto.length ? [conPunto[0].lat, conPunto[0].lng] : [13.4833, -88.1833];
  soltarMapa();
  mapa = L.map("mapa", {zoomControl:false, attributionControl:false, maxZoom:19})
    .setView(centro, conPunto.length ? 15 : 13);
  L.control.attribution({prefix:false, position:"bottomleft"}).addTo(mapa);
  capaBase = null; capaEncima = null;
  ponerCapa(capaGuardada());
  armarMenuCapas();
  /* El giro con dos dedos estaba escrito y NUNCA se encendia: armarGiroDedo()
     no la llamaba nadie. Por eso el mapa no giraba con la mano. Se llama aqui,
     al armar el mapa; la propia funcion se protege de armarse dos veces. */
  armarGiroDedo();
  // al acercar o alejar, los montones cambian: el abanico se rehace
  mapa.on("zoomend", separarPines);
  /* Aqui iba una linea punteada uniendo los clientes en su orden de ruta.
     Se quito: como el orden salta por el mapa, quedaban diagonales largas
     cruzadas de punta a punta y tapaban las calles. No se pierde nada,
     porque CADA PIN YA LLEVA SU NUMERO de orden adentro. */
  capa = L.layerGroup().addTo(mapa);
  marcasRuta = [];
  const puntos = [];
  conPunto.forEach((c, i) => {
    let clase = "";
    if (S.rol === "despacho"){
      const ps = pedidosDeCliente(c.id);
      const faltan = ps.filter(entregaPendiente).length;
      /* Cuatro estados, cuatro colores. Antes "aqui no tengo nada" y "aqui
         tengo entrega pendiente" salian los dos del mismo color: el mapa no
         le contestaba al motorista la unica pregunta que le hace, que es a
         donde tiene que ir. Y el rojo mezclaba atrasado con no entregado,
         que son cosas distintas: una es que NO ha ido, la otra es que fue
         y no lo recibieron. */
      clase = !ps.length ? "nada" : (faltan ? "" : "si");
      if (ps.some(estaAtrasado)) clase = "tarde";
      if (ps.some(x => x.estado === "no entregado")) clase = "no";
    } else {
      const v = visitaDe(c.id);
      clase = v ? (v.resultado === "pedido" ? "si" : "no") : "";
    }
    if (c.id === sigId) clase += " sig";
    const icono = L.divIcon({
      className:"", iconSize:[32,32], iconAnchor:[16,32],
      html: htmlPin(clase, c.orden != null ? c.orden : (i+1))
    });
    // el pin del cliente que se esta moviendo se puede arrastrar
    const movible = !!(moviendo && moviendo.id === c.id);
    const mk = L.marker([c.lat, c.lng], {icon:icono, draggable:movible, autoPan:true,
      zIndexOffset: c.id === sigId ? 600 : 0}).addTo(capa);
    // el que se esta moviendo a mano NO se abanica: lo esta colocando alguien
    if (!movible) marcasRuta.push({mk:mk, lat:c.lat, lng:c.lng});
    if (movible){
      mk.on("dragstart", () => { arrastrando = true; });
      mk.on("drag", () => { if (!mk._avisoDrag){ mk._avisoDrag = true; } });
      mk.on("dragend", ev => {
        arrastrando = false;
        fijarPuntoCliente(mk.getLatLng());
      });
      // respaldo: si dragend no llega, se toma la posicion al levantar el dedo
      const el = mk.getElement && mk.getElement();
      if (el) el.addEventListener("touchend", () => {
        setTimeout(() => {
          if (moviendo && moviendo.id === c.id){
            arrastrando = false;
            fijarPuntoCliente(mk.getLatLng());
          }
        }, 350);
      });
    } else {
      mk.on("click", () => hojaCliente(c));
    }
    puntos.push([c.lat, c.lng]);
  });
  if (puntos.length > 1 && mapaVive()) try { mapa.fitBounds(puntos, {padding:[40,40]}); } catch(e){}
  if (vistaFijada && mapaVive()){ try { mapa.setView(vistaFijada.centro, vistaFijada.zoom || 17); } catch(e){} vistaFijada = null; }
  /* Despues del encuadre, que ya fijo el zoom de verdad: antes de eso el
     abanico se calcularia con un zoom que no es el que se va a ver. */
  separarPines();
  setTimeout(() => { if (mapaVive()){ try { mapa.invalidateSize(); } catch(e){} separarPines(); } }, 120);
  acomodarFabs();
  setTimeout(acomodarFabs, 160);

  // punto azul: sigue al preventista mientras camina
  const pintaYo = (centrar) => {
    if (!posYo || !mapaVive()) return;
    if (!miMarcaRef || !mapa.hasLayer(miMarcaRef)){
      miMarcaRef = L.marker(posYo, {zIndexOffset:-500, icon:L.divIcon({className:"",
        iconSize:[16,16], html:'<div class="yo"><i class="cono"></i></div>'})}).addTo(mapa);
      pintarRumbo();
    }
    else miMarcaRef.setLatLng(posYo);
    if (centrar && mapaVive()) try { mapa.setView(posYo, 17); } catch(e){}
  };
  miMarcaRef = null;               // el mapa se acaba de recrear; la marca vieja murió con él
  vigilarGPS();
  if (posYo) pintaYo(!conPunto.length);
  else if (navigator.geolocation)
    navigator.geolocation.getCurrentPosition(p => {
      posYo = [p.coords.latitude, p.coords.longitude];
      pintaYo(!conPunto.length);
    }, ()=>{}, {enableHighAccuracy:true, timeout:12000});
  $("#m-centrar").onclick = () => {
    if (posYo) return pintaYo(true);
    if (!navigator.geolocation) return;
    navigator.geolocation.getCurrentPosition(p => {
      posYo = [p.coords.latitude, p.coords.longitude]; pintaYo(true);
    }, ()=>{}, {enableHighAccuracy:true, timeout:12000});
  };
  /* El giro con dos dedos SI esta encendido: lo arma armarGiroDedo() al
     construir el mapa. Aqui decia lo contrario — quedo de cuando estaba
     apagado — y el que lo leyera iba a creer que ese codigo esta muerto. */
  if ($("#m-brujula")) $("#m-brujula").onclick = () => {
    /* Si el mapa quedo torcido con la mano, el primer toque lo endereza
       al norte. Es lo que uno espera de una brujula. */
    if (!girando && enderezarMapa()) return;
    if (!girando && rumbo == null && !navigator.geolocation)
      return alert("Este teléfono no da la brújula.");
    girarMapa(!girando);
  };
  if (girando){ cajaMapa()?.classList.add("girando"); giroPintado = null; setTimeout(agrandarMapa, 60);
    try { mapa.dragging.disable(); } catch(e){} pintarGiro(); }
  if ($("#m-trazo")) $("#m-trazo").onclick = () => dibujarTrazo(lista);

  // agregar cliente donde estoy
  if ($("#m-aqui")) $("#m-aqui").onclick = () => {
    const b = $("#m-aqui");
    if (!navigator.geolocation) return alert("Este teléfono no da la ubicación.");
    b.disabled = true; b.textContent = "Buscando…";
    navigator.geolocation.getCurrentPosition(pos => {
      b.disabled = false; b.textContent = "＋ Cliente aquí";
      const ex = Math.round(pos.coords.accuracy);
      if (ex > 80 && !confirm("La señal está en " + ex + " metros de precisión.\n\n¿Seguir?")) return;
      hojaNuevoCliente(Math.round(pos.coords.latitude*1e6)/1e6, Math.round(pos.coords.longitude*1e6)/1e6);
    }, err => {
      b.disabled = false; b.textContent = "＋ Cliente aquí";
      alert(err.code === 1 ? "No dio permiso de ubicación. Actívelo en los ajustes del navegador."
                           : "No se pudo tomar la ubicación. Pruebe a cielo abierto.");
    }, {enableHighAccuracy:true, timeout:20000, maximumAge:0});
  };

  // agregar cliente tocando el mapa
  if ($("#m-punto")) $("#m-punto").onclick = () => {
    const b = $("#m-punto");
    const activo = b.getAttribute("aria-pressed") === "true";
    b.setAttribute("aria-pressed", !activo);
    $("#mira").classList.toggle("on", !activo);
    if (activo) mapa.off("click", ponerPunto);
    else mapa.on("click", ponerPunto);
    // el panel se cierra solo: el mapa queda libre para tocar
    const caja = $("#m-mas-caja");
    if (caja && !activo){
      caja.classList.remove("on");
      $("#m-mas").setAttribute("aria-pressed","false");
      acomodarFabs();
    }
  };
  armarMovida();
}

/* El azul de la linea. Antes era #1D2340, el MISMO color de los pines, y
   por eso el camino se perdia entre las gotas: no era que el color fuera
   feo, era que no se distinguia de los pines. Brayan escogio el azul vivo
   sobre la maqueta.
   Ojo si algun dia se cambia: el puntito de ubicacion del vendedor tambien
   es azul. Se distinguen porque el puntito lleva aro blanco grueso. */
const AZUL_TRAZO = "#1A6FE0";

let capaTrazo = null;

/* Donde esta parado el vendedor, AHORA. El vigia del GPS deja posYo puesto,
   pero al abrir la app o bajo techo todavia no ha agarrado; ahi se pide una
   sola lectura. Nunca se queda colgado: si el aparato no contesta, devuelve
   nulo y el que llama decide que hacer. */
function dondeEstoy(ms){
  if (posYo) return Promise.resolve(posYo);
  if (!navigator.geolocation) return Promise.resolve(null);
  const tope = ms || 8000;
  return new Promise(listo => {
    let contestado = false;
    const responder = v => { if (!contestado){ contestado = true; listo(v); } };
    navigator.geolocation.getCurrentPosition(
      p => { posYo = [p.coords.latitude, p.coords.longitude]; responder(posYo); },
      () => responder(null),
      {enableHighAccuracy:true, timeout: tope});
    /* Cinturon: en algunos telefonos el timeout de arriba no dispara. */
    setTimeout(() => responder(null), tope + 600);
  });
}

function quitarTrazo(){
  if (capaTrazo && mapa) try { mapa.removeLayer(capaTrazo); } catch(e){}
  capaTrazo = null;
  const b = $("#m-trazo");
  if (b) b.setAttribute("aria-pressed","false");
}

/* El pedido al ruteador. Lo usan los dos botones -la ruta entera y una sola
   tienda-, para que no haya dos maneras distintas de calcular lo mismo.
   El servidor no acepta mas de 100 puntos de una vez. */
async function pedirCamino(puntos){
  const pts = puntos.map(p => p[1] + "," + p[0]).join(";");
  /* Con 15 segundos de tope. Sin esto, en senal mala el fetch se queda
     esperando para siempre y el boton se queda con los tres puntitos. */
  const corte = new AbortController();
  const reloj = setTimeout(() => { try { corte.abort(); } catch(_){} }, 15000);
  try {
    const r = await fetch("https://router.project-osrm.org/route/v1/driving/" + pts +
      "?overview=full&geometries=geojson", {signal: corte.signal});
    const d = await r.json();
    if (!d.routes || !d.routes.length) throw new Error("sin ruta");
    return {
      linea: d.routes[0].geometry.coordinates.map(c => [c[1], c[0]]),
      km: Math.round(d.routes[0].distance/100)/10,
      min: Math.round(d.routes[0].duration/60)
    };
  } finally { clearTimeout(reloj); }
}

/* Dos lineas encimadas: la blanca gruesa es el borde, para que el azul se
   lea igual sobre calle clara y sobre monte. */
function pintarCamino(linea){
  quitarTrazo();
  capaTrazo = L.layerGroup([
    L.polyline(linea, {color:"#ffffff", weight:9, opacity:.75}),
    L.polyline(linea, {color:AZUL_TRAZO, weight:5, opacity:.95})
  ]).addTo(mapa);
  const b = $("#m-trazo");
  if (b) b.setAttribute("aria-pressed","true");
}

function fallaDeCamino(e){
  alert(e && e.name === "AbortError"
    ? "El camino tard\u00f3 demasiado.\n\nCon se\u00f1al lenta esto pasa; pruebe otra vez en un momento."
    : "No se pudo trazar el camino ahora.\n\nNecesita se\u00f1al; pruebe otra vez en un momento.");
}

async function dibujarTrazo(lista){
  if (!mapa) return;
  const b = $("#m-trazo");
  if (capaTrazo){ quitarTrazo(); return; }
  let con = lista.filter(c => c.lat != null && c.lng != null)
    .sort((a,b2) => (Number(a.orden)||999) - (Number(b2.orden)||999));
  if (con.length < 2) return alert("Se necesitan al menos dos clientes con ubicaci\u00f3n marcada.");
  if (b){ b.disabled = true; b.textContent = "\u2026"; }
  try {
    /* ARRANCA DONDE ESTA PARADO EL VENDEDOR. Antes la linea empezaba en el
       cliente 1 y ese primer tramo no contaba: en la captura que mando
       Brayan eran 28.5 km y 31 minutos que la app no le sumaba, y por eso
       los kilometros le salian cortos y la linea no le servia para salir. */
    const yo = await dondeEstoy(8000);
    /* Su punto tambien ocupa lugar en la lista del ruteador. */
    const tope = yo ? 89 : 90;
    let recorte = "";
    /* Cuando son muchos, se traza lo que de verdad le sirve: los que le
       faltan por visitar. Si aun asi son demasiados, se corta y se avisa. */
    if (con.length > tope){
      const faltan = con.filter(pendiente);
      if (faltan.length >= 2 && faltan.length < con.length){
        con = faltan;
        recorte = "Se trazaron solo los que faltan por visitar.";
      }
    }
    if (con.length > tope){
      con = con.slice(0, tope);
      recorte = "Son demasiados: se trazaron los primeros " + tope + " del orden de visita.";
    }
    const puntos = con.map(c => [c.lat, c.lng]);
    if (yo) puntos.unshift(yo);
    const cam = await pedirCamino(puntos);
    pintarCamino(cam.linea);
    const nota = $("#mapa-nota");
    if (nota) nota.innerHTML = avisoTodasLasRutas() +
      '<div class="conteo">Camino por calle \u00b7 ' + cam.km + ' km \u00b7 ' + cam.min + ' min' +
      (yo ? ' \u00b7 desde donde est\u00e1'
          : ' \u00b7 sin se\u00f1al de GPS: arranca en el primer cliente') +
      (recorte ? ' \u00b7 ' + recorte : '') + '</div>';
  } catch(e){
    fallaDeCamino(e);
  } finally {
    if (b){ b.disabled = false; b.textContent = "\u301c"; }
  }
}

/* "Calle": de donde esta parado a ESA tienda, sin salirse de la app.
   Es distinto de "Navegar", que abre Google Maps y lo saca de aqui. */
async function trazoAUnCliente(c, boton){
  if (!mapa || !mapaVive()) return;
  if (c.lat == null || c.lng == null)
    return alert("Esta tienda no tiene punto en el mapa.\n\nM\u00e1rquele la ubicaci\u00f3n primero.");
  const antes = boton ? boton.innerHTML : "";
  if (boton){ boton.disabled = true; boton.innerHTML = "<b>\u301c</b>Buscando\u2026"; }
  try {
    const yo = await dondeEstoy(8000);
    if (!yo) return alert("No se pudo tomar su ubicaci\u00f3n.\n\n" +
      "El camino se traza desde donde est\u00e1 usted, as\u00ed que hace falta.\n" +
      "Toque \u25ce para que el mapa lo encuentre y vuelva a intentar.");
    const cam = await pedirCamino([yo, [c.lat, c.lng]]);
    cerrarHoja();
    pintarCamino(cam.linea);
    /* El mapa se cierra sobre el tramo, que si no queda fuera de pantalla. */
    try { mapa.fitBounds(capaTrazo.getBounds(), {padding:[38,38]}); } catch(e){}
    const nota = $("#mapa-nota");
    if (nota) nota.innerHTML = avisoTodasLasRutas() +
      '<div class="conteo">Camino hasta ' + escapar(c.nombre) + ' \u00b7 ' +
      cam.km + ' km \u00b7 ' + cam.min + ' min \u00b7 desde donde est\u00e1</div>';
  } catch(e){
    fallaDeCamino(e);
  } finally {
    if (boton){ boton.disabled = false; boton.innerHTML = antes; }
  }
}

function ponerPunto(e){
  const b = $("#m-punto");
  if (b) b.setAttribute("aria-pressed","false");
  if ($("#mira")) $("#mira").classList.remove("on");
  if (mapa) mapa.off("click", ponerPunto);

}

/* --- alta de cliente desde el mapa --- */
function hojaNuevoCliente(lat, lng){
  const sec = S.sectores.find(x => x.id === S.sectorSel);
  const sig = clientesDelSector().reduce((a,c) => Math.max(a, Number(c.orden)||0), 0) + 1;
  $("#hoja-cuerpo").innerHTML =
    '<div class="eyebrow">Nuevo cliente · ' + escapar(sec ? sec.nombre : "") + '</div>' +
    '<h2>¿De quién es este punto?</h2>' +
    '<p style="font-size:13px;color:var(--tenue);margin:6px 0 0" class="num">' + lat + ', ' + lng + '</p>' +
    '<label class="campo"><span>Nombre del negocio</span><input id="nc-nom" type="text" autocomplete="off"></label>' +
    '<label class="campo"><span>Teléfono del negocio</span><input id="nc-tel" type="tel" inputmode="tel" placeholder="7777-7777" autocomplete="off"></label>' +
    '<div class="aviso dato">El c&oacute;digo se le pone al guardar (le tocar&iacute;a el <b>' +
      escapar(siguienteCodigo()) + '</b> o el siguiente libre).</div>' +
    '<label class="campo"><span>Referencia</span><input id="nc-ref" type="text" placeholder="Frente a la iglesia"></label>' +
    '<label class="campo"><span>Orden de visita</span><input id="nc-ord" type="number" value="' + sig + '"></label>' +
    '<button class="btn" id="nc-guardar" style="margin-top:16px">Guardar cliente aquí</button>' +
    '<button class="btn secundario" id="nc-cerrar" style="margin-top:9px">Cancelar</button>';
  $("#nc-cerrar").onclick = cerrarHoja;
  $("#nc-guardar").onclick = async () => {
    const nom = $("#nc-nom").value.trim();
    if (!nom) return alert("Escriba el nombre del negocio.");
    const tel = $("#nc-tel").value.trim();
    if (tel.replace(/\D/g,"").length < 8)
      return alert("Falta el teléfono del negocio.\n\nEs el que usa el motorista cuando no encuentra a alguien, así que no se puede dejar en blanco.");
    const celda = celdaDe(lat, lng);
    try {
      const z = await db.collection("bloqueados").doc(celda).get();
      if (z.exists)
        return alert("Aqui hubo un negocio que la administracion dio de baja" +
          (z.data().motivo ? ":\n\n\"" + z.data().motivo + "\"" : ".") +
          "\n\nNo se puede abrir otro cliente en este punto. Hable con el administrador.");
    } catch(e){}
    const choca = clienteQueChoca(nom, tel);
    if (choca && choca.activo === false)
      return alert("A este negocio lo dio de baja la administracion" +
        (choca.baja && choca.baja.motivo ? ":\n\n\"" + choca.baja.motivo + "\"" : ".") +
        "\n\nNo se puede volver a abrir con otro codigo. Hable con el administrador si debe reactivarse.");
    if (choca)
      return alert("Ese negocio ya esta en el sistema como \"" + choca.nombre +
        "\" (" + (choca.codigo || "sin codigo") + ").\n\nBusquelo en el buscador en vez de abrirlo otra vez.");
    /* Los parecidos. Si es el mismo sin lugar a dudas, no se crea.
       Si solo se parece, se crea marcado y lo revisa el admin. */
    const pares = clientesParecidos(nom, tel, lat, lng);
    const duro = pares.find(x => x.duro);
    if (duro)
      return alert("Este negocio ya esta en el sistema como \"" + duro.c.nombre + "\" (" +
        (duro.c.codigo || "sin codigo") + "), " + duro.motivo + ".\n\n" +
        "Busquelo en el buscador. Si de verdad es otro negocio distinto, que el administrador lo de de alta.");
    if (pares.length && !confirm("Se parece a \"" + pares[0].c.nombre + "\" (" +
        (pares[0].c.codigo || "sin codigo") + "), " + pares[0].motivo + ".\n\n" +
        "Si es el mismo, cancele y busquelo. Si de verdad es otro negocio, siga: queda anotado " +
        "para que el administrador lo revise.")) return;
    let codigoNuevo;
    try { codigoNuevo = await reservarCodigo(); }
    catch(err){ return avisoCodigo(err); }
    const ok = await guardarEn("clientes", () => db.collection("clientes").add({
      nombre: nom, telefono: tel, clave: claveCliente(nom, tel), celda: celda,
      revisarCon: pares.slice(0,3).map(x => x.c.id),
      codigo: codigoNuevo,
      referencia: $("#nc-ref").value.trim(),
      direccion: "", sectorId: S.sectorSel, orden: Number($("#nc-ord").value) || sig,
      activo: true, lat: lat, lng: lng,
      creadoPor: S.usuario.uid, creadoPorNombre: S.nombre,
      creadoEl: hoyISO(), creadoMes: mesISO(),
      ubicadoPor: S.usuario.uid, ubicadoEn: firebase.firestore.FieldValue.serverTimestamp()
    }), $("#nc-guardar"));
    if (ok){ cerrarHoja(); pintarRuta(); }
  };
  $("#fondo").classList.add("abierto"); $("#hoja").classList.add("abierta");
}

/* Mover el punto a mano: sirve cuando el cliente quedo en la calle de al
   lado. "Reubicar" usa el GPS de donde uno esta; esto deja escoger el punto. */
/* Hacia donde ve el preventista. Dos fuentes: el GPS lo da cuando va
   caminando, y la brujula del aparato cuando esta parado. */
let rumbo = null;

function pintarRumbo(){
  const el = document.querySelector(".yo");
  if (!el) return;
  if (rumbo == null){ el.classList.remove("con-rumbo"); return; }
  el.classList.add("con-rumbo");
  const c = el.querySelector(".cono");
  if (c) c.style.setProperty("--rumbo", Math.round(rumbo) + "deg");
}

function ponerRumbo(grados){
  if (grados == null || isNaN(grados)) return;
  rumbo = ((Number(grados) % 360) + 360) % 360;
  pintarRumbo();
  pintarGiro();
}

/* ---- El mapa girando con la brujula ----
   Sin esto el mapa siempre ve al norte y uno tiene que girar el telefono
   en la mano para saber si el cliente le queda adelante o atras. Con esto
   el mapa se acomoda solo: lo que esta arriba de la pantalla es lo que
   uno tiene enfrente.

   Mientras gira, se traba el arrastre a mano: Leaflet no sabe que esta
   girado y los dedos lo mandarian para donde no es. El mapa sigue solo
   al preventista, que es lo que se ocupa caminando. */
let girando = false, giroPintado = null;

function cajaMapa(){ return document.querySelector(".mapa-caja"); }

/* Saca la sesion de este aparato y deja el aviso en la pantalla de
   entrada, para que la persona sepa por que se salio y no crea que la
   app se descompuso. */
async function sacarSesion(motivo){
  try { (cortes||[]).forEach(c => { try { c(); } catch(e){} }); } catch(e){}
  try { await auth.signOut(); } catch(e){}
  const a = $("#login-aviso");
  if (a){ mostrarAviso(a, motivo); a.classList.remove("oculto"); }
  else alert(motivo);
}

/* ---- Suavizado del giro ----
   La brujula del telefono es nerviosa: en una moto o en el carro manda
   lecturas que brincan, y el mapa daba tirones que marean y hacen perder
   el punto. Aqui NO se pinta la lectura cruda. Se guarda a donde apunta
   la brujula (rumboMeta) y el mapa lo persigue de a poquito, 60 veces por
   segundo, avanzando una fraccion de lo que le falta. Asi todo brinco se
   reparte en medio segundo de movimiento parejo.

   Ojo con el cruce del norte: de 350 a 10 grados son 20 de diferencia,
   no 340. Sin corregir eso el mapa se pega una vuelta entera al revez
   cada vez que uno pasa por el norte. */
let rumboMeta = null, rumboSuave = null, latidoGiro = null;

/* de -180 a 180: cual es el camino corto entre dos angulos */
function difAngulo(a, b){
  let d = (a - b) % 360;
  if (d > 180) d -= 360;
  if (d < -180) d += 360;
  return d;
}

function pintarGiro(){
  if (!girando || rumbo == null) return;
  rumboMeta = rumbo;
  if (rumboSuave == null) rumboSuave = rumbo;   // el primero entra de una
  arrancarLatido();
}

function arrancarLatido(){
  if (latidoGiro != null) return;
  const paso = () => {
    const caja = cajaMapa();
    if (!girando || !caja || rumboMeta == null){ latidoGiro = null; return; }
    const falta = difAngulo(rumboMeta, rumboSuave);
    /* SUAVIDAD: cuanto se acerca en cada cuadro. Mas bajo = mas suave y
       mas lento. 0.12 tarda como medio segundo en alcanzar un giro. Si
       les sigue pareciendo brusco, bajar este numero. */
    if (Math.abs(falta) < 0.4){
      rumboSuave = rumboMeta;
    } else {
      rumboSuave = ((rumboSuave + falta * 0.12) % 360 + 360) % 360;
    }
    const g = Math.round(rumboSuave * 10) / 10;
    if (giroPintado == null || Math.abs(difAngulo(g, giroPintado)) >= 0.2){
      giroPintado = g;
      caja.style.setProperty("--giro", (-g) + "deg");
    }
    latidoGiro = (Math.abs(falta) < 0.4) ? null : requestAnimationFrame(paso);
  };
  latidoGiro = requestAnimationFrame(paso);
}

/* ===== Girar el mapa con dos dedos ================================
   Se tuerce igual que se hace zoom, pero torciendo la mano. El zoom de
   Leaflet usa los mismos dos dedos, asi que hay que decidir cual de los
   dos quiso hacer el vendedor: si los dedos se separan o se juntan, es
   zoom; si giran quedandose a la misma distancia, es giro. Por eso el
   giro solo arranca cuando la mano dio mas de 12 grados y la distancia
   entre los dedos casi no cambio.
   Esto es aparte de la brujula: la brujula apunta a donde uno va, esto
   lo deja donde uno lo dejo. */
let giroDedo = 0, torciendo = false, baseAng = null, baseDist = 0, baseGiro = 0;

/* ---- Arrastrar el mapa cuando esta torcido ------------------------
   ESTE ERA EL BUENO. Leaflet corre el mapa en las coordenadas de SU
   caja, pero la caja va girada por CSS. Entonces el dedo empuja para un
   lado y el mapa se va para otro. Medido con el dedo de verdad, con el
   dedo dando 120px a la DERECHA:

       mapa derecho    el mapa se fue 120px a la derecha   (bien)
       mapa a  90 gr   el mapa se fue      hacia ABAJO
       mapa a 180 gr   el mapa se fue 120px a la IZQUIERDA (al reves)
       mapa a 270 gr   el mapa se fue      hacia ARRIBA

   Eso es, exacto, lo que Brayan sentia como "tengo que mover a sentido
   contrario". No era la brujula: era que el mapa torcido nunca siguio
   al dedo.

   Aqui se le quita el arrastre a Leaflet mientras el mapa este torcido y
   se hace a mano: al movimiento del dedo se le da la vuelta por el
   angulo del mapa, y asi lo que uno tiene bajo el dedo se va con el
   dedo, este como este el mapa. */
let panDedo = null;

/* Convierte un movimiento de la PANTALLA al movimiento que hay que
   pedirle al mapa, que esta girado gr grados. Es girar el vector al
   reves: R(-gr). */
function vueltaAlDedo(dx, dy, gr){
  const r = -gr * Math.PI / 180, c = Math.cos(r), s = Math.sin(r);
  return [dx*c - dy*s, dx*s + dy*c];
}
/* Torcido es torcido, lo haya puesto la mano o la brujula. Se pregunta
   por el estado y no por el angulo, porque la brujula apuntando al
   norte da 0 grados y aun asi Leaflet tiene el arrastre apagado: si se
   preguntara por el angulo, en ese momento no se podria mover el mapa
   ni con el dedo ni con Leaflet. */
function mapaTorcido(){ return girando || !!giroDedo; }

/* Leaflet arrastra bien solo cuando el mapa esta derecho. */
function arrastreLeaflet(si){
  if (!mapa) return;
  try { si ? mapa.dragging.enable() : mapa.dragging.disable(); } catch(e){}
}

function angEntre(t){
  return Math.atan2(t[1].clientY - t[0].clientY, t[1].clientX - t[0].clientX) * 180 / Math.PI;
}
function distEntre(t){
  const dx = t[1].clientX - t[0].clientX, dy = t[1].clientY - t[0].clientY;
  return Math.sqrt(dx*dx + dy*dy);
}
function ponerGiroDedo(g){
  const caja = cajaMapa();
  if (!caja) return;
  giroDedo = ((g % 360) + 360) % 360;
  if (giroDedo === 0){
    caja.classList.remove("torcido");
    caja.style.removeProperty("--giro");
    /* Mapa derecho otra vez: Leaflet vuelve a arrastrar el, que lo hace
       mejor -trae la inercia, el rebote en las orillas-. */
    if (!girando) arrastreLeaflet(true);
    /* se devuelve el mapa a su tamanio normal */
    const m = document.getElementById("mapa");
    if (m && !girando){
      m.style.cssText = m.style.cssText.replace(/(position|width|height|left|top)\s*:[^;]*;?/g, "");
      try { mapa && mapa.invalidateSize({animate:false}); } catch(e){}
    }
  } else {
    const nuevo = !caja.classList.contains("torcido");
    caja.classList.add("torcido");
    /* Torcido: el arrastre lo lleva panDedo, aqui abajo. Si se le deja a
       Leaflet, mueve el mapa en diagonal. */
    arrastreLeaflet(false);
    /* CON la mano, no contra ella: la brujula gira al reves porque sigue
       al rumbo, pero el dedo tiene que llevarse el mapa consigo. */
    caja.style.setProperty("--giro", giroDedo + "deg");
    if (nuevo) agrandarMapa();
  }
  const b = $("#m-brujula");
  /* El boton dorado significa UNA cosa: la brujula esta corriendo. Antes
     el giro con el dedo tambien lo ponia dorado, asi que uno torcia el
     mapa con la mano y el boton se prendia como si la brujula estuviera
     puesta. De ahi salia el enredo: uno lo tocaba creyendo que la
     apagaba, y en el segundo toque la prendia de verdad — y ahi si el
     mapa se movia al reves, porque la brujula gira contra la mano a
     proposito, para dejar el norte donde uno apunta.
     Ahora el mapa torcido con la mano lleva su propio aro, que no se
     confunde con el dorado. */
  if (b && !girando){
    b.setAttribute("aria-pressed", "false");
    b.classList.toggle("torcida", !!giroDedo);
  }
}
/* El angulo al que esta el mapa AHORITA, lo haya puesto la brujula o la
   mano. Se lee del CSS para que al agarrarlo con los dedos siga desde
   donde se quedo y no pegue un brinco. */
function giroActual(){
  const caja = cajaMapa();
  if (!caja) return 0;
  const v = parseFloat(getComputedStyle(caja).getPropertyValue("--giro"));
  return isNaN(v) ? 0 : v;
}
function enderezarMapa(){
  if (!giroDedo) return false;
  ponerGiroDedo(0);
  return true;
}
/* ====== Clientes en el mismo punto: se abren en abanico ======
   Varias tiendas de la misma cuadra caen una encima de otra y el preventa
   ve un solo pin: no puede tocar las de abajo ni leer su numero de orden.
   Aqui se detectan las que quedan a menos de 26 pixeles y se abren en
   circulo alrededor del monton.
   SOLO se mueve el pin en pantalla; el punto guardado del cliente no se
   toca. Y se vuelve a calcular con cada zoom: al acercarse se separan solas
   y el abanico se cierra. */
var marcasRuta = [];
function separarPines(){
  if (!mapaVive() || !marcasRuta.length) return;
  const pos = marcasRuta.map(m => {
    let p = null;
    try { p = mapa.latLngToLayerPoint([m.lat, m.lng]); } catch(e){}
    return {m:m, p:p};
  }).filter(x => x.p);
  const tomado = new Array(pos.length).fill(false);
  pos.forEach((a, i) => {
    if (tomado[i]) return;
    const grupo = [a];
    tomado[i] = true;
    for (let j = i + 1; j < pos.length; j++){
      if (tomado[j]) continue;
      const dx = a.p.x - pos[j].p.x, dy = a.p.y - pos[j].p.y;
      if (dx*dx + dy*dy < 26*26){ grupo.push(pos[j]); tomado[j] = true; }
    }
    if (grupo.length === 1){
      // solo: se devuelve a su punto de verdad por si venia abanicado
      try { a.m.mk.setLatLng([a.m.lat, a.m.lng]); } catch(e){}
      return;
    }
    const r = 15 + grupo.length * 2.2;
    grupo.forEach((g, k) => {
      const ang = (k / grupo.length) * Math.PI * 2 - Math.PI / 2;
      try {
        g.m.mk.setLatLng(mapa.layerPointToLatLng(
          L.point(a.p.x + Math.cos(ang) * r, a.p.y + Math.sin(ang) * r)));
      } catch(e){}
    });
  });
}

function armarGiroDedo(){
  const caja = cajaMapa();
  if (!caja || caja.dataset.giroDedo) return;
  caja.dataset.giroDedo = "1";
  caja.addEventListener("touchstart", e => {
    /* UN dedo con el mapa torcido: lo arrastramos nosotros. Se deja
       pasar lo que caiga sobre un boton o un aviso, o el mapa se
       arrastraria al querer tocarlos. */
    if (e.touches.length === 1 && mapaTorcido()){
      const t = e.touches[0];
      panDedo = (e.target && e.target.closest && e.target.closest(".fabs, .cap, .capas, button"))
        ? null : {x:t.clientX, y:t.clientY};
    } else {
      panDedo = null;
    }
    if (e.touches.length !== 2) return;
    baseAng = angEntre(e.touches); baseDist = distEntre(e.touches);
    /* Se arranca del angulo que el mapa TIENE, no del que llevaba la
       mano: si la brujula lo dejo torcido, al agarrarlo no brinca. */
    baseGiro = giroActual(); torciendo = false;
  }, {passive:true});
  caja.addEventListener("touchmove", e => {
    if (panDedo && e.touches.length === 1){
      if (!mapaTorcido() || !mapa){ panDedo = null; return; }
      const t = e.touches[0];
      const dx = t.clientX - panDedo.x, dy = t.clientY - panDedo.y;
      if (!dx && !dy) return;
      panDedo = {x:t.clientX, y:t.clientY};
      /* Se le da la vuelta al movimiento por el angulo del mapa, y se
         corre al reves: panBy mueve la VISTA, y el mapa se ve moverse
         al contrario de la vista. */
      const v = vueltaAlDedo(dx, dy, giroActual());
      try { mapa.panBy([-v[0], -v[1]], {animate:false}); } catch(err){}
      return;
    }
    if (e.touches.length !== 2 || baseAng == null) return;
    const ang = angEntre(e.touches), dist = distEntre(e.touches);
    const vuelta = difAngulo(ang, baseAng);
    const estira = baseDist ? dist / baseDist : 1;
    if (!torciendo){
      /* Todavia no se sabe que quiso: si los dedos se separaron o se
         juntaron, era zoom y aqui no se hace nada mas. */
      if (Math.abs(estira - 1) > 0.18) { baseAng = null; return; }
      if (Math.abs(vuelta) < 12) return;
      torciendo = true;
      /* LA MANO MANDA. Si la brujula estaba corriendo, se apaga: el que
         agarra el mapa con los dedos es el que lo esta manejando, y
         tener las dos peleando es lo que lo hacia sentir al reves. */
      if (girando) girarMapa(false);
      if (mapa) try { mapa.touchZoom.disable(); mapa.dragging.disable(); } catch(err){}
    }
    ponerGiroDedo(baseGiro + vuelta);
  }, {passive:true});
  const soltar = () => {
    if (torciendo && mapa) try { mapa.touchZoom.enable(); } catch(err){}
    /* El arrastre SOLO se le devuelve a Leaflet si el mapa quedo
       derecho. Antes se le devolvia siempre al soltar los dedos, y por
       eso el mapa quedaba torcido Y arrastrandose en diagonal: el
       enredo se sentia despues de girar, no mientras se giraba. */
    if (!mapaTorcido()) arrastreLeaflet(true);
    torciendo = false; baseAng = null; panDedo = null;
  };
  caja.addEventListener("touchend", soltar, {passive:true});
  caja.addEventListener("touchcancel", soltar, {passive:true});
}

function girarMapa(si){
  const caja = cajaMapa();
  if (!caja) return;
  girando = !!si;
  const b = $("#m-brujula");
  if (b){
    b.setAttribute("aria-pressed", girando ? "true" : "false");
    b.classList.toggle("brujula-on", girando);
    b.textContent = girando ? "➤" : "➤";
  }
  if (girando){
    /* La brujula manda: lo que se haya torcido con la mano se suelta. */
    giroDedo = 0; caja.classList.remove("torcido");
    if (b) b.classList.remove("torcida");
    caja.classList.add("girando");
    giroPintado = null;
    agrandarMapa();
    pedirPermisoBrujula();
    if (mapa){
      /* El arrastre lo lleva panDedo mientras el mapa este torcido. */
      arrastreLeaflet(false);
      /* SOLO se centra si la persona NO se ve en pantalla. Antes se
         centraba siempre, y por eso Brayan decia "me tira de nuevo para
         donde yo estoy y me desubica para donde voy": el se habia
         corrido el mapa adelante para ver a donde iba, prendia la
         brujula y el mapa lo devolvia a su punto de un solo.
         El pad(-0.15) come un 15% de la orilla: pegado al borde cuenta
         como que no se ve, porque ahi ya no sirve de nada. */
      if (posYo && mapaVive()) try {
        if (!mapa.getBounds().pad(-0.15).contains(L.latLng(posYo)))
          mapa.setView(posYo, Math.max(mapa.getZoom(), 17));
      } catch(e){}
    }
    pintarGiro();
  } else {
    caja.classList.remove("girando");
    caja.style.removeProperty("--giro");
    if (latidoGiro != null){ cancelAnimationFrame(latidoGiro); latidoGiro = null; }
    rumboSuave = null; rumboMeta = null; giroPintado = null;
    const m = document.getElementById("mapa");
    if (m) m.style.cssText = m.style.cssText
      .replace(/(position|width|height|left|top)\s*:[^;]*;?/g, "");
    if (!giroDedo) arrastreLeaflet(true);
    panDedo = null;
  }
  setTimeout(() => { try { mapa && mapa.invalidateSize(); } catch(e){} }, 220);
}

/* ---- El colchon para que no quede franja blanca ----
   Al girar un rectangulo sobre su centro, las esquinas barren por fuera.
   Un cuadrado del tamano de la DIAGONAL de la pantalla tapa el hueco en
   cualquier angulo; menos que eso deja franja en algun giro.

   Va por JS y no por CSS porque la regla "#pant-ruta.lleno #mapa" lleva
   dos id y le gana en especificidad a cualquier alto puesto en la hoja:
   el ancho si agarraba pero el alto se quedaba en 100%, y por eso la
   franja salia siempre abajo y se movia con el giro. Puesto desde aqui
   queda como estilo pegado al elemento, que le gana a todo. */
function agrandarMapa(){
  const caja = cajaMapa(), m = document.getElementById("mapa");
  /* Vale para los dos giros: el de la brujula y el de la mano. Al torcer
     un rectangulo las esquinas se salen, y si el mapa no se agranda queda
     el vacio blanco alrededor. */
  /* Antes decia "!girando" y se salia: agrandaba solo con la brujula. El
     giro de la mano usa giroDedo, no girando, asi que llamaba a agrandar y
     no agrandaba nada, y quedaban los triangulos blancos en las esquinas.
     El propio comentario de arriba decia que valia para los dos. */
  if (!caja || !m || (!girando && !giroDedo)) return;
  const w = caja.clientWidth, h = caja.clientHeight;
  if (!w || !h) return;
  const lado = Math.ceil(Math.sqrt(w*w + h*h)) + 4;   // 4px de sobra por el redondeo
  m.style.position = "absolute";
  m.style.width  = lado + "px";
  m.style.height = lado + "px";
  m.style.left   = Math.round((w - lado)/2) + "px";
  m.style.top    = Math.round((h - lado)/2) + "px";
  try { mapa && mapa.invalidateSize({animate:false}); } catch(e){}
}
/* si el telefono cambia de horizontal a vertical, se recalcula */
window.addEventListener("resize", () => { if (girando || giroDedo) agrandarMapa(); });

/* En iPhone hay que pedir permiso a la brujula, y solo se puede
   pedir cuando el dedo toca un boton. */
function pedirPermisoBrujula(){
  try {
    const D = window.DeviceOrientationEvent;
    if (D && typeof D.requestPermission === "function"){
      D.requestPermission().then(r => { if (r === "granted") oirBrujula(); })
                           .catch(()=>{});
      return;
    }
  } catch(e){}
  oirBrujula();
}

let brujulaLista = false;
function oirBrujula(){
  if (brujulaLista) return;
  brujulaLista = true;
  const leer = e => {
    if (e.webkitCompassHeading != null) return ponerRumbo(e.webkitCompassHeading);
    if (e.absolute && e.alpha != null) ponerRumbo(360 - e.alpha);
  };
  try {
    window.addEventListener("deviceorientationabsolute", leer, true);
    window.addEventListener("deviceorientation", leer, true);
  } catch(e){}
}

/* Rastreo continuo del GPS. Un solo vigia para toda la sesion:
   el mapa se repinta y se recrea, pero la posicion sigue viva aqui. */
let vigiaGPS = null, posYo = null, miMarcaRef = null;
function vigilarGPS(){
  if (vigiaGPS != null || !navigator.geolocation) return;
  vigiaGPS = navigator.geolocation.watchPosition(p => {
    posYo = [p.coords.latitude, p.coords.longitude];
    if (miMarcaRef && mapaVive()){ try { miMarcaRef.setLatLng(posYo); } catch(e){} }
    reportarPosicion(p.coords.latitude, p.coords.longitude, p.coords.accuracy);
    if (p.coords.heading != null && !isNaN(p.coords.heading) && p.coords.speed > 0.4)
      ponerRumbo(p.coords.heading);
  }, ()=>{}, {enableHighAccuracy:true, maximumAge:3000});
  oirBrujula();
}
function pararGPS(){
  if (vigiaGPS != null && navigator.geolocation){
    try { navigator.geolocation.clearWatch(vigiaGPS); } catch(e){}
  }
  vigiaGPS = null; posYo = null; miMarcaRef = null;
}

/* ===================== Cerrar el día =====================
   Lo que Handy llama "terminar ruta". Aqui es un boton al final de Mi dia:
   resume la jornada, la deja firmada con hora y apaga el GPS. Cerrado el
   dia, el preventista ya no levanta pedidos hasta manana. */
function jornadaId(){ return hoyISO() + "_" + (S.usuario ? S.usuario.uid : ""); }

function diaCerrado(){ return !!(S.jornada && S.jornada.fin); }

function horaCorta(d){
  return ("0"+d.getHours()).slice(-2) + ":" + ("0"+d.getMinutes()).slice(-2);
}

function hojaCerrarDia(datos){
  const faltan = datos.total - datos.visitados;
  $("#hoja-cuerpo").innerHTML =
    '<div class="eyebrow">' + fechaBonita(hoyISO()) + '</div>' +
    '<h2>Terminar mi día</h2>' +
    (S.cargosPendientes
      ? '<div class="aviso" style="border-color:var(--rojo);color:var(--rojo)">' +
        '<b>Tiene ' + S.cargosPendientes +
        (S.cargosPendientes === 1 ? ' devolución sin responder.' : ' devoluciones sin responder.') +
        '</b><br>Acéptela o recházela en Mi día antes de cerrar. ' +
        'Si no responde, al día de pago se toma como aceptada.</div>'
      : '') +
    '<div class="cifra-tot" style="border-top:0;margin-top:14px;padding-top:0">' +
      '<span class="eyebrow">Vendido</span><b class="num">' + money(datos.monto) + '</b></div>' +
    '<div style="margin-top:12px">' +
      filaCifra("Visitas", "de " + datos.total + " clientes del sector", String(datos.visitados), null) +
      filaCifra("Con pedido", "efectividad " + datos.efect + "%", String(datos.conPedido), null) +
      (datos.arranque ? filaCifra("Arrancó", "primera visita del día", datos.arranque, null) : "") +
    '</div>' +
    (faltan > 0
      ? '<div class="aviso dato" style="margin-top:14px">Quedan <b>' + faltan +
        '</b> clientes sin visitar. Si cierra ahora, quedan como no visitados.</div>'
      : '<div class="aviso bien" style="margin-top:14px">Visitó a todo el sector. Buen día.</div>') +
    '<button class="btn" id="cd-si" style="margin-top:18px">Sí, terminar mi día</button>' +
    '<button class="btn secundario" id="cd-no" style="margin-top:9px">Todavía no</button>';
  $("#fondo").classList.add("abierto"); $("#hoja").classList.add("abierta");
  $("#cd-no").onclick = cerrarHoja;
  $("#cd-si").onclick = async () => {
    const b = $("#cd-si");
    b.disabled = true; b.textContent = "Cerrando…";
    const ahora = new Date();
    try {
      const pendiente = await esperarEscritura(db.collection("jornadas").doc(jornadaId()).set({
        fecha: hoyISO(), mes: mesISO(),
        preventaUid: S.usuario.uid, preventaNombre: S.nombre,
        sectorId: S.sectorSel || null,
        inicio: datos.arranque || "", fin: horaCorta(ahora),
        visitas: datos.visitados, conPedido: datos.conPedido,
        sinVisitar: Math.max(0, faltan), efectividad: datos.efect,
        vendido: dosDec(datos.monto),
        cerradoEn: firebase.firestore.FieldValue.serverTimestamp()
      }, {merge:true}));
      // oficina lo ve de una: se marca en el punto en vivo y se apaga el GPS
      try {
        await esperarEscritura(db.collection("posiciones").doc(S.usuario.uid)
          .set({cerrado:true, fin:horaCorta(ahora)}, {merge:true}), 3000);
      } catch(e){}
      pararGPS();
      cerrarHoja();
      alert("Día cerrado a las " + horaCorta(ahora) + "." +
        (pendiente ? "\n\nSin señal: el cierre sube solo cuando vuelva la señal." : "") +
        "\n\nQue descanse.");
    } catch(e){
      b.disabled = false; b.textContent = "Sí, terminar mi día";
      alert("No se pudo cerrar (" + (e.code || e.message) + "). Inténtelo con señal.");
    }
  };
}

/* Las tres cifras del pie no son adorno: cada una abre su lista.
   Clientes lleva a la ficha del negocio; las otras dos solo muestran. */
function filaCifra(titulo, abajo, monto, clase){
  return '<' + (clase ? 'button' : 'div') + ' class="cifra-fila"' + (clase ? ' data-id="' + clase + '"' : '') + '>' +
    '<span class="qui"><b>' + titulo + '</b><small>' + abajo + '</small></span>' +
    (monto ? '<span class="mon">' + monto + '</span>' : '') +
    '</' + (clase ? 'button' : 'div') + '>';
}

function hojaCifra(clave, lista){
  const esDesp = S.rol === "despacho";
  let titulo = "", filas = "", total = null, rotulo = "";

  if (clave === "clientes"){
    titulo = "Clientes del día";
    filas = lista.map(c => {
      const e = estadoCli(c);
      const d = aQueDistancia(c);
      return filaCifra(escapar(c.nombre),
        escapar(c.codigo || "sin código") + " · " + e.texto + (d != null ? " · a " + tramo(d) : ""),
        "", c.id);
    }).join("");
  }

  else if (clave === "visitados"){
    titulo = "Visitados hoy";
    const vs = (S.visitasHoy || []).slice().sort((a,b) => String(a.inicio||"").localeCompare(String(b.inicio||"")));
    filas = vs.map(v => {
      const h = v.inicio ? new Date(v.inicio) : null;
      const hora = h && !isNaN(h) ? ("0"+h.getHours()).slice(-2) + ":" + ("0"+h.getMinutes()).slice(-2) : "";
      const min = v.duracionSeg ? Math.max(1, Math.round(v.duracionSeg/60)) + " min" : "";
      return filaCifra(escapar(v.clienteNombre || ""),
        [hora, min, v.resultado === "pedido" ? "con pedido" : escapar(v.motivo || "no compró")]
          .filter(Boolean).join(" · "),
        v.monto ? money(v.monto) : "", null);
    }).join("");
    rotulo = "Visitas";
    total = String(vs.length);
  }

  else if (clave === "vendido"){
    titulo = "Vendido hoy";
    const ps = (S.pedidosDia || []).filter(x => esVenta(x) && (esDesp || x.preventaUid === S.usuario.uid));
    filas = ps.map(x => filaCifra(escapar(x.clienteNombre || ""),
      escapar(x.clienteCodigo || "") + (x.tipo === "cambio" ? " · cambio" : "") +
      (x.adicional ? " · adicional" : ""),
      money(x.total), null)).join("");
    rotulo = "Total del día";
    total = money(ps.reduce((t,x) => t + (Number(x.total)||0), 0));
  }

  else if (clave === "entregas" || clave === "entregadas"){
    const reps = (S.pedidosDia || []).filter(x => x.tipo !== "cambio");
    const ver = clave === "entregadas"
      ? reps.filter(x => x.estado === "entregado" || x.estado === "entregado parcial")
      : reps;
    titulo = clave === "entregadas" ? "Ya entregadas" : "Entregas del día";
    filas = ver.map(x => filaCifra(escapar(x.clienteNombre || ""),
      escapar(x.clienteCodigo || "") + " · " +
      (x.estado === "entregado" ? "entregado"
        : x.estado === "entregado parcial" ? "entregado a medias"
        : x.estado === "no entregado" ? escapar(x.motivoNoEntrega || "no recibió")
        : "pendiente"),
      money(x.estado && x.estado.indexOf("entregado") === 0 ? montoEntregado(x) : x.total), null)).join("");
    rotulo = "Entregas";
    total = String(ver.length);
  }

  else if (clave === "cobrado"){
    titulo = "Cobrado hoy";
    const ent = (S.pedidosDia || []).filter(x => x.tipo !== "cambio" &&
      (x.estado === "entregado" || x.estado === "entregado parcial"));
    filas = ent.map(x => filaCifra(escapar(x.clienteNombre || ""),
      /* Decia x.pago.forma, y ese campo no existe: en todo el resto del
         archivo se llama metodo. La condicion nunca se cumplia y el corte
         del dia marcaba TODO como efectivo, hasta lo transferido. */
      (x.pago && x.pago.metodo === "transferencia" ? "transferencia" : "efectivo") +
      (x.estado === "entregado parcial" ? " · entrega a medias" : ""),
      money(montoEntregado(x)), null)).join("");
    rotulo = "Total cobrado";
    total = money(ent.reduce((t,x) => t + montoEntregado(x), 0));
  }

  $("#hoja-cuerpo").innerHTML =
    '<div class="eyebrow">' + fechaBonita(fechaVista()) + '</div>' +
    '<h2>' + titulo + '</h2>' +
    (filas
      ? '<div style="margin-top:10px">' + filas + '</div>' +
        (total != null
          ? '<div class="cifra-tot"><span class="eyebrow">' + rotulo + '</span>' +
            '<b class="num">' + total + '</b></div>' : '')
      : '<div class="conteo" style="margin-top:12px">Todavía no hay nada aquí.</div>') +
    '<button class="btn secundario" id="cf-cerrar" style="margin-top:16px">Volver al mapa</button>';
  $("#fondo").classList.add("abierto"); $("#hoja").classList.add("abierta");
  $("#cf-cerrar").onclick = cerrarHoja;
  $$("#hoja-cuerpo .cifra-fila[data-id]").forEach(b => b.onclick = () => {
    const c = S.clientes.find(x => x.id === b.dataset.id);
    if (!c) return;
    if (c.lat != null && mapaVive()) try { mapa.setView([c.lat, c.lng], 18); } catch(e){}
    hojaCliente(c);
  });
}

/* ===================================================================
   DATOS FISCALES DEL CLIENTE

   Para que sirve: oficina no habla con los clientes. Sus unicos canales
   son el preventa y el motorista, asi que cuando falta un NRC o un NIT
   se va el dia persiguiendo a alguien por WhatsApp. El preventa SI esta
   parado frente al duenio y le puede pedir la tarjeta. Por eso se
   captura aqui.

   AQUI NO SE GENERA NINGUN DTE. Generar un DTE es firmarlo con el
   certificado de la DGII y transmitirlo a Hacienda: eso es del sistema
   de oficina. Lo que hace D'Preventa es RECOGER el dato limpio y
   dejarlo listo. Si un DTE sale mal, el cliente pierde el derecho a
   deducir ese IVA, y ese riesgo no se toca desde la calle.

   Los campos son los siete que pidio oficina y que son el minimo de
   Hacienda: razon social, NRC, giro o actividad economica, NIT o DUI,
   direccion, correo y telefono.

   EL DEPARTAMENTO Y EL MUNICIPIO NO VAN ESCRITOS AQUI A PROPOSITO.
   Hacienda quito los 262 municipios viejos del catalogo CAT-013 y los
   cambio por 45; ademas en julio de 2026 volvio a moverlos (el codigo
   10 y el 11 se intercambiaron entre Cabanas Este y Oeste). Un codigo
   viejo hace que el DTE se rechace al validarlo. Por eso la lista vive
   en Firestore, en configuracion/catalogoGeo, y se puede actualizar sin
   volver a subir la app. Mientras no este cargada, se escribe a mano.
=================================================================== */
const FISCAL_CAMPOS = [
  ["razonSocial", "Raz\u00f3n social", "text",  "Como aparece en la tarjeta"],
  /* NIT y DUI van aparte (oficina, 4 sep 2026): no son lo mismo y a veces
     Hacienda pide los dos. El DUI viaja al puente como fiscal.dui. */
  ["nit",         "NIT",               "text",  "0000-000000-000-0"],
  ["dui",         "DUI",               "text",  "00000000-0"],
  ["nrc",         "NRC (registro de IVA)", "text", "Solo si es contribuyente"],
  ["giro",        "Giro o actividad econ\u00f3mica", "text", "A qu\u00e9 se dedica"],
  ["dirFiscal",   "Direcci\u00f3n fiscal", "text", "La de la tarjeta, no la de entrega"],
  ["correo",      "Correo",            "email", "Aqu\u00ed le llega el DTE"],
  ["telFiscal",   "Tel\u00e9fono",     "tel",   ""]
];

/* La lista de departamentos y municipios, si oficina ya la cargo. */
function catalogoGeo(){
  const g = S.catalogoGeo;
  return (g && Array.isArray(g.departamentos) && g.departamentos.length) ? g : null;
}

function esContribuyente(c){ return c && c.fiscal && c.fiscal.tipo === "credito"; }

/* El desplegable que va dentro de la hoja del cliente. Plegado, para que
   no le estorbe al preventa que solo va a levantar el pedido. */
function bloqueFiscal(c){
  const f = (c && c.fiscal) || {};
  const tipo = f.tipo || "consumidor";
  const geo = catalogoGeo();
  const llenos = FISCAL_CAMPOS.filter(x => (f[x[0]] || "").trim()).length;
  const marca = tipo === "credito"
    ? (llenos >= 5 ? "Cr\u00e9dito fiscal \u00b7 completo" : "Cr\u00e9dito fiscal \u00b7 faltan datos")
    : "Consumidor final";
  return '<details class="plega" id="fis-caja">' +
    '<summary>Datos para facturar<span class="marca-f">' + marca + '</span></summary>' +
    '<div class="adentro">' +
      '<p style="font-size:13px;color:var(--tenue);margin:0 0 10px">' +
        'Esto lo ocupa oficina para facturar. Si el cliente no pide cr\u00e9dito fiscal, ' +
        'd\u00e9jelo en consumidor final y no llene nada m\u00e1s.</p>' +
      '<label class="campo"><span>Tipo de cliente</span><select id="fis-tipo">' +
        '<option value="consumidor"' + (tipo === "consumidor" ? " selected" : "") + '>Consumidor final</option>' +
        '<option value="credito"' + (tipo === "credito" ? " selected" : "") + '>Cr\u00e9dito fiscal</option>' +
      '</select></label>' +
      '<div id="fis-campos"' + (tipo === "credito" ? "" : ' class="oculto"') + '>' +
        FISCAL_CAMPOS.map(x =>
          '<label class="campo"><span>' + x[1] + '</span>' +
          '<input class="fis-c" data-k="' + x[0] + '" type="' + x[2] + '" ' +
          (x[3] ? 'placeholder="' + x[3] + '" ' : '') +
          'value="' + escapar(f[x[0]] || "") + '"></label>').join("") +
        (geo
          ? '<label class="campo"><span>Departamento</span><select id="fis-dep">' +
              '<option value="">Elija</option>' +
              geo.departamentos.map(d => '<option value="' + escapar(d.cod) + '"' +
                (f.departamento === d.cod ? " selected" : "") + '>' + escapar(d.nombre) + '</option>').join("") +
            '</select></label>' +
            '<label class="campo"><span>Municipio</span><select id="fis-mun"></select></label>'
          : '<label class="campo"><span>Departamento y municipio</span>' +
            '<input class="fis-c" data-k="depMunTexto" type="text" value="' +
              escapar(f.depMunTexto || "") + '" placeholder="Ej: San Miguel, San Miguel Centro"></label>' +
            '<p style="font-size:12px;color:var(--tenue);margin:6px 0 0">Oficina lo pasa a ' +
            'c\u00f3digo. En cuanto carguen el cat\u00e1logo de Hacienda, aqu\u00ed salen dos listas ' +
            'y ya no hay que escribirlo.</p>') +
        /* La foto de la tarjeta: con esto una duda de un digito se
           resuelve mirando, no llamando al motorista. */
        '<div class="eyebrow" style="margin-top:16px">Foto de la tarjeta de IVA</div>' +
        (f.fotoTarjeta
          ? '<div class="foto-caja" style="margin-top:8px"><img src="' + f.fotoTarjeta + '" alt="">' +
            '<button class="quitar-f" id="fis-quitar">Quitar</button></div>'
          : '<label class="btn linea" style="margin-top:8px;display:block;text-align:center">Tomar foto' +
            '<input id="fis-foto" type="file" accept="image/*" capture="environment" style="display:none"></label>') +
      '</div>' +
      '<button class="btn" id="fis-guardar" style="margin-top:14px">Guardar datos de facturaci\u00f3n</button>' +
    '</div></details>';
}

let fisFoto = null;

function amarrarFiscal(c){
  const caja = document.getElementById("fis-caja");
  if (!caja) return;
  fisFoto = (c.fiscal && c.fiscal.fotoTarjeta) || null;
  const geo = catalogoGeo();

  const pintaMun = () => {
    const dep = document.getElementById("fis-dep"), mun = document.getElementById("fis-mun");
    if (!dep || !mun || !geo) return;
    const lista = (geo.municipios || []).filter(m => m.dep === dep.value);
    const elegido = (c.fiscal && c.fiscal.municipio) || "";
    mun.innerHTML = '<option value="">Elija</option>' +
      lista.map(m => '<option value="' + escapar(m.cod) + '"' +
        (elegido === m.cod ? " selected" : "") + '>' + escapar(m.nombre) + '</option>').join("");
  };
  if (geo){ pintaMun(); const d = document.getElementById("fis-dep"); if (d) d.onchange = pintaMun; }

  const tipo = document.getElementById("fis-tipo");
  if (tipo) tipo.onchange = () => {
    const campos = document.getElementById("fis-campos");
    if (campos) campos.classList.toggle("oculto", tipo.value !== "credito");
  };

  const inp = document.getElementById("fis-foto");
  if (inp) inp.onchange = e => {
    const f = e.target.files && e.target.files[0];
    if (!f) return;
    /* Se encoge igual que las otras fotos: un JPG de camara no cabe en
       un documento de Firestore y ademas se comeria los datos del
       preventa en la calle. */
    /* Mismo encogido que la foto del negocio (640 px, calidad 0.5). Un
       JPG de camara no cabe en un documento de Firestore y ademas se
       comeria los datos del preventa en la calle. Aqui va un poco mas
       de calidad porque hay que poder LEER los numeros de la tarjeta. */
    const img = new Image();
    img.onload = () => {
      const max = 900, esc = Math.min(1, max/Math.max(img.width, img.height));
      const cv = document.createElement("canvas");
      cv.width = Math.round(img.width*esc); cv.height = Math.round(img.height*esc);
      cv.getContext("2d").drawImage(img, 0, 0, cv.width, cv.height);
      fisFoto = cv.toDataURL("image/jpeg", 0.7);
      URL.revokeObjectURL(img.src);
      c.fiscal = Object.assign({}, c.fiscal || {}, {fotoTarjeta: fisFoto});
      hojaCliente(c);
      const caja = document.getElementById("fis-caja");
      if (caja) caja.open = true;
    };
    img.src = URL.createObjectURL(f);
  };
  const q = document.getElementById("fis-quitar");
  if (q) q.onclick = () => {
    fisFoto = null;
    if (c.fiscal) c.fiscal.fotoTarjeta = "";
    hojaCliente(c);
    const caja = document.getElementById("fis-caja");
    if (caja) caja.open = true;
  };

  const g = document.getElementById("fis-guardar");
  if (g) g.onclick = async () => {
    const datos = {tipo: (tipo && tipo.value) || "consumidor"};
    document.querySelectorAll("#fis-campos .fis-c").forEach(x => {
      datos[x.dataset.k] = x.value.trim();
    });
    const dep = document.getElementById("fis-dep"), mun = document.getElementById("fis-mun");
    if (dep) datos.departamento = dep.value || "";
    if (mun) datos.municipio = mun.value || "";
    if (fisFoto) datos.fotoTarjeta = fisFoto;
    /* Para credito fiscal, Hacienda exige NIT y NRC del receptor: sin
       eso oficina no puede emitir el comprobante. Se avisa aqui, en la
       tienda, que es donde todavia se puede pedir la tarjeta. */
    if (datos.tipo === "credito" && (!datos.nit || !datos.nrc)){
      if (!confirm("Para cr\u00e9dito fiscal hacen falta el NIT y el NRC.\n\n" +
        "\u00bfGuardar as\u00ed de todos modos? Oficina no va a poder facturarle " +
        "hasta que lleguen esos dos.")) return;
    }
    datos.anotadoPor = S.usuario.uid;
    datos.anotadoPorNombre = S.nombre;
    const ok = await guardarEn("clientes", () => db.collection("clientes").doc(c.id)
      .update({fiscal: datos, fiscalEn: firebase.firestore.FieldValue.serverTimestamp()}), g);
    if (!ok) return;
    c.fiscal = datos;
    const enLista = S.clientes.find(x => x.id === c.id);
    if (enLista) enLista.fiscal = datos;
    nota("Datos de facturaci\u00f3n guardados.");
  };
}

/* ===================================================================
   AVISOS PARA OFICINA
   Para que nadie tenga que estar mirando la pantalla a ver si entro algo.

   De donde salen: NO se abre ninguna escucha nueva. Todo esto ya viene
   por las escuchas que estaban (pedidos del dia, jornadas del dia) mas
   una sola de cargos. Se revisa lo que ya llego y se saca la lista.

   Como se avisa: dos capas.
   1) Con la app en pantalla: un sonido corto y el globito rojo.
   2) Con la app atras (en WhatsApp, con la pantalla apagada pero la app
      todavia viva): una notificacion de Android de verdad.
   Lo que NO hace: avisar con la app cerrada del todo. Eso pide un
   servidor que mande el mensaje y no lo tenemos.

   Por eso, y esto es lo importante: el sonido es un empujon, no el
   registro. La BANDEJA es la que manda. Aunque el telefono estuviera en
   silencio o guardado, lo pendiente sigue ahi hasta que alguien lo mire.
=================================================================== */
const AVISOS = {
  adicional: {ico:"\u25cf", tit:"Pedido adicional"},
  gasto:     {ico:"\u25c8", tit:"Gasto del cami\u00f3n"},
  carga:     {ico:"\u25a4", tit:"Diferencia en la carga"},
  devolucion:{ico:"\u21ba", tit:"Devoluci\u00f3n"},
  transfer:  {ico:"\u25ce", tit:"Transferencia por confirmar"},
  cierre:    {ico:"\u2713", tit:"Cierre de jornada"}
};
let avisosVistos = null;      // null = todavia no hay linea de base
let avisosLista = [];
let avisosNuevos = 0;
let cargosAbiertos = [];

/* Arma la lista de lo que espera respuesta de oficina. */
function armarAvisos(){
  const L = [];
  const hoy = hoyISO();
  (S.pedidosDia || []).forEach(p => {
    if ((p.fecha || "") !== hoy || p.estado === "anulado") return;
    if (p.adicional === true && p.estado === "adicional")
      L.push({id:"ad_" + p.id, tipo:"adicional",
              txt:(p.preventaNombre || "") + " \u00b7 " + (p.clienteNombre || "") +
                  " \u00b7 " + money(p.total || 0)});
    if (p.pago && p.pago.estado === "reportado")
      L.push({id:"tr_" + p.id, tipo:"transfer",
              txt:(p.clienteNombre || "") + " \u00b7 " + money((p.pago && p.pago.monto) || p.total || 0)});
  });
  (S.jornadasDia || []).forEach(j => {
    const quien = j.preventaNombre || "";
    const gs = Array.isArray(j.gastos) ? j.gastos : [];
    /* La cuenta va en la llave: si el motorista mete otro gasto, cambia
       el numero y suena de nuevo. Sin eso solo avisaria del primero. */
    if (gs.length){
      const tot = gs.reduce((a,g) => a + (Number(g.monto) || 0), 0);
      L.push({id:"ga_" + j.id + "_" + gs.length, tipo:"gasto",
              txt:quien + " \u00b7 " + gs.length + (gs.length === 1 ? " gasto \u00b7 " : " gastos \u00b7 ") +
                  money(tot) + (j.kmRecorrido ? " \u00b7 " + j.kmRecorrido + " km" : "")});
    }
    const dif = Array.isArray(j.cargaDiferencias) ? j.cargaDiferencias : [];
    if (dif.length)
      L.push({id:"ca_" + j.id + "_" + dif.length, tipo:"carga",
              txt:quien + " \u00b7 " + dif.length +
                  (dif.length === 1 ? " producto no cuadr\u00f3" : " productos no cuadraron")});
    if (j.fin)
      L.push({id:"ci_" + j.id, tipo:"cierre",
              txt:quien + " cerr\u00f3 a las " + j.fin +
                  (j.vendido != null ? " \u00b7 " + money(j.vendido) : "")});
  });
  cargosAbiertos.forEach(c => {
    L.push({id:"dv_" + c.id, tipo:"devolucion",
            txt:(c.paraNombre || c.deNombre || "") +
                (c.monto != null ? " \u00b7 " + money(c.monto) : "") +
                (c.respuesta ? " \u00b7 ya contest\u00f3" : " \u00b7 sin contestar")});
  });
  return L;
}

/* Se llama cada vez que llega algo nuevo por las escuchas. */
function revisarAvisos(){
  if (!(S.rol === "admin" || S.rol === "supervisor")) return;
  avisosLista = armarAvisos();
  const ids = avisosLista.map(a => a.id);
  if (avisosVistos === null){
    /* Primera pasada al entrar: se toma como linea de base y NO suena.
       Si no, abrir la app a las 6 de la tarde soltaria veinte avisos
       de cosas que ya se vieron y nadie volveria a hacerle caso. */
    avisosVistos = ids.slice();
    pintarGloboAvisos();
    return;
  }
  const frescos = avisosLista.filter(a => avisosVistos.indexOf(a.id) < 0);
  avisosNuevos = frescos.length;
  if (frescos.length){
    sonarAviso();
    notificarSistema(frescos);
  }
  pintarGloboAvisos();
  /* si ya esta parado en En vivo, la lista se acomoda sola */
  if (S.pagina === "vivo" && document.getElementById("ofi-avisos")) pintarBandeja();
}

/* Un tono corto, hecho por el propio navegador. Sin archivo de sonido:
   asi no hay que bajar nada ni engorda el zip. Dos notas cortas, que se
   oyen en una oficina sin ser un escandalo. */
function sonarAviso(){
  try {
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return;
    const ctx = new AC();
    [[880, 0], [1175, 0.13]].forEach(([hz, cuando]) => {
      const o = ctx.createOscillator(), g = ctx.createGain();
      o.type = "sine"; o.frequency.value = hz;
      o.connect(g); g.connect(ctx.destination);
      const t = ctx.currentTime + cuando;
      g.gain.setValueAtTime(0.0001, t);
      g.gain.exponentialRampToValueAtTime(0.22, t + 0.02);
      g.gain.exponentialRampToValueAtTime(0.0001, t + 0.12);
      o.start(t); o.stop(t + 0.14);
    });
    setTimeout(() => { try { ctx.close(); } catch(e){} }, 600);
  } catch(e){}
}

/* La notificacion de Android. Solo sale si ya dieron permiso. */
function notificarSistema(frescos){
  try {
    if (!("Notification" in window) || Notification.permission !== "granted") return;
    if (document.visibilityState === "visible") return;   // ya lo esta viendo
    const t = frescos.length === 1
      ? (AVISOS[frescos[0].tipo] || {}).tit || "Algo entr\u00f3"
      : frescos.length + " cosas esperan respuesta";
    const cuerpo = frescos.slice(0, 3).map(a => a.txt).join("\n");
    new Notification(empApp() + " \u00b7 " + t, {
      body: cuerpo, icon: "icon-192.png", badge: "icon-192.png",
      tag: "preventa-avisos", renotify: true
    });
  } catch(e){}
}

function pintarGloboAvisos(){
  const b = document.querySelector('#nav button[data-p="vivo"]');
  if (!b) return;
  let g = b.querySelector(".globo");
  if (!g){
    g = document.createElement("span");
    g.className = "globo"; b.appendChild(g);
  }
  g.textContent = avisosNuevos > 99 ? "99+" : String(avisosNuevos);
  g.classList.toggle("oculto", avisosNuevos < 1);
  pintarCampana();
}

/* Al entrar a En vivo se dan por vistos: el globito se apaga pero la
   bandeja sigue mostrando todo lo que espera respuesta. */
function marcarAvisosVistos(){
  avisosVistos = avisosLista.map(a => a.id);
  avisosNuevos = 0;
  pintarGloboAvisos();
}

/* Pinta la bandeja y amarra el boton de permiso. El permiso de
   notificaciones SOLO se puede pedir con el dedo encima de un boton:
   pedirlo solo al arrancar lo rechaza el navegador. */
function pintarBandeja(){
  const c = document.getElementById("ofi-avisos");
  if (!c) return;
  c.innerHTML = bloqueAvisos();
  const b = document.getElementById("av-permiso");
  if (b) b.onclick = () => {
    if (!("Notification" in window))
      return alert("Este navegador no da notificaciones.");
    Notification.requestPermission().then(r => {
      if (r === "granted"){
        sonarAviso();
        alert("Listo. Ahora suena aunque ande en otra app,\n" +
          "mientras la aplicación siga abierta atr\u00e1s.\n\n" +
          "Con la app cerrada del todo no llega: eso pide un servidor " +
          "que mande el mensaje, y todav\u00eda no lo tenemos.");
      } else {
        alert("Qued\u00f3 sin permiso. El globito rojo y el sonido siguen " +
          "funcionando mientras la pantalla est\u00e9 abierta.");
      }
      pintarBandeja();
    }).catch(() => {});
  };
}

/* El pedazo de bandeja que se pinta arriba de En vivo. */
function bloqueAvisos(){
  if (!avisosLista.length)
    return '<div class="pasos"><div class="eyebrow">Pendientes</div>' +
      '<div class="conteo" style="text-align:left;margin-top:6px">' +
      'Nada esperando respuesta.</div></div>';
  const permiso = ("Notification" in window) ? Notification.permission : "no";
  return '<div class="pasos"><div class="eyebrow">Pendientes \u00b7 ' +
      avisosLista.length + '</div>' +
    (permiso === "granted" ? '' :
      '<button class="btn linea" id="av-permiso" style="margin-top:10px">' +
      'Avisarme con sonido aunque est\u00e9 en otra app</button>') +
    avisosLista.map(a => {
      const d = AVISOS[a.tipo] || {ico:"\u25cf", tit:"Aviso"};
      const nuevo = avisosVistos && avisosVistos.indexOf(a.id) < 0;
      return '<div class="aviso-fila' + (nuevo ? ' nuevo' : '') + '">' +
        '<span class="ico">' + d.ico + '</span>' +
        '<span class="qu"><b>' + d.tit + '</b><small>' + escapar(a.txt) + '</small></span>' +
      '</div>';
    }).join("") + '</div>';
}

/* ===================== En vivo =====================
   El telefono del preventa y del motorista deja su punto en `posiciones`.
   Un documento por persona, se sobrescribe: no es un rastro guardado, es
   "donde anda ahorita". Se escribe cada 90 segundos o cada 75 metros, lo
   que caiga primero, para no gastar datos ni bateria de gusto. */
let ultimoReporte = 0, ultimaPos = null;

function arranqueDeHoy(){
  const con = (S.visitasHoy || []).filter(v => v.inicio);
  if (!con.length) return "";
  const t = con.map(v => v.inicio).sort()[0];
  const d = new Date(t);
  return isNaN(d) ? "" : ("0"+d.getHours()).slice(-2) + ":" + ("0"+d.getMinutes()).slice(-2);
}

function reportarPosicion(lat, lng, exactitud, forzar){
  if (!S.usuario || (S.rol !== "preventa" && S.rol !== "despacho" && S.rol !== "supervisor")) return;
  if (lat == null || lng == null) return;
  const ahora = Date.now();
  const lejos = !ultimaPos || distMetros(ultimaPos[0], ultimaPos[1], lat, lng) > 75;
  if (!forzar && !lejos && ahora - ultimoReporte < 90000) return;
  ultimoReporte = ahora;
  ultimaPos = [lat, lng];
  const mios = (S.pedidosDia || []).filter(x => x.preventaUid === S.usuario.uid);
  db.collection("posiciones").doc(S.usuario.uid).set({
    nombre: S.nombre || "", rol: S.rol, fecha: hoyISO(),
    lat: Math.round(lat*1e6)/1e6, lng: Math.round(lng*1e6)/1e6,
    exactitud: Math.round(exactitud || 0),
    sectorId: S.sectorSel || null,
    en: S.visita ? S.visita.clienteNombre : "",
    visitas: (S.visitasHoy || []).length,
    vendido: dosDec(mios.reduce((t,x) => t + (Number(x.total) || 0), 0)),
    arranque: arranqueDeHoy(),
    hora: firebase.firestore.FieldValue.serverTimestamp()
  }, {merge:true}).catch(()=>{});
  guardarHuella(lat, lng);
}

/* ===================== El recorrido del día =====================
   "posiciones" guarda SOLO donde anda cada quien ahorita: se escribe
   encima y lo anterior se pierde. Para poder ver despues por donde
   anduvo, hay que ir dejando huella.
   Se guarda dentro de la jornada del dia, que ya existe, y no se escribe
   punto por punto: se juntan en el telefono y se mandan de a tandas. Asi
   son unas 60 escrituras al dia por persona en vez de 400, y se gasta
   menos dato y menos bateria. */
let huellas = [], huellaUltima = 0;

function guardarHuella(lat, lng){
  const ahora = Date.now();
  huellas.push({
    la: Math.round(lat*1e5)/1e5,
    ln: Math.round(lng*1e5)/1e5,
    h: ("0"+new Date().getHours()).slice(-2) + ":" + ("0"+new Date().getMinutes()).slice(-2)
  });
  /* Se manda cada 5 puntos o cada 8 minutos, lo que pase primero. Si el
     telefono se queda sin senal, los puntos se acumulan y suben juntos
     cuando vuelva. */
  if (huellas.length < 5 && ahora - huellaUltima < 480000) return;
  soltarHuellas();
}

function soltarHuellas(){
  if (!huellas.length || !S.usuario) return;
  const tanda = huellas.slice();
  huellas = [];
  huellaUltima = Date.now();
  db.collection("jornadas").doc(jornadaId()).set({
    fecha: hoyISO(), mes: mesISO(),
    preventaUid: S.usuario.uid, preventaNombre: S.nombre,
    rol: S.rol,
    ruta: firebase.firestore.FieldValue.arrayUnion.apply(null, tanda)
  }, {merge:true}).catch(() => {
    /* Si no entró, se devuelven a la cola para el próximo intento: el
       recorrido de un día no se pierde por un bache de señal. */
    huellas = tanda.concat(huellas);
  });
}

/* Al cerrar la app o al cerrar el dia, lo que quede en la cola se manda. */
window.addEventListener("pagehide", () => { try { soltarHuellas(); } catch(e){} });

let moviendo = null;

/* No se pone por toque: se arrastra el mapa y el aro se queda quieto en el
   centro. Asi no depende de que el mapa reciba el toque, que en tableta no
   siempre llega. El mapa se redibuja cada vez que Firebase manda algo, por
   eso esto corre al final de cada pintado. */
function armarMovida(){
  const mira = $("#mira");
  const vieja = $("#mv-barra");
  if (!moviendo || !mapa){
    if (vieja) vieja.remove();
    if (mira) mira.classList.remove("on");
    return;
  }
  if (mira) mira.classList.remove("on");   // ahora se arrastra el pin, no hay mira
  // Si ya esta puesta se deja quieta: borrarla y rehacerla en cada repintado
  // hacia que el toque se perdiera a medio camino.
  if (vieja) return;

  const d = document.createElement("div");
  d.id = "mv-barra";
  d.className = "cap";
  d.style.cssText = "left:10px;right:10px;bottom:calc(150px + env(safe-area-inset-bottom));" +
                    "display:flex;gap:8px;align-items:stretch";

    '<div class="aviso dato" style="flex:1;margin:0;display:flex;align-items:center">' +
      'Mantenga el dedo sobre el pin de <b style="margin:0 4px">' + escapar(moviendo.nombre) +
      '</b> y arr&aacute;strelo a su lugar.</div>' +
    '<button class="btn secundario" id="mv-no" style="flex:0 0 108px;margin:0">Cancelar</button>';
  (document.querySelector("#pant-ruta") || document.body).appendChild(d);

  const cancelar = ev => {
    if (ev){ ev.preventDefault(); ev.stopPropagation(); }
    moviendo = null;
    arrastrando = false;
    if (mira) mira.classList.remove("on");

  ["click","touchend"].forEach(t => $("#mv-no").addEventListener(t, cancelar));
}

async function fijarPuntoCliente(ll){
 try {

 } catch(e){ nota("Falló al mover: " + (e.code || e.message || e), true); }
