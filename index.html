<!-- La ficha de la empresa va ARRIBA: el rotulo que reemplaza al logo
     la necesita, y el logo se pide antes que el programa del final. -->
<script src="empresa.js"></script>
<script>
/* 🪤 Esto va ACA ARRIBA, no abajo con el resto del programa, y no es
   capricho: las imagenes de la pagina se piden ANTES de que corra el
   programa del final del archivo. Si el logo no existe, el `onerror`
   dispara en ese momento, y si la funcion todavia no se declaro el
   navegador tira "marcaSinLogo is not defined" y deja el icono roto a la
   vista. (Y ojo: nunca escribir la etiqueta de guion abierta dentro de un
   comentario de aqui adentro, porque parte el bloque en dos.) */
function marcaSinLogo(img){
  if (!img || !img.parentNode) return;
  var t = document.createElement("b");
  t.className = "marca-txt";
  t.textContent = (window.EMPRESA && (window.EMPRESA.nombre || window.EMPRESA.nombreLargo)) || "";
  img.parentNode.replaceChild(t, img);
}
/* 🪤 La segunda red, y hace falta. `onerror` NO dispara cuando el servidor
   contesta 200 con otra cosa --por ejemplo la pagina entera, que es lo que
   hacen los hospedajes que redirigen todo al index--. Ahi la imagen "carga"
   pero mide cero, y lo que queda a la vista es el icono roto del navegador.
   Por eso se revisa tambien al cargar: si no trajo ancho, no era un dibujo. */
function marcaRevisa(img){
  if (img && !img.naturalWidth) marcaSinLogo(img);
}
/* El estilo lo elige cada quien en su telefono. Se aplica ANTES de pintar
   para que no se vea el brinco de claro a oscuro al abrir. */
(function(){
  var e = "navy";
  try { e = localStorage.getItem("estiloApp") || "cielo"; } catch(x){}
  document.documentElement.setAttribute("data-estilo", e);
})();
</script>
<link rel="manifest" href="manifest.json">
<link rel="stylesheet" href="leaflet.css">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
:root{
  --tinta:#131826; --papel:#F4F5F8; --carta:#FFFFFF;
  --verde:#1D2340; --verde-claro:#E7E9F0;
  --senal:#D89A16; --rojo:#B23636; --ok:#1F7A4D;
  --linea:#DCE0E8; --tenue:#6C7689;
  --r:16px;
  /* todo sale del navy y el dorado del logo.
     verde y rojo solo para decir "salio bien" y "se perdio" */
  --c-vender:#1D2340;  --f-vender:#E7E9F0;   /* navy del logo */
  --c-cambio:#C98410;  --f-cambio:#FAF0DA;   /* dorado del logo */
  --c-listo:#1F7A4D;   --f-listo:#E4F1EA;
  --c-perdido:#A93226; --f-perdido:#F7E9E7;
  --c-mover:#46527A;   --f-mover:#ECEEF5;    /* navy aclarado */
  --c-marcar:#6B6070;  --f-marcar:#F0EDF1;
}

/* ============ ESTILOS DE LA APP ============
   navy  = el de siempre (no lleva bloque: es el :root de arriba)
   sol   = para la calle a mediodia: blanco puro, tinta negra, bordes gruesos
   noche = para el arranque de las 5:30 y el cierre: fondo oscuro
   Se cambia desde el chip de la cuenta y se guarda en este telefono. */

/* ===== Cielo: el aspecto que mandó Brayan (4 sep 2026) =====
   Blanco, azul y tarjetas de borde fino, como el tablero de referencia.
   Va por variables, igual que los otros dos: NO se toca ni una regla de
   componente. Si mañana no gusta, se borra este bloque y no queda rastro.
   El azul es el unico acento; verde, morado y naranja aparecen solo en las
   pastillas que dicen un estado, que es como los usa la referencia. */
html[data-estilo="cielo"]{
  --tinta:#0F172A; --papel:#F8FAFC; --carta:#FFFFFF;
  --verde:#2563EB; --verde-claro:#EFF6FF;
  --senal:#EA580C; --rojo:#DC2626; --ok:#16A34A;
  --linea:#E2E8F0; --tenue:#64748B;
  --r:14px;
  --c-vender:#2563EB;  --f-vender:#DBEAFE;
  --c-cambio:#EA580C;  --f-cambio:#FFEDD5;
  --c-listo:#16A34A;   --f-listo:#DCFCE7;
  --c-perdido:#DC2626; --f-perdido:#FEE2E2;
  --c-mover:#7C3AED;   --f-mover:#EDE9FE;
  --c-marcar:#0891B2;  --f-marcar:#CFFAFE;
}
/* La barra lateral de la referencia es clara, no de color: el activo se
   marca con una pastilla azul palida y letra azul, no con un bloque. */
/* La barra lateral. En la referencia es BLANCA, no de color, y lo que
   marca donde uno esta es una pastilla azul palida con la letra azul --no
   un bloque de color que grita. Estos colores estan escritos a mano y no
   por variables porque el bloque original tambien lo esta: son colores de
   la barra, no del sistema. */
html[data-estilo="cielo"] .tb-lado{background:#FFFFFF;color:var(--tinta);
  border-right:1px solid var(--linea)}
html[data-estilo="cielo"] .tb-sec{color:var(--tenue)}
html[data-estilo="cielo"] .tb-nav button{color:#475569}
html[data-estilo="cielo"] .tb-nav button:hover{background:#F1F5F9;color:var(--tinta)}
html[data-estilo="cielo"] .tb-nav button[aria-pressed=true]{
  background:var(--verde-claro);color:var(--verde)}
html[data-estilo="cielo"] .tb-pie{border-top-color:var(--linea);color:var(--tenue)}
html[data-estilo="cielo"] .tb-pie b{color:var(--tinta)}
html[data-estilo="cielo"] .tb-pie .tb-version button{color:var(--verde)}
/* El boton principal: en la referencia es azul PLANO. El degradado y la
   sombra pesada vienen del tema navy y aqui se ven como un boton de
   otra app pegado encima. */
html[data-estilo="cielo"] .btn{background:var(--verde);background-image:none;
  box-shadow:0 1px 2px rgba(15,23,42,.08)}
html[data-estilo="cielo"] .btn.linea{background:var(--carta);border:1px solid var(--linea);
  color:var(--tinta);box-shadow:none}
html[data-estilo="cielo"] .btn.secundario{background:var(--carta);
  border:1px solid var(--linea);color:var(--tinta);background-image:none;box-shadow:none}
html[data-estilo="sol"]{
  --tinta:#000000; --papel:#FFFFFF; --carta:#FFFFFF;
  --verde:#141A33; --verde-claro:#DDE1EE;
  --senal:#8A5900; --rojo:#8E1B10; --ok:#0E5C36;
  --linea:#8E96AA; --tenue:#2F3646;
  --c-vender:#141A33;  --f-vender:#DDE1EE;
  --c-cambio:#7A5100;  --f-cambio:#FFF1CC;
  --c-listo:#0E5C36;   --f-listo:#DAEFE3;
  --c-perdido:#8E1B10; --f-perdido:#FFE2DD;
  --c-mover:#2E3A63;   --f-mover:#E2E6F2;
  --c-marcar:#463F4D;  --f-marcar:#EBE7ED;
}
/* Bordes gruesos y botones planos: se ven con el sol de frente.
   El degradado del boton se quita a mano: con el reflejo del sol un
   degradado se ve lavado y el texto blanco encima se pierde. */
html[data-estilo="sol"] .btn{background:var(--verde);background-image:none;box-shadow:none;
  border:2px solid var(--verde);color:#fff}
html[data-estilo="sol"] .btn.linea{background:#fff;border-color:var(--tinta);color:var(--tinta);
  font-weight:800}
html[data-estilo="sol"] .btn.secundario{background:#fff;border:2px solid var(--linea);
  color:var(--tinta)}
/* Las fichas y pestañas apagadas quedaban gris sobre blanco: no se leian. */
html[data-estilo="sol"] .filtros-cli button,
html[data-estilo="sol"] .vistas button,
html[data-estilo="sol"] .cat{color:var(--tinta);border-color:var(--tinta);border-width:2px}
html[data-estilo="sol"] .filtros-cli button[aria-pressed="true"],
html[data-estilo="sol"] .vistas button[aria-pressed="true"],
html[data-estilo="sol"] .cat[aria-pressed="true"]{background:var(--verde);color:#fff;
  border-color:var(--verde)}
/* Texto secundario mas oscuro: con el sol, el gris claro desaparece. */
html[data-estilo="sol"] .conteo,
html[data-estilo="sol"] .eyebrow,
html[data-estilo="sol"] .tarjeta-cli .cod,
html[data-estilo="sol"] .tarjeta-cli .dir{color:#2F3646}
html[data-estilo="sol"] .tarjeta-cli{border-width:2px}
html[data-estilo="sol"] input[type=text],
html[data-estilo="sol"] input[type=email],
html[data-estilo="sol"] input[type=password],
html[data-estilo="sol"] input[type=number],
html[data-estilo="sol"] select,
html[data-estilo="sol"] textarea{border-width:2px}
html[data-estilo="sol"] .cat,
html[data-estilo="sol"] .chip-usuario,
html[data-estilo="sol"] .btn.linea{border-width:2px}
html[data-estilo="sol"] .aviso{background:#FFE2DD;color:var(--rojo)}
html[data-estilo="sol"] .aviso.bien{background:#DAEFE3;color:var(--ok)}
html[data-estilo="sol"] .aviso.dato{background:#FFF1CC;color:#6B4400}

html[data-estilo="noche"]{
  --tinta:#EAECF3; --papel:#0C0F1C; --carta:#161B2E;
  --verde:#3D4A85; --verde-claro:#232A45;
  --senal:#E0A33A; --rojo:#E2796B; --ok:#5FC08D;
  --linea:#2A3150; --tenue:#8D96AF;
  --c-vender:#3D4A85;  --f-vender:#232A45;
  --c-cambio:#E0A33A;  --f-cambio:#2E2617;
  --c-listo:#5FC08D;   --f-listo:#16301F;
  --c-perdido:#E2796B; --f-perdido:#33201D;
  --c-mover:#5A67A0;   --f-mover:#242B47;
  --c-marcar:#8A7F92;  --f-marcar:#2A2630;
}
/* los fondos palidos que estaban escritos a mano hay que apagarlos aparte */
html[data-estilo="noche"] .aviso{background:#33201D;color:var(--rojo)}
html[data-estilo="noche"] .aviso.bien{background:#16301F;color:var(--ok)}
html[data-estilo="noche"] .aviso.dato{background:#2E2617;color:#E5C07B}
html[data-estilo="noche"] .veredicto.si,
html[data-estilo="noche"] .sello.si,
html[data-estilo="noche"] .pill.si,
html[data-estilo="noche"] .cli.hecho .orden{background:#16301F;color:var(--ok)}
html[data-estilo="noche"] .veredicto.no,
html[data-estilo="noche"] .sello.no,
html[data-estilo="noche"] .poco,
html[data-estilo="noche"] .cli.nada .orden{background:#33201D;color:var(--rojo)}
html[data-estilo="noche"] .medalla.o1{background:#2E2617;color:#E5C07B}
html[data-estilo="noche"] pre{background:#080B14;color:#C9D3E8}
html[data-estilo="noche"] #pant-admin table.lista tbody tr:nth-child(even) td{background:#1B2136}
/* lo que iba con fondo tinta y letra blanca: ahora la tinta es clara */
html[data-estilo="noche"] .pestana[aria-pressed=true],
html[data-estilo="noche"] .s-libre[aria-pressed=true],
html[data-estilo="noche"] .vistas button[aria-pressed=true],
html[data-estilo="noche"] .crono button,
html[data-estilo="noche"] #pant-admin .pestana[aria-pressed=true],
html[data-estilo="noche"] #pant-admin .vistas button[aria-pressed=true]{color:#0C0F1C}
html[data-estilo="noche"] .crono{color:#0C0F1C}
html[data-estilo="noche"] #pant-admin header{background:#080B14;border-bottom-color:#232A44}
html[data-estilo="noche"] .lin-ctrl button:active{color:#0C0F1C}
/* la hoja impresa no se pinta de oscuro nunca */
@media print{ html[data-estilo="noche"] body{background:#fff;color:#000} }

/* la fila de estilos dentro de la hoja de la cuenta */
.estilos-fila{display:flex;gap:8px;margin-top:8px}
.estilo-op{flex:1;padding:11px 6px;border-radius:12px;border:1.5px solid var(--linea);
  background:var(--carta);color:var(--tinta);font:inherit;font-size:13px;font-weight:700;
  display:flex;flex-direction:column;align-items:center;gap:6px}
.estilo-op .muestra{width:100%;height:18px;border-radius:6px;border:1px solid rgba(128,128,128,.35)}
.estilo-op[aria-pressed=true]{border-color:var(--verde);border-width:2px;
  box-shadow:0 0 0 3px var(--verde-claro)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{touch-action:manipulation;-webkit-text-size-adjust:100%;
  overscroll-behavior:none;overscroll-behavior-y:contain}
body{overscroll-behavior:none;overscroll-behavior-y:contain;
  -webkit-user-select:none;user-select:none}
/* dentro del mapa manda Leaflet: nada de recargar ni rebotar */
.mapa-caja,#mapa{overscroll-behavior:none;touch-action:none}
#pant-ruta.lleno{overflow:hidden}
input,textarea,select,#impresion{-webkit-user-select:text;user-select:text}
/* el mapa sí maneja sus propios gestos */
#mapa,#mapa *{touch-action:auto}
/* Candado contra el desborde horizontal. Basta con que UN elemento sea
   mas ancho que la pantalla para que el cuerpo entero se estire y todo
   se vea cortado por la derecha, hasta los parrafos. Esto lo impide de
   raiz, y ademas cada contenedor se queda dentro de su ancho. */
/* OJO: aqui NO va overflow-x:hidden. Puesto en html o en body, Android
   se enreda con cual es el contenedor que hace scroll y la pantalla se
   queda clavada: no sube ni baja. El candado va por dentro. */
html,body{margin:0;padding:0}
.pantalla,main,#admin-cuerpo,#dia-cuerpo,#ruta-cuerpo,#ofi-cuerpo{
  max-width:100%;min-width:0;overflow-x:clip}
.pasos,.meta,.kpi,.lin,.cuota-fila,.fila-eq{max-width:100%;min-width:0;
  overflow-wrap:anywhere}
/* Las pestañas de tres o mas: que se puedan correr con el dedo en vez
   de empujar la pantalla. */
.vistas{overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none}
.vistas::-webkit-scrollbar{display:none}
.vistas button{flex:1 0 auto;white-space:nowrap}
body{
  background:var(--papel); color:var(--tinta);
  font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  font-size:16px; line-height:1.4;
  padding-bottom:env(safe-area-inset-bottom);
}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
.num{font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.eyebrow{font-size:11px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:var(--tenue)}
.oculto{display:none !important}

/* ---------- pantallas base ---------- */
.pantalla{min-height:100dvh;display:flex;flex-direction:column}
.centro{align-items:center;justify-content:center;padding:24px}
.tarjeta-centro{width:100%;max-width:400px;background:var(--carta);border-radius:var(--r);padding:24px;box-shadow:0 1px 3px rgba(20,32,28,.08)}

.marca{display:flex;align-items:center;gap:9px}
.marca img{height:30px;width:auto;display:block}
.marca b{font-size:21px;font-weight:800;letter-spacing:-.02em}
.marca span{font-size:11px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:var(--tenue)}
.marca-caja{background:var(--verde);border-radius:12px;padding:9px 13px;display:inline-flex}
.marca-caja img{height:26px}
/* Cuando no hay logo, el nombre de la empresa hace de logo.
   `color:inherit` es lo que lo salva: la barra lateral es navy y el
   ticket es papel blanco. Con un color fijo, en uno de los dos el
   nombre desaparece --y desaparece EN SILENCIO, que es lo peor. */
.marca-txt{font-size:17px;font-weight:900;letter-spacing:.04em;
  line-height:26px;color:inherit;white-space:nowrap}
.marca-caja .marca-txt{color:#fff}
#arranque{position:fixed;inset:0;z-index:5000;background:#1D2340;display:flex;
  flex-direction:column;align-items:center;justify-content:center;gap:26px;
  transition:opacity .4s ease}
#arranque.fuera{opacity:0;pointer-events:none}
#arranque .palabra{color:#fff;font-size:38px;font-weight:800;letter-spacing:-.03em;
  animation:entra .5s ease both}
#arranque .palabra i{font-style:normal;color:var(--senal)}
#arranque .cargando{width:30px;height:30px;border-radius:50%;
  border:3px solid rgba(255,255,255,.22);border-top-color:#fff;animation:gira .8s linear infinite}
@keyframes entra{from{opacity:0;transform:translateY(9px)}to{opacity:1;transform:none}}
@keyframes gira{to{transform:rotate(360deg)}}
.marca-sub{display:inline-flex;align-items:center;gap:8px;margin-left:9px;
  padding-left:10px;border-left:1.5px solid var(--linea)}
.marca-sub b{font-size:15px;font-weight:800;letter-spacing:-.02em;color:var(--verde);
  font-family:ui-sans-serif,system-ui,sans-serif}
.marca-sub b i{font-style:normal;color:var(--senal)}
.marca-caja .marca-sub{border-left-color:rgba(255,255,255,.28)}
.marca-caja .marca-sub b{color:#fff}
.marca-caja .marca-sub b i{color:var(--senal)}

label.campo{display:block;margin:14px 0 0}
label.campo>span{display:block;font-size:12px;font-weight:700;color:var(--tenue);margin-bottom:4px}
input[type=text],input[type=email],input[type=password],input[type=number],select,textarea{
  width:100%;padding:12px;border:1.5px solid var(--linea);border-radius:10px;background:var(--carta)}
input:focus,select:focus,textarea:focus{outline:2px solid var(--verde);outline-offset:1px;border-color:var(--verde)}
.btn{display:block;width:100%;padding:14px;border-radius:12px;font-weight:700;text-align:center;
  color:#fff;background:linear-gradient(135deg,#242C52 0%,var(--verde) 60%);
  box-shadow:0 2px 10px rgba(29,35,64,.22);transition:transform .12s ease}
.btn:active{transform:scale(.985)}
.btn:disabled{opacity:.5}
.btn.secundario{background:var(--verde-claro);color:var(--verde)}
.btn.linea{background:none;border:1.5px solid var(--linea);color:var(--tinta)}
.btn.peligro{background:var(--rojo)}
.btn.chico{width:auto;padding:9px 14px;font-size:14px}
.aviso{margin-top:14px;padding:11px 12px;border-radius:10px;font-size:14px;background:#FBEDE9;color:var(--rojo)}
.aviso.bien{background:#E7F3EC;color:var(--ok)}
.aviso.dato{background:#FDF3D9;color:#7A5B00}

/* ---------- encabezado ---------- */
header{position:sticky;top:0;z-index:20;background:var(--papel);border-bottom:1px solid var(--linea);
  padding:calc(10px + env(safe-area-inset-top)) 14px 0}
.fila-top{display:flex;align-items:center;justify-content:space-between;gap:10px}
.chip-usuario{font-size:12px;font-weight:700;color:var(--tenue);background:var(--carta);border:1px solid var(--linea);
  border-radius:999px;padding:6px 11px;max-width:52vw;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.buscador{position:relative;margin:10px 0}
.buscador input{padding-left:38px;padding-right:38px;border-radius:999px;font-size:16px}
.buscador .lupa{position:absolute;left:14px;top:50%;transform:translateY(-50%);color:var(--tenue)}
.buscador .limpiar{position:absolute;right:8px;top:50%;transform:translateY(-50%);padding:6px 10px;color:var(--tenue);font-size:18px}
.cats{display:flex;gap:7px;overflow-x:auto;padding:0 0 10px;scrollbar-width:none}
.cats::-webkit-scrollbar{display:none}
.cat{flex:0 0 auto;padding:8px 13px;border-radius:999px;border:1.5px solid var(--linea);background:var(--carta);
  font-size:13px;font-weight:700;white-space:nowrap}
.cat[aria-pressed=true]{background:var(--verde);border-color:var(--verde);color:#fff}

/* ---------- lista ---------- */
main{flex:1;padding:12px 14px 150px}
.conteo{font-size:12px;color:var(--tenue);margin:2px 0 10px}
.item{width:100%;text-align:left;background:var(--carta);border:1px solid var(--linea);border-radius:var(--r);
  padding:14px;margin-bottom:8px;display:flex;gap:12px;align-items:center;justify-content:space-between}
.item:active{background:var(--verde-claro)}
.item .izq{min-width:0}
.item h3{margin:0;font-size:16px;font-weight:600;line-height:1.25}
.item .cod{font-size:11px;font-weight:700;letter-spacing:.06em;color:var(--tenue);margin-top:3px}
.item .der{text-align:right;flex:0 0 auto}
.p-normal{font-size:23px;font-weight:800;letter-spacing:-.03em;line-height:1.1}
.p-min{font-size:12px;font-weight:700;color:var(--verde);margin-top:2px;white-space:nowrap}
.marca-prov{display:inline-block;margin-left:6px;font-size:10px;font-weight:800;letter-spacing:.06em;
  background:#FDF3D9;color:#7A5B00;border-radius:5px;padding:2px 6px;vertical-align:2px}
.vacio{text-align:center;padding:50px 20px;color:var(--tenue)}

/* ---------- regla de precio (elemento distintivo) ---------- */
.regla{margin:16px 0 6px}
.regla-barra{position:relative;height:12px;border-radius:6px;overflow:hidden;
  background:linear-gradient(90deg,#F3DEDE 0%,#F7EBD4 46%,#E3EFE8 100%)}
.regla-piso{position:absolute;top:-3px;bottom:-3px;width:3px;background:var(--senal);border-radius:2px}
.regla-marca{position:absolute;top:-6px;width:12px;height:24px;margin-left:-6px;border-radius:6px;
  background:var(--tinta);box-shadow:0 0 0 3px var(--carta);transition:left .12s ease}
.regla-pies{display:flex;justify-content:space-between;font-size:11px;font-weight:700;color:var(--tenue);margin-top:9px}

/* ---------- hoja del producto ---------- */
.fondo{position:fixed;inset:0;background:rgba(20,32,28,.45);z-index:1400;opacity:0;pointer-events:none;transition:opacity .18s}
.fondo.abierto{opacity:1;pointer-events:auto}
.hoja{position:fixed;left:0;right:0;bottom:0;z-index:1500;background:var(--carta);
  border-radius:20px 20px 0 0;padding:8px 18px calc(22px + env(safe-area-inset-bottom));
  max-height:92dvh;overflow-y:auto;transform:translateY(101%);transition:transform .22s ease}
.hoja.abierta{transform:none}
.agarradera{width:42px;height:4px;border-radius:2px;background:var(--linea);margin:6px auto 14px}
.hoja h2{margin:4px 0 0;font-size:19px;font-weight:800;letter-spacing:-.02em;line-height:1.2}
.dato-grande{font-size:34px;font-weight:800;letter-spacing:-.035em}
.rejilla{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:14px 0}
.caja{background:var(--papel);border-radius:11px;padding:11px 12px}
.caja b{display:block;font-size:19px;font-weight:800;letter-spacing:-.02em;margin-top:2px}
.oferta{display:flex;align-items:center;gap:9px;margin-top:6px}
.oferta input{font-size:22px;font-weight:800;text-align:center}
.veredicto{margin-top:12px;padding:13px;border-radius:11px;font-weight:700;text-align:center}
.veredicto.si{background:#E7F3EC;color:var(--ok)}
.veredicto.no{background:#FBEDE9;color:var(--rojo)}
.veredicto small{display:block;font-weight:600;font-size:13px;opacity:.85;margin-top:3px}
.secreto{margin-top:16px;padding-top:14px;border-top:1px dashed var(--linea)}

/* ---------- administración ---------- */
.pestanas{display:flex;gap:6px;overflow-x:auto;padding:0 0 10px;scrollbar-width:none}
.pestanas::-webkit-scrollbar{display:none}
.pestana{flex:0 0 auto;padding:9px 14px;border-radius:999px;font-size:13px;font-weight:700;background:var(--carta);border:1.5px solid var(--linea)}
.pestana[aria-pressed=true]{background:var(--tinta);border-color:var(--tinta);color:#fff}
.fila{display:flex;gap:9px;align-items:center;margin:9px 0}
.fila .btn{width:auto;flex:1}
table.lista{width:100%;max-width:100%;table-layout:fixed;border-collapse:collapse;font-size:13px}
table.lista th{text-align:left;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--tenue);padding:7px 4px;border-bottom:1px solid var(--linea)}
table.lista td{padding:9px 4px;border-bottom:1px solid var(--linea);vertical-align:top;
  overflow-wrap:anywhere;word-break:break-word}
table.lista tr td:last-child{text-align:right;white-space:normal;padding-right:0}
/* la columna del boton no se estira: el resto se reparte lo que sobra */
table.lista th:last-child,table.lista td:last-child{width:76px}
table.lista .btn.chico{width:100%;padding:8px 4px;font-size:12px;white-space:normal;line-height:1.2}
.pasos{background:var(--carta);border:1px solid var(--linea);border-radius:var(--r);padding:16px 18px;margin-top:12px}
.pasos ol{margin:8px 0 0;padding-left:20px}
.pasos li{margin-bottom:9px;font-size:14px}
code{background:var(--papel);border-radius:5px;padding:2px 6px;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:13px;word-break:break-all}
pre{background:var(--tinta);color:#DCE6E1;border-radius:11px;padding:14px;overflow-x:auto;font-size:12px;line-height:1.5}

/* ---------- navegacion inferior ---------- */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:30;display:flex;background:var(--carta);
  border-top:1px solid var(--linea);padding-bottom:env(safe-area-inset-bottom)}
.nav button{flex:1;padding:9px 4px 10px;display:flex;flex-direction:column;align-items:center;gap:3px;
  font-size:11px;font-weight:700;color:var(--tenue)}
.nav button b{font-size:19px;line-height:1;font-weight:400}
.nav button[aria-pressed=true]{color:var(--verde)}
/* ---- El globito rojo de avisos sin ver ---- */
.nav button{position:relative}
.globo{position:absolute;top:3px;left:50%;margin-left:3px;min-width:18px;height:18px;
  border-radius:999px;background:var(--rojo,#C0392B);color:#fff;font-size:11px;font-weight:800;
  line-height:18px;text-align:center;padding:0 5px;box-shadow:0 1px 4px rgba(0,0,0,.35)}
.globo.oculto{display:none}
/* la fila de un aviso en la bandeja */
.aviso-fila{display:flex;gap:11px;align-items:flex-start;padding:11px 0;
  border-bottom:1px solid var(--linea)}
.aviso-fila:last-child{border-bottom:0}
.aviso-fila .ico{flex:0 0 auto;width:32px;height:32px;border-radius:10px;display:flex;
  align-items:center;justify-content:center;font-size:15px;background:var(--papel)}
.aviso-fila.nuevo .ico{background:var(--rojo,#C0392B);color:#fff}
.aviso-fila .qu{flex:1;min-width:0}
.aviso-fila .qu b{display:block;font-size:14px;font-weight:800;letter-spacing:-.01em}
.aviso-fila .qu small{display:block;font-size:11.5px;color:var(--tenue);font-weight:700;
  overflow-wrap:anywhere}
/* ---- El desplegable de datos fiscales ---- */
.plega{margin-top:14px;border:1px solid var(--linea);border-radius:var(--r);overflow:hidden}
.plega>summary{padding:13px 15px;font-size:14px;font-weight:800;cursor:pointer;
  list-style:none;display:flex;align-items:center;justify-content:space-between;gap:8px}
.plega>summary::-webkit-details-marker{display:none}
.plega>summary::after{content:"\25be";font-size:13px;color:var(--tenue)}
.plega[open]>summary::after{content:"\25b4"}
.plega>summary .marca-f{font-size:11px;font-weight:800;letter-spacing:.04em;
  text-transform:uppercase;color:var(--tenue)}
.plega .adentro{padding:0 15px 15px}
.nav button b{transition:background .18s ease,color .18s ease;
  width:44px;height:26px;display:flex;align-items:center;justify-content:center;border-radius:999px}
.nav button[aria-pressed=true] b{background:var(--verde);color:var(--senal)}
.nav button[aria-pressed=true] b{transform:translateY(-1px)}

/* ---------- ruta del dia ---------- */
.meta{background:var(--carta);border:1px solid var(--linea);border-radius:var(--r);padding:14px;margin-bottom:10px}
.meta-cifras{display:flex;justify-content:space-between;align-items:flex-end;gap:8px}
.meta-cifras b{font-size:27px;font-weight:800;letter-spacing:-.03em;display:block}
.barra{height:9px;border-radius:5px;background:var(--verde-claro);overflow:hidden;margin-top:11px}
.barra i{display:block;height:100%;border-radius:5px;transition:width .35s ease;
  background:linear-gradient(90deg,var(--verde),#3E4874)}
.tarjeta-cli{background:var(--carta);border:1px solid var(--linea);border-radius:var(--r);
  padding:13px 14px;margin-bottom:9px}
.tarjeta-cli .arriba{display:flex;gap:12px;align-items:flex-start}
.tarjeta-cli .datos{flex:1;min-width:0}
.tarjeta-cli h3{margin:0;font-size:16px;font-weight:700;line-height:1.25}
.tarjeta-cli .cod{font-size:12px;font-weight:700;color:var(--tenue);margin-top:2px}
.tarjeta-cli .renglon{display:flex;flex-wrap:wrap;gap:9px;align-items:center;margin-top:6px}
.tarjeta-cli .dir{font-size:13px;color:var(--tenue);margin-top:7px;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
/* La cabecera del preventa: un solo bloque, sin filas de botones repetidas. */
.filtros-cli{display:flex;gap:7px;overflow-x:auto;padding:2px 0 9px;-webkit-overflow-scrolling:touch}
.filtros-cli button{flex:0 0 auto;padding:7px 13px;border-radius:999px;font-size:12.5px;font-weight:800;
  background:var(--carta);border:1px solid var(--linea);color:var(--tenue)}
.filtros-cli button[aria-pressed="true"]{background:var(--verde);border-color:var(--verde);color:#fff}
.mini-foto{width:52px;height:52px;border-radius:12px;object-fit:cover;flex:0 0 auto;
  border:1px solid var(--linea);background:var(--papel)}
.mini-foto.vacia{display:flex;align-items:center;justify-content:center;color:var(--tenue);font-size:19px}
/* La tarjeta entera abre al cliente; abajo queda UNA sola accion. */
.tarjeta-cli{position:relative}
.tarjeta-cli.toca{cursor:pointer}
.tarjeta-cli.toca:active{background:var(--verde-claro)}
.tarjeta-cli.es-sig{border-color:var(--verde);box-shadow:0 0 0 2px var(--verde-claro)}
.tarjeta-cli .sig-cinta{position:absolute;top:-1px;right:12px;background:var(--verde);color:#fff;
  font-size:10px;font-weight:800;letter-spacing:.06em;padding:3px 9px;border-radius:0 0 8px 8px}
/* Cómo llegar: se abre el navegador del telefono con el punto del negocio. */
.tarjeta-cli .pie .como{color:var(--verde);background:var(--verde-claro);flex:0 0 auto}
.tarjeta-cli .pie{display:flex;gap:8px;justify-content:flex-end;margin-top:11px}
.tarjeta-cli .pie button{padding:9px 16px;border-radius:9px;font-size:13px;font-weight:800}
.tarjeta-cli .pie .mas{color:var(--verde);background:var(--verde-claro)}
.tarjeta-cli .pie .ir{color:#fff;background:var(--verde);box-shadow:0 2px 8px rgba(29,35,64,.3)}
.cli{width:100%;text-align:left;background:var(--carta);border:1px solid var(--linea);border-radius:var(--r);
  padding:13px 14px;margin-bottom:8px;display:flex;gap:11px;align-items:center}
.cli:active{background:var(--verde-claro)}
.cli .orden{flex:0 0 30px;height:30px;border-radius:50%;background:var(--papel);display:flex;align-items:center;
  justify-content:center;font-size:12px;font-weight:800;color:var(--tenue)}
.cli .med{flex:1;min-width:0}
.cli h3{margin:0;font-size:16px;font-weight:600;line-height:1.25}
.cli .sub{font-size:11px;font-weight:700;letter-spacing:.05em;color:var(--tenue);margin-top:3px;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cli.hecho{opacity:.62}
.cli.hecho .orden{background:#E7F3EC;color:var(--ok)}
.cli.nada .orden{background:#FBEDE9;color:var(--rojo)}
.sello{flex:0 0 auto;font-size:11px;font-weight:800;border-radius:6px;padding:3px 7px}
.sello.si{background:#E7F3EC;color:var(--ok)}
.sello.no{background:#FBEDE9;color:var(--rojo)}

/* ---------- barra del pedido en curso ---------- */
.carro{position:fixed;left:10px;right:10px;bottom:calc(58px + env(safe-area-inset-bottom));z-index:38;
  background:var(--verde);color:#fff;border-radius:13px;padding:12px 15px;display:flex;align-items:center;
  justify-content:space-between;gap:10px;box-shadow:0 5px 18px rgba(20,32,28,.28)}
.carro .izq{min-width:0}
.carro .eyebrow{color:#B9C0D6}
.carro b{font-size:19px;font-weight:800;letter-spacing:-.02em}
.carro button{background:#fff;color:var(--verde);border-radius:9px;padding:9px 13px;font-size:14px;font-weight:800;flex:0 0 auto}
.aviso-cliente{background:var(--verde-claro);color:var(--verde);border-radius:10px;padding:9px 12px;
  font-size:13px;font-weight:700;margin:0 0 10px;display:flex;justify-content:space-between;gap:9px;align-items:center}
.aviso-cliente button{font-size:12px;font-weight:800;color:var(--rojo);flex:0 0 auto}

/* ---------- cantidad ---------- */
.pie-hoja{position:sticky;bottom:0;background:var(--carta);padding:12px 0 4px;margin-top:14px;
  border-top:1px solid var(--linea);display:flex;gap:9px}
.pie-hoja .btn{margin:0}
.tope{font-size:11px;font-weight:800;color:var(--tenue);text-align:center;margin-top:5px}
.tope b{color:var(--verde)}
.stepper{display:flex;align-items:center;gap:9px;margin-top:6px}
.stepper button{width:46px;height:46px;border-radius:11px;background:var(--verde-claro);color:var(--verde);
  font-size:23px;font-weight:800;flex:0 0 auto}
.stepper input{text-align:center;font-size:22px;font-weight:800;height:46px}
.lin{display:flex;justify-content:space-between;gap:10px;padding:11px 0;border-bottom:1px solid var(--linea);align-items:flex-start}
.lin .n{font-size:15px;font-weight:600;line-height:1.25}
.lin .d{font-size:12px;color:var(--tenue);margin-top:2px}
.lin .t{text-align:right;flex:0 0 auto}
.lin .t b{font-size:16px;font-weight:800}
.lin .quitar{color:var(--rojo);font-size:12px;font-weight:800;margin-top:3px}
.lin-ctrl{display:flex;align-items:center;gap:6px;margin-top:7px;flex-wrap:wrap}
.lin-ctrl button{width:34px;height:34px;border-radius:9px;background:var(--verde-claro);
  color:var(--verde);font-size:19px;font-weight:800;flex:0 0 auto}
.lin-ctrl button:active{background:var(--verde);color:#fff}
.lin-ctrl input{width:52px;height:34px;text-align:center;font-size:15px;font-weight:800;padding:0;border-radius:9px}
.lin-ctrl .por{color:var(--tenue);font-weight:700;font-size:13px;padding:0 2px}
.lin-ctrl .pre{width:70px}
.lin-ctrl .tope-min{font-size:10px;font-weight:800;color:var(--tenue);width:100%}
.retrato{position:relative;margin:-8px -18px 0;height:150px;background:var(--verde-claro);
  display:flex;align-items:center;justify-content:center;overflow:hidden}
.retrato img{width:100%;height:100%;object-fit:cover;display:block}
.retrato .sin{color:var(--tenue);font-size:13px;font-weight:700}
.retrato label{position:absolute;left:0;right:0;bottom:0;background:rgba(19,24,38,.72);color:#fff;
  font-size:12px;font-weight:700;padding:9px 12px;text-align:center;letter-spacing:.03em}
.cabeza-cli{display:flex;align-items:flex-start;gap:12px;margin-top:14px}
.cabeza-cli .izq{flex:1;min-width:0}
.lejos{font-size:12px;font-weight:800;color:var(--ok);margin-top:4px;display:flex;align-items:center;gap:5px}
.lejos.gris{color:var(--tenue)}
.estado-cli{display:inline-flex;align-items:center;gap:6px;font-size:11px;font-weight:800;
  border-radius:6px;padding:4px 8px;margin-top:6px}
.estado-cli.prog{background:var(--f-cambio);color:var(--c-cambio)}
.estado-cli.hecho{background:var(--f-listo);color:var(--c-listo)}
.estado-cli.libre{background:var(--papel);color:var(--tenue)}
.acciones{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:16px}
.acciones button,.acciones a{background:var(--papel);border-radius:14px;padding:12px 4px;
  display:flex;flex-direction:column;align-items:center;gap:7px;font-size:10px;font-weight:800;
  letter-spacing:.03em;color:var(--tinta);text-transform:uppercase;text-decoration:none;
  transition:transform .12s ease}
.acciones button b,.acciones a b{font-size:19px;font-weight:400;line-height:1;width:38px;height:38px;
  border-radius:12px;display:flex;align-items:center;justify-content:center}
.acciones button:active,.acciones a:active{transform:scale(.94)}
.acciones .vender b{background:var(--f-vender);color:var(--c-vender)}
.acciones .listo  b{background:var(--f-listo);color:var(--c-listo)}
.acciones .cambio b{background:var(--f-cambio);color:var(--c-cambio)}
.acciones .perdido b{background:var(--f-perdido);color:var(--c-perdido)}
.acciones .mover  b{background:var(--f-mover);color:var(--c-mover)}
.acciones .marcar b{background:var(--f-marcar);color:var(--c-marcar)}
.acc-ped{display:flex;gap:8px;margin-top:8px}
.acc-ped button{padding:7px 13px;border-radius:9px;font-size:12px;font-weight:800}
.acc-ped .editar{background:var(--f-cambio);color:var(--c-cambio)}
.acc-ped .imprimir{background:var(--verde-claro);color:var(--verde)}
.acc-ped .rep-ver{background:var(--papel);color:var(--tinta)}
.acc-ped button:active{transform:scale(.95)}
.cuotas{background:var(--papel);border-radius:12px;padding:11px 12px}
.cuota-fila{display:flex;align-items:center;gap:9px;margin-top:8px}
.cuota-fila .quien{flex:1;min-width:0;font-size:13px;font-weight:700;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cuota-fila input{width:62px;height:34px;text-align:center;font-size:14px;font-weight:800;padding:0}
.cuota-fila .hizo{font-size:11px;font-weight:800;color:var(--tenue);width:66px;text-align:right}
.razones{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:14px}
.razones button{background:var(--papel);border:1.5px solid var(--linea);border-radius:11px;padding:15px 10px;
  font-size:14px;font-weight:700}
.razones button:active{background:var(--verde-claro);border-color:var(--verde)}
.s-libre[aria-pressed=true]{background:var(--tinta);border-color:var(--tinta);color:#fff}
.s-libre[aria-pressed=true]::after{content:" \2713"}
.mapa-caja{position:relative;z-index:0;isolation:isolate;border-radius:var(--r);
  overflow:hidden;border:1px solid var(--linea)}
/* ---- El mapa girando con la brujula ----
   ESTO ES LO QUE FALTABA. El javascript siempre puso el angulo en --giro,
   pero no habia ninguna regla que lo leyera: el numero se calculaba y se
   iba a la basura. La aguja si giraba porque usa otra variable (--rumbo),
   que si tiene su regla mas abajo. Por eso una si y el otro no.

   El mapa se agranda a 150% y se corre un 25% hacia arriba y hacia la
   izquierda: al girar un cuadro sobre su centro las esquinas se salen, y
   sin este colchon se verian franjas blancas en las orillas.

   Los botones y la mira NO se giran: son hermanos de #mapa, no hijos. */
/* Sin transition: el suavizado lo hace el javascript cuadro por cuadro.
   Las dos cosas juntas se sienten pastosas y el mapa llega tarde. */
.mapa-caja.torcido #mapa,
.mapa-caja.girando #mapa{
  transform-origin:50% 50%;
  transform:rotate(var(--giro,0deg));
  will-change:transform}
/* El pin ya viene torcido -45 grados (es la gota). Se le resta el giro del
   mapa para que la gota siga apuntando al suelo. El numero de adentro se
   queda en +45 y sale derecho solo: -45 - giro + 45 + giro = 0. */
.mapa-caja.torcido .pin,
.mapa-caja.girando .pin{transform:rotate(calc(-45deg - var(--giro,0deg)))}
/* Las etiquetas de Leaflet tambien se enderezan, o quedan de cabeza. */
.mapa-caja.torcido .leaflet-tooltip,
.mapa-caja.girando .leaflet-tooltip{transform:rotate(calc(-1 * var(--giro,0deg)))}
.fabs{position:absolute;right:10px;bottom:12px;z-index:900;display:flex;flex-direction:column;
  align-items:flex-end;gap:8px}
.fab{background:var(--verde);color:#fff;border-radius:14px;padding:12px 15px;font-size:14px;
  font-weight:800;box-shadow:0 5px 16px rgba(29,35,64,.45)}
.fab.alt{background:var(--carta);color:var(--tinta);padding:10px 13px;font-size:19px;font-weight:400}
.fab[aria-pressed=true]{background:var(--senal);color:var(--tinta)}
/* Mapa torcido con la mano: aro dorado, NO relleno dorado. El relleno
   quiere decir "la brujula esta corriendo" y son cosas distintas. */
.fab.torcida{box-shadow:0 0 0 2.5px var(--senal), 0 3px 10px rgba(12,16,30,.3)}
.fab:active{transform:scale(.96)}
/* ===== El acomodo del mapa, copiado de Handy =====================
   Solo la forma: ni un boton se quita, ni una funcion cambia. Los
   vendedores vienen de Handy y la memoria de donde esta cada cosa es
   lo que se respeta. Salido de las capturas del 31-08-2026. */

/* Los botones de la derecha son circulos blancos separados, con el
   dibujo en color, no cuadrados pegados. */
.cap-fabs{gap:12px}
.fab.alt{width:52px;height:52px;padding:0;border-radius:50%;
  display:flex;align-items:center;justify-content:center;
  background:var(--carta);color:var(--verde);font-size:21px;font-weight:400;
  box-shadow:0 2px 8px rgba(20,32,28,.28)}
.fab.alt[aria-pressed=true]{background:var(--verde);color:#fff}
.fabs-mas{gap:12px}
/* "Cliente aqui" se queda ancho: no es de los redondos, es la accion. */
.cap-fabs .fab:not(.alt){border-radius:999px;padding:13px 18px}

/* La barra de buscar: mas alta y bien redonda, la lupa en gris. */
.buscar-flot{padding:14px 18px;box-shadow:0 2px 10px rgba(20,32,28,.2)}
.buscar-flot .lupa{font-size:19px}
.buscar-flot input{font-size:15.5px}

/* El pie: la fecha centrada entre flechas, en el azul de la casa. */
.cap-pie{border-top:0;box-shadow:0 -2px 12px rgba(12,16,30,.12);padding:12px 12px 10px}
.cap-pie .dia{font-size:15px;margin-bottom:10px}
.cap-pie .dia .flecha{font-size:19px;font-weight:800;color:var(--verde);padding:0 6px}

/* La cabecera de cada familia en el catalogo: fondo gris, nombre a la
   izquierda y cuantos trae a la derecha. Salido de la captura de Handy. */
/* ===== El pie, del alto que lo trae Handy =========================
   El de ellos son dos renglones y ya: la fecha y las tres fichas. El
   nuestro venia con mas aire y con la tarjeta del que sigue completa,
   y entre los tres se comian media pantalla de mapa. Se aprieta todo
   sin quitar nada: la tarjeta del que sigue queda de un solo renglon,
   que es lo que el vendedor lee de reojo. */
.cap-pie{padding:8px 12px 8px}
.cap-pie .agarradera{margin:0 auto 6px}
.cap-pie .dia{font-size:13.5px;margin-bottom:7px;gap:6px}
.cap-pie .dia .flecha{font-size:17px;padding:0 4px}
.cap-pie .dia .plata{font-size:12px;padding:2px 8px}
.pills{gap:6px}
.pill.filtro{padding:7px 10px;font-size:11.5px}
.pill.filtro b.num{padding:1px 8px;font-size:12px;min-width:24px}
.cap-pie .siguiente{padding:7px 10px;margin:7px 0 0;border-radius:11px;border-width:1px}
.cap-pie .siguiente .no{width:22px;height:22px;border-radius:7px;font-size:11px}
.cap-pie .siguiente .qui b{font-size:13px}
.cap-pie .siguiente .qui small{font-size:10.5px}

.cat-cab{display:flex;align-items:center;gap:10px;width:100%;text-align:left;
  background:var(--verde-claro);border-bottom:1px solid var(--linea);
  padding:13px 14px;font-size:14px;font-weight:800;color:var(--tinta);
  letter-spacing:.01em;text-transform:uppercase}
.cat-cab .flecha{color:var(--tenue);font-size:15px;width:12px}
.cat-cab .nom{flex:1;min-width:0}
.cat-cab b.num{font-size:15px;font-weight:800;color:var(--tinta)}
.cat-cab:active{background:var(--linea)}

/* Las pestañas y la tira de iconos del reparto, al estilo de Handy */
.lt-tabs{display:flex;overflow-x:auto;scrollbar-width:none;border-bottom:1px solid var(--linea);margin:0 0 0}
.lt-tabs::-webkit-scrollbar{display:none}
.lt-tabs button{flex:0 0 auto;padding:13px 14px;font-size:12px;font-weight:700;
  color:var(--tenue);letter-spacing:.03em;border-bottom:3px solid transparent}
.lt-tabs button[aria-pressed=true]{color:var(--verde);border-bottom-color:var(--ok)}
.lt-iconos{display:flex;border-bottom:1px solid var(--linea);margin:0 0 8px}
.lt-iconos button{flex:1;padding:11px 4px;font-size:19px;color:var(--verde);border-bottom:3px solid transparent}
.lt-iconos button[aria-pressed=true]{border-bottom-color:var(--ok)}
.lt-tope{text-align:center;padding:14px 12px 12px}
.lt-tope b.num{display:block;font-size:26px;font-weight:800;color:var(--ok);letter-spacing:-.02em}
.lt-tope span{display:block;font-size:13px;color:var(--tenue);font-weight:700;margin-top:3px}
.lt-resumen{display:block;margin:6px auto 0;font-size:13px;font-weight:800;color:var(--verde)}
.lt{position:relative;padding:4px 0 10px 26px}
.lt::before{content:"";position:absolute;left:7px;top:14px;bottom:14px;width:2px;background:var(--verde);opacity:.35}
.lt-fila{position:relative;margin-bottom:18px}
.lt-punto{position:absolute;left:-23px;top:16px;width:11px;height:11px;border-radius:50%;
  background:var(--verde);box-shadow:0 0 0 3px var(--carta)}
.lt-fila.si .lt-punto{background:var(--ok)}
.lt-fila.no .lt-punto{background:var(--rojo)}
.lt-tit{font-size:15px;font-weight:800;color:var(--tinta)}
.lt-cli{font-size:13.5px;color:var(--tinta);margin-top:2px}
.lt-dir{font-size:13px;color:var(--tenue);margin-top:1px}
.lt-plata{font-size:13.5px;color:var(--ok);font-weight:700;margin-top:7px}
.lt-cobro{font-size:13.5px;color:var(--tinta);margin-top:1px}
.lt-modo{font-size:12.5px;color:var(--tenue);margin-top:1px}
.lt-hora{font-size:12.5px;color:var(--tinta);margin-top:5px}
.lt-btn{margin-top:8px;background:var(--verde);color:#fff;border-radius:8px;
  padding:11px 26px;font-size:13.5px;font-weight:800;letter-spacing:.03em}
.lt-btn:active{transform:scale(.97)}

/* La pantalla de entrega, al estilo de Handy */
/* ---- Buscador de pantallas: 23 pantallas detras de dos niveles de menu
   no se encuentran si uno no se las sabe de memoria. Se escribe y se llega. */
.bu-caja{position:relative;margin-top:14px}
.bu-caja input{width:100%;font:inherit;font-size:15px;padding:12px 14px;
  border:1.5px solid var(--linea);border-radius:12px;background:var(--carta);color:var(--tinta)}
.bu-caja input:focus{outline:none;border-color:var(--verde)}
.bu-res{margin-top:8px;background:var(--carta);border:1px solid var(--linea);
  border-radius:12px;overflow:hidden}
.bu-res button{display:block;width:100%;text-align:left;background:none;border:0;
  padding:12px 14px;border-bottom:1px solid var(--linea);font:inherit}
.bu-res button:last-child{border-bottom:0}
.bu-res button:active{background:var(--verde-claro)}
.bu-res b{display:block;font-size:14.5px;font-weight:800;letter-spacing:-.01em;color:var(--tinta)}
.bu-res small{display:block;font-size:12px;color:var(--tenue);font-weight:700;margin-top:2px}
.bu-res .donde{color:var(--c-cambio)}
.bu-nada{padding:14px;text-align:center;font-size:13px;color:var(--tenue);font-weight:700}

/* ---- Zonificador: encerrar clientes en el mapa y mandarlos de un golpe ---- */
.zo-caja{position:relative;border:1px solid var(--linea);border-radius:14px;overflow:hidden;
  margin-top:10px;background:var(--verde-claro)}
#zo-mapa{height:calc(100dvh - 320px);min-height:360px}
/* width/height a la fuerza: un <svg> sin medida propia se queda con la de
   fabrica (300x150) y el inset:0 NO lo estira, porque en un elemento con
   tamano propio ese estiron no aplica. Sin esto el lazo es un rectangulito
   en la esquina, tapado por la cinta, y el dedo le cae siempre al mapa:
   uno toca para encerrar y no pasa nada. (Lo cacho Brayan en la calle.) */
.zo-lazo{position:absolute;inset:0;width:100%;height:100%;display:block;
  z-index:600;pointer-events:none}
.zo-caja.encerrando .zo-lazo{pointer-events:auto;cursor:crosshair;touch-action:none}
.zo-lazo path{fill:rgba(31,122,77,.14);stroke:var(--c-listo);stroke-width:2.4;
  stroke-dasharray:6 5;stroke-linejoin:round;stroke-linecap:round}
.zo-cinta{position:absolute;top:9px;left:9px;right:9px;z-index:650;background:var(--carta);
  border-radius:12px;box-shadow:0 3px 14px rgba(20,32,28,.22);padding:10px 12px;
  display:flex;align-items:center;gap:9px}
.zo-cinta .txt{flex:1;min-width:0}
.zo-cinta .txt b{display:block;font-size:14px;font-weight:800;letter-spacing:-.01em}
.zo-cinta .txt small{display:block;font-size:11.5px;color:var(--tenue);font-weight:700}
.zo-cinta button{flex:0 0 auto;font:inherit;font-size:12.5px;font-weight:800;border:0;
  background:var(--verde-claro);color:var(--verde);padding:8px 12px;border-radius:9px}
.zo-cinta button.on{background:var(--verde);color:#fff}
.zo-cinta .zo-icono{width:36px;padding:0;display:flex;align-items:center;justify-content:center}
.zo-cinta .zo-icono svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:2.2;
  stroke-linecap:round;stroke-linejoin:round}

/* ---- El zonificador a pantalla llena ----
   Encerrar entre dos mil y pico de puntos en un recuadro chico no se puede:
   el dedo no tiene donde moverse. La clase va en el BODY, igual que en el
   mapa de En vivo, y el mapa se va de orilla a orilla.
   z-index por DEBAJO de .fondo (1400) y .hoja (1500): si la app abre un
   aviso encima, se tiene que seguir viendo. */
body.zo-lleno{overflow:hidden}
body.zo-lleno nav,body.zo-lleno .carro{display:none}
body.zo-lleno #pant-admin > header{display:none}
body.zo-lleno #pant-admin > main{padding:0}
body.zo-lleno .zo-caja{position:fixed;inset:0;margin:0;border:0;border-radius:0;z-index:1000}
body.zo-lleno #zo-mapa{height:100%;min-height:0}
body.zo-lleno .zo-cinta{top:calc(9px + env(safe-area-inset-top))}
body.zo-lleno .zo-hoja{padding-bottom:calc(16px + env(safe-area-inset-bottom))}
.zo-hoja{position:absolute;left:0;right:0;bottom:0;z-index:660;background:var(--carta);
  border-radius:18px 18px 0 0;box-shadow:0 -3px 20px rgba(20,32,28,.22);
  /* hasta el 55%: si tapa el mapa, uno pierde de vista lo que encerro */
  padding:13px 15px 16px;max-height:55%;overflow-y:auto;
  transform:translateY(100%);transition:transform .25s ease}
.zo-hoja.abierta{transform:translateY(0)}
.zo-cuenta{font-size:29px;font-weight:800;letter-spacing:-.03em;font-variant-numeric:tabular-nums;
  line-height:1.05}
.zo-cuenta small{display:block;font-size:13px;font-weight:700;color:var(--tenue);margin-top:3px}
@media (prefers-reduced-motion:reduce){.zo-hoja{transition:none}}

/* ---- Portada de oficina: la cuadricula de Handy ----
   Tarjetas blancas TODAS IGUALES, numero grande arriba y el rotulo debajo.
   Sin tarjeta grande de color, sin barra de progreso: en Handy todo pesa lo
   mismo y por eso se lee de un vistazo. El unico color que entra es el del
   numero, y solo cuando dice algo (verde la plata, rojo lo que va mal). */
/* grid-auto-rows en 1fr: TODAS las filas miden lo mismo. Sin esto, la fila
   que lleva "Ver detalles" queda mas alta y la cuadricula se ve despareja. */
/* La tira del dia: tres numeros de corrido en vez de ocho tarjetas.
   En el telefono los tres caben en un renglon; en la computadora de
   oficina se estiran y respiran, sin cambiar de forma. */
.of-tira{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;margin-top:2px;
  background:var(--linea);border:1px solid var(--linea);border-radius:13px;overflow:hidden}
.of-dato{background:var(--carta);padding:11px 12px;text-align:left;border:0;
  font:inherit;color:inherit;min-width:0;display:block}
button.of-dato{cursor:pointer}
button.of-dato:active{background:var(--verde-claro)}
button.of-dato:focus-visible{outline:2px solid var(--senal);outline-offset:-2px}
.of-dato b{display:block;font-size:20px;font-weight:800;letter-spacing:-.03em;
  font-variant-numeric:tabular-nums;line-height:1.15;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.of-dato b.plata{color:var(--c-listo)}
.of-dato b.malo{color:var(--c-perdido)}
.of-dato b.ojo{color:var(--c-cambio)}
.of-dato b.nada{color:var(--tenue)}
.of-dato span{display:block;font-size:11.5px;font-weight:700;color:var(--tenue);
  margin-top:3px;line-height:1.3}
@media (min-width:820px){
  .of-dato{padding:16px 18px}
  .of-dato b{font-size:29px}
  .of-dato span{font-size:13px;margin-top:5px}
}

/* Lo que no se pudo entregar. Solo aparece cuando hay: en cero no es
   noticia, con una es lo primero que oficina tiene que ver. */
.of-alerta{display:flex;align-items:center;justify-content:space-between;gap:10px;
  width:100%;margin-top:8px;padding:11px 13px;border-radius:12px;cursor:pointer;
  background:var(--f-perdido,#F7E9E7);border:1.5px solid var(--c-perdido);
  color:var(--c-perdido);font:inherit;font-size:13.5px;font-weight:800;text-align:left}
.of-alerta span{font-size:12px;font-weight:700;opacity:.85;white-space:nowrap}

/* Clientes y rutas: totales del catalogo, no trabajo del dia. Van de
   renglon tenue para que no se pierdan ni cuesten una tarjeta. */
.of-pie{display:flex;align-items:center;gap:10px;margin-top:8px;padding-left:2px}
.of-pie button{background:none;border:0;padding:2px 0;cursor:pointer;font:inherit;
  font-size:12.5px;font-weight:700;color:var(--tenue);text-decoration:underline;
  text-decoration-color:var(--linea);text-underline-offset:3px}
.of-pie button:hover{color:var(--verde)}
.of-pie button:focus-visible{outline:2px solid var(--senal);outline-offset:2px}
.of-pie i{width:3px;height:3px;border-radius:50%;background:var(--linea);flex:0 0 auto}

/* ---- Seguimiento de entregas: cual salio, cual falta, cual no se pudo ----
   La cinta de color de la izquierda NUNCA dice sola el estado: al lado va
   siempre el rotulo escrito, para quien no distingue colores. */
.seg-filtros{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding:10px 0 2px}
.seg-filtros::-webkit-scrollbar{display:none}
.seg-filtros button{flex:0 0 auto;font:inherit;font-size:13px;font-weight:700;
  border:1.5px solid var(--linea);background:var(--carta);color:var(--tenue);
  padding:7px 14px;border-radius:999px;white-space:nowrap}
.seg-filtros button[aria-pressed=true]{background:var(--verde);border-color:var(--verde);color:#fff}
.seg-ent{background:var(--carta);border:1px solid var(--linea);border-radius:13px;
  padding:12px 14px 12px 13px;margin-top:8px;border-left:3px solid var(--linea)}
.seg-ent.bien{border-left-color:var(--c-listo)}
.seg-ent.ojo{border-left-color:var(--c-cambio)}
.seg-ent.mal{border-left-color:var(--c-perdido)}
.seg-top{display:flex;align-items:baseline;gap:9px}
.seg-est{font-size:10.5px;font-weight:800;letter-spacing:.06em;text-transform:uppercase}
.seg-est.bien{color:var(--c-listo)}
.seg-est.ojo{color:var(--c-cambio)}
.seg-est.mal{color:var(--c-perdido)}
.seg-hora{margin-left:auto;font-size:11.5px;font-weight:800;color:var(--tenue);
  font-variant-numeric:tabular-nums}
.seg-nom{font-size:14.5px;font-weight:800;letter-spacing:-.01em;margin-top:5px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.seg-dir{font-size:12px;color:var(--tenue);font-weight:600;margin-top:2px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.seg-pie{display:flex;align-items:baseline;gap:8px;margin-top:8px;padding-top:8px;
  border-top:1px solid var(--linea)}
.seg-pie small{font-size:11.5px;color:var(--tenue);font-weight:700;flex:1;min-width:0;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.seg-pie b{font-size:14.5px;font-weight:800;font-variant-numeric:tabular-nums}
.seg-motivo{font-size:12px;font-weight:700;color:var(--c-perdido);background:var(--f-perdido);
  border-radius:8px;padding:6px 9px;margin-top:8px}
.seg-vacio{background:var(--carta);border:1px dashed var(--linea);border-radius:13px;
  padding:20px 14px;text-align:center;font-size:13px;color:var(--tenue);font-weight:700;margin-top:8px}
@media (min-width:820px){ .seg-lista{display:grid;grid-template-columns:repeat(2,1fr);gap:0 12px} }

/* ---- Tablero de oficina: familiar como Handy, en navy y dorado ----
   La tira de fechas arriba y la cuadricula de fichas son el gesto que la
   gente ya reconoce. Los colores de ESTADO (bien/ojo/mal) pasaron las seis
   pruebas del validador de paletas, daltonismo incluido, y NUNCA van solos:
   siempre llevan su rotulo al lado. */
.t-tira{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding:2px 0 10px}
.t-tira::-webkit-scrollbar{display:none}
.t-tira button{flex:0 0 auto;font:inherit;font-size:13px;font-weight:700;
  border:1.5px solid var(--linea);background:var(--carta);color:var(--tenue);
  padding:7px 15px;border-radius:999px;white-space:nowrap}
.t-tira button[aria-pressed=true]{background:var(--verde);border-color:var(--verde);color:#fff}
.t-titular{background:var(--verde);color:#fff;border-radius:var(--r);padding:16px 18px}
.t-titular .eyebrow{color:#AEB6D2}
.t-titular b{display:block;font-size:36px;font-weight:800;letter-spacing:-.03em;
  font-variant-numeric:tabular-nums;line-height:1.05;margin-top:5px}
.t-titular .sub{font-size:13px;color:#C3C9E0;margin-top:7px;font-weight:600;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.t-titular .sub i{font-style:normal;color:#fff;font-weight:800}
.t-rejilla{display:grid;grid-template-columns:repeat(2,1fr);gap:9px;margin-top:9px}
.t-kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.t-kpc{background:var(--carta);border:1px solid var(--linea);border-radius:13px;
  padding:10px 11px 9px;display:flex;flex-direction:column;gap:1px;min-width:0;
  font:inherit;text-align:left;color:inherit}
.t-kpc .nm small{font-size:13px;color:var(--tenue);font-weight:700}
button.t-kpc{cursor:pointer}
button.t-kpc:active{filter:brightness(.96)}
button.t-kpc:focus-visible{outline:2px solid var(--senal);outline-offset:-2px}
.t-kpc .et{font-size:11px;font-weight:800;letter-spacing:.4px;text-transform:uppercase;color:var(--tenue)}
.t-kpc .nm{font-size:25px;font-weight:800;letter-spacing:-.03em;line-height:1.05;
  font-variant-numeric:tabular-nums}
.t-kpc .sb{font-size:12px;color:var(--tenue);font-weight:700}
.t-kpc.hero{background:var(--verde);border-color:transparent;grid-column:span 3}
.t-kpc.hero .et,.t-kpc.hero .sb{color:#C3C9E0}
.t-kpc.hero{padding:13px 15px 12px}
.t-kpc.hero .nm{color:#fff;font-size:30px}
.t-kpc .chip{align-self:flex-start;font-size:11px;font-weight:800;padding:2px 8px;border-radius:99px;margin-top:2px}
.t-kpc .chip.bien{background:rgba(31,122,77,.15);color:var(--verde)}
.t-kpc .chip.ojo{background:rgba(201,132,16,.16);color:#9A6212}
.t-kpc .chip.mal{background:rgba(140,47,47,.14);color:#8C2F2F}
/* Portafolio */
.pf-cuad{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
.pf-cd{border-radius:12px;padding:10px 11px;border:1px solid var(--linea);background:var(--carta)}
.pf-cd .et{font-size:10.5px;font-weight:800;letter-spacing:.04em;text-transform:uppercase}
.pf-cd .nm{font-size:21px;font-weight:800;line-height:1.1;margin-top:2px;font-variant-numeric:tabular-nums}
.pf-cd .nm i{font-style:normal;font-size:12px;color:var(--tenue);font-weight:600}
.pf-cd .sb{font-size:11px;color:var(--tenue);margin-top:3px;line-height:1.25}
.pf-cd.estrella{background:var(--f-listo);border-color:#BFE0CC} .pf-cd.estrella .et{color:var(--c-listo)}
.pf-cd.oportunidad{background:#E6F0FB;border-color:#BFD6F2} .pf-cd.oportunidad .et{color:#1F5FA8}
.pf-cd.volumen{background:var(--f-cambio);border-color:#EBD6A6} .pf-cd.volumen .et{color:var(--c-cambio)}
.pf-cd.revisar{background:var(--f-perdido);border-color:#EBC5C1} .pf-cd.revisar .et{color:var(--c-perdido)}
.pf-regla{display:flex;gap:10px;align-items:center;padding:9px 12px;border-bottom:1px solid var(--linea);font-size:13px}
.pf-regla:last-child{border-bottom:0}
.pf-regla .k{width:22px;height:22px;border-radius:6px;background:var(--verde);color:#fff;font-weight:800;font-size:12px;display:grid;place-items:center;flex:0 0 22px}
.pf-regla .q{flex:1;line-height:1.25} .pf-regla .q small{display:block;color:var(--tenue);font-size:11px}
.pf-regla b{font-variant-numeric:tabular-nums}
.pf-fila{display:flex;align-items:center;gap:10px;width:100%;text-align:left;padding:10px 12px;border:0;border-bottom:1px solid var(--linea);background:var(--carta);color:var(--tinta);font:inherit;cursor:pointer}
.pf-fila:last-child{border-bottom:0}
.pf-fila .q{flex:1;min-width:0} .pf-fila .q b{display:block;font-size:13.5px} .pf-fila .q small{color:var(--tenue);font-size:11.5px;line-height:1.3}
.pf-mot{font-size:11px;font-weight:800;padding:2px 8px;border-radius:99px;background:var(--f-perdido);color:var(--c-perdido);white-space:nowrap}
/* Tres fichas chicas caben en cualquier telefono: ya no se parten en dos
   columnas de fichas grandes. El grande siempre ocupa la fila entera. */
.t-kpc .et{font-size:10px}
.t-kpc .nm{font-size:20px}
.t-kpc .sb{font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
/* En pantalla ancha (tablet, o telefono con letra chica) las puertas van a
   dos columnas y usan el ancho, en vez de cinco renglones flacos. */
@media(min-width:600px){.cajero{grid-template-columns:1fr 1fr}}
.t-ficha{background:var(--carta);border:1px solid var(--linea);border-radius:13px;padding:13px 14px}
.t-ficha b{display:block;font-size:24px;font-weight:800;letter-spacing:-.025em;
  font-variant-numeric:tabular-nums;line-height:1.1;margin-top:4px}
.t-ficha small{display:block;font-size:12px;color:var(--tenue);font-weight:700;margin-top:3px}
.t-medidor{background:var(--carta);border:1px solid var(--linea);border-radius:13px;
  padding:14px 15px;margin-top:9px}
.t-medidor .fila{display:flex;align-items:baseline;gap:9px;flex-wrap:wrap}
.t-medidor .num{font-size:28px;font-weight:800;letter-spacing:-.025em;font-variant-numeric:tabular-nums}
.t-chip{margin-left:auto;font-size:11px;font-weight:800;letter-spacing:.05em;
  text-transform:uppercase;padding:4px 10px;border-radius:999px}
.t-chip.bien{background:var(--f-listo);color:var(--c-listo)}
.t-chip.ojo{background:var(--f-cambio);color:var(--c-cambio)}
.t-chip.mal{background:var(--f-perdido);color:var(--c-perdido)}
.t-barra{height:9px;border-radius:99px;background:var(--verde-claro);margin-top:11px;overflow:hidden}
.t-barra i{display:block;height:100%;border-radius:99px}
.t-barra i.bien{background:var(--c-listo)}
.t-barra i.ojo{background:var(--c-cambio)}
.t-barra i.mal{background:var(--c-perdido)}
.t-medidor .det{font-size:12.5px;color:var(--tenue);font-weight:700;margin-top:8px}
@media (min-width:820px){ .t-rejilla{grid-template-columns:repeat(4,1fr)} }

.e-resumen{font-size:13.5px;color:var(--tenue);font-weight:700;margin-top:10px;text-align:center}
.e-lin{border-bottom:1px solid var(--linea);padding:11px 0}
.e-lin:last-child{border-bottom:0}
.e-cab{display:flex;align-items:flex-start;gap:10px}
.e-nom{font-size:14.5px;font-weight:800;color:var(--tinta);text-transform:uppercase;letter-spacing:-.01em}
.e-cod{font-size:12.5px;color:var(--tenue);margin-top:1px}
.e-pza{flex:0 0 auto;border:1px solid var(--linea);border-radius:7px;padding:4px 9px;
  font-size:12px;font-weight:700;color:var(--tenue)}
.e-ops{display:flex;gap:6px;margin-top:9px}
.e-op{flex:1;border:1.5px solid var(--linea);border-radius:999px;padding:8px 4px;
  font-size:12px;font-weight:700;color:var(--tenue);background:var(--papel)}
.e-op[aria-pressed=true]{background:var(--verde);border-color:var(--verde);color:#fff}
.e-op:active{transform:scale(.97)}
/* FOTO y FIRMA lado a lado, arriba, como Handy. */
.e-par{display:flex;gap:8px;margin-top:12px}
.e-par>*{flex:1;min-width:0}
.e-par .btn{margin-top:0}
.e-par .foto-caja{margin-top:0}
.e-par .foto-caja img{width:100%;border-radius:10px;display:block}
/* La firma de quien recibe. Hasta hoy la firma solo existia en el ticket
   IMPRESO; en pantalla no habia donde firmar. */
.firma-caja{margin-top:10px;border:1.5px dashed var(--linea);border-radius:12px;
  background:var(--carta);padding:8px}
.firma-caja canvas{display:block;width:100%;height:150px;border-radius:8px;
  background:var(--papel);touch-action:none;cursor:crosshair}
.firma-pie{display:flex;align-items:center;gap:10px;margin-top:8px}
.firma-pie small{flex:1;font-size:11.5px;color:var(--tenue);font-weight:700}
.firma-pie button{font:inherit;font-size:12.5px;font-weight:800;background:none;border:0;
  padding:5px 9px;border-radius:8px}
.firma-pie .f-borrar{color:var(--rojo)}
.firma-pie .f-listo{color:var(--verde);background:var(--verde-claro)}
.firma-hecha{margin-top:10px;border:1px solid var(--linea);border-radius:12px;
  background:var(--carta);padding:8px;display:flex;align-items:center;gap:10px}
.firma-hecha img{height:52px;flex:0 0 auto;border-radius:6px;background:var(--papel)}
.firma-hecha span{flex:1;font-size:12.5px;font-weight:700;color:var(--c-listo)}

.e-barra{background:var(--verde);color:#fff;border-radius:14px;padding:13px 15px;margin-top:16px;
  font-size:14px;line-height:1.7}
.e-barra b{font-weight:800}
.e-barra .e-modo{border-top:1px solid rgba(255,255,255,.28);margin-top:7px;padding-top:7px;font-size:13px}

.mira{position:absolute;inset:0;z-index:850;pointer-events:none;display:none;
  align-items:center;justify-content:center}
.mira.on{display:flex}
.mira i{width:34px;height:34px;border-radius:50%;border:3px solid var(--senal);
  box-shadow:0 0 0 2px #fff, 0 0 0 5px rgba(216,154,22,.35)}
.mira b{position:absolute;top:12px;left:50%;transform:translateX(-50%);background:var(--senal);
  color:var(--tinta);font-size:12px;font-weight:800;border-radius:999px;padding:7px 13px;white-space:nowrap}
/* El cono dice hacia donde esta viendo. El mapa no gira, pero el punto si:
   sirve igual para saber por que calle agarrar. */
.yo .cono{position:absolute;left:50%;top:50%;width:0;height:0;
  border-left:11px solid transparent;border-right:11px solid transparent;
  border-bottom:20px solid rgba(46,123,232,.38);
  transform-origin:50% 100%;
  transform:translate(-50%,-100%) rotate(var(--rumbo,0deg));
  transition:transform .18s linear;display:none;pointer-events:none}
.yo.con-rumbo .cono{display:block}
.yo{position:relative;width:16px;height:16px;border-radius:50%;background:#2E7BE8;border:3px solid #fff;
  box-shadow:0 0 0 3px rgba(46,123,232,.3)}
.tira{display:flex;justify-content:space-between;align-items:baseline;gap:10px;
  font-size:12px;font-weight:700;color:var(--tenue);margin-bottom:7px}
.tira b{font-size:16px;color:var(--tinta)}
#mapa{height:calc(100dvh - 250px);min-height:320px}

/* ---------- mapa a pantalla llena ---------- */
#pant-ruta.lleno > header{display:none}
#pant-ruta.lleno > main{padding:0}
/* pantalla completa de verdad: el mapa va de orilla a orilla y por debajo
   de la barra de abajo. Lo demas flota encima. */
#pant-ruta.lleno .mapa-caja{position:fixed;inset:0;border:0;border-radius:0;z-index:1}
#pant-ruta.lleno #mapa{height:100%;min-height:0}
.cap{position:fixed;z-index:900}
.cap-top{top:calc(9px + env(safe-area-inset-top));left:10px;right:10px;display:flex;
  flex-direction:column;gap:8px;pointer-events:none}
.cap-top>*{pointer-events:auto}
.buscar-flot{background:var(--carta);border-radius:999px;box-shadow:0 3px 14px rgba(20,32,28,.22);
  display:flex;align-items:center;gap:10px;padding:12px 16px}
.buscar-flot input{border:0;background:none;padding:0;font-size:15px;flex:1}
.buscar-flot input:focus{outline:none}
.buscar-flot .lupa{color:var(--tenue);font-size:17px}
.chips-flot{display:flex;gap:7px;overflow-x:auto;scrollbar-width:none;padding:1px}
.chips-flot::-webkit-scrollbar{display:none}
.chips-flot button{flex:0 0 auto;background:var(--carta);border-radius:999px;padding:8px 14px;
  font-size:13px;font-weight:700;box-shadow:0 2px 9px rgba(20,32,28,.16);white-space:nowrap}
.chips-flot button[aria-pressed=true]{background:var(--verde);color:#fff;
  box-shadow:0 3px 12px rgba(29,35,64,.4)}
.hallazgos{background:var(--carta);border-radius:14px;box-shadow:0 3px 14px rgba(20,32,28,.22);
  max-height:46dvh;overflow-y:auto;padding:5px 0}
.hallazgos button{display:block;width:100%;text-align:left;padding:11px 16px;font-size:15px}
.hallazgos button:active{background:var(--verde-claro)}
.hallazgos small{display:block;color:var(--tenue);font-size:11px;font-weight:700;margin-top:2px}
.capas{position:absolute;right:56px;bottom:0;background:var(--carta);border-radius:14px;
  box-shadow:0 4px 18px rgba(20,32,28,.3);padding:6px;display:none;gap:4px;flex-direction:column;min-width:150px}
.capas.on{display:flex}
.capas button{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:10px;
  font-size:14px;font-weight:700;text-align:left;width:100%}
.capas button[aria-pressed=true]{background:var(--verde-claro);color:var(--verde)}
.capas .mini{width:26px;height:26px;border-radius:7px;flex:0 0 auto;border:1px solid var(--linea)}
.mini.calles{background:linear-gradient(135deg,#f4f1ea 40%,#dfe6ef)}
.mini.satelital{background:linear-gradient(135deg,#2f4a2b,#6b7f4a 55%,#8a8f6b)}
.mini.relieve{background:linear-gradient(135deg,#e8e2d2,#b9c9a6 60%,#8fa98a)}
.mini.oscuro{background:linear-gradient(135deg,#1b2130,#39405a)}
/* El nitido: mismo papel que Calles pero con el trazo marcado, que es
   justo lo que lo diferencia. */
.mini.nitido{background:linear-gradient(135deg,#faf7f2 45%,#e9e4d8);
  box-shadow:inset 0 0 0 1.5px var(--senal)}
.cap-fabs{right:10px;bottom:calc(150px + env(safe-area-inset-bottom));display:flex;
  flex-direction:column;align-items:flex-end;gap:9px}
/* capas, trazo y punto viven escondidos detras del boton de los tres puntos */
.fabs-mas{display:none;flex-direction:column;align-items:flex-end;gap:9px}
.fabs-mas.on{display:flex}
#m-mas[aria-pressed=true]{background:var(--senal);color:var(--tinta)}
.cap-pie{left:0;right:0;bottom:calc(58px + env(safe-area-inset-bottom));background:var(--carta);
  border-top:1px solid var(--linea);padding:10px 12px calc(10px)}
.cap-pie .dia{display:flex;align-items:center;justify-content:center;gap:10px;
  font-size:14px;font-weight:800;color:var(--verde);margin-bottom:9px}
.pills{display:flex;gap:7px}
.pill{flex:1;background:var(--papel);border-radius:999px;padding:8px 6px;text-align:center;
  font-size:11px;font-weight:700;color:var(--tenue);display:flex;align-items:center;
  justify-content:center;gap:6px}
.pill b{font-size:14px;color:var(--tinta)}
.pill.si{background:#E7F3EC} .pill.si b{color:var(--ok)}
button.pill{border:1.5px solid var(--linea);font:inherit;font-weight:700}
button.pill:active{transform:scale(.97)}
button.pill::after{content:"›";font-size:14px;font-weight:800;color:var(--tenue);margin-left:-2px}
/* Las fichas-filtro del mapa, con la forma que traen los vendedores de
   Handy: el rotulo a la izquierda y el numero en su propia burbuja a la
   derecha, y la puesta se rellena entera. Sin flechita: no abren lista,
   filtran el mapa. */
button.pill.filtro::after{content:""}
.pill.filtro{gap:7px;padding:9px 12px;font-size:12px;color:var(--tinta);
  background:var(--verde-claro);border-color:transparent}
.pill.filtro b.num{background:var(--papel);border:1.5px solid var(--linea);
  border-radius:999px;padding:1px 9px;font-size:12.5px;line-height:1.5;
  min-width:26px;color:var(--tinta)}
.pill.filtro[aria-pressed=true]{background:var(--verde);border-color:var(--verde);color:#fff}
.pill.filtro[aria-pressed=true] b.num{background:#fff;border-color:#fff;color:var(--verde)}
/* la plata del renglon de la fecha del mapa */
.cap-pie .dia .plata{flex:0 0 auto;font-size:13px;font-weight:800;color:var(--c-listo);
  background:var(--f-listo);border-radius:999px;padding:3px 10px}
/* lista de la hoja que abre cada cifra */
.cifra-fila{display:flex;align-items:center;gap:10px;width:100%;text-align:left;
  padding:11px 0;border-bottom:1px solid var(--linea)}
.cifra-fila:last-child{border-bottom:0}
.cifra-fila .qui{flex:1;min-width:0}
.cifra-fila .qui b{display:block;font-size:14.5px;font-weight:800;letter-spacing:-.01em;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cifra-fila .qui small{display:block;font-size:11.5px;color:var(--tenue);font-weight:700}
.cifra-fila .mon{flex:0 0 auto;font-size:14px;font-weight:800}
.cifra-tot{display:flex;justify-content:space-between;align-items:baseline;
  margin-top:14px;padding-top:12px;border-top:1.5px solid var(--tinta)}
.cifra-tot b{font-size:19px;font-weight:900;letter-spacing:-.02em}
.pill.act{background:var(--verde)} .pill.act,.pill.act b{color:var(--senal)}
.pill.si{background:var(--f-listo)} .pill.si b{color:var(--c-listo)}
.pin{background:var(--verde);color:#fff;border-radius:50% 50% 50% 4px;width:30px;height:30px;
  display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:800;
  transform:rotate(-45deg);box-shadow:0 2px 8px rgba(0,0,0,.55);border:2.5px solid #fff}
.pin span{transform:rotate(45deg)}
.pin{background:var(--verde)}
.pin.si{background:var(--c-listo)} .pin.no{background:var(--c-perdido)}
/* Solo el mapa del motorista: "nada que entregar aqui" se apaga para que
   resalten los que si tiene pendientes, y "atrasado de otro dia" lleva su
   propio color, distinto del rojo de "fue y no lo recibieron". */
.pin.nada{background:var(--tenue);opacity:.62}
/* El traslado entre un cliente y el siguiente, en la jornada que ve
   oficina. Va discreto: es el camino, no una parada. Cuando se pasa de
   media hora se marca, que ahi si hay algo que preguntar. */
.tras{display:flex;align-items:center;gap:8px;margin:4px 0 4px 6px;
  font-size:12.5px;font-weight:700;color:var(--tenue)}
.tras i{flex:0 0 auto;width:2px;height:16px;border-radius:2px;background:var(--linea)}
.tras.largo{color:var(--c-cambio)}
.tras.largo i{background:var(--c-cambio);width:3px}
.pin.tarde{background:var(--c-cambio)}

/* ---- pines: la gota de siempre, mejor asentada ----
   anillo blanco, sombra corta y el numero centrado de verdad.
   El SIGUIENTE cliente late en dorado para que se halle de un vistazo. */
.pin{position:relative;width:32px;height:32px;border:2.5px solid #fff;
  box-shadow:0 3px 7px rgba(12,16,30,.45),0 0 0 .5px rgba(12,16,30,.18);
  font-size:12.5px;letter-spacing:-.02em}
.pin span{display:block;line-height:1}
.pin.sig{background:var(--senal);color:#131826;border-color:#fff;
  box-shadow:0 4px 12px rgba(216,154,22,.55),0 0 0 .5px rgba(12,16,30,.2)}
.pin.sig::before{content:"";position:absolute;inset:-10px;border-radius:50%;
  border:2px solid var(--senal);opacity:.55;animation:late 1.9s ease-out infinite}
@keyframes late{0%{transform:scale(.7);opacity:.6} 100%{transform:scale(1.35);opacity:0}}
@media (prefers-reduced-motion:reduce){ .pin.sig::before{animation:none} }

/* ---- pines "casita": el estilo de Handy que pidio Brayan (03-09-2026) ----
   Gota azul con la cajita adentro y el numero de orden en una etiqueta
   chiquita, para no perder el "que sigue". Los colores de estado (verde
   ya visitado, rojo no compro, dorado el que sigue) se quedan iguales.
   Se escoge en Administrar > Ajustes > Marcadores del mapa. */
.pin.casa{background:#2F6FE4;width:34px;height:34px;border-radius:50% 50% 50% 4px}
.pin.casa span.ico{width:20px;height:20px;display:flex;align-items:center;justify-content:center}
.pin.casa span.ico svg{width:19px;height:19px;display:block}
.pin.casa span.num{position:absolute;top:-7px;right:-9px;transform:rotate(45deg);
  min-width:17px;height:17px;padding:0 4px;border-radius:9px;background:#fff;color:#131826;
  font-size:10px;font-weight:800;display:flex;align-items:center;justify-content:center;
  box-shadow:0 1px 3px rgba(12,16,30,.4)}
.pin.casa.si{background:var(--c-listo)} .pin.casa.no{background:var(--c-perdido)}
.pin.casa.nada{background:var(--tenue)} .pin.casa.tarde{background:var(--c-cambio)}
.pin.casa.sig{background:var(--senal)}

/* ---- hoja de abajo: agarradera, avance y el siguiente cliente ---- */
.cap-pie{border-radius:18px 18px 0 0;box-shadow:0 -6px 22px -14px rgba(12,16,30,.5);
  padding-top:6px;transition:padding .2s ease}
.agarradera{width:100%;padding:4px 0 8px;display:flex;justify-content:center}
.agarradera i{display:block;width:38px;height:4px;border-radius:2px;background:var(--linea)}
.cap-pie .dia{margin-bottom:5px}
.cap-pie .dia .avance{flex:0 0 auto;font-size:12px;font-weight:800;color:var(--tenue);
  font-variant-numeric:tabular-nums}
.cap-pie .barra{height:5px;margin:0 0 9px}
.siguiente{display:flex;align-items:center;gap:10px;width:100%;text-align:left;
  background:var(--f-cambio);border:1.5px solid var(--c-cambio);border-radius:13px;
  padding:9px 11px;margin-bottom:9px}
.siguiente .no{flex:0 0 auto;width:26px;height:26px;border-radius:8px;background:var(--c-cambio);
  color:#fff;font-size:12px;font-weight:800;display:flex;align-items:center;justify-content:center}
.siguiente .qui{flex:1;min-width:0}
.siguiente .qui b{display:block;font-size:14px;font-weight:800;letter-spacing:-.01em;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.siguiente .qui small{display:block;font-size:11px;font-weight:700;color:var(--c-cambio)}
.siguiente .ir{flex:0 0 auto;font-size:17px;color:var(--c-cambio);font-weight:800}
.siguiente:active{transform:scale(.99)}
/* encogida: solo el dia y la barra, para que el mapa respire */
.cap-pie.encogida .pills{display:none}
.cap-pie.encogida .siguiente{margin-bottom:2px}
/* ---- En vivo: donde anda cada quien ahorita ---- */
#mapa-vivo{height:210px;border-radius:13px;overflow:hidden;border:1px solid var(--linea);
  background:var(--verde-claro)}

/* ---- En vivo: el mapa a pantalla llena ----
   Mismo patron que #pant-ruta.lleno, pero la clase va en el BODY: el bloque
   En vivo vive en DOS pantallas (En vivo de oficina y el Tablero de
   Administrar), y asi sirve en las dos sin repetir reglas.
   Los z-index quedan por DEBAJO de .fondo (1400) y .hoja (1500) a proposito:
   si la app abre una hoja o un aviso encima, se tiene que seguir viendo. */
.mv-caja{position:relative;margin-top:10px}
.mv-ampliar{position:absolute;right:9px;top:9px;z-index:5;width:34px;height:34px;
  display:flex;align-items:center;justify-content:center;padding:0;
  background:var(--carta);border:1px solid var(--linea);border-radius:10px;
  box-shadow:0 2px 9px rgba(20,32,28,.18)}
.mv-ampliar svg{width:16px;height:16px;stroke:var(--tinta);fill:none;stroke-width:2.1;
  stroke-linecap:round;stroke-linejoin:round}
body.mv-lleno{overflow:hidden}
body.mv-lleno nav,body.mv-lleno .carro{display:none}
body.mv-lleno .mv-caja{position:fixed;inset:0;margin:0;z-index:1000}
body.mv-lleno #mapa-vivo{height:100%;border:0;border-radius:0}
body.mv-lleno .mv-ampliar{display:none}

.mv-cap{position:fixed;z-index:1050;top:calc(9px + env(safe-area-inset-top));left:10px;right:10px;
  display:flex;flex-direction:column;gap:8px;pointer-events:none;max-width:640px;margin:0 auto}
/* display:flex le gana al atributo hidden, y la barra se quedaba puesta al
   cerrar. Hay que apagarla a mano. */
.mv-cap[hidden],.mv-hoja[hidden]{display:none}
.mv-cap>*{pointer-events:auto}
.mv-barra{background:var(--carta);border-radius:999px;box-shadow:0 3px 14px rgba(20,32,28,.22);
  display:flex;align-items:center;gap:11px;padding:9px 10px 9px 15px}
.mv-tit{flex:1;min-width:0}
.mv-tit b{display:block;font-size:14.5px;font-weight:800;letter-spacing:-.01em}
.mv-tit small{display:block;font-size:11px;font-weight:700;color:var(--tenue)}
.mv-cerrar{flex:0 0 auto;width:34px;height:34px;border-radius:50%;padding:0;
  background:var(--verde-claro);display:flex;align-items:center;justify-content:center}
.mv-cerrar svg{width:15px;height:15px;stroke:var(--verde);fill:none;stroke-width:2.4;stroke-linecap:round}
.mv-chips{display:flex;gap:7px;overflow-x:auto;scrollbar-width:none;padding:1px}
.mv-chips::-webkit-scrollbar{display:none}
.mv-chips button{flex:0 0 auto;background:var(--carta);border-radius:999px;padding:8px 14px;
  font-size:13px;font-weight:700;box-shadow:0 2px 9px rgba(20,32,28,.16);white-space:nowrap}
.mv-chips button[aria-pressed=true]{background:var(--verde);color:#fff}

/* La hoja de la gente se BAJA: de un toque en el agarre, o arrastrandola.
   Recogida deja solo una pestana asomada, para que el mapa quede libre
   con los puntos, que es para lo que se amplia. */
.mv-hoja{position:fixed;left:0;right:0;bottom:0;z-index:1050;background:var(--carta);
  border-radius:18px 18px 0 0;box-shadow:0 -3px 20px rgba(20,32,28,.2);
  padding:6px 16px calc(14px + env(safe-area-inset-bottom));
  max-height:47dvh;overflow-y:auto;max-width:640px;margin:0 auto;
  transition:transform .22s ease}
.mv-hoja.recogida{transform:translateY(calc(100% - 46px - env(safe-area-inset-bottom)));
  overflow:hidden}
.mv-hoja.sin-animacion{transition:none}
.mv-tirador{display:block;width:100%;padding:6px 0 8px;background:none;border:0;
  cursor:grab;touch-action:none}
.mv-agarre{width:38px;height:4px;border-radius:99px;background:var(--linea);margin:0 auto 7px}
.mv-tirador .eyebrow{display:block;text-align:center}
.mv-hoja.recogida .mv-agarre{background:var(--tenue)}
#mv-filas{transition:opacity .18s}
.mv-hoja.recogida #mv-filas{opacity:0;pointer-events:none}
@media (prefers-reduced-motion:reduce){.mv-hoja,#mv-filas{transition:none}}
.vivo-fila{display:flex;align-items:center;gap:11px;padding:10px 0;border-bottom:1px solid var(--linea)}
.vivo-fila:last-child{border-bottom:0}
.vivo-ini{flex:0 0 auto;width:34px;height:34px;border-radius:11px;display:flex;align-items:center;

.vivo-ini.env{background:var(--c-listo)} .vivo-ini.frio{background:var(--tenue)}
.vivo-qui{flex:1;min-width:0}
.vivo-qui b{display:block;font-size:14px;font-weight:800;letter-spacing:-.01em;

.vivo-num{flex:0 0 auto;text-align:right}

.marca-vivo{width:30px;height:30px;border-radius:10px 10px 10px 3px;background:var(--verde);color:#fff;
  display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:800;
  border:2.5px solid #fff;box-shadow:0 3px 7px rgba(12,16,30,.45)}
.marca-vivo.env{background:var(--c-listo)} .marca-vivo.frio{background:var(--tenue)}
/* ---- hoja de entrega del motorista ---- */
.he-cli{border:1.5px solid var(--linea);border-radius:var(--r);padding:13px;
  margin-bottom:11px;background:var(--carta)}
.he-cli.recortado{border-color:var(--c-cambio);border-width:2px}
.he-cli.hecho{opacity:.6}
.he-top{display:flex;align-items:flex-start;gap:10px}
.he-top .qui{flex:1;min-width:0}
.he-top b{display:block;font-size:15.5px;font-weight:800;letter-spacing:-.01em}
.he-top small{display:block;font-size:11.5px;color:var(--tenue);font-weight:700}
.he-top .mon{text-align:right;flex:0 0 auto}
.he-top .mon b{font-size:16px}
.he-top .mon s{font-size:11px;color:var(--tenue);font-weight:700}
.he-lin{display:flex;gap:8px;align-items:baseline;padding:6px 0;
  border-bottom:1px dashed var(--linea);font-size:13.5px}
.he-lin:last-of-type{border-bottom:0}
.he-lin .cn{flex:0 0 34px;font-weight:800;font-variant-numeric:tabular-nums}
.he-lin .nm{flex:1;min-width:0}

.he-nota{margin-top:9px;padding:8px 10px;border-radius:10px;background:var(--f-cambio);

/* ---- bodega ---- */
.bod-tabs{display:flex;gap:6px;margin:0 0 12px;overflow-x:auto;-webkit-overflow-scrolling:touch}
.bod-tabs::-webkit-scrollbar{display:none}
.bod-tabs button{flex:0 0 auto;border:1.5px solid var(--linea);background:var(--carta);
  border-radius:999px;padding:8px 15px;font-size:13.5px;font-weight:800;color:var(--tenue)}
.bod-tabs button[aria-pressed=true]{background:var(--tinta);color:#fff;border-color:var(--tinta)}
.inv-lin{display:flex;align-items:center;gap:10px;padding:11px 0;border-bottom:1px solid var(--linea)}
.inv-lin:last-child{border-bottom:0}
.inv-lin .qi{flex:1;min-width:0}
.inv-lin .qi b{display:block;font-size:14.5px;font-weight:800}
.inv-lin .qi small{display:block;font-size:11.5px;color:var(--tenue);font-weight:700;margin-top:2px}
.inv-lin .ex{flex:0 0 auto;text-align:right}
.inv-lin .ex b{font-size:19px;font-weight:800;font-variant-numeric:tabular-nums}
.inv-lin.bajo .ex b{color:var(--rojo)}
.inv-lin.bajo .qi small{color:var(--rojo)}
.mov-lin{display:flex;gap:10px;padding:9px 0;border-bottom:1px dashed var(--linea);font-size:13px}
