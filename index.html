    }
  };
}

function pintarDiaBodega(){
  const m = $("#dia-cuerpo");
  if (!m) return;
  const cab = $("#pant-dia .marca b");
  if (cab) cab.textContent = esHoy() ? "Bodega · hoy" : "Bodega · " + fechaBonita(fechaVista());

  const tabs =
    '<div class="bod-tabs">' +
      [["hoy","Hoy"],["inv","Inventario"],["ent","Entradas"],["sal","Salidas"]]
        .map(t => '<button data-v="' + t[0] + '" aria-pressed="' +
          (vistaBodega === t[0]) + '">' + t[1] + '</button>').join("") +
    '</div>';
  const cablearTabs = () => $$("#dia-cuerpo .bod-tabs button").forEach(b =>
    b.onclick = () => { vistaBodega = b.dataset.v; pintarDia(); });

  if (vistaBodega !== "hoy"){
    const cerrado = loLlevaOficina("inventario");
    m.innerHTML = tabs + (vistaBodega === "inv" ? panelBodega() : "") +
      ((cerrado && vistaBodega !== "inv") ? avisoOficina("inventario") : "");
    cablearTabs();
    if (vistaBodega === "inv") vistaInventario(m);
    // entradas y salidas se apagan: el kardex pasa a ser de oficina
    if (!cerrado && vistaBodega === "ent") vistaEntrada(m);
    if (!cerrado && vistaBodega === "sal") vistaSalida(m);
    return;
  }

  const filas = demandaDelDia();
  const cortados = filas.filter(f => S.cortes[f.cod] && S.cortes[f.cod].va != null &&
    Number(S.cortes[f.cod].va) < f.pedido);
  const unidades = filas.reduce((a,f) => a + f.pedido, 0);

  m.innerHTML = tabs + panelBodega() +
    '<div class="kpis" style="margin-top:10px">' +
      '<div class="kpi"><span class="eyebrow">Productos</span><b class="num">' + filas.length + '</b></div>' +
      '<div class="kpi"><span class="eyebrow">Unidades</span><b class="num">' + unidades + '</b></div>' +
      '<div class="kpi"><span class="eyebrow">Recortados</span><b class="num">' + cortados.length + '</b></div>' +
      '<div class="kpi"><span class="eyebrow">Pedidos</span><b class="num">' +
        (S.pedidosDia || []).filter(p => p.tipo !== "cambio").length + '</b></div>' +
    '</div>' +
    '<div class="aviso dato">De lo que se pidió hoy, escriba cuánto <b>sí va</b>. ' +
      'Lo que deje corto se descuenta solo en la hoja del motorista.</div>' +
    (function(){
      /* Lo que reportaron los motoristas al revisar su carga. Sale aqui
         para que bodega lo vea al momento y no a las cinco de la tarde. */
      const conDif = (S.jornadasDia || []).filter(j =>
        Array.isArray(j.cargaDiferencias) && j.cargaDiferencias.length);
      const revisada = (S.jornadasDia || []).filter(j => j.cargaRecibida);
      if (!revisada.length) return '';
      return '<div class="meta" style="margin-top:12px">' +
        '<div class="eyebrow">Lo que dijeron los motoristas</div>' +
        revisada.map(j => {
          const d = j.cargaDiferencias || [];
          return '<div class="cuota-fila" style="flex-wrap:wrap;gap:4px">' +
            '<span class="quien" style="flex:1 1 100%">' + escapar(j.preventaNombre || "") +
              ' \u00b7 ' + escapar(j.cargaHora || "") +
              '<br><span style="color:var(--tenue);font-size:11px">' +
              (d.length
                ? d.map(x => escapar(x.nombre) + " " + x.dif).join(" \u00b7 ") +
                  (j.cargaNota ? " \u00b7 " + escapar(j.cargaNota) : "")
                : "recibi\u00f3 conforme") + '</span></span>' +
            '<b class="num" style="color:' + (d.length ? "var(--senal)" : "var(--ok)") + '">' +
              (d.length ? d.length + " dif." : "\u2713") + '</b></div>';
        }).join("") + '</div>';
    })() +
    (filas.length
      ? '<div class="meta" style="margin-top:12px"><div class="eyebrow">Carga del día</div>' +
        filas.map(f => {
          const c = S.cortes[f.cod];
          const va = c && c.va != null ? Number(c.va) : f.pedido;
          const ex = S.exist[f.cod];
          const corto = va < f.pedido;
          return '<div class="lin" style="align-items:center">' +
            '<div style="flex:1;min-width:0">' +
              '<div class="n">' + escapar(f.nombre) + '</div>' +
              '<div class="d">' + escapar(f.cod) + ' · piden ' + f.pedido +
                (ex != null ? ' · existencia ' + ex : '') +
                (corto ? ' · <b style="color:var(--c-cambio)">' + escapar(c.motivo || "recortado") + '</b>' : '') +
              '</div>' +
            '</div>' +
            '<div class="lin-ctrl">' +
              '<input class="b-va" data-c="' + escapar(f.cod) + '" type="number" inputmode="numeric" ' +
                'min="0" max="' + f.pedido + '" value="' + va + '">' +
              '<span class="tope-min">de ' + f.pedido + '</span>' +
            '</div>' +
          '</div>';
        }).join("") +
        '<label class="campo" style="margin-top:12px"><span>Motivo de lo que se recorta</span>' +
          '<select id="b-motivo">' +
          MOTIVOS_BODEGA.map(x => '<option value="' + x + '">' + x + '</option>').join("") +
          '</select></label>' +
        '<button class="btn" id="b-guardar" style="margin-top:12px">Guardar la carga del día</button>' +
        '<p class="conteo" style="text-align:center;margin-top:7px">' +
          'El motorista lo ve al instante en su hoja de entrega.</p>' +
        '</div>'
      : '<div class="vacio"><p>Todavía no hay pedidos para este día.</p></div>');

  cablearTabs();
  m.insertAdjacentHTML("afterbegin", "");
  if ($("#b-guardar")) $("#b-guardar").onclick = async () => {
    const b = $("#b-guardar");
    b.disabled = true; b.textContent = "Guardando…";
    const motivo = $("#b-motivo").value;
    const cortes = {};
    $$("#dia-cuerpo .b-va").forEach(inp => {
      const cod = inp.dataset.c;
      const f = filas.find(x => x.cod === cod);
      let va = Math.max(0, Math.min(f.pedido, parseInt(inp.value) || 0));
      if (va < f.pedido) cortes[cod] = {va:va, pedido:f.pedido, motivo:motivo, por:S.nombre};
    });
    try {
      await db.collection("bodegaDia").doc(fechaVista()).set({
        fecha: fechaVista(), cortes: cortes, por: S.nombre,
        actualizado: firebase.firestore.FieldValue.serverTimestamp()
      });
      b.textContent = "Guardado";
      setTimeout(() => { b.disabled = false; b.textContent = "Guardar la carga del día"; }, 1400);
    } catch(e){
      b.disabled = false; b.textContent = "Guardar la carga del día";
      alert("No se pudo guardar (" + (e.code || e.message) + ").");
    }
  };
}

function pintarDia(){
  if (S.rol === "bodega") return pintarDiaBodega();
  if (S.rol === "despacho") return pintarDiaReparto();
  const m = $("#dia-cuerpo");
  if (!m) return;
  const cab = $("#pant-dia .marca b");
  if (cab) cab.textContent = esHoy() ? "Mi día" : fechaBonita(fechaVista());
  const lista = clientesDelDia();
  const visitados = S.visitasHoy.length;
  const conPedido = S.visitasHoy.filter(v => v.resultado === "pedido").length;
  const monto = S.pedidosHoy.reduce((a,p) => a + (Number(p.total)||0), 0);
  const efect = visitados ? Math.round(conPedido / visitados * 100) : 0;
  const sinVenta = S.visitasHoy.filter(v => v.resultado !== "pedido");
  const cuenta = {};
  sinVenta.forEach(v => { cuenta[v.resultado] = (cuenta[v.resultado] || 0) + 1; });

  const meta = S.metas[S.usuario.uid];
  const delMes = S.pedidosMes.reduce((a,p) => a + (Number(p.total)||0), 0);
  const pctMeta = (meta && meta.monto) ? Math.min(100, Math.round(delMes/meta.monto*100)) : 0;

  m.innerHTML =
    (meta && meta.monto ?
      '<div class="meta">' +
        '<div class="eyebrow">Meta del mes</div>' +
        '<div class="meta-cifras" style="margin-top:6px">' +
          '<div><b class="num">' + money(delMes) + '</b>' +
            '<span style="font-size:12px;color:var(--tenue);font-weight:700">de ' + money(meta.monto) + '</span></div>' +
          '<div style="text-align:right"><b class="num">' + pctMeta + '%</b>' +
            '<span style="font-size:12px;color:var(--tenue);font-weight:700">' +
            (pctMeta >= 100 ? 'cumplida' : 'falta ' + money(meta.monto - delMes)) + '</span></div>' +
        '</div>' +
        '<div class="barra"><i class="meta" style="width:' + pctMeta + '%"></i></div>' +
      '</div>' : '') +
    (() => {
      const av = avanceFoco(S.pedidosMes, S.usuario.uid);
      if (!av) return '';
      return '<div class="meta">' +
        '<div class="eyebrow">Su cuota de productos · ' + mesISO() + '</div>' +
        '<div class="meta-cifras" style="margin-top:6px">' +
          '<div><b class="num">' + av.pct + '%</b>' +
            '<span style="font-size:12px;color:var(--tenue);font-weight:700">' +
            av.totalHecho + ' de ' + av.totalMeta + ' unidades</span></div>' +
        '</div>' + barraFoco(av.pct) +
        av.filas.map(f => '<div class="fila-eq"><div class="cab">' +
          '<b style="font-size:14px">' + escapar(f.nombre) + '</b>' +
          '<span>' + f.hecho + ' de ' + f.meta + ' · ' + f.pct + '%</span></div>' +
          barraFoco(f.pct) + '</div>').join("") +
      '</div>';
    })() +
    (() => {
      const cu = S.miCuenta;
      if (!cu) return '';
      const resta = (Number(cu.comisionPerdida)||0) + (Number(cu.porErrores)||0);
      return '<div class="meta">' +
        /* El numero que se PAGA sale del sistema de incentivos de oficina,
           no de aqui. Si esta pantalla dice "su comision" y la quincena
           trae otra cifra, el vendedor reclama con razon. Aqui se le
           muestra el avance, que para eso sirve: para saber como va. */
        '<div class="eyebrow">Su avance estimado · ' + escapar(cu.mes || mesISO()) + '</div>' +
        '<div class="meta-cifras" style="margin-top:6px">' +
          '<div><b class="num">' + money(cu.neto) + '</b>' +
            '<span style="font-size:12px;color:var(--tenue);font-weight:700">le queda</span></div>' +
          '<div style="text-align:right"><b class="num">' + money(cu.comision) + '</b>' +
            '<span style="font-size:12px;color:var(--tenue);font-weight:700">acumulado' +
            (cu.bonos ? ' + ' + money(cu.bonos) + ' de bonos' : '') + '</span></div>' +
        '</div>' +
        (resta ?
          (cu.comisionPerdida ? '<div class="cuota-fila" style="margin-top:8px">' +
            '<span class="quien">Devoluciones ' + money(cu.devuelto) + '</span>' +
            '<span class="hizo num" style="color:var(--rojo)">−' + money(cu.comisionPerdida) +
            '</span></div>' : '') +
          (cu.porErrores ? '<div class="cuota-fila"><span class="quien">Cargos por error</span>' +
            '<span class="hizo num" style="color:var(--rojo)">−' + money(cu.porErrores) +
            '</span></div>' : '')
          : '<div class="conteo" style="margin-top:6px">Sin descuentos este mes.</div>') +
        '<div class="conteo" style="margin-top:8px">Se calcula sobre lo que se entregó: ' +
          'lo que el cliente devuelve no cuenta.</div>' +
        '<div class="conteo" style="margin-top:4px"><b>Es un estimado.</b> El monto que se le paga ' +
          'lo cierra oficina en la quincena y puede no dar igual.</div>' +
      '</div>';
    })() +
    '<div class="kpis">' +
      '<div class="kpi"><span class="eyebrow">Vendido hoy</span><b class="num">' + money(monto) + '</b></div>' +
      '<div class="kpi"><span class="eyebrow">Efectividad</span><b class="num">' + efect + '%</b></div>' +
      '<div class="kpi"><span class="eyebrow">Visitas</span><b class="num">' + visitados + '</b></div>' +
      '<div class="kpi"><span class="eyebrow">Con pedido</span><b class="num">' + conPedido + '</b></div>' +
    '</div>' +
    '<div class="meta">' +
      '<div class="eyebrow">Cobertura del sector</div>' +
      '<div class="meta-cifras" style="margin-top:6px">' +
        '<div><b class="num">' + visitados + '/' + lista.length + '</b>' +
        '<span style="font-size:12px;color:var(--tenue);font-weight:700">clientes del día</span></div>' +
      '</div>' +
      '<div class="barra"><i style="width:' + (Math.max(lista.length, visitados) ? Math.min(100, Math.round(visitados/Math.max(lista.length, visitados)*100)) : 0) + '%"></i></div>' +
    '</div>' +
    (Object.keys(cuenta).length ?
      '<div class="meta"><div class="eyebrow">Por qué no compraron</div>' +
      Object.keys(cuenta).map(k => '<div class="lin"><div class="n">' + escapar(k) + '</div>' +
        '<div class="t"><b class="num">' + cuenta[k] + '</b></div></div>').join("") + '</div>' : "") +
    (S.pedidosHoy.length ?
      '<div class="meta"><div class="eyebrow">Pedidos de hoy</div>' +
      S.pedidosHoy.map(p => '<div class="lin"><div><div class="n">' + escapar(p.clienteNombre) + '</div>' +
        '<div class="d">' + escapar(p.tipo) + ' · ' + p.lineas.length + ' productos</div></div>' +
        '<div class="t"><b class="num">' + money(p.total) + '</b></div></div>').join("") + '</div>'
      : '<div class="vacio"><p>Todavía no hay pedidos hoy.</p></div>');
  if (S.rol === "preventa"){
    /* clientes nuevos que ESTE preventista abrio */
    const mios = S.clientes.filter(c => c.creadoPor === S.usuario.uid);
    const hoy  = mios.filter(c => c.creadoEl === hoyISO()).length;
    const mes  = mios.filter(c => c.creadoMes === mesISO()).length;
    m.insertAdjacentHTML("beforeend",
      '<div class="meta" style="margin-top:12px"><div class="eyebrow">Clientes nuevos</div>' +
      '<div class="meta-cifras" style="margin-top:6px">' +
        '<div><b class="num" style="font-size:21px">' + hoy + '</b>' +
        '<span style="font-size:12px;color:var(--tenue);font-weight:700">hoy</span></div>' +
        '<div style="text-align:right"><b class="num" style="font-size:21px">' + mes + '</b>' +
        '<span style="font-size:12px;color:var(--tenue);font-weight:700">este mes</span></div>' +
      '</div>' +
      (mios.length ? '<div class="conteo" style="margin-top:4px">' + mios.length +
        ' abiertos por usted en total</div>' : '') + '</div>');
    cargarMisCargos(m);
    bloqueCerrarDia(m, {total:lista.length, visitados:visitados, conPedido:conPedido,
      monto:monto, efect:efect, arranque:arranqueDeHoy()});
  }
}

function bloqueCerrarDia(m, datos){
  if (!esHoy()) return;
  if (diaCerrado()){
    const j = S.jornada;
    m.insertAdjacentHTML("beforeend",
      '<div class="meta" style="margin-top:12px;border-left:4px solid var(--c-listo)">' +
        '<div class="eyebrow">Día cerrado</div>' +
        '<div class="meta-cifras" style="margin-top:6px">' +
          '<div><b class="num">' + escapar(j.fin || "") + '</b>' +
          '<span style="font-size:12px;color:var(--tenue);font-weight:700">terminó</span></div>' +
          '<div style="text-align:right"><b class="num">' + money(j.vendido || 0) + '</b>' +
          '<span style="font-size:12px;color:var(--tenue);font-weight:700">' +
          (j.visitas || 0) + ' visitas</span></div>' +
        '</div>' +
        '<div class="conteo" style="margin-top:6px">Mañana arranca de nuevo. ' +
        'Si necesita levantar un pedido más, hable con oficina.</div>' +
      '</div>');
    return;
  }
  m.insertAdjacentHTML("beforeend",
    '<button class="btn" id="d-cerrar" style="margin-top:16px">Terminar mi día</button>' +
    '<p class="conteo" style="text-align:center;margin-top:7px">Cierra la jornada y apaga el GPS.</p>');
  $("#d-cerrar").onclick = () => hojaCerrarDia(datos);
}
/* Lo que ve oficina: un punto por persona y una fila por persona.
   Tres estados y nada mas: en visita, andando, o sin reportar. */
let cortePos = null, mapaVivo = null;
let mapaVivoAbierto = false, ultimaListaVivo = [];

function soltarVivo(){
  /* Si se sale de la pantalla con el mapa ampliado, hay que devolverlo:
     si no, la clase del body deja la app entera sin poder desplazarse. */
  if (mvLleno) mvAmpliar(false);
  /* Antes esto tambien destruia el mapa. Como soltarVivo se llama desde
     varios lados —al entrar a Administrar, al cambiar de pantalla—, el
     mapa se creaba y se destruia enseguida, y quedaba el cuadro gris.
     Ahora solo se corta la escucha de posiciones, que es lo unico que de
     verdad hay que soltar. El mapa se rearma solo si su recuadro
     desaparece, y eso ya lo revisa armarMapaVivo. */
  if (cortePos){ try { cortePos(); } catch(e){} cortePos = null; }
}

function haceCuanto(ts){
  if (!ts || !ts.toDate) return {txt:"sin reportar", min:9999};
  const min = Math.round((Date.now() - ts.toDate().getTime())/60000);
  if (min < 1) return {txt:"ahorita", min:0};
  if (min < 60) return {txt:"hace " + min + " min", min:min};
  return {txt:"hace " + Math.round(min/60) + " h", min:min};
}

function marcarActualizado(){
  const cA = document.getElementById("vivo-actualizado");
  if (cA) cA.textContent = "Actualizado " +
    new Date().toLocaleTimeString("es-SV", {hour:"2-digit", minute:"2-digit"});
}

function inicialesDe(nom){
  const p = String(nom || "?").trim().split(/\s+/);
  return ((p[0]||"?")[0] + (p[1] ? p[1][0] : "")).toUpperCase();
}

/* Las filas se arman aparte porque las pintan DOS lugares: la tarjeta de
   En vivo y la hoja del mapa a pantalla llena. Una sola fuente, para que
   nunca digan cosas distintas. */
function filasVivoHTML(lista){
  return (lista || []).map(g => {
    const h = haceCuanto(g.hora);
    const clase = g.cerrado ? "frio" : (h.min > 20 ? "frio" : (g.en ? "env" : ""));
    const donde = g.cerrado ? "terminó su día" + (g.fin ? " a las " + escapar(g.fin) : "")
      : (h.min > 20 ? "sin señal " + h.txt
      : (g.en ? "en " + escapar(g.en) : "en camino"));
    return '<div class="vivo-fila" data-uid="' + g.uid + '">' +
      '<span class="vivo-ini ' + clase + '">' + escapar(inicialesDe(g.nombre)) + '</span>' +
      '<span class="vivo-qui"><b>' + escapar(g.nombre || "") + '</b>' +
        '<small>' + donde + ' · ' + h.txt +
        (g.arranque ? ' · arrancó ' + escapar(g.arranque) : '') + '</small></span>' +
      '<span class="vivo-num"><b class="num">' + (g.rol === "despacho" ? "" : money(g.vendido || 0)) + '</b>' +
        '<small>' + (g.visitas || 0) + ' visitas</small></span>' +
    '</div>';
  }).join("");
}

function pintarVivo(gente){
  const cont = $("#vivo-filas");
  if (!cont) return;
  const hoy = hoyISO();
  const lista = gente.filter(g => g.fecha === hoy)
    .sort((a,b) => (a.nombre||"").localeCompare(b.nombre||"","es"));
  if (!lista.length){
    cont.innerHTML = '<div class="conteo">Nadie ha reportado posición hoy. ' +
      'Los teléfonos reportan solos al entrar a la app.</div>';
    ultimaListaVivo = [];
    if (mapaVivoAbierto) armarMapaVivo([]);
    mvPintarHoja();
    marcarActualizado();
    return;
  }
  cont.innerHTML = filasVivoHTML(lista);

  ultimaListaVivo = lista;
  if (mapaVivoAbierto) armarMapaVivo(mvFiltrada());
  mvPintarHoja();
  marcarActualizado();
}

const MAPA_VIVO_DIAG = {creado:"", ok:0, malos:0, ultimoError:"", ancho:0, alto:0, esperas:0};
function armarMapaVivo(lista){
  const caja = document.getElementById("mapa-vivo");
  if (caja){ MAPA_VIVO_DIAG.ancho = caja.offsetWidth; MAPA_VIVO_DIAG.alto = caja.offsetHeight; }
  /* Si la libreria vino incompleta, se avisa en pantalla en vez de dejar
     un cuadro gris sin explicacion, y se reintenta cuando llegue la
     buena. Antes esto era el unico caso que no decia nada. */
  if (caja && (!window.L || !L.version || typeof L.map !== "function")){
    caja.innerHTML = '<div style="display:flex;height:100%;align-items:center;' +
      'justify-content:center;text-align:center;padding:14px;font-size:13px;' +
      'color:var(--tenue)">El mapa se est\u00e1 cargando\u2026<br>' +
      'Si no aparece, revise la se\u00f1al.</div>';
    window.LEAFLET_LISTO = () => {
      const c = document.getElementById("mapa-vivo");
      if (c){ c.innerHTML = ""; armarMapaVivo(lista); }
    };
    return;
  }
  if (caja && caja.firstChild && !mapaVivo) caja.innerHTML = "";
  if (!window.L || !caja) return;
  /* Si el recuadro todavia no tiene tamano en pantalla, Leaflet cree que
     mide cero y no dibuja: queda el cuadro gris. Antes se reintentaba con
     dos temporizadores a ciegas y no siempre alcanzaba. Ahora se espera a
     que el recuadro mida de verdad, y ademas se vigila: si cambia de
     tamano despues (al girar el telefono, al abrirse un teclado), el mapa
     se reacomoda solo. */
  if (!caja.offsetWidth || !caja.offsetHeight){
    if (!caja._espera){
      caja._espera = true; MAPA_VIVO_DIAG.esperas++;
      const vigilar = () => {
        if (!document.getElementById("mapa-vivo")) return;
        if (caja.offsetWidth && caja.offsetHeight){ caja._espera = false; armarMapaVivo(lista); return; }
        requestAnimationFrame(vigilar);
      };
      requestAnimationFrame(vigilar);
    }
    return;
  }
  const conPunto = lista.filter(g => g.lat != null);
  if (!mapaVivo || !mapaVivo._container || !mapaVivo._container.isConnected){
    /* Si la pantalla se volvio a pintar, el mapa viejo quedo colgando de
       un div que ya no existe: hay que soltarlo y armarlo de nuevo. */
    if (mapaVivo){ try { mapaVivo.remove(); } catch(e){} mapaVivo = null; }
    mapaVivo = L.map("mapa-vivo", {zoomControl:false, attributionControl:false, maxZoom:19})
      .setView(conPunto.length ? [conPunto[0].lat, conPunto[0].lng] : [13.4833,-88.1833], 13);
    /* Se cuentan los mosaicos que cargan y los que fallan. Si el mapa se
       ve gris, con esto se sabe si es que no llegan las imagenes o si es
       que el mapa nunca se armo. */
    const capa = L.tileLayer(CAPAS.calles.url, CAPAS.calles.ops).addTo(mapaVivo);
    MAPA_VIVO_DIAG.creado = new Date().toLocaleTimeString();
    MAPA_VIVO_DIAG.ok = 0; MAPA_VIVO_DIAG.malos = 0; MAPA_VIVO_DIAG.ultimoError = "";
    capa.on("tileload", () => { MAPA_VIVO_DIAG.ok++; });
    capa.on("tileerror", e => {
      MAPA_VIVO_DIAG.malos++;
      MAPA_VIVO_DIAG.ultimoError = (e && e.tile && e.tile.src) ? e.tile.src : "sin detalle";
    });
    mapaVivo._capa = L.layerGroup().addTo(mapaVivo);
    /* Por que se veia gris hasta que uno salia y volvia: al crearse, el
       navegador todavia no le habia dado su lugar en la pantalla, y
       Leaflet se quedaba con la medida vieja. Al volver ya la tenia. En
       vez de esperar un momento exacto que nunca acierta, se insiste
       durante los primeros segundos y despues se deja de molestar. */
    const acomodar = () => { try { mapaVivo && mapaVivo.invalidateSize(); } catch(e){} };
    let veces = 0;
    const reloj = setInterval(() => {
      acomodar();
      if (++veces >= 12 || !mapaVivo) clearInterval(reloj);
    }, 250);
    acomodar();
    if (window.ResizeObserver && !caja._ojo){
      caja._ojo = new ResizeObserver(acomodar);
      caja._ojo.observe(caja);
    }
  }
  /* Y cada vez que llega gente nueva, se vuelve a acomodar: es gratis y
     tapa el caso de que la pantalla haya cambiado de tamano en medio. */
  try { mapaVivo.invalidateSize(); } catch(e){}
  mapaVivo._capa.clearLayers();
  const puntos = [];
  conPunto.forEach(g => {
    const h = haceCuanto(g.hora);
    const clase = (g.cerrado || h.min > 20) ? "frio" : (g.en ? "env" : "");
    L.marker([g.lat, g.lng], {icon:L.divIcon({className:"", iconSize:[30,30], iconAnchor:[15,30],
      html:'<div class="marca-vivo ' + clase + '">' + escapar(inicialesDe(g.nombre)) + '</div>'})})
      .addTo(mapaVivo._capa)
      .on("click", () => alert(g.nombre + "\n" + (g.en ? "En " + g.en : "En camino") +
        "\n" + h.txt + (g.arranque ? " · arrancó " + g.arranque : "")));
    puntos.push([g.lat, g.lng]);
  });
  if (puntos.length > 1) mapaVivo.fitBounds(puntos, {padding:[30,30]});
  else if (puntos.length === 1) mapaVivo.setView(puntos[0], 16);
}

/* ================= En vivo: el mapa a pantalla llena =================
   Oficina abre el mapa de orilla a orilla para buscar a alguien. La lista
   de la gente flota encima y SE PUEDE BAJAR de un toque o arrastrandola,
   para que quede solo el mapa con los puntos. Es el mismo patron del mapa
   de la ruta (#pant-ruta.lleno), pero con la clase en el body, porque el
   bloque En vivo vive en dos pantallas. */
/* var y no let: soltarVivo() esta definida mas arriba y lee mvLleno. Con let
   quedaria en zona muerta si algo la llamara antes de esta linea. */
var mvLleno = false, mvFiltro = "todos";

/* El filtro sale de datos que YA vienen en posiciones: el rol y hace
   cuanto reporto. No se pide un dato mas ni se gasta una lectura mas. */
function mvFiltrada(){
  const L = ultimaListaVivo || [];
  if (mvFiltro === "preventa") return L.filter(g => g.rol !== "despacho");
  if (mvFiltro === "reparto")  return L.filter(g => g.rol === "despacho");
  if (mvFiltro === "frios")    return L.filter(g => g.cerrado || haceCuanto(g.hora).min > 20);
  return L;
}

function mvArmarCapa(){
  if (document.getElementById("mv-cap")) return;
  const cap = document.createElement("div");
  cap.className = "mv-cap"; cap.id = "mv-cap"; cap.hidden = true;
  cap.innerHTML =
    '<div class="mv-barra">' +
      '<span class="mv-tit"><b>En vivo</b><small id="mv-sub">—</small></span>' +
      '<button class="mv-cerrar" id="mv-cerrar" title="Volver" aria-label="Volver">' +
        '<svg viewBox="0 0 24 24"><path d="M18 6L6 18M6 6l12 12"/></svg></button>' +
    '</div>' +
    '<div class="mv-chips" id="mv-chips">' +
      '<button data-f="todos" aria-pressed="true">Todos</button>' +
      '<button data-f="preventa" aria-pressed="false">Preventa</button>' +
      '<button data-f="reparto" aria-pressed="false">Reparto</button>' +
      '<button data-f="frios" aria-pressed="false">Sin señal</button>' +
    '</div>';
  document.body.appendChild(cap);

  const hoja = document.createElement("div");
  hoja.className = "mv-hoja"; hoja.id = "mv-hoja"; hoja.hidden = true;
  hoja.innerHTML =
    '<button class="mv-tirador" id="mv-tirador" aria-expanded="true" ' +
      'aria-controls="mv-filas" title="Bajar la lista">' +
      '<span class="mv-agarre"></span>' +
      '<span class="eyebrow" id="mv-rotulo">Quién anda dónde</span>' +
    '</button>' +
    '<div id="mv-filas"></div>';
  document.body.appendChild(hoja);

  $("#mv-cerrar").onclick = () => mvAmpliar(false);

  $("#mv-chips").onclick = e => {
    const b = e.target.closest("button[data-f]");
    if (!b) return;
    mvFiltro = b.dataset.f;
    $$("#mv-chips button").forEach(x => x.setAttribute("aria-pressed", String(x === b)));
    armarMapaVivo(mvFiltrada());
    mvPintarHoja();
  };

  /* Bajar la hoja: de un toque en el agarre, o arrastrandola. Las dos, porque
     el toque nunca falla y el arrastre es lo que la mano espera. */
  const tirador = $("#mv-tirador");
  tirador.onclick = () => mvRecoger(!hoja.classList.contains("recogida"));

  let y0 = null, movido = 0;
  tirador.addEventListener("pointerdown", e => {
    y0 = e.clientY; movido = 0;
    hoja.classList.add("sin-animacion");
    try { tirador.setPointerCapture(e.pointerId); } catch(_){}
  });
  tirador.addEventListener("pointermove", e => {
    if (y0 == null) return;
    movido = e.clientY - y0;
    const recogida = hoja.classList.contains("recogida");
    // solo se deja arrastrar hacia donde tiene sentido
    const d = recogida ? Math.min(0, movido) : Math.max(0, movido);
    hoja.style.transform = "translateY(calc(" + (recogida ? "100% - 46px" : "0px") + " + " + d + "px))";
  });
  const soltar = () => {
    if (y0 == null) return;
    y0 = null;
    hoja.classList.remove("sin-animacion");
    hoja.style.transform = "";
    if (Math.abs(movido) > 40) mvRecoger(movido > 0);
    // si apenas se movio, el click del boton se encarga
    movido = 0;
  };
  tirador.addEventListener("pointerup", soltar);
  tirador.addEventListener("pointercancel", soltar);

  document.addEventListener("keydown", e => { if (e.key === "Escape" && mvLleno) mvAmpliar(false); });
}

function mvRecoger(si){
  const hoja = $("#mv-hoja"); if (!hoja) return;
  hoja.classList.toggle("recogida", !!si);
  const t = $("#mv-tirador");
  if (t){
    t.setAttribute("aria-expanded", String(!si));
    t.title = si ? "Subir la lista" : "Bajar la lista";
  }
  const r = $("#mv-rotulo");
  if (r) r.textContent = si ? "Subir la lista" : "Quién anda dónde";
  // el mapa gano o perdio alto util: que Leaflet lo sepa
  requestAnimationFrame(() => { try { mapaVivo && mapaVivo.invalidateSize(); } catch(_){} });
}

function mvPintarHoja(){
  const c = document.getElementById("mv-filas");
  if (!c) return;
  const lista = mvFiltrada();
  c.innerHTML = lista.length ? filasVivoHTML(lista)
    : '<div class="conteo" style="padding:8px 0">Nadie con ese filtro ahorita.</div>';
  const sub = document.getElementById("mv-sub");
  if (sub) sub.textContent = lista.length
    ? (lista.length === 1 ? "1 en la calle" : lista.length + " en la calle")
    : "nadie reportando";
}

function mvAmpliar(si){
  si = !!si;
  if (si) mvArmarCapa();
  mvLleno = si;
  document.body.classList.toggle("mv-lleno", si);
  const cap = document.getElementById("mv-cap"), hoja = document.getElementById("mv-hoja");
  if (cap) cap.hidden = !si;
  if (hoja) hoja.hidden = !si;
  if (si) mvPintarHoja();
  /* El recuadro acaba de cambiar de tamano. Leaflet todavia cree que mide lo
     de antes, asi que se le avisa DESPUES de que el navegador reacomodo. */
  requestAnimationFrame(() => {
    try { mapaVivo && mapaVivo.invalidateSize(); } catch(_){}
    if (mapaVivoAbierto) armarMapaVivo(mvFiltrada());
  });
}

function bloqueEnVivo(m){
  m.insertAdjacentHTML("afterbegin",
    '<div class="pasos"><div class="eyebrow">En vivo</div>' +
      '<p style="font-size:14px;margin:8px 0 10px">Dónde anda cada quien ahorita, ' +
      'a qué hora arrancó y cómo va. Se actualiza solo, sin saltar.</p>' +
      '<div id="vivo-filas"><div class="conteo">Cargando…</div></div>' +
      '<button class="btn linea" id="ver-mapa-vivo" style="margin-top:10px">Ver en el mapa</button>' +
      '<div class="mv-caja" id="mv-caja" hidden>' +
        '<div id="mapa-vivo"></div>' +
        /* El boton NO puede ir dentro de #mapa-vivo: Leaflet se adueña de ese
           recuadro y armarMapaVivo() le limpia los hijos. Va en el envoltorio. */
        '<button class="mv-ampliar" id="mv-ampliar" title="Ampliar el mapa" ' +
          'aria-label="Ampliar el mapa"><svg viewBox="0 0 24 24">' +
          '<path d="M15 3h6v6M9 21H3v-6M21 3l-7 7M3 21l7-7"/></svg></button>' +
      '</div>' +
      '<div id="vivo-actualizado" class="conteo" style="text-align:center;margin-top:8px"></div>' +
    '</div>');
  /* El mapa YA NO se dibuja de una. La lista es lo que oficina lee; el mapa
     vivo -que se redibuja con cada senal de GPS y hacia saltar la pantalla-
     queda detras de un toque, para cuando de verdad haya que buscar a
     alguien. Asi la oficina se queda quieta y se lee tranquila. */
  mapaVivoAbierto = false;
  const btnMv = $("#ver-mapa-vivo");
  if (btnMv) btnMv.onclick = () => {
    mapaVivoAbierto = !mapaVivoAbierto;
    const cj = document.getElementById("mv-caja");
    if (cj) cj.hidden = !mapaVivoAbierto;
    btnMv.textContent = mapaVivoAbierto ? "Ocultar el mapa" : "Ver en el mapa";
    if (mapaVivoAbierto) armarMapaVivo(mvFiltrada());
  };
  const btnAmp = $("#mv-ampliar");
  if (btnAmp) btnAmp.onclick = () => mvAmpliar(true);
  cortePos = db.collection("posiciones").onSnapshot(
    q => pintarVivo(q.docs.map(d => Object.assign({uid:d.id}, d.data()))),
    e => { const c = $("#vivo-filas"); if (c) c.textContent = "No se pudo leer (" + (e.code||e.message) + ")."; }
  );
}

let tableroFecha = null, tableroRango = "hoy";
/* Los cuatro rangos de la tira de fechas. Se calculan sobre el dia que se
   este viendo, asi que las flechas de dia siguen sirviendo. */
function rangoTablero(f){
  const [a,mm,d] = f.split("-").map(Number);
  const iso = x => x.getFullYear() + "-" + String(x.getMonth()+1).padStart(2,"0") +
                   "-" + String(x.getDate()).padStart(2,"0");
  if (tableroRango === "semana"){
    const hoy = new Date(a, mm-1, d);
    const lun = new Date(a, mm-1, d - ((hoy.getDay() + 6) % 7));   // la semana abre el lunes
    return {desde: iso(lun), hasta: f, rot: "Esta semana"};
  }
  if (tableroRango === "mes") return {desde: f.slice(0,7) + "-01", hasta: f, rot: "Este mes"};
  if (tableroRango === "ayer"){ const x = corrido(f,-1); return {desde:x, hasta:x, rot:"Ayer"}; }
  return {desde: f, hasta: f, rot: f === hoyISO() ? "Hoy" : fechaBonita(f)};
}

function adminTablero(m){
  if (!tableroFecha) tableroFecha = hoyISO();
  const f = tableroFecha;
  const R = rangoTablero(f);
  const [aa,mm,dd] = f.split("-").map(Number);
  const diaSem = new Date(aa, mm-1, dd).getDay();
  const secsDia = S.sectores.filter(x => x.activo !== false && tieneDia(x) && Number(x.dia) === diaSem);
  const idsDia = secsDia.map(x => x.id);
  const clientesDia = S.clientes.filter(c => c.activo !== false && idsDia.indexOf(c.sectorId) >= 0);

  m.innerHTML =
    '<div class="t-tira" id="t-tira">' +
      [["ayer","Ayer"],["hoy","Hoy"],["semana","Esta semana"],["mes","Este mes"]]
        .map(x => '<button data-r="' + x[0] + '" aria-pressed="' +
          (tableroRango === x[0]) + '">' + x[1] + '</button>').join("") +
    '</div>' +
    '<div class="meta">' +
      '<div class="dia">' +
        '<button id="t-ayer" style="font-size:19px;color:var(--verde);padding:0 8px">‹</button>' +
        '<span style="flex:1;text-align:center">' + (f === hoyISO() ? "Hoy" : fechaBonita(f)) + '</span>' +
        '<button id="t-manana" style="font-size:19px;color:var(--verde);padding:0 8px">›</button>' +
      '</div>' +
      '<div class="conteo" style="text-align:center">' +
        (secsDia.length ? secsDia.map(x => escapar(x.nombre)).join(" · ") : "Ningún sector toca este día") +
      '</div>' +
    '</div>' +
    '<div id="t-cuerpo"><div class="conteo">Cargando…</div></div>';

  if (f === hoyISO()) bloqueEnVivo(m);

  if ($("#t-tira")) $("#t-tira").onclick = e => {
    const b = e.target.closest("button[data-r]");
    if (!b) return;
    tableroRango = b.dataset.r;
    if (tableroRango === "ayer" || tableroRango === "hoy") tableroFecha = hoyISO();
    pintarAdmin();
  };
  $("#t-ayer").onclick = () => { tableroFecha = corrido(f,-1); pintarAdmin(); };
  $("#t-manana").onclick = () => { tableroFecha = corrido(f,1); pintarAdmin(); };

  /* La fecha se guarda como texto AAAA-MM-DD, asi que un rango por orden
     alfabetico es exactamente un rango de fechas. Son las mismas cuatro
     consultas para cualquier rango; lo que crece es cuantos documentos
     devuelven. */
  const enRango = col => db.collection(col)
    .where("fecha", ">=", R.desde).where("fecha", "<=", R.hasta).get();
  Promise.all([
    enRango("visitas"), enRango("pedidos"), enRango("agenda"), enRango("entregas"),
    // lo PROGRAMADO para entregar va por fechaEntrega, no por la fecha del pedido
    db.collection("pedidos").where("fechaEntrega", ">=", R.desde)
      .where("fechaEntrega", "<=", R.hasta).get()
  ]).then(([qv, qp, qa, qe, qpe]) => {
    [["tablero por rango: visitas", qv], ["tablero por rango: pedidos", qp], ["tablero por rango: agenda", qa],
     ["tablero por rango: entregas", qe], ["tablero por rango: programadas", qpe]].forEach(x => anotarLectura(x[0], x[1]));
    const programadas = qa.size;
    const c = $("#t-cuerpo");
    if (!c) return;
    const vis = qv.docs.map(d => d.data());
    const ped = qp.docs.map(d => d.data()).filter(esVenta);
    const verde = vis.filter(v => v.resultado === "pedido").length;
    const amar  = vis.length - verde;
    const base = programadas || clientesDia.length;
    const rojo  = Math.max(0, base - vis.length);
    const totalC = Math.max(1, base || vis.length);
    const monto = ped.reduce((a,x) => a + (Number(x.total)||0), 0);
    const conT = vis.filter(v => v.duracionSeg);
    const promMin = conT.length ? Math.round(conT.reduce((a,v) => a + v.duracionSeg, 0) / conT.length / 60) : null;
    const efect = vis.length ? Math.round(verde / vis.length * 100) : 0;
    const pc = n => Math.round(n / totalC * 1000) / 10;

    const barra = (v, a, r, t, fina) =>
      '<div class="apilada' + (fina ? " fina" : "") + '">' +
        (v ? '<i class="v" style="width:' + (v/t*100) + '%"><span>' + v + '</span></i>' : '') +
        (a ? '<i class="a" style="width:' + (a/t*100) + '%"><span>' + a + '</span></i>' : '') +
        (r ? '<i class="r" style="width:' + (r/t*100) + '%"><span>' + r + '</span></i>' : '') +
      '</div>';

    // por preventista
    const porQuien = {};
    vis.forEach(v => {
      const k = v.preventaUid || "?";
      porQuien[k] = porQuien[k] || {nombre:v.preventaNombre || "sin nombre", v:0, a:0, min:0, nmin:0};
      if (v.resultado === "pedido") porQuien[k].v++; else porQuien[k].a++;
      if (v.duracionSeg){ porQuien[k].min += v.duracionSeg/60; porQuien[k].nmin++; }
    });
    const montoQuien = {};
    ped.forEach(x => { montoQuien[x.preventaUid] = (montoQuien[x.preventaUid]||0) + (Number(x.total)||0); });
    const nuevosQuien = {};
    S.clientes.filter(c => c.creadoEl === f && c.creadoPor)
      .forEach(c => { nuevosQuien[c.creadoPor] = (nuevosQuien[c.creadoPor]||0) + 1; });
    const filas = Object.keys(porQuien).map(k => Object.assign({uid:k}, porQuien[k]))
      .sort((a,b) => (b.v + b.a) - (a.v + a.a));

    /* Cumplimiento de entregas: lo que de verdad se entrego contra lo que
       estaba programado para entregarse en este rango. Es la medida que
       oficina ya mira en Handy. */
    /* Solo cuentan las entregas HECHAS. En `entregas` tambien se guardan las
       que se marcaron "no entregado" (cerrarEntrega las escribe igual, con su
       estado), y qe.size las contaba como cumplidas: una entrega fallida
       subia el porcentaje. Igual que hace la pantalla de seguimiento. */
    const entHechas = qe.docs.filter(d => (d.data().estado || "") !== "no entregado").length;
    const entProg = qpe.size;
    const cumpl = entProg ? Math.round(entHechas / entProg * 1000) / 10 : null;
    /* Umbrales del negocio, no del gusto: 90 o mas va bien; de 75 a 90 hay
       que mirarlo; abajo de 75 se quedaron entregas sin hacer. */
    const eCum = cumpl == null ? "ojo" : (cumpl >= 90 ? "bien" : (cumpl >= 75 ? "ojo" : "mal"));
    const rotCum = cumpl == null ? "Sin programar"
      : (eCum === "bien" ? "Va bien" : (eCum === "ojo" ? "Ojo" : "Se quedó corto"));

    c.innerHTML =
      '<div class="t-kpis">' +
        '<div class="t-kpc hero"><span class="et">Vendido · ' + escapar(R.rot) + '</span>' +
          '<span class="nm">' + money(monto) + '</span>' +
          '<span class="sb">' + ped.length + ' pedidos · ' + vis.length + ' visitas</span></div>' +
        '<div class="t-kpc"><span class="et">Efectividad</span>' +
          '<span class="nm">' + efect + '%</span>' +
          '<span class="sb">dejaron pedido</span></div>' +
        '<div class="t-kpc"><span class="et">Cumplimiento</span>' +
          '<span class="nm">' + (cumpl == null ? "—" : cumpl.toFixed(0) + "%") + '</span>' +
          '<span class="sb">' + entHechas + ' de ' + entProg + ' entregas</span>' +
          '<span class="chip ' + eCum + '">' + rotCum + '</span></div>' +
        '<div class="t-kpc"><span class="et">Sin visitar</span>' +
          '<span class="nm">' + rojo + '</span>' +
          '<span class="sb">clientes del rango</span></div>' +
        '<div class="t-kpc"><span class="et">Minutos</span>' +
          '<span class="nm">' + (promMin != null ? promMin : "—") + '</span>' +
          '<span class="sb">por visita</span></div>' +
        '<div class="t-kpc"><span class="et">En la calle</span>' +
          '<span class="nm">' + (S.usuarios||[]).filter(u => u.rol === "preventa" && u.activo !== false).length + '</span>' +
          '<span class="sb">preventistas</span></div>' +
      '</div>' +

      '<div class="meta">' +
        '<div class="eyebrow">Cómo salió el día</div>' +
        barra(verde, amar, rojo, totalC) +
        '<div class="leyenda">' +
          '<span><i class="v"></i>Le compraron <b>' + verde + '</b> · ' + pc(verde) + '%</span>' +
          '<span><i class="a"></i>Visitados sin venta <b>' + amar + '</b> · ' + pc(amar) + '%</span>' +
          '<span><i class="r"></i>Sin visitar <b>' + rojo + '</b> · ' + pc(rojo) + '%</span>' +
        '</div>' +
      '</div>' +

      (filas.length
        ? '<div class="meta"><div class="eyebrow">Por preventista</div>' +
          filas.map(x => {
            const t = Math.max(1, x.v + x.a);
            return '<div class="fila-eq">' +
              '<div class="cab"><b>' + escapar(x.nombre) + '</b>' +
                '<span>' + money(montoQuien[x.uid] || 0) +
                (x.nmin ? ' · ' + Math.round(x.min/x.nmin) + ' min por visita' : '') +
                (nuevosQuien[x.uid] ? ' · ' + nuevosQuien[x.uid] + ' cliente' + (nuevosQuien[x.uid]>1?'s':'') + ' nuevo' + (nuevosQuien[x.uid]>1?'s':'') : '') + '</span></div>' +
              barra(x.v, x.a, 0, t, true) +
            '</div>';
          }).join("") + '</div>'
        : '<div class="vacio"><p>Nadie registró visitas este día.</p></div>') +

      (amar ? '<div class="meta"><div class="eyebrow">Por qué no compraron</div>' +
        (() => {
          const cu = {};
          vis.filter(v => v.resultado !== "pedido").forEach(v => { cu[v.resultado] = (cu[v.resultado]||0)+1; });
          return Object.keys(cu).sort((a,b) => cu[b]-cu[a]).map(k =>
            '<div class="lin"><div class="n">' + escapar(k) + '</div>' +
            '<div class="t"><b class="num">' + cu[k] + '</b></div></div>').join("");
        })() + '</div>' : '') +

      '<div class="meta"><div class="eyebrow">Jornada del preventista</div>' +
        '<p style="font-size:14px;margin:8px 0 0">La pel\u00edcula del d\u00eda: a qu\u00e9 hora cay\u00f3 cada visita ' +
        'y d\u00f3nde hubo huecos largos.</p>' +
        '<label class="campo"><span>Preventista</span><select id="jor-quien">' +
          '<option value="">Elija\u2026</option>' +
          filas.map(x => '<option value="' + escapar(x.uid) + '">' + escapar(x.nombre) + '</option>').join("") +
        '</select></label>' +
        '<div id="jor-cuerpo"></div></div>';

    /* La visita se anota al CERRARSE, asi que la hora de inicio se calcula
       restando la duracion. Huecos de mas de 30 min se marcan. */
    const HUECO = 30 * 60 * 1000;

  $("#jor-quien").onchange = () => {
      const uid = $("#jor-quien").value;
      const cont = $("#jor-cuerpo");
      if (!uid || !cont){ if (cont) cont.innerHTML = ""; return; }
      const suyas = vis.filter(v => v.preventaUid === uid && v.creado && v.creado.toDate)
        .map(v => {
          const fin = v.creado.toDate().getTime();
          const dur = (Number(v.duracionSeg) || 0) * 1000;
          return Object.assign({}, v, {fin: fin, ini: fin - dur});
        })
        .sort((a,b) => a.ini - b.ini);
      if (!suyas.length){
        cont.innerHTML = '<div class="conteo" style="margin-top:8px">Sin visitas con hora ese d\u00eda.</div>';
        return;
      }
      const hora = t => {
        const d = new Date(t);
        return String(d.getHours()).padStart(2,"0") + ":" + String(d.getMinutes()).padStart(2,"0");
      };
      let html = "", huecos = 0, trasN = 0, trasMs = 0;
      suyas.forEach((v, i) => {
        if (i > 0){
          /* El traslado de un cliente al siguiente. Antes esto solo se
             pintaba cuando pasaba de media hora, y con cara de problema
             ("Hueco de N min"). El jefe quiere ver cuanto se tarda en
             llegar SIEMPRE, no nada mas cuando se tarda de mas.
             Sale del dato que ya estaba guardado — la hora en que cerro
             la visita anterior contra la hora en que abrio esta — asi
             que tambien se ve en los dias que ya pasaron. */
          const brecha = Math.max(0, v.ini - suyas[i-1].fin);
          const largo = brecha > HUECO;
          if (largo) huecos++;
          trasN++; trasMs += brecha;
          html += '<div class="tras' + (largo ? ' largo' : '') + '">' +
            '<i></i><span>' + (largo ? 'Hueco de ' : 'Traslado de ') + ratos(brecha) +
            (v.trasladoMetros != null ? ' \u00b7 ' + tramo(v.trasladoMetros) : '') +
            '</span></div>';
        }
        const vendio = v.resultado === "pedido";
        html += '<div class="lin"><div style="flex:1;min-width:0">' +
          '<div class="n">' + hora(v.ini) + ' \u00b7 ' + escapar(v.clienteNombre || "") + '</div>' +
          '<div class="d">' + escapar(v.resultado || "") +
            (v.duracionSeg ? ' \u00b7 ' + Math.round(v.duracionSeg/60) + ' min' : '') +
            (v.metrosDelCliente != null ? ' \u00b7 a ' + v.metrosDelCliente + ' m del punto' : '') +
            (v.fueraDelPunto != null ? ' \u00b7 fuera del punto' : '') +
          '</div></div>' +
          '<div class="t"><b class="num" style="color:var(--' + (vendio ? 'verde' : 'tenue') + ')">' +
            (vendio ? money(v.monto || 0) : '\u2014') + '</b></div></div>';
      });
      const primera = suyas[0].ini, ultima = suyas[suyas.length-1].fin;
      cont.innerHTML =
        '<div class="conteo" style="margin:8px 0">Arranc\u00f3 ' + hora(primera) +
        ' \u00b7 termin\u00f3 ' + hora(ultima) +
        ' \u00b7 ' + Math.round((ultima - primera)/3600000 * 10)/10 + ' h de jornada' +
        (huecos ? ' \u00b7 ' + huecos + ' hueco' + (huecos>1?'s':'') : '') + '</div>' +
        /* Lo que el jefe pidio, en un solo renglon: cuanto del dia se le
           va al vendedor manejando entre cliente y cliente. */
        (trasN ? '<div class="conteo" style="margin:8px 0">En traslados ' +
          ratos(trasMs) + ' de ' + trasN + ' tramo' + (trasN>1?'s':'') +
          ' \u00b7 promedio ' + ratos(Math.round(trasMs/trasN)) +
          ' \u00b7 con los clientes ' + ratos(suyas.reduce((a,v) =>
            a + (Number(v.duracionSeg)||0)*1000, 0)) + '</div>' : '') + html;
    };
  }).catch(e => {
    const c = $("#t-cuerpo");
    if (c) c.innerHTML = '<div class="aviso">No se pudo leer el día (' + (e.code||e.message) + ').</div>';
  });
}

function corrido(iso, pasos){
  const [a,m,d] = iso.split("-").map(Number);
  const f = new Date(a, m-1, d + pasos);
  return f.getFullYear() + "-" + String(f.getMonth()+1).padStart(2,"0") + "-" + String(f.getDate()).padStart(2,"0");
}

function adminFoco(m){
  const foco = (S.foco && S.foco.productos) || [];
  const c = S.comis || {porcentaje:0, bonoMeta:0, bonoFoco:0};
  const puedeCostos = S.rol === "admin";

  m.innerHTML =
    '<div class="meta"><div class="eyebrow">Tabla de foco · ' + mesISO() + '</div>' +
      '<div class="conteo">' + foco.length + ' productos en foco este mes</div>' +
      '<div id="fo-avance"><div class="conteo">Cargando avance…</div></div>' +
    '</div>' +

    (soloVer() ? '' :
    '<div class="pasos"><div class="eyebrow">Agregar producto al foco</div>' +
      '<label class="campo"><span>Producto</span><select id="fo-prod"><option value="">Elija…</option>' +
        S.catalogo.map(x => '<option value="' + x.cod + '">' + escapar(x.cod + " · " + x.nombre) + '</option>').join("") +
      '</select></label>' +
      '<label class="campo"><span>Meta del mes (unidades, todo el equipo)</span>' +
        '<input id="fo-meta" type="number" inputmode="numeric" value="100"></label>' +
      '<button class="btn" id="fo-add" style="margin-top:14px">Agregar al foco</button>' +
      (puedeCostos ? '<button class="btn linea" id="fo-margen" style="margin-top:9px">Ver los 10 de mejor margen</button>' : '') +
      '<div id="fo-sug"></div></div>') +

    '<div id="fo-lista"></div>' +

    (puedeCostos ?
    '<div class="pasos"><div class="eyebrow">Comisiones y bonos</div>' +
      '<p style="font-size:14px;margin:8px 0 0">Se calcula sobre lo que se <b>entreg&oacute;</b>, no sobre lo pedido. ' +
      'Si alguna regla no aplica, d&eacute;jela en cero.</p>' +
      '<label class="campo"><span>Pagar sobre</span><select id="co-modo">' +
        '<option value="venta"' + (c.modo !== "margen" ? " selected" : "") + '>La venta</option>' +
        '<option value="margen"' + (c.modo === "margen" ? " selected" : "") + '>La ganancia (precio menos costo)</option>' +
      '</select></label>' +
      '<label class="campo"><span>Comisi&oacute;n sobre la venta (%)</span>' +
        '<input id="co-pct" type="number" step="0.1" value="' + (c.porcentaje||0) + '"></label>' +
      '<label class="campo"><span>Comisi&oacute;n sobre la ganancia (%)</span>' +
        '<input id="co-pctm" type="number" step="0.1" value="' + (c.pctMargen||0) + '"></label>' +
      '<div class="eyebrow" style="margin-top:16px">Por grupo A / B / C</div>' +
      '<p style="font-size:13px;margin:6px 0 0;color:var(--tenue)">Opcional. Si pone un ' +
        'porcentaje aqu&iacute;, manda sobre el de arriba para los productos de ese grupo. ' +
        'D&eacute;jelo vac&iacute;o para que todos vayan parejo.</p>' +
      ["A","B","C"].map(g =>
        '<label class="campo"><span>Grupo ' + g + ' (%)</span><input id="co-g' + g + '" type="number" ' +
        'step="0.1" value="' + (((c.porGrupo||{})[g] != null) ? c.porGrupo[g] : "") + '"></label>').join("") +
      '<div class="eyebrow" style="margin-top:16px">Bonos</div>' +
      '<label class="campo"><span>Bono por cumplir la meta ($)</span>' +
        '<input id="co-meta" type="number" step="1" value="' + (c.bonoMeta||0) + '"></label>' +
      '<label class="campo"><span>Bono por cumplir el foco ($)</span>' +
        '<input id="co-foco" type="number" step="1" value="' + (c.bonoFoco||0) + '"></label>' +
      '<button class="btn" id="co-guardar" style="margin-top:14px">Guardar reglas</button></div>' +
    '<div id="co-cuentas"></div>' : '');

  // avance del mes
  db.collection("pedidos").where("mes","==",mesISO()).get().then(q => {
    const ped = q.docs.map(d => d.data());
    const av = avanceFoco(ped);
    const caja = $("#fo-avance");
    if (caja){
      caja.innerHTML = av
        ? '<div class="meta-cifras" style="margin-top:6px">' +
            '<div><b class="num" style="font-size:25px">' + av.pct + '%</b>' +
            '<span style="font-size:12px;color:var(--tenue);font-weight:700">' +
            av.totalHecho + ' de ' + av.totalMeta + ' unidades</span></div></div>' + barraFoco(av.pct)
        : '<div class="conteo">Todavía no hay productos en foco.</div>';
    }
    const cont = $("#fo-lista");
    if (!cont || !av) return;

    // por producto, con la cuota de cada vendedor
    const vend = S.usuarios.filter(x => x.rol === "preventa" && x.activo !== false);
    const unidadesDe = (uid, cod) => {
      let n = 0;
      ped.filter(x => x.preventaUid === uid && x.tipo !== "cambio")
         .forEach(x => (x.lineas||[]).forEach(l => { if (l.cod === cod) n += Number(l.cant)||0; }));
      return n;
    };
    cont.innerHTML =
      '<div class="meta"><div class="eyebrow">Por producto</div>' +
      av.filas.map((f, i) => {
        const fp = foco[i] || {};
        return '<div class="fila-eq"><div class="cab"><b>' + escapar(f.nombre) + '</b>' +
          '<span>' + f.hecho + '/' + f.meta + ' · ' + f.pct + '%</span></div>' +
          barraFoco(f.pct) +
          (vend.length ?
            '<div class="cuotas" style="margin-top:9px">' +
              '<div class="eyebrow">Cuota de cada vendedor</div>' +
              vend.map(u => {
                const meta = (fp.cuotas && fp.cuotas[u.uid] != null) ? Number(fp.cuotas[u.uid]) : "";
                const hizo = unidadesDe(u.uid, f.cod);
                const usada = meta === "" ? f.meta : meta;
                const pct = usada ? Math.round(hizo/usada*100) : 0;
                return '<div class="cuota-fila">' +
                  '<span class="quien">' + escapar(u.nombre || "sin nombre") + '</span>' +
                  (soloVer()
                    ? '<span class="hizo">' + (meta === "" ? f.meta : meta) + '</span>'
                    : '<input class="q-cuota" data-i="' + i + '" data-u="' + u.uid + '" type="number" ' +
                      'inputmode="numeric" min="0" placeholder="' + f.meta + '" value="' + meta + '">') +
                  '<span class="hizo">' + hizo + ' · ' + pct + '%</span>' +
                '</div>';
              }).join("") +
              (soloVer() ? '' :
                '<button class="btn secundario g-cuota" data-i="' + i + '" style="margin-top:9px;padding:9px">' +
                'Guardar cuotas</button>') +
            '</div>' : '') +
          (soloVer() ? '' :
            '<button class="quitar" data-i="' + i + '" style="margin-top:9px">Quitar del foco</button>') +
        '</div>';
      }).join("") + '</div>';

    $$("#fo-lista .g-cuota").forEach(b => b.onclick = async () => {
      const i = Number(b.dataset.i);
      const copia = foco.map(x => Object.assign({}, x));
      const c = Object.assign({}, copia[i].cuotas || {});
      $$("#fo-lista .q-cuota[data-i='" + i + "']").forEach(inp => {
        const v = inp.value.trim();
        if (v === "") delete c[inp.dataset.u];
        else c[inp.dataset.u] = Number(v) || 0;
      });
      copia[i].cuotas = c;
      await guardarEn("foco", () => db.collection("foco").doc(mesISO())
        .set({mes:mesISO(), productos:copia}), b);
    });

    // por vendedor
    const porUid = {};
    ped.forEach(x => {
      const k = x.preventaUid;
      porUid[k] = porUid[k] || {nombre:x.preventaNombre || "sin nombre", venta:0, pedidos:[]};
      porUid[k].venta += Number(x.total)||0;
      porUid[k].pedidos.push(x);
    });
    const filas = Object.keys(porUid).map(k => {
      const v = porUid[k];
      const avv = avanceFoco(v.pedidos, k);
      const mt = S.metas[k];
      const cumpleMeta = mt && mt.monto ? v.venta >= mt.monto : false;
      const cumpleFoco = avv ? avv.pct >= 100 : false;
      return {uid:k, nombre:v.nombre, venta:v.venta, foco: avv ? avv.pct : 0,
              meta: mt ? mt.monto : 0, cumpleMeta:cumpleMeta, cumpleFoco:cumpleFoco};
    }).sort((a,b) => b.venta - a.venta);

    cont.innerHTML += '<div class="meta"><div class="eyebrow">Por vendedor</div>' +
      (filas.length ? filas.map(x =>
        '<div class="fila-eq"><div class="cab"><b>' + escapar(x.nombre) + '</b>' +
          '<span>' + money(x.venta) + (x.meta ? ' de ' + money(x.meta) : '') + '</span></div>' +
          '<div class="conteo">Foco ' + x.foco + '%' +
            (x.cumpleFoco ? ' · cumplida' : '') + '</div>' +
          barraFoco(x.foco) +
        '</div>').join("") : '<div class="conteo">Sin ventas este mes.</div>') + '</div>';

    $$("#fo-lista .quitar").forEach(b => b.onclick = async () => {
      const copia = foco.slice();
      copia.splice(Number(b.dataset.i), 1);
      await db.collection("foco").doc(mesISO()).set({mes:mesISO(), productos:copia});
    });
  }).catch(()=>{});

  if ($("#fo-add")) $("#fo-add").onclick = async () => {
    const cod = $("#fo-prod").value;
    if (!cod) return alert("Elija el producto.");
    const pr = S.catalogo.find(x => x.cod === cod);
    if (foco.some(f => f.cod === cod)) return alert("Ese producto ya está en el foco.");
    const copia = foco.concat([{cod:cod, nombre: pr ? pr.nombre : cod, meta: Number($("#fo-meta").value)||0}]);
    await guardarEn("foco", () => db.collection("foco").doc(mesISO())
      .set({mes:mesISO(), productos:copia}), $("#fo-add"));
  };

  if ($("#fo-margen")) $("#fo-margen").onclick = () => {
    const top = mejoresMargenes(10);
    const caja = $("#fo-sug");
    if (!top.length){
      caja.innerHTML = '<div class="aviso dato">No hay costos cargados, así que no se puede calcular el margen.</div>';
      return;
    }
    caja.innerHTML = '<div class="eyebrow" style="margin-top:16px">Los 10 de mejor margen</div>' +
      top.map(x => '<div class="lin"><div><div class="n">' + escapar(x.p.nombre) + '</div>' +
        '<div class="d">' + x.p.cod + ' · ' + money(x.p.precio) + '</div></div>' +
        '<div class="t"><b class="num">' + x.m + '%</b>' +
        '<div class="quitar" data-c="' + x.p.cod + '" style="color:var(--verde)">Al foco</div></div></div>').join("");
    $$("#fo-sug .quitar").forEach(b => b.onclick = () => {
      $("#fo-prod").value = b.dataset.c;
      $("#fo-meta").focus();
    });
  };

  if ($("#co-guardar")) $("#co-guardar").onclick = async () => {
    const porGrupo = {};
    ["A","B","C"].forEach(g => {
      const v = $("#co-g" + g).value.trim();
      if (v !== "") porGrupo[g] = Number(v)||0;
    });
    await guardarEn("configuracion", () => db.collection("configuracion").doc("comisiones").set({
      modo: $("#co-modo").value,
      porcentaje: Number($("#co-pct").value)||0,
      pctMargen: Number($("#co-pctm").value)||0,
      porGrupo: porGrupo,
      bonoMeta: Number($("#co-meta").value)||0,
      bonoFoco: Number($("#co-foco").value)||0
    }), $("#co-guardar"));
  };

  if (puedeCostos) pintarCuentasDelMes();
}

/* Oficina calcula la cuenta de cada vendedor y la PUBLICA. El preventista
   solo lee el resultado: nunca le llega un costo al telefono. */
function pintarCuentasDelMes(){
  const cont = $("#co-cuentas");
  if (!cont) return;
  cont.innerHTML = '<div class="meta"><div class="conteo">Calculando la cuenta del mes…</div></div>';

  Promise.all([
    db.collection("pedidos").where("mes","==",mesISO()).get(),
    db.collection("cargos").where("mes","==",mesISO()).get().catch(()=>({docs:[]}))
  ]).then(([qp, qc]) => {
    if (!$("#co-cuentas")) return;
    const ped = qp.docs.map(d => Object.assign({id:d.id}, d.data()));
    const cargos = (qc.docs||[]).map(d => d.data()).filter(x => x.estado === "aceptado");
    const abc = clasificarABC(ped);
    S.abc = abc;

    const porUid = {};
    ped.filter(esVenta).forEach(p => {
      porUid[p.preventaUid] = porUid[p.preventaUid] ||
        {nombre: p.preventaNombre || "sin nombre", ped: []};
      porUid[p.preventaUid].ped.push(p);
    });

    const filas = Object.keys(porUid).map(uid => {
      const cu = cuentaDelMes(porUid[uid].ped, abc);
      const mt = S.metas[uid];
      const av = avanceFoco(porUid[uid].ped, uid);
      const cumpleMeta = mt && mt.monto ? cu.venta >= mt.monto : false;
      const bonos = bonosDe(cumpleMeta, av ? av.pct >= 100 : false);
      const porErrores = cargos.filter(x => x.paraUid === uid)
        .reduce((a,x) => a + (Number(x.monto)||0), 0);
      const neto = dosDec(cu.comision + bonos - porErrores);
      return Object.assign({uid:uid, nombre:porUid[uid].nombre, bonos:bonos,
        porErrores:dosDec(porErrores), neto:neto, meta: mt ? mt.monto : 0}, cu);
    }).sort((a,b) => b.venta - a.venta);

    const faltanCostos = filas.some(f => f.sinCosto);
    $("#co-cuentas").innerHTML =
      '<div class="meta"><div class="eyebrow">Cuenta del mes · ' + mesISO() + '</div>' +
      ((S.comis && S.comis.modo === "margen" && faltanCostos)
        ? '<div class="aviso dato">Hay productos sin costo cargado. Esas líneas quedan fuera del ' +
          'cálculo de la ganancia. Revise los costos antes de pagar.</div>' : '') +
      (filas.length ? filas.map(x =>
        '<div class="fila-eq"><div class="cab"><b>' + escapar(x.nombre) + '</b>' +
          '<span class="num">' + money(x.neto) + '</span></div>' +
          '<div class="conteo">Entregado ' + money(x.venta) +
            (x.sobreMargen ? ' · ganancia ' + money(x.margen) : '') +
            ' · comisión ' + money(x.comision) +
            (x.bonos ? ' · bonos ' + money(x.bonos) : '') + '</div>' +
          ((x.devuelto || x.porErrores) ?
            '<div class="conteo" style="color:var(--rojo)">Le descuentan: ' +
              (x.devuelto ? 'devoluciones ' + money(x.devuelto) +
                ' (comisión perdida ' + money(x.comisionPerdida) + ')' : '') +
              (x.porErrores ? (x.devuelto ? ' · ' : '') + 'cargos por error ' + money(x.porErrores) : '') +
            '</div>' : '') +
        '</div>').join("") : '<div class="conteo">Todavía no hay ventas este mes.</div>') +
      (filas.length ? '<button class="btn" id="co-publicar" style="margin-top:12px">' +
        'Publicar la cuenta al equipo</button>' +
        '<p style="font-size:12px;color:var(--tenue);margin:6px 0 0">Cada vendedor ve solo la suya, ' +
        'en su pantalla de Mi día. No se le manda ningún costo.</p>' : '') +
      '</div>' + tablaDevoluciones(ped) + tablaABC(abc);

    if ($("#co-publicar")) $("#co-publicar").onclick = async () => {
      const b = $("#co-publicar");
      b.disabled = true; b.textContent = "Publicando…";
      try {
        const lote = db.batch();
        filas.forEach(x => lote.set(db.collection("comisiones").doc(mesISO() + "_" + x.uid), {
          mes: mesISO(), preventaUid: x.uid, preventaNombre: x.nombre,
          venta: x.venta, comision: x.comision, bonos: x.bonos,
          devuelto: x.devuelto, comisionPerdida: x.comisionPerdida,
          porErrores: x.porErrores, neto: x.neto, meta: x.meta,
          publicadoPorNombre: S.nombre,
          publicadoEn: firebase.firestore.FieldValue.serverTimestamp()
        }));
        await lote.commit();
        b.textContent = "Publicada";
      } catch(e){
        b.disabled = false; b.textContent = "Publicar la cuenta al equipo";
        alert("No se pudo publicar (" + (e.code||e.message) + ").");
      }
    };
  }).catch(() => {
    if ($("#co-cuentas")) $("#co-cuentas").innerHTML =
      '<div class="meta"><div class="conteo">No se pudo calcular la cuenta.</div></div>';
  });
}

/* Devoluciones del mes. Oficina puede quitarle el peso a una cuando no fue
   culpa del vendedor (el cliente no estaba, cerro, ya no quiso): al
   perdonarla, esa venta y su comision vuelven a contarle. */
function tablaDevoluciones(pedidos){
  const filas = [];
  pedidos.filter(esVenta).forEach(p => {
    if (!(p.estado === "entregado parcial" || p.estado === "no entregado")) return;
    const noDado = (p.lineas||[]).reduce((a,l) =>
      a + Math.max(0, (Number(l.cant)||0) - cantEntregada(l)) * (Number(l.precio)||0), 0);
    if (noDado <= 0) return;
    filas.push({id:p.id, monto:dosDec(noDado), cliente:p.clienteNombre || "",
                preventa:p.preventaNombre || "", fecha:p.fecha || "",
                motivo:p.motivoNoEntrega || p.notaEntrega || "",
                perdonada:p.devolucionPerdonada === true});
  });
  if (!filas.length) return '<div class="meta"><div class="eyebrow">Devoluciones del mes</div>' +
    '<div class="conteo">Ninguna este mes.</div></div>';

  filas.sort((a,b) => b.monto - a.monto);
  setTimeout(() => {
    $$("#dv-lista .dv-btn").forEach(b => b.onclick = async () => {
      const f = filas[Number(b.dataset.i)];
      const quitar = !f.perdonada;
      if (quitar && !confirm("La devolución de " + money(f.monto) + " de " + f.cliente +
        " deja de pesarle a " + (f.preventa || "el vendedor") +
        ".\n\nEsa venta y su comisión le vuelven a contar. ¿Sigue?")) return;
      const ok = await guardarEn("pedidos", () => db.collection("pedidos").doc(f.id).update({
        devolucionPerdonada: quitar,
        devolucionPerdonadaPorNombre: quitar ? S.nombre : "",
        devolucionPerdonadaEn: quitar ? firebase.firestore.FieldValue.serverTimestamp() : null
      }), b);
      if (ok) pintarCuentasDelMes();
    });
  }, 0);

  const pesan = filas.filter(f => !f.perdonada).reduce((a,f) => a + f.monto, 0);
  return '<div class="meta"><div class="eyebrow">Devoluciones del mes</div>' +
    '<div class="conteo">' + filas.length + ' devoluciones · ' + money(pesan) +
      ' le pesan al equipo</div>' +
    '<div id="dv-lista" style="margin-top:8px">' + filas.map((f,i) =>
      '<div class="cuota-fila" style="flex-wrap:wrap;gap:6px">' +
        '<span class="quien" style="flex:1 1 100%">' + escapar(f.cliente) +
          ' · <b>' + money(f.monto) + '</b>' +
          '<br><span style="color:var(--tenue);font-size:11px">' +
            escapar(f.preventa) + (f.fecha ? ' · ' + fechaBonita(f.fecha) : '') +
            (f.motivo ? ' · ' + escapar(f.motivo) : '') +
            (f.perdonada ? ' · <b style="color:var(--ok)">perdonada</b>' : '') +
          '</span></span>' +
        '<button class="btn linea chico dv-btn" data-i="' + i + '" style="width:auto' +
          (f.perdonada ? '' : ';color:var(--ok)') + '">' +
          (f.perdonada ? 'Volver a cobrársela' : 'No fue su culpa') + '</button>' +
      '</div>').join("") + '</div></div>';
}

/* Que producto manda en cada categoria: A los que hacen el grueso de la
   venta, B los del medio, C la cola. Sirve para armar las metas. */
function tablaABC(abc){
  if (!abc.filas.length) return "";
  const cats = {};
  abc.filas.forEach(f => { (cats[f.cat] = cats[f.cat] || []).push(f); });
  return '<div class="meta"><div class="eyebrow">Clasificación A / B / C · ' + mesISO() + '</div>' +
    '<p style="font-size:13px;color:var(--tenue);margin:6px 0 10px">Dentro de cada categoría: ' +
    '<b>A</b> los pocos que hacen el grueso de la venta, <b>B</b> los del medio, <b>C</b> la cola.</p>' +
    Object.keys(cats).sort().map(cat =>
      '<div class="fila-eq"><div class="cab"><b>' + escapar(cat) + '</b>' +
        '<span>' + ["A","B","C"].map(g =>
          g + " " + cats[cat].filter(x => x.grupo === g).length).join(" · ") + '</span></div>' +
        cats[cat].slice(0,8).map(x =>
          '<div class="cuota-fila"><span class="quien">' +
            '<b class="abc abc-' + x.grupo + '">' + x.grupo + '</b> ' + escapar(x.nombre) + '</span>' +
            '<span class="hizo num">' + money(x.venta) + '</span></div>').join("") +
        (cats[cat].length > 8
          ? '<div class="conteo">y ' + (cats[cat].length - 8) + ' más</div>' : '') +
      '</div>').join("") + '</div>';
}

function adminMetas(m){
  const preventas = S.usuarios.filter(u => u.rol !== "admin" && u.activo !== false);
  m.innerHTML =
    (preventas.length ? '' : '<div class="aviso dato">Todavía no hay vendedores creados. Cree las cuentas en Administrar → Usuarios y vuelva aquí.</div>') +
    (preventas.length && !soloVer() ? '<div class="pasos"><div class="eyebrow">Meta del mes · ' + mesISO() + '</div>' +
      '<label class="campo"><span>Preventista</span><select id="mt-uid">' +
        preventas.map(u => '<option value="' + u.uid + '">' + escapar(u.nombre || u.correo || u.uid) + '</option>').join("") +
      '</select></label>' +
      '<label class="campo"><span>Monto a vender ($)</span><input id="mt-monto" type="number" inputmode="decimal" step="1" value="0"></label>' +
      '<button class="btn" id="mt-add" style="margin-top:14px">Guardar meta</button></div>' : '') +
    '<div class="conteo">Cargando resultados del mes…</div>' +
    '<div id="mt-cuerpo"></div>';

  if ($("#mt-add")) $("#mt-add").onclick = async () => {
    const uid = $("#mt-uid").value;
    if (!uid) return alert("Elija el preventista.");
    const u = preventas.find(x => x.uid === uid) || {};
    const monto = Number($("#mt-monto").value) || 0;
    await guardarEn("metas", () => db.collection("metas").doc(mesISO() + "_" + uid).set({
      mes: mesISO(), preventaUid: uid, preventaNombre: u.nombre || u.correo || "", monto: monto,
      actualizado: firebase.firestore.FieldValue.serverTimestamp()

  Promise.all([

    const c = $("#mt-cuerpo");

    const ped = qp.docs.map(d => d.data()), vis = qv.docs.map(d => d.data());
    const acum = {};
    const fila = uid => (acum[uid] = acum[uid] || {nombre:"", monto:0, pedidos:0, visitas:0, conVenta:0, minutos:0});
    ped.forEach(p => { const f = fila(p.preventaUid); f.nombre = p.preventaNombre || f.nombre;
      f.monto += Number(p.total)||0; f.pedidos++; });
    vis.forEach(v => { const f = fila(v.preventaUid); f.nombre = v.preventaNombre || f.nombre;
      f.visitas++; if (v.resultado === "pedido") f.conVenta++;
      if (v.duracionSeg) f.minutos += v.duracionSeg/60; });

    const orden = Object.keys(acum).map(uid => Object.assign({uid:uid}, acum[uid]))
      .sort((a,b) => b.monto - a.monto);
    const totalMes = orden.reduce((a,x) => a + x.monto, 0);
    m.querySelector(".conteo").textContent = "Mes de " + mesISO() + " · " + money(totalMes) + " en " +
      orden.reduce((a,x) => a + x.pedidos, 0) + " pedidos";

    if (!orden.length){ c.innerHTML = '<div class="vacio"><p>Todavía no hay movimiento este mes.</p></div>'; return; }

    c.innerHTML = orden.map((x, i) => {
      const mt = S.metas[x.uid];
      const pct = (mt && mt.monto) ? Math.min(100, Math.round(x.monto/mt.monto*100)) : null;
      const ef = x.visitas ? Math.round(x.conVenta/x.visitas*100) : 0;
      return '<div class="meta">' +
        '<div class="meta-cifras">' +
          '<div><b style="font-size:17px"><span class="medalla' + (i===0?" o1":"") + '">' + (i+1) + '</span>' +
            escapar(x.nombre || "sin nombre") + '</b></div>' +
          '<div style="text-align:right"><b class="num" style="font-size:21px">' + money(x.monto) + '</b></div>' +
        '</div>' +
        (pct != null ? '<div class="barra chica"><i class="meta" style="width:' + pct + '%"></i></div>' +
          '<div class="conteo">' + pct + '% de la meta de ' + money(mt.monto) + '</div>' : '') +
        '<table class="tabla-eq">' +
          '<tr><td>Pedidos</td><td class="num">' + x.pedidos + '</td></tr>' +
          '<tr><td>Visitas</td><td class="num">' + x.visitas + '</td></tr>' +
          '<tr><td>Efectividad</td><td class="num">' + ef + '%</td></tr>' +
          '<tr><td>Ticket promedio</td><td class="num">' + money(x.pedidos ? x.monto/x.pedidos : 0) + '</td></tr>' +
          (x.minutos ? '<tr><td>Minutos por visita</td><td class="num">' +
            Math.round(x.minutos/Math.max(1,x.visitas)) + '</td></tr>' : '') +
        '</table></div>';
    }).join("");
  }).catch(e => {
    const c = $("#mt-cuerpo");
    if (c) c.innerHTML = '<div class="aviso">No se pudieron leer los resultados (' + (e.code||e.message) + ').</div>';
  });
}

/* ------------------- foco, margen y comisiones ------------------- */
function margenDe(p){
  const c = costoBase(p.cod);
  if (c == null || !p.precio) return null;
  return Math.round((p.precio - c) / p.precio * 1000) / 10;
}
function mejoresMargenes(n){
  return S.catalogo
    .map(p => ({p:p, m:margenDe(p)}))
    .filter(x => x.m != null)
    .sort((a,b) => b.m - a.m)
    .slice(0, n);
}
function unidadesPorProducto(pedidos){
  const u = {};
  pedidos.forEach(x => (x.lineas||[]).forEach(l => {
    if (x.tipo === "cambio") return;
    u[l.cod] = (u[l.cod] || 0) + (Number(l.cant)||0);
  }));
  return u;
}
function metaDe(f, uid){
  if (uid && f.cuotas && f.cuotas[uid] != null) return Number(f.cuotas[uid]) || 0;
  return Number(f.meta) || 0;
}
function avanceFoco(pedidos, uid){
  if (!S.foco || !S.foco.productos || !S.foco.productos.length) return null;
  const u = unidadesPorProducto(pedidos);
  const filas = S.foco.productos.map(f => {
    const hecho = u[f.cod] || 0;
    const meta = metaDe(f, uid);
    return {cod:f.cod, nombre:f.nombre, meta:meta, hecho:hecho,
            pct: meta ? Math.round(hecho/meta*100) : 0};
  });
  const totalMeta = filas.reduce((a,x) => a + x.meta, 0);
  const totalHecho = filas.reduce((a,x) => a + x.hecho, 0);
  return {filas:filas, pct: totalMeta ? Math.round(totalHecho/totalMeta*100) : 0,
          totalMeta:totalMeta, totalHecho:totalHecho};
}
/* ===================================================================
   ABC, MARGEN Y COMISION
   El costo NUNCA sale del lado de administracion. Oficina calcula y
   publica en /comisiones un resumen por vendedor con puros resultados
   (venta, margen, comision, descuentos). El preventista lee el suyo y
   ve como va, pero nunca ve costos.
=================================================================== */

/* Lo que de verdad se entrego de una linea: si el motorista entrego menos,
   lo que no llego no se le paga al preventista. */
function cantEntregada(l){ return Number(l.entregado != null ? l.entregado : l.cant) || 0; }

/* Margen real de la linea, con el precio al que se vendio DE VERDAD.
   Por eso el margen se achica solo cuando se vende en volumen con
   descuento: no se usa el precio de lista, se usa el cobrado. */
function margenLinea(l, cant){
  const costo = costoBase(l.cod);
  if (costo == null) return null;
  return dosDec((Number(l.precio)||0) * cant - costo * cant);
}

/* Clasificacion ABC dentro de cada categoria, por lo vendido:
   A los pocos que hacen el 80% de la venta, B hasta el 95%, C la cola. */
function clasificarABC(pedidos){
  const porCat = {};
  pedidos.forEach(p => (p.lineas||[]).forEach(l => {
    const cat = l.cat || "SIN CATEGORIA";
    porCat[cat] = porCat[cat] || {};
    const f = porCat[cat][l.cod] = porCat[cat][l.cod] ||
      {cod:l.cod, nombre:l.nombre, cat:cat, venta:0, unidades:0};
    f.venta += Number(l.total)||0;
    f.unidades += Number(l.cant)||0;
  }));
  const grupos = {}, filas = [];
  Object.keys(porCat).sort().forEach(cat => {
    const lista = Object.keys(porCat[cat]).map(c => porCat[cat][c])
      .sort((a,b) => b.venta - a.venta);
    const total = lista.reduce((a,x) => a + x.venta, 0);
    let acum = 0;
    lista.forEach(x => {
      /* El corte se mira ANTES de sumar el producto: el que cruza el 80%
         todavia es A. Si no, un producto solo en su categoria saldria C
         aunque haga el 100% de la venta. */
      const antes = total ? acum/total*100 : 0;
      acum += x.venta;
      x.grupo = antes < 80 ? "A" : antes < 95 ? "B" : "C";
      x.pesoCat = total ? Math.round(x.venta/total*100) : 0;
      grupos[x.cod] = x.grupo;
      filas.push(x);
    });
  });
  return {grupos:grupos, filas:filas};
}
function grupoDe(cod, abc){ return (abc && abc.grupos[cod]) || "C"; }

/* Porcentaje que aplica a una linea: si hay tabla por grupo A/B/C se usa
   esa, si no la general. Sirve igual sobre venta o sobre margen. */
function pctDeGrupo(c, grupo){
  const t = c.porGrupo || {};
  const v = t[grupo];
  if (v != null && v !== "") return Number(v) || 0;
  return Number(c.modo === "margen" ? c.pctMargen : c.porcentaje) || 0;
}

/* Cuenta del mes de un vendedor. Se paga sobre lo ENTREGADO; lo devuelto
   se muestra aparte con la comision que se perdio por esa devolucion. */
function cuentaDelMes(pedidos, abc){
  const c = S.comis || {};
  const sobreMargen = c.modo === "margen";
  let venta = 0, margen = 0, comision = 0;
  let devuelto = 0, comisionPerdida = 0;
  let sinCosto = 0;

  pedidos.filter(esVenta).forEach(p => {
    const cerrado = p.estado === "entregado" || p.estado === "entregado parcial" ||
                    p.estado === "no entregado";
    /* Si oficina perdono la devolucion, no fue culpa del vendedor: se le
       cuenta como si se hubiera entregado todo y la comision vuelve. */
    const perdonado = p.devolucionPerdonada === true;
    (p.lineas||[]).forEach(l => {
      const pedida = Number(l.cant)||0;
      const dada = (cerrado && !perdonado) ? cantEntregada(l) : pedida;
      const noDada = Math.max(0, pedida - dada);
      const pct = pctDeGrupo(c, grupoDe(l.cod, abc));
      const precio = Number(l.precio)||0;

      venta += dosDec(precio * dada);
      devuelto += dosDec(precio * noDada);

      if (sobreMargen){
        const m = margenLinea(l, dada);
        if (m == null){ sinCosto++; return; }
        margen += m;
        comision += m * pct / 100;
        const mp = margenLinea(l, noDada);
        if (mp != null) comisionPerdida += mp * pct / 100;
      } else {
        comision += precio * dada * pct / 100;
        comisionPerdida += precio * noDada * pct / 100;
      }
    });
  });

  return {venta:dosDec(venta), margen:dosDec(margen), comision:dosDec(comision),
          devuelto:dosDec(devuelto), comisionPerdida:dosDec(comisionPerdida),
          sinCosto:sinCosto, sobreMargen:sobreMargen};
}

/* Los bonos van aparte de lo que deja cada linea. */
function bonosDe(cumpleMeta, cumpleFoco){
  const c = S.comis;
  if (!c) return 0;
  let total = 0;
  if (cumpleMeta) total += Number(c.bonoMeta)||0;
  if (cumpleFoco) total += Number(c.bonoFoco)||0;
  return Math.round(total*100)/100;
}
function barraFoco(pct){
  const col = pct >= 100 ? "var(--ok)" : pct >= 60 ? "var(--senal)" : "var(--rojo)";
  return '<div class="barra chica"><i style="width:' + Math.min(100,pct) + '%;background:' + col + '"></i></div>';
}
