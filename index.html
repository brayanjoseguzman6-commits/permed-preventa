/* ===================== diagnostico =====================
   Se abre desde el chip de la cuenta o desde el login.
   No necesita ser administrador: justamente sirve cuando el rol no sale. */
/* ===================== prueba a fondo =====================
   Cuando Firestore niega permiso y las reglas se ven bien, la causa casi
   siempre es una de tres: el token es de otro proyecto, la base de datos
   no es la que se cree, o el permiso falla solo en LISTAR (no en leer un
   documento suelto). Esto las separa una por una y da un veredicto. */
async function pruebaAFondo(){
  const mono = "font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12px;line-height:1.6;" +
               "white-space:pre-wrap;word-break:break-word;background:var(--carta);" +
               "border:1px solid var(--linea);border-radius:12px;padding:12px;margin:12px 0 0";
  $("#hoja-cuerpo").innerHTML =
    '<div class="eyebrow">Diagnóstico</div><h2>Prueba a fondo</h2>' +
    '<pre id="f-salida" style="' + mono + '">Probando…</pre>' +
    '<button class="btn linea" id="f-copiar" style="margin-top:12px">Copiar el resultado</button>' +
    '<button class="btn secundario" id="f-volver" style="margin-top:9px">Volver</button>';
  $("#fondo").classList.add("abierto"); $("#hoja").classList.add("abierta");
  $("#f-volver").onclick = hojaDiagnostico;

  const L = [];
  const pinta = () => { const e = $("#f-salida"); if (e) e.textContent = L.join("\n"); };
  const cod = e => (e && (e.code || e.message)) || "?";
  $("#f-copiar").onclick = () => {
    try { navigator.clipboard.writeText(L.join("\n")); alert("Copiado."); } catch(e){ alert("No se pudo copiar."); }
  };

  const cfg = window.FIREBASE_CONFIG || {};
  const u = auth.currentUser;
  L.push("PRUEBA A FONDO · App " + VERSION + " · " + new Date().toLocaleString());
  L.push("");
  if (!u){ L.push("No hay sesión. Entre primero."); pinta(); return; }

  /* --- 1. el proyecto de la app --- */
  L.push("1 · PROYECTO QUE USA LA APP");
  L.push("   config.projectId = " + cfg.projectId);
  let idBase = "(default)";
  try {
    const dbid = db._databaseId || (db._delegate && db._delegate._databaseId);
    if (dbid){
      L.push("   firestore.projectId = " + dbid.projectId);
      idBase = dbid.database || dbid.databaseId || "(default)";
      L.push("   base de datos = " + idBase);
      if (dbid.projectId !== cfg.projectId)
        L.push("   >>> OJO: no coinciden.");
    }
  } catch(e){ L.push("   (no se pudo leer el id interno)"); }
  L.push("");
  pinta();

  /* --- 2. el token: para que proyecto fue emitido --- */
  L.push("2 · CREDENCIAL DE LA SESIÓN");
  L.push("   uid    = " + u.uid);
  L.push("   correo = " + u.email);
  try {
    const t = await u.getIdTokenResult(true);
    const aud = t.claims.aud, iss = t.claims.iss || "";
    L.push("   token emitido para (aud) = " + aud);
    L.push("   vence = " + new Date(t.expirationTime).toLocaleString());
    if (aud !== cfg.projectId){
      L.push("   >>> CAUSA ENCONTRADA: el token es del proyecto \"" + aud +
             "\" pero la app pide datos de \"" + cfg.projectId + "\".");
    } else {
      L.push("   coincide con el proyecto. Bien.");
    }
    if (iss.indexOf(cfg.projectId) < 0 && iss)
      L.push("   >>> emisor raro: " + iss);
  } catch(e){ L.push("   FALLA al leer el token [" + cod(e) + "]"); }
  L.push("");
  pinta();

  /* --- 3. leer un documento suelto vs listar la coleccion --- */
  L.push("3 · LEER UN DOCUMENTO vs LISTAR LA COLECCIÓN");
  L.push("   (si uno pasa y el otro no, el permiso que falta es LISTAR)");
  const pruebas = [
    ["usuarios/" + u.uid, () => db.collection("usuarios").doc(u.uid).get({source:"server"})],
    ["configuracion/ajustes", () => db.collection("configuracion").doc("ajustes").get({source:"server"})],
    ["sectores/ZZnoexiste (documento suelto)", () => db.collection("sectores").doc("ZZnoexiste").get({source:"server"})],
    ["sectores (listar, 1 solo)", () => db.collection("sectores").limit(1).get({source:"server"})],
    ["sectores (listar, toda)", () => db.collection("sectores").get({source:"server"})],
    ["clientes/ZZnoexiste (documento suelto)", () => db.collection("clientes").doc("ZZnoexiste").get({source:"server"})],
    ["clientes (listar, 1 solo)", () => db.collection("clientes").limit(1).get({source:"server"})]
  ];
  const res = {};
  for (const [nombre, fn] of pruebas){
    try {
      const r = await fn();
      const q = (r.size != null) ? (r.size + " documento(s)") : (r.exists ? "existe" : "no existe (pero SÍ dejó leer)");
      L.push("   OK   · " + nombre + " → " + q);
      res[nombre] = "ok";
    } catch(e){
      L.push("   NIEGA· " + nombre + " → [" + cod(e) + "]");
      res[nombre] = cod(e);
    }
    pinta();
  }
  L.push("");
  pinta();

  /* --- 4. veredicto --- */
  L.push("4 · VEREDICTO");
  const docSuelto = res["sectores/ZZnoexiste (documento suelto)"];
  const listar    = res["sectores (listar, 1 solo)"];
  const miUsuario = res["usuarios/" + u.uid];

  if (miUsuario !== "ok"){
    L.push("   Ni siquiera puede leer su propio documento de usuario.");
    L.push("   Las reglas no se están aplicando o el proyecto no es el mismo.");
    L.push("   Revise el punto 1 y el punto 2 de arriba.");
  } else if (docSuelto === "ok" && listar !== "ok"){
    L.push("   Lee un documento suelto pero NO puede LISTAR la colección.");
    L.push("   Eso es permiso de \"list\", no de \"get\". Suele pasar cuando");
    L.push("   las reglas publicadas no son las que se cree, o quedó una regla");
    L.push("   vieja más arriba que gana. Vuelva a publicar y espere un minuto.");
  } else if (docSuelto !== "ok" && listar !== "ok"){
    L.push("   Su usuario sí se lee, pero \"sectores\" no, ni suelto ni en lista.");
    L.push("   Entonces la regla de sectores es la que niega: lo que la app");
    L.push("   evalúa NO es lo que usted publicó. Revise que sea la misma base");
    L.push("   de datos del punto 1 (" + idBase + ") y el mismo proyecto.");
  } else {
    L.push("   Todo lo probado pasó. Si la pantalla sigue en blanco, ya no es");
    L.push("   permiso: es que las colecciones están vacías o las listas en");
    L.push("   vivo quedaron caídas. Use \"Reconectar con Firestore\".");
  }
  L.push("");
  L.push("Toque \"Copiar el resultado\" y mándelo tal cual.");
  pinta();
}

async function hojaDiagnostico(){
  const mono = "font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12px;line-height:1.6;" +
               "white-space:pre-wrap;word-break:break-word;background:var(--carta);" +
               "border:1px solid var(--linea);border-radius:12px;padding:12px;margin:12px 0 0";
  $("#hoja-cuerpo").innerHTML =
    '<div class="eyebrow">Diagnóstico</div><h2>Qué responde Firebase</h2>' +
    '<pre id="d-salida" style="' + mono + '">Revisando…</pre>' +
    '<button class="btn linea" id="d-otra" style="margin-top:12px">Revisar de nuevo</button>' +
    '<button class="btn linea" id="d-reconectar" style="margin-top:9px">Reconectar con Firestore</button>' +
    '<button class="btn" id="d-fondo" style="margin-top:9px">PRUEBA A FONDO · buscar la causa</button>' +
    '<button class="btn linea" id="d-copiar" style="margin-top:9px">Copiar el resultado</button>' +
    '<button class="btn" id="d-catalogo" style="margin-top:9px">BAJAR EL CATÁLOGO · JSON y CSV para oficina</button>' +
    '<button class="btn linea" id="d-cache" style="margin-top:9px">Borrar lo guardado de Firestore en este teléfono</button>' +
    '<button class="btn" id="d-limpio" style="margin-top:9px">ARRANQUE LIMPIO · dejar el teléfono como nuevo</button>' +
    '<button class="btn linea" id="d-sincache" style="margin-top:9px">' +
      (sinCache() ? "Volver a guardar datos en el teléfono" : "Trabajar SIN copia en el teléfono") + '</button>' +
    '<button class="btn linea" id="d-sw" style="margin-top:9px">Desregistrar el service worker y borrar cachés</button>' +
    '<button class="btn secundario" id="d-cerrar" style="margin-top:9px">Volver</button>';
  $("#fondo").classList.add("abierto"); $("#hoja").classList.add("abierta");
  $("#d-cerrar").onclick = cerrarHoja;
  $("#d-otra").onclick = hojaDiagnostico;
  $("#d-fondo").onclick = pruebaAFondo;

  /* Baja el catalogo que corre HOY en el servidor, no el archivo de
     arranque. Se pide con getDocFromServer para que no conteste la copia
     guardada en el telefono, que puede estar vieja. */
  $("#d-catalogo").onclick = async () => {
    const btn = $("#d-catalogo");
    const antes = btn.textContent;
    btn.textContent = "Bajando del servidor…";
    btn.disabled = true;
    try {
      const ref = db.collection("configuracion").doc("catalogo");
      let doc;
      try { doc = await ref.get({ source: "server" }); }
      catch(e){ doc = await ref.get(); }   // sin señal, se usa lo que haya

      if (!doc.exists) throw new Error("No existe configuracion/catalogo");
      const datos = doc.data() || {};
      const prods = Array.isArray(datos.productos) ? datos.productos : [];
      if (!prods.length) throw new Error("El catálogo vino vacío");

      const hoy = new Date().toISOString().slice(0,10);

      // 1) el JSON tal cual esta en el servidor, sin tocarle nada
      bajarArchivo(
        "catalogo-" + hoy + ".json",
        "application/json",
        JSON.stringify(datos, null, 2)
      );

      // 2) el CSV con las tres columnas que pidio oficina
      const escapa = v => {
        const t = (v == null ? "" : String(v));
        return /[",;\n]/.test(t) ? '"' + t.replace(/"/g, '""') + '"' : t;
      };
      const filas = ["cod;nombre;cat"];
      prods.slice().sort((a,b) => String(a.cod||"").localeCompare(String(b.cod||"")))
           .forEach(x => filas.push([escapa(x.cod), escapa(x.nombre), escapa(x.cat)].join(";")));
      // el BOM hace que Excel abra bien los acentos
      bajarArchivo("catalogo-" + hoy + ".csv", "text/csv;charset=utf-8", "\uFEFF" + filas.join("\r\n"));

      alert("Listo: " + prods.length + " productos.\n\n" +
            "Se bajaron dos archivos a la carpeta de Descargas:\n" +
            "· catalogo-" + hoy + ".json\n" +
            "· catalogo-" + hoy + ".csv\n\n" +
            "Versión del catálogo: " + (datos.version != null ? datos.version : "(sin número)"));
    } catch(e){
      alert("No se pudo bajar el catálogo.\n\n" + (e && e.message ? e.message : e));
    } finally {
      btn.textContent = antes;
      btn.disabled = false;
    }
  };
  $("#d-reconectar").onclick = () => {
    if (!auth.currentUser) return alert("Primero entre con su cuenta.");
    conexionSana(); reconectar();
    alert("Listo. Se volvió a conectar; en unos segundos deben aparecer los datos.");
    cerrarHoja();
  };

  const L = [];
  const pinta = () => { const e = $("#d-salida"); if (e) e.textContent = L.join("\n"); };
  const tipos = o => Object.keys(o).sort().map(k =>
    "   " + k + " = " + JSON.stringify(o[k]) + "   (" + (Array.isArray(o[k]) ? "array" : typeof o[k]) + ")"
  ).join("\n");

  const cfg = window.FIREBASE_CONFIG || {};
  L.push("App " + VERSION + "  ·  " + new Date().toLocaleString());
  L.push("proyecto: " + cfg.projectId);
  L.push("dominio:  " + location.hostname);
  L.push("conexión: " + (navigator.onLine ? "en línea" : "SIN SEÑAL"));
  L.push("copia en el teléfono: " + (sinCache() ? "APAGADA (trabaja contra el servidor)" : "encendida"));
  L.push("rol que usa la app ahora: " + JSON.stringify(S.rol) +
         ((S.nube && S.nube.miRol) ? "  · en vivo: " + S.nube.miRol : ""));
  L.push("");
  pinta();

  const u = auth.currentUser;
  if (!u){
    L.push("SESIÓN · no hay nadie logueado.");
    L.push("");
    const r = ultimoIntento();
    if (!r){
      L.push("ÚLTIMO INTENTO DE ENTRAR · todavía no hay ninguno anotado.");
      L.push("Cerrá esta hoja, probá entrar una vez y volvé a abrir el Diagnóstico.");
    } else {
      L.push("ÚLTIMO INTENTO DE ENTRAR");
      L.push("   cuándo   = " + new Date(r.cuando).toLocaleString());
      L.push("   correo   = [" + r.correo + "]  (" + r.correoLargo + " letras)");
      L.push("   espacios de sobra = " + r.espacios);
      L.push("   contraseña: " + r.claveLargo + " letras · " + (r.claveTipos || "nada"));
      if (r.claveRaros) L.push("   OJO: " + r.claveRaros + " carácter(es) raro(s) en la contraseña (¿teclado en otro idioma?)");
      L.push("   la contraseña no se guarda, solo cómo era");
      L.push("");
      if (!r.codigo){
        L.push("   RESULTADO · ENTRÓ BIEN");
      } else {
        L.push("   RESULTADO · falló");
        L.push("   código   = " + r.codigo);
        if (r.codigo === "auth/too-many-requests")
          L.push("   → Firebase está frenando esta cuenta por muchos intentos seguidos.");
        else if (r.codigo === "auth/invalid-credential" || r.codigo === "auth/wrong-password")
          L.push("   → La contraseña no coincide con la que está en Authentication.");
        else if (r.codigo === "auth/user-not-found")
          L.push("   → Ese correo no existe en Authentication. Revisá que esté escrito igualito.");
        else if (r.codigo === "auth/invalid-email")
          L.push("   → El correo está mal escrito (le falta algo o le sobra un espacio).");
        else if (r.codigo === "auth/network-request-failed")
          L.push("   → No llegó a Firebase. Es la conexión, no la contraseña.");
        if (r.detalle) L.push("   detalle  = " + r.detalle);
      }
    }
    L.push("");
    pinta();
  } else {
    L.push("SESIÓN");
    L.push("   uid    = " + u.uid);
    L.push("   correo = " + u.email);
    L.push("");
    pinta();

    // usuarios/{uid} desde el servidor
    L.push("usuarios/" + u.uid + "  (servidor)");
    pinta();
    try {
      const d = await db.collection("usuarios").doc(u.uid).get({source:"server"});
      if (!d.exists) L.push("   NO EXISTE el documento con ese UID en el proyecto " + cfg.projectId);
      else L.push(tipos(d.data()));
    } catch(e){ L.push("   FALLA [" + (e.code || e.message) + "]"); }
    L.push("");
    pinta();

    // usuarios/{uid} desde lo guardado en el telefono
    L.push("usuarios/" + u.uid + "  (guardado en el teléfono)");
    pinta();
    try {
      const d = await db.collection("usuarios").doc(u.uid).get({source:"cache"});
      L.push(d.exists ? "   rol = " + JSON.stringify(d.data().rol) + " · activo = " + JSON.stringify(d.data().activo)
                      : "   no hay copia guardada");
    } catch(e){ L.push("   no hay copia guardada [" + (e.code || e.message) + "]"); }
    L.push("");
    pinta();

    // sectores
    L.push("sectores  (servidor)");
    pinta();
    try {
      const q = await db.collection("sectores").get({source:"server"});
      L.push("   " + q.size + " documento(s)");
      q.docs.forEach(x => {
        const v = x.data();
        L.push("   · " + x.id + "  nombre=" + JSON.stringify(v.nombre) +
               " dia=" + JSON.stringify(v.dia) + " activo=" + JSON.stringify(v.activo) +
               " preventaUid=" + JSON.stringify(v.preventaUid || null));
      });
    } catch(e){ L.push("   FALLA [" + (e.code || e.message) + "]"); }
    L.push("");
    pinta();

    // catalogo
    L.push("configuracion/catalogo  (servidor)");
    pinta();
    try {
      const d = await db.collection("configuracion").doc("catalogo").get({source:"server"});
      L.push(d.exists ? "   " + ((d.data().productos || []).length) + " productos" : "   no existe");
    } catch(e){ L.push("   FALLA [" + (e.code || e.message) + "]"); }
    L.push("");

    L.push("QUÉ HIZO LA APP AL ENTRAR");
    (S.diag && S.diag.pasos || ["(entrá de nuevo para verlo)"]).forEach(x => L.push("   " + x));
    if (S.diag && S.diag.desdeCache != null)
      L.push("   el documento vino del teléfono, no del servidor: " + (S.diag.desdeCache ? "SÍ" : "no"));
    L.push("   botón Administrar visible: " + ((S.rol === "admin" || S.rol === "supervisor") ? "sí" : "NO"));
    L.push("");
    pinta();
  }

  // listas en vivo
  L.push("LISTAS EN VIVO (onSnapshot)");
  const nb = S.nube || {};
  if (!Object.keys(nb).length) L.push("   todavía no ha llegado ninguna");
  ["sectores","clientes","existencias"].forEach(k => {
    const x = nb[k];
    if (!x) { L.push("   " + k + " · NUNCA LLEGÓ"); return; }
    L.push("   " + k + " · " + (x.error ? "FALLA [" + x.error + "]"
      : x.n + " docs · del teléfono: " + (x.cache ? "SÍ" : "no") + " · " + x.cuando));
  });
  if (nb.rescateSectores) L.push("   rescate sectores · " + nb.rescateSectores);
  if (nb.rescateClientes) L.push("   rescate clientes · " + nb.rescateClientes);
  L.push("   S.sectores en memoria = " + S.sectores.length + " · S.clientes = " + S.clientes.length);
  /* Lo que cobra Firebase: documentos que vinieron del servidor en esta
     sesion. Sirve para saber que pantalla se come la cuota. */
  L.push("");
  L.push("LECTURAS DEL SERVIDOR EN ESTA SESIÓN (aprox.)");
  const lec = Object.keys(S.lecturas || {}).sort((a,b) => S.lecturas[b] - S.lecturas[a]);
  if (!lec.length) L.push("   ninguna todavía");
  lec.forEach(k => L.push("   " + k + " · " + S.lecturas[k]));
  if (lec.length) L.push("   total · " + lec.reduce((a,k) => a + S.lecturas[k], 0));
  L.push("");
  pinta();

  /* Ancho de la pantalla. Si el cuerpo mide mas que la ventana, algo se
     esta saliendo y TODO se ve cortado por la derecha, hasta los
     parrafos. Aqui se mide y se dice cual es el culpable. */
  /* Existencias que quedaron sin cuadrar. Antes esto no se veia en ningun
     lado: el error se tragaba y el kardex y la existencia se iban separando
     en silencio. */
  L.push("EXISTENCIAS QUE NO SE PUDIERON MOVER");
  const pendExist = existenciasPendientes();
  if (!pendExist.length) L.push("   ninguna \u00b7 el kardex y las existencias van a la par");
  else {
    L.push("   " + pendExist.length + " movimiento(s) quedaron sin bajar de existencias.");
    L.push("   El kardex S\u00cd los tiene: bodega debe cuadrar estos productos a mano.");
    pendExist.slice(-10).forEach(x => L.push("   " +
      String(x.cuando || "").slice(0,16).replace("T", " ") +
      " \u00b7 " + x.cod + " " + (x.nombre || "") +
      " \u00b7 " + x.tipo + " " + x.unidades +
      " \u00b7 pedido " + String(x.pedidoId || "?").slice(0,6) +
      " \u00b7 [" + x.codigo + "]"));
  }
  L.push("");
  pinta();

  L.push("MAPA EN VIVO");
  /* OJO: dentro de esta función, "L" es la lista de líneas del reporte,
     no Leaflet. Por eso hay que preguntar por window.L: antes se leía la
     versión de la lista y siempre salía "?", como si la librería viniera
     mala. No venía mala; el que estaba mal era este renglón. */
  L.push("   Leaflet cargado: " + (window.L && window.L.version
    ? "sí (" + window.L.version + ")" : (window.L ? "a medias" : "NO")));
  L.push("   recuadro = " + MAPA_VIVO_DIAG.ancho + " x " + MAPA_VIVO_DIAG.alto + " px" +
         (MAPA_VIVO_DIAG.esperas ? " · esperó " + MAPA_VIVO_DIAG.esperas + " vez(ces) a tener tamaño" : ""));
  L.push("   mapa armado: " + (mapaVivo ? ("sí, a las " + MAPA_VIVO_DIAG.creado) : "NO"));
  L.push("   mosaicos: " + MAPA_VIVO_DIAG.ok + " cargados · " + MAPA_VIVO_DIAG.malos + " fallaron");
  if (MAPA_VIVO_DIAG.ultimoError) L.push("   último que falló: " + MAPA_VIVO_DIAG.ultimoError);
  L.push("   capa = " + CAPAS.calles.url);
  L.push("");
  pinta();

  L.push("QUIÉN LE HABLA AL MAPA MUERTO  (trampa temporal)");
  try {
    const tr = window.TRAMPA_MAPA || [];
    if (!tr.length) L.push("   nadie · el mapa no se quedó sin panel esta vez");
    else tr.forEach(x => {
      L.push("   " + x.hora);
      L.push("      " + x.quien);
    });
  } catch(e){ L.push("   (no se pudo leer)"); }
  L.push("");
  pinta();

  L.push("ERRORES");
  if (!ERRORES.length) L.push("   ninguno desde que abrió la app");
  else ERRORES.forEach(x => {
    L.push("   " + x.cuando + " · " + x.donde + " · " + x.msj);
    if (x.pila) L.push("      " + x.pila);
  });
  L.push("");
  pinta();

  L.push("PANTALLA");
  try {
    const vw = Math.round(window.innerWidth);
    const bw = Math.round(document.documentElement.scrollWidth);
    L.push("   ventana = " + vw + " px · contenido = " + bw + " px");
    L.push("   pantalla del aparato = " + window.screen.width + " px · zoom " +
           (window.devicePixelRatio || 1));
    if (bw > vw + 2){
      L.push("   SE SALE POR " + (bw - vw) + " px. Culpables:");
      let hallados = 0;
      document.querySelectorAll("section:not(.oculto) *").forEach(el => {
        if (hallados >= 6) return;
        const r = el.getBoundingClientRect();
        if (r.width && r.right > vw + 2){
          hallados++;
          L.push("      <" + el.tagName.toLowerCase() +
            (el.id ? " #" + el.id : "") +
            (el.className && typeof el.className === "string"
              ? " ." + el.className.split(" ").filter(Boolean).slice(0,2).join(".") : "") +
            "> llega a " + Math.round(r.right) + " px");
        }
      });
      if (!hallados) L.push("      (no se hallo ninguno visible: puede ser una hoja abierta)");
    } else {
      L.push("   todo cabe: no hay desborde");
    }
  } catch(e){ L.push("   no se pudo medir (" + (e.message || e) + ")"); }
  L.push("");
  pinta();

  // service worker
  L.push("SERVICE WORKER");
  try {
    const regs = await navigator.serviceWorker.getRegistrations();
    if (!regs.length) L.push("   ninguno registrado");
    regs.forEach(r => {
      const w = r.active || r.waiting || r.installing;
      L.push("   script = " + (w ? w.scriptURL.split("/").pop() : "—") + " · estado = " + (w ? w.state : "—") +
             (r.waiting ? "  (hay una versión ESPERANDO)" : ""));
    });
    const ks = await caches.keys();
    L.push("   cachés = " + (ks.length ? ks.join(", ") : "ninguna"));
  } catch(e){ L.push("   no se pudo leer [" + e.message + "]"); }
  pinta();

  $("#d-copiar").onclick = () => {
    navigator.clipboard.writeText(L.join("\n"))
      .then(() => { $("#d-copiar").textContent = "Copiado"; })
      .catch(() => { $("#d-copiar").textContent = "No se pudo copiar"; });
  };
  $("#d-limpio").onclick = async () => {
    if (!confirm("Deja el teléfono como recién instalado:\n\n" +
      "· borra la copia local de Firestore\n" +
      "· cierra la sesión (va a pedir correo y contraseña otra vez)\n" +
      "· vuelve a bajar la app\n\n" +
      "Los pedidos que no hayan subido se pierden. ¿Sigue?")) return;
    await arranqueLimpio(true);
  };
  $("#d-sincache").onclick = async () => {
    const prender = !sinCache();
    if (prender && !confirm("Sin copia en el teléfono la app SIEMPRE pide los datos al servidor.\n\n" +
      "Queda más segura contra errores pegados, pero DEJA DE FUNCIONAR SIN SEÑAL.\n\n¿Prender ese modo?")) return;
    await arranqueLimpio(prender);
  };
  $("#d-cache").onclick = async () => {
    if (!confirm("Se borra lo que Firestore tiene guardado en este teléfono. Los pedidos sin subir se pierden. ¿Sigue?")) return;
    try { await db.terminate(); await db.clearPersistence(); } catch(e){ alert("No se pudo: " + e.message); }
    location.reload();
  };
  $("#d-sw").onclick = async () => {
    const regs = await navigator.serviceWorker.getRegistrations();
    for (const r of regs) await r.unregister();
    for (const k of await caches.keys()) await caches.delete(k);
    location.reload(true);
  };
}

function escucharCatalogo(){
  if (S.cortarCatalogo) { S.cortarCatalogo(); S.cortarCatalogo = null; }
  S.cortarCatalogo = db.collection("configuracion").doc("catalogo").onSnapshot(d => {
    if (d.exists){ S.catalogo = d.data().productos || []; S.catVersion = d.data().version || 0; }
    else { S.catalogo = []; }
    pintarCategorias(); pintarLista();
    if (!$("#pant-admin").classList.contains("oculto")) pintarAdmin();
  }, e => {
    S.cortarCatalogo = null;
    const m = e.code === "permission-denied"
      ? "Esta cuenta no tiene permiso de ver el cat\u00e1logo. P\u00eddale al administrador que la revise en <b>Administrar &rarr; Usuarios</b>: que est\u00e9 activa y con el puesto correcto."
      : "No se pudo leer el catálogo (" + e.code + ").";
    $("#lista").innerHTML = '<div class="vacio"><p>' + m + '</p>' +
      '<button class="btn secundario" id="btn-reintentar" style="margin-top:16px">Reintentar</button></div>';
    $("#conteo").textContent = "";
    $("#btn-reintentar").onclick = () => {
      $("#lista").innerHTML = '<div class="vacio"><p>Probando de nuevo…</p></div>';
      escucharCatalogo();
    };
  });
}

function pedirPin(){
  if (S.rol !== "admin"){
    alert("Esta cuenta no ve costos. Solo las cuentas de administrador tienen ese permiso.");
    return;
  }
  if (S.costosVisibles){
    S.costosVisibles = false; pintarLista();
    alert("Costos ocultos otra vez.");
    return;
  }
  const pin = prompt("PIN para ver costos:");
  if (pin == null) return;
  if (!S.ajustes.pin){ alert("Todavía no hay PIN puesto. Póngalo en Administrar → Ajustes."); return; }
  if (pin !== S.ajustes.pin){ alert("PIN incorrecto."); return; }
  S.costosVisibles = true; pintarLista();
  alert("Costos visibles. Se ocultan solos al cerrar la aplicación.");
}

/* ===================== catálogo: lista ===================== */
function categorias(){
  const set = new Set(S.catalogo.filter(p => p.visible !== false).map(p => p.cat).filter(Boolean));
  return Array.from(set).sort((a,b)=>a.localeCompare(b,"es"));
}
function pintarCategorias(){
  const cont = $("#cats");
  cont.innerHTML = "";
  const todas = document.createElement("button");
  todas.className = "cat"; todas.textContent = "Todo";
  todas.setAttribute("aria-pressed", S.filtroCat === "");
  todas.onclick = () => { S.filtroCat = ""; pintarCategorias(); pintarLista(); };
  cont.appendChild(todas);
  const conEx = document.createElement("button");
  conEx.className = "cat"; conEx.textContent = "Con existencia";
  conEx.setAttribute("aria-pressed", !!S.soloConExist);
  conEx.onclick = () => { S.soloConExist = !S.soloConExist; pintarCategorias(); pintarLista(); };
  cont.appendChild(conEx);
  categorias().forEach(c => {
    const b = document.createElement("button");
    b.className = "cat"; b.textContent = c;
    b.setAttribute("aria-pressed", S.filtroCat === c);
    b.onclick = () => { S.filtroCat = (S.filtroCat === c ? "" : c); pintarCategorias(); pintarLista(); };
    cont.appendChild(b);
  });
}
function filtrados(){
  const q = limpiaTexto(S.busqueda).split(/\s+/).filter(Boolean);
  return S.catalogo.filter(p => {
    if (p.visible === false) return false;
    /* "Con existencia" evita el mal rato de ofrecer algo que no hay. Es el
       mismo filtro que los vendedores usan en Handy. */
    if (S.soloConExist && existDe(p.cod) <= 0) return false;
    if (S.filtroCat && p.cat !== S.filtroCat) return false;
    if (!q.length) return true;
    const heno = limpiaTexto(p.nombre + " " + p.cod + " " + p.cat);
    return q.every(t => heno.includes(t));
  });
}
function pintarLista(){
  const lista = $("#lista"), res = filtrados();
  $("#conteo").textContent = res.length + (res.length === 1 ? " producto" : " productos") +
    (S.soloConExist ? " · solo con existencia" : "") +
    (S.costosVisibles ? " · costos visibles" : "");
  lista.innerHTML = "";
  if (!S.catalogo.length){
    lista.innerHTML = '<div class="vacio"><p>Todavía no hay catálogo cargado.</p>' +
      (S.rol === "admin" ? '<p style="font-size:14px">Entre a <b>Administrar → Productos</b> y cargue el catálogo inicial.</p>' :
       '<p style="font-size:14px">Avísele al administrador para que lo cargue.</p>') + '</div>';
    return;
  }
  if (!res.length){
    lista.innerHTML = '<div class="vacio"><p>Nada con esa búsqueda.</p><p style="font-size:14px">' +
      (S.soloConExist ? 'Está puesto <b>Con existencia</b>: quítelo para ver todo el catálogo.'
                      : 'Pruebe con una palabra más corta o con el código.') + '</p></div>';
    return;
  }
  const frag = document.createDocumentFragment();
  /* Agrupado por familia y cerrado, como lo trae Handy: con 371 productos
     una lista corrida no se camina. Al buscar o al filtrar por categoria se
     enseña plano, porque ahi el vendedor ya sabe lo que anda buscando. */
  const agrupar = !S.busqueda.trim() && !S.filtroCat;
  if (agrupar){
    const porCat = {};
    res.forEach(p => { const c = p.cat || "Sin categoría"; (porCat[c] = porCat[c] || []).push(p); });
    Object.keys(porCat).sort((a,b) => a.localeCompare(b, "es")).forEach(cat => {
      const cab = document.createElement("button");
      cab.className = "cat-cab";
      const abierta = !!S.catAbiertas[cat];
      cab.setAttribute("aria-expanded", abierta);
      cab.innerHTML = '<span class="flecha">' + (abierta ? "⌄" : "›") + '</span>' +
        '<span class="nom">' + escapar(cat) + '</span>' +
        '<b class="num">' + porCat[cat].length + '</b>';
      cab.onclick = () => { S.catAbiertas[cat] = !S.catAbiertas[cat]; pintarLista(); };
      frag.appendChild(cab);
      if (abierta) porCat[cat].forEach(p => frag.appendChild(filaProducto(p)));
    });
    lista.appendChild(frag);
    return;
  }
  res.forEach(p => frag.appendChild(filaProducto(p)));
  lista.appendChild(frag);
}

function filaProducto(p){
  {
    const piso = pisoDe(p), desc = descMaxDe(p);
    const b = document.createElement("button");
    b.className = "item";
    b.innerHTML =
      '<div class="izq">' +
        '<h3>' + escapar(p.nombre) + '</h3>' +
        '<div class="cod">' + p.cod + (p.provisional ? '<span class="marca-prov">provisional</span>' : '') + selloExist(p.cod) + '</div>' +
      '</div>' +
      '<div class="der">' +
        '<div class="p-normal num">' + money(precioDe(p)) + '</div>' +
        (etiquetaPrecio(p) ? '<div class="p-min" style="color:var(--senal)">' + escapar(etiquetaPrecio(p)) + '</div>' : '') +
        '<div class="p-min num">' + (piso ? 'mín ' + money(piso) : 'sin mínimo') + '</div>' +
        (S.costosVisibles && costoDe(p.cod) ?
          '<div class="p-min num" style="color:var(--rojo)">costo ' + money(costoDe(p.cod).prom) +
          (costoDe(p.cod).ult !== costoDe(p.cod).prom ? ' \u00b7 \u00falt. ' + money(costoDe(p.cod).ult) : '') +
          '</div>' : '') +
      '</div>';
    b.onclick = () => abrirHoja(p);
    return b;
  }
}
function escapar(t){
  const d = document.createElement("div"); d.textContent = t == null ? "" : t;
  return d.innerHTML.replace(/"/g,"&quot;").replace(/'/g,"&#39;");
}

$("#in-buscar").addEventListener("input", e => {
  S.busqueda = e.target.value;
  ver("#btn-limpiar", !!S.busqueda);
  pintarLista();
});
$("#btn-limpiar").onclick = () => { $("#in-buscar").value = ""; S.busqueda = ""; ver("#btn-limpiar", false); pintarLista(); $("#in-buscar").focus(); };

/* ===================== hoja del producto ===================== */
function abrirHoja(p){
  S.abierto = p;
  const piso = pisoDe(p), desc = descMaxDe(p);
  const c = S.costosVisibles ? costoDe(p.cod) : null;
  const cuerpo = $("#hoja-cuerpo");
  cuerpo.innerHTML =
    '<div class="eyebrow">' + p.cod + ' · ' + (p.cat||"") + '</div>' +

      const tope = Math.max(p.precio, piso) * 1.05, base = Math.min(piso, p.precio) * 0.85;
      const pos = x => Math.max(0, Math.min(100, (x - base)/(tope - base)*100));
      mp.style.left = pos(piso) + "%";
      if (isNaN(v)){
        marca.style.left = pos(p.precio) + "%";

          "<small>Es " + dif.toFixed(1) + "% abajo del normal. Le quedan " + money(v - piso) + " sobre el piso.</small>";

/* ===================== La puerta con oficina =====================
   El sistema de oficina escribe en Firestore; este solo recibe. No hay
   manera de ir a leer el de ellos ni falta: el dia que empiecen a
   escribir, aparece solo. Lo que faltaba era ENTERARSE, para no andar
   revisando a ciegas ni esperar a que alguien avise por telefono. */
function llegoDeOficina(){
  const s = [];
  const ex = Object.keys(S.exist || {}).length;
  if (ex) s.push({que:"existencias", det:ex + " productos con existencia"});
  const cat = (S.catalogo || []).filter(p => p.costo != null && p.provisional !== true).length;
  if (cat) s.push({que:"costos", det:cat + " productos con costo real"});
  if (S.metas && Object.keys(S.metas).length) s.push({que:"metas", det:"metas del mes"});
  if (S.foco) s.push({que:"foco", det:"productos en foco"});
  return s;
}
function avisoOficinaLlego(){
  const l = llegoDeOficina();
  if (!l.length) return "";
  const o = (S.ajustes && S.ajustes.oficinaLleva) || {};
  /* Solo se avisa de lo que TODAVIA no se ha apagado de este lado: si ya
     esta la llave puesta, no hay nada que decidir. */
  const nuevos = l.filter(x =>
    (x.que === "existencias" && !o.inventario) ||
    (x.que === "costos" && !o.costos) ||
    ((x.que === "metas" || x.que === "foco") && !o.comisiones));
  if (!nuevos.length) return "";
  return '<button class="adm-card adm-ojo" id="adm-ofi" style="margin-bottom:12px">' +
    '<b>Oficina ya est\u00e1 mandando datos</b>' +

/* ====== La portada de Administrar: el tablero ======
   Brayan mando la pantalla que queria (3 sep 2026): un tablero de
   oficina con menu lateral, seis tarjetas arriba, la grafica de la
   semana, la dona de estados, la actividad, tres tablas, los pedidos
   del dia, acciones rapidas y el resumen del mes. Esto es eso, con los
   datos que la app de verdad guarda.

   De donde sale cada cosa:
   - lo de HOY (vendido, pedidos, por aprobar, entregas, estados,
     actividad, pedidos recientes) sale de S.pedidosDia y S.entregasHoy,
     que Administrar ya escucha en vivo: cero lecturas nuevas.
   - clientes y bodega salen de S.clientes y S.exist, ya cargados.
   - la semana y el mes piden UNA lectura al abrir (los pedidos del mes,
     y los dias de la semana que caigan en el mes anterior) y se guardan
     cinco minutos. Es lo mismo que hoy cuesta Tablero > Este mes. */
const tablero = {sello:0, sem:[], mes:[], cargando:false, error:null, cortes:[], clave:""};

function minimoExistencia(){
  const n = Number(S.ajustes.minimoExistencia);
  return isNaN(n) || S.ajustes.minimoExistencia == null ? 10 : n;
}

function cargarTablero(){
  /* ESCUCHA, no lee. Antes esto hacia un get() del mes entero cada vez que
     se abria la portada (cada 5 min): con miles de pedidos, miles de
     lecturas por entrada, y el 3 de septiembre se acabo la cuota gratis
     del dia (71 mil lecturas con 4 conexiones). Un onSnapshot que se
     queda puesto mientras Administrar este abierto, con la cache
     persistente del telefono, solo baja lo que cambio. */
  const hoy = hoyISO(), desde = corrido(hoy, -6), mes = mesISO();
  const clave = mes + "|" + desde;
  if (tablero.clave === clave && tablero.cortes.length) return;
  soltarTablero();
  tablero.clave = clave; tablero.cargando = true; tablero.error = null;
  const doc = d => Object.assign({id:d.id}, d.data());
  let delMes = null, antes = desde.slice(0,7) === mes ? [] : null;
  const junta = () => {
    if (delMes === null || antes === null) return;
    tablero.mes = delMes;
    tablero.sem = delMes.filter(p => p.fecha >= desde).concat(antes);
    tablero.sello = Date.now(); tablero.cargando = false;
    if (S.pagina === "admin" && !grupoActual) pintarAdmin();
  };
  const falla = e => {
    tablero.error = (e && (e.code || e.message)) || String(e); tablero.cargando = false;
    if (S.pagina === "admin" && !grupoActual) pintarAdmin();
  };
  tablero.cortes.push(db.collection("pedidos").where("mes", "==", mes).onSnapshot(q => {
    anotarLectura("tablero: pedidos del mes", q); delMes = q.docs.map(doc); junta();
  }, falla));
  /* Si la semana empieza en el mes pasado, esos dias se escuchan aparte. */
  if (antes === null)
    tablero.cortes.push(db.collection("pedidos").where("fecha", ">=", desde).where("fecha", "<", mes + "-01").onSnapshot(q => {
      anotarLectura("tablero: semana del mes pasado", q); antes = q.docs.map(doc); junta();
    }, falla));
}
function soltarTablero(){
  tablero.cortes.forEach(f => { try { f(); } catch(e){} });
  tablero.cortes = []; tablero.clave = "";
}

/* Cuantos documentos han venido DEL SERVIDOR en esta sesion, por pantalla.
   Es lo que cobra Firebase. Aproximado: en una escucha con cache, el
   primer aviso viene del telefono (gratis) y despues solo llegan los
   cambios. Se ve en Diagnostico. */
function anotarLectura(que, q){
  try {
    if (q.metadata && q.metadata.fromCache) return;
    const n = q.docChanges ? q.docChanges().length : q.size;
    S.lecturas = S.lecturas || {};
    S.lecturas[que] = (S.lecturas[que] || 0) + n;
  } catch(e){}
}

  const hoy = hoyISO();

}

  if (!tbVersionTxt) tbVersion();
}
/* El numero que de verdad distingue una version de otra es el CACHE del
   service worker. Se lee de ahi mismo, para no tenerlo escrito dos veces. */
function tbVersion(){
  if (tbVersionTxt === "…") return;
  tbVersionTxt = "…";
  fetch("sw.js").then(r => r.text()).then(t => {
    const m = t.match(/CACHE\s*=\s*"[^"]*-(v\d+)"/);
    tbVersionTxt = "Versión " + (m ? m[1] : "?");
    const e = $("#tb-version"); if (e) e.textContent = tbVersionTxt;
  }).catch(() => { tbVersionTxt = ""; });
}

/* ---- el buscador de arriba: clientes, productos y pedidos de hoy ---- */
function tbBuscar(){
  const inp = $("#tb-buscar"), caja = $("#tb-res");
  const q = (inp.value || "").trim().toLowerCase();
  if (q.length < 2){ caja.classList.add("oculto"); caja.innerHTML = ""; return; }
  const tiene = (...xs) => xs.some(x => x != null && String(x).toLowerCase().indexOf(q) >= 0);
  const cl = S.clientes.filter(c => c.activo !== false && tiene(c.nombre, c.codigo, c.telefono)).slice(0, 4);
  const pr = S.catalogo.map((p, i) => ({p, i})).filter(x => tiene(x.p.nombre, x.p.cod)).slice(0, 4);
  const pe = (S.pedidosDia || []).filter(p => tiene(p.clienteNombre, p.clienteCodigo, money(p.total), p.preventaNombre)).slice(0, 3);
  const sec = id => { const s = S.sectores.find(x => x.id === id); return s ? s.nombre : ""; };
  caja.innerHTML = (!cl.length && !pr.length && !pe.length)
    ? '<div class="tb-nada">Nada con «' + escapar(q) + '».</div>'
    : cl.map(c => '<button data-k="c" data-id="' + c.id + '"><span class="tb-tipo">Cliente</span><b>' + escapar(c.nombre) +
        '</b><span class="num">' + escapar(c.codigo || sec(c.sectorId)) + '</span></button>').join("") +
      pr.map(x => '<button data-k="p" data-i="' + x.i + '"><span class="tb-tipo">Producto</span><b>' + escapar(x.p.nombre) +
        '</b><span class="num">' + money(precioDe(x.p)) + '</span></button>').join("") +
      pe.map(p => '<button data-k="o" data-id="' + p.id + '"><span class="tb-tipo">Pedido</span><b>' + escapar(p.clienteNombre) +
        '</b><span class="num">' + money(p.total) + '</span></button>').join("");
  caja.classList.remove("oculto");
}
function tbElegir(b){
  const k = b.dataset.k;
  $("#tb-res").classList.add("oculto");
  const q = $("#tb-buscar").value;
  $("#tb-buscar").value = "";
  if (k === "p") return editarProducto(Number(b.dataset.i));
  if (k === "o") return tbVerPedido(b.dataset.id);
  if (k === "c"){
    irAPestana("clientes", "clientes");

function cablearTablero(){
  const pa = $("#pant-admin");
  $("#tb-ham").onclick = () => pa.classList.toggle("tb-abierto");
  $("#tb-velo").onclick = () => pa.classList.remove("tb-abierto");
  $("#tb-campana").onclick = tbAbrirAvisos;

/* ---- los pedazos del tablero ---- */
const TB_ESTADOS = [
  ["pendiente", "Pendientes", "Pendiente", "senal", "#D89A16"],
  ["aprobado", "Aprobados", "Aprobado", "mover", "#5B6BA6"],
  ["entregado", "Entregados", "Entregado", "listo", "#1F7A4D"],
  ["entregado parcial", "Parciales", "Parcial", "cambio", "#C98410"],
  ["no entregado", "No entregados", "No entregado", "perdido", "#A93226"],
  ["adicional", "Adicionales", "Adicional", "mover", "#8A93B8"],
  ["rechazado", "Rechazados", "Rechazado", "marcar", "#8C8794"]
];
function tbEstadoDe(p){
  const e = p.estado || "";
  if (e === "confirmado") return "aprobado";
  if (e === "anulado") return "rechazado";
  return TB_ESTADOS.some(x => x[0] === e) ? e : "pendiente";
}
function tbEstadoInfo(p){ return TB_ESTADOS.find(x => x[0] === tbEstadoDe(p)); }
function tbEntregado(p){ return String(p.estado || "").indexOf("entregado") === 0; }
function tbUnid(p, l){
  return (tbEntregado(p) && l.entregado != null) ? (Number(l.entregado) || 0) : (Number(l.cant) || 0);
}
function tbMs(t){
  if (!t) return 0;
  try { const d = t.toDate ? t.toDate() : new Date(t); const n = d.getTime(); return isNaN(n) ? 0 : n; } catch(e){ return 0; }
}
function tbHora(ms){
  return ms ? new Date(ms).toLocaleTimeString("es-SV", {hour:"numeric", minute:"2-digit"}) : "";
}
function tbHace(ms){
  if (!ms) return "hoy";
  const m = Math.round((Date.now() - ms) / 60000);
  if (m < 1) return "ahora";
  if (m < 60) return m + " min";
  if (m < 600) return Math.round(m / 60) + " h";
  return tbHora(ms);
}
function tbNombre(n){ return String(n || "").trim().split(/\s+/)[0] || ""; }
function tbSector(p){
  const c = p.sectorId ? S.sectores.find(x => x.id === p.sectorId) : null;
  return c ? c.nombre : "";
}
function tbIniciales(n){
  return String(n || "").split(/\s+/).filter(Boolean).slice(0,2).map(x => x[0].toUpperCase()).join("") || "?";
}
function tbSuma(l, f){ return l.reduce((a, x) => a + (Number(f(x)) || 0), 0); }
const TB_FAM = ["#C98410", "#5B6BA6", "#1F7A4D", "#A93226", "#1A6FE0", "#6B6070"];
function tbColorFam(cat){
  let h = 0; String(cat || "").split("").forEach(c => { h = (h * 31 + c.charCodeAt(0)) % 9973; });
  return TB_FAM[h % TB_FAM.length];
}

function tbKpis(sem){

  if (!tablero.sello) dAyer = '<div class="tb-d">contra ayer…</div>';
  else if (ayer <= 0) dAyer = '<div class="tb-d">ayer no hubo ventas</div>';
  else {
    const pct = Math.round((vendido - ayer) / ayer * 1000) / 10;
    dAyer = '<div class="tb-d ' + (pct >= 0 ? "up" : "dn") + '">' + (pct >= 0 ? "▲ " : "▼ ") + Math.abs(pct) + '% contra ayer</div>';

  const quienes = {};
  (S.pedidosDia || []).forEach(p => { if (p.preventaUid) quienes[p.preventaUid] = 1; });

      '<span class="tb-cir ' + cls + '">' + tbIco(ico) + '</span><div><div class="tb-et">' + et + '</div>' +
      '<div class="tb-n">' + n + '</div>' + d + '</div></button>';
  return '<section class="tb-kpis">' +
    kpi("c-senal", "dol", "Vendido hoy", money(vendido), dAyer, "hoy:tablero") +
    kpi("c-navy", "car", "Pedidos hoy", peds.length,
      '<div class="tb-d">' + (nQ ? nQ + (nQ === 1 ? " preventista vendiendo" : " preventistas vendiendo") : "nadie ha vendido") + '</div>', "hoy:pedidos") +
    kpi("c-mover", "chk", "Por aprobar", porAprobar,
      '<div class="tb-d ' + (porAprobar ? "ir" : "") + '">' + (porAprobar ? "Ver pedidos →" : "todo aprobado") + '</div>', "hoy:pedidos") +
    kpi("c-azul", "cam", "Entregas hoy", ent.length ? hechas + '<small>/' + ent.length + '</small>' : "0",
      '<div class="tb-d">' + (!ent.length ? "sin entregas hoy" :
        (faltan ? faltan + " por entregar" : "todas hechas") + (noPudo ? " · " + noPudo + " no se pudo" : "")) + '</div>', "hoy:reparto") +
    kpi("c-ok", "gen", "Clientes activos", activos,
      '<div class="tb-d' + (nuevos ? " up" : "") + '">' + (nuevos ? "▲ " + nuevos + (nuevos === 1 ? " nuevo este mes" : " nuevos este mes") : "ninguno nuevo este mes") + '</div>', "clientes:clientes") +
    kpi("c-perdido", "ale", "Bodega baja", bajos,
      '<div class="tb-d ' + (bajos ? "ir" : "") + '">' + (bajos ? "Ver bodega →" : "nada escaso") + '</div>', "hoy:existencias") +
    '</section>';
}
function tbBajos(){
  const min = minimoExistencia();
  return S.catalogo.filter(p => S.exist[p.cod] != null && Number(S.exist[p.cod]) <= min)
    .map(p => ({p, n: Number(S.exist[p.cod]) || 0})).sort((a, b) => a.n - b.n);
}

function tbGrafica(sem){
  const hoy = hoyISO(), libres = S.ajustes.noLaborables || [0, 6];
  const DIAS = ["dom", "lun", "mar", "mié", "jue", "vie", "sáb"];
  const dias = [];
  for (let i = 6; i >= 0; i--){
    const f = corrido(hoy, -i);
    const [aa, mm, dd] = f.split("-").map(Number);
    const ds = new Date(aa, mm - 1, dd).getDay();
    const v = tbSuma(sem.filter(p => p.fecha === f && esVenta(p)), p => p.total);
    dias.push({f, et: DIAS[ds] + " " + dd, v: (v <= 0 && libres.indexOf(ds) >= 0) ? null : v});
  }
  const W = 520, H = 210, L = 46, R = 14, T = 16, B = 34;
  const top = Math.max(...dias.map(d => d.v || 0), 1);
  const paso = top > 4000 ? 2000 : top > 2000 ? 1000 : top > 800 ? 500 : top > 400 ? 200 : top > 160 ? 100 : 50;
  const max = Math.ceil(top / paso) * paso;
  const x = i => L + i * (W - L - R) / 6, y = v => T + (H - T - B) * (1 - v / max);
  let s = '<svg viewBox="0 0 ' + W + ' ' + H + '" role="img" aria-label="Ventas de los últimos 7 días">';
  for (let v = 0; v <= max; v += paso)
    s += '<line class="g" x1="' + L + '" x2="' + (W - R) + '" y1="' + y(v) + '" y2="' + y(v) + '"/>' +
      '<text x="' + (L - 6) + '" y="' + (y(v) + 4) + '" text-anchor="end">$' + (v >= 1000 ? (v / 1000) + "k" : v) + '</text>';
  const segs = []; let cur = [];
  dias.forEach((d, i) => { if (d.v == null){ if (cur.length) segs.push(cur); cur = []; } else cur.push([x(i), y(d.v)]); });
  if (cur.length) segs.push(cur);
  segs.forEach(sg => {
    if (sg.length < 2) return;
    const d = sg.map((p, i) => (i ? "L" : "M") + p[0].toFixed(1) + " " + p[1].toFixed(1)).join(" ");
    s += '<path class="a" d="' + d + ' L' + sg[sg.length - 1][0].toFixed(1) + ' ' + y(0) + ' L' + sg[0][0].toFixed(1) + ' ' + y(0) + 'Z"/>' +
      '<path class="l" d="' + d + '"/>';
  });
  dias.forEach((d, i) => {
    if (d.v == null){
      s += '<line class="o" x1="' + (x(i) - 18) + '" x2="' + (x(i) + 18) + '" y1="' + y(0) + '" y2="' + y(0) + '"/>';
    } else {
      s += '<circle class="p' + (i === 6 ? " hoy" : "") + '" cx="' + x(i) + '" cy="' + y(d.v) + '" r="4"/>';
    }
    s += '<text x="' + x(i) + '" y="' + (H - 14) + '" text-anchor="middle">' + d.et + '</text>';
  });
  if (dias[6].v != null && dias[6].v > 0)
    s += '<text class="n" x="' + (x(6) - 8) + '" y="' + (y(dias[6].v) - 10) + '" text-anchor="end">' + money(dias[6].v) + ' hasta ahora</text>';
  s += '</svg>';
  return '<div class="tb-card"><div class="tb-tit"><h2>Ventas de los últimos 7 días</h2><span class="tb-sel">Vendido ($)</span></div>' +
    '<div class="tb-graf">' + s + '</div></div>';
}

function tbDona(){
  const peds = S.pedidosDia || [];
  const cuenta = {};
  peds.forEach(p => { const e = tbEstadoDe(p); cuenta[e] = (cuenta[e] || 0) + 1; });
  const est = TB_ESTADOS.filter(x => cuenta[x[0]]).map(x => ({n: cuenta[x[0]], nombre: x[1], color: x[4]}));
  const tot = peds.length;
  let d;
  if (!tot) d = '<div class="tb-vacio">Todavía no hay pedidos hoy.</div>';
  else {
    const r = 52, C = 2 * Math.PI * r; let acc = 0;
    d = '<div class="tb-dona"><svg viewBox="0 0 140 140" role="img" aria-label="Pedidos de hoy por estado">';
    est.forEach(e => {
      const f = e.n / tot;
      d += '<circle cx="70" cy="70" r="' + r + '" fill="none" stroke="' + e.color + '" stroke-width="20" stroke-dasharray="' +
        (f * C).toFixed(2) + ' ' + C.toFixed(2) + '" stroke-dashoffset="' + (-acc * C).toFixed(2) + '" transform="rotate(-90 70 70)"/>';
      acc += f;
    });
    d += '<text class="c1" x="70" y="72" text-anchor="middle">' + tot + '</text><text class="c2" x="70" y="86" text-anchor="middle">pedidos</text></svg>' +
      '<ul>' + est.map(e => '<li><i style="background:' + e.color + '"></i><span>' + e.nombre + '</span><b>' + e.n +
        ' <small>(' + Math.round(e.n / tot * 100) + '%)</small></b></li>').join("") + '</ul></div>';
  }
  return '<div class="tb-card"><div class="tb-tit"><h2>Pedidos de hoy por estado</h2></div>' + d + '</div>';
}

function tbActividad(){
  const hoy = hoyISO();
  const vistos = {}, todos = [];
  (S.pedidosDia || []).concat(S.entregasHoy || []).forEach(p => { if (!vistos[p.id]){ vistos[p.id] = 1; todos.push(p); } });
  const ev = [];
  todos.forEach(p => {
    if (p.fecha === hoy && p.creado)
      ev.push({ms: tbMs(p.creado), cls: "c-navy", ico: "car", t: "Pedido nuevo · " + money(p.total),
        s: p.clienteNombre + " · " + tbNombre(p.preventaNombre), id: p.id});
    if (p.entregadoEn && tbMs(p.entregadoEn)){
      const ms = tbMs(p.entregadoEn), q = tbNombre(p.entregadoPorNombre);
      if (p.estado === "no entregado")
        ev.push({ms, cls: "c-perdido", ico: "ale", t: "No se pudo entregar", s: p.clienteNombre + (q ? " · " + q : ""), id: p.id});
      else if (tbEntregado(p))
        ev.push({ms, cls: p.estado === "entregado parcial" ? "c-cambio" : "c-ok", ico: "cam",
          t: (p.estado === "entregado parcial" ? "Entrega parcial · " : "Entregado · ") + money(p.totalEntregado != null ? p.totalEntregado : p.total),
          s: p.clienteNombre + (q ? " · " + q : ""), id: p.id});
    }
  });
  S.clientes.filter(c => c.creadoEl === hoy).forEach(c =>
    ev.push({ms: tbMs(c.ubicadoEn), cls: "c-ok", ico: "gen", t: "Cliente nuevo", s: c.nombre + (c.creadoPorNombre ? " · " + tbNombre(c.creadoPorNombre) : "")}));
  ev.sort((a, b) => b.ms - a.ms);
  const FONDO = {"c-navy": "var(--f-vender);color:var(--c-vender)", "c-ok": "var(--f-listo);color:var(--c-listo)",
    "c-cambio": "var(--f-cambio);color:var(--c-cambio)", "c-perdido": "var(--f-perdido);color:var(--c-perdido)"};
  const lista = ev.slice(0, 6);
  return '<div class="tb-card"><div class="tb-tit"><h2>Actividad reciente</h2></div>' +
    (!lista.length ? '<div class="tb-vacio">Nada todavía. Aquí van saliendo los pedidos, las entregas y los clientes nuevos del día.</div>' :
    '<ul class="tb-acti">' + lista.map(e =>
      '<li' + (e.id ? ' data-ped="' + e.id + '" style="cursor:pointer"' : '') + '><span class="tb-cir" style="background:' + FONDO[e.cls] + '">' + tbIco(e.ico) + '</span>' +
      '<div><b>' + escapar(e.t) + '</b><small>' + escapar(e.s) + '</small></div><time>' + tbHace(e.ms) + '</time></li>').join("") + '</ul>') +
    '<button class="tb-ver" data-ir="hoy:tablero">Ver todo lo de hoy →</button></div>';
}

function tbCargando(titulo){
  return '<div class="tb-card"><div class="tb-tit"><h2>' + titulo + '</h2></div><div class="tb-vacio">' +
    (tablero.error ? 'No se pudo leer (' + escapar(tablero.error) + ').' : 'Cargando…') + '</div></div>';
}
function tbTopProductos(sem){
  if (!tablero.sello) return tbCargando("Lo más vendido · 7 días");
  const por = {};
  sem.filter(esVenta).forEach(p => (p.lineas || []).forEach(l => {
    const u = tbUnid(p, l);
    if (!por[l.cod]) por[l.cod] = {cod: l.cod, nombre: l.nombre, u: 0, v: 0};
    por[l.cod].u += u; por[l.cod].v += dosDec(u * (Number(l.precio) || 0));
  }));
  const top = Object.values(por).sort((a, b) => b.v - a.v).slice(0, 5);
  const catDe = cod => { const p = S.catalogo.find(x => x.cod === cod); return p ? p.cat : ""; };
  return '<div class="tb-card"><div class="tb-tit"><h2>Lo más vendido · 7 días</h2></div>' +

/* ===================== Puesta en marcha =====================
   El dia uno de una empresa nueva la base esta VACIA: cero cuentas, cero
   productos, cero rutas, cero clientes. Y el tablero, que es lo primero
   que se abre, se ve exactamente igual que el de una empresa que cerro:
   todo en cero. Quien instala tiene que adivinar en que orden se llena, y
   el orden importa --no se puede meter un cliente sin ruta, ni una ruta
   sin preventista-- asi que adivinar sale caro.

   Esto no es un tutorial ni una pantalla nueva: es una tarjeta que
   aparece ARRIBA del tablero mientras algo esencial falte, dice que falta,
   en que orden va, y lleva de un toque al lugar donde se hace. En cuanto
   esta todo, desaparece sola y no vuelve. Lo que se hace una vez en la
   vida no puede quedar estorbando para siempre.

   Y no repite las instrucciones: los pasos que ya tienen guia escrita en
   Ayuda enlazan a ESA guia. Un solo texto, un solo lugar. */
const PASOS_ARRANQUE = [
  {id:"empresa", titulo:"Poner los datos de la empresa",
   por:"El nombre, el NIT y el giro salen en cada ticket que firma el cliente.",
   ir:"ajustes:ajustes", foco:"s-t-razon", boton:"Ir a Ajustes",
   /* Cuenta lo que de verdad va a salir impreso, venga de Ajustes o del
      arranque de empresa.js. Si solo mirara Ajustes, este paso saldria
      pendiente para siempre en una empresa que ya trae sus datos. */
   listo: () => !!datosTicket().razon},

  {id:"cuentas", titulo:"Crear las cuentas del equipo",
   por:"Los preventistas y los motoristas entran con su propio correo. Sin cuentas no hay quien venda ni quien entregue.",
   ir:"equipo:usuarios", boton:"Ir a Cuentas", guia:"guiaCuentas",
   listo: () => (S.usuarios || []).some(u => u.activo !== false && u.rol && u.rol !== "admin")},

  {id:"catalogo", titulo:"Cargar el catálogo",
   por:"Los productos con su precio. Se sube de un Excel; no hay que teclearlos uno por uno.",
   ir:"catalogo:cargarCat", boton:"Cargar del Excel",
   listo: () => (S.catalogo || []).length > 0},

  {id:"rutas", titulo:"Armar las rutas",
   por:"Cada ruta lleva su día y su preventista. Va ANTES que los clientes, porque cada cliente se mete dentro de una ruta.",
   ir:"clientes:sectores", boton:"Ir a Rutas", guia:"guiaRutas",
   listo: () => (S.sectores || []).some(x => x.activo !== false)},

  {id:"clientes", titulo:"Meter los clientes",
   por:"Uno por uno o pegando la lista completa. Es lo último porque cada uno necesita su ruta ya creada.",
   ir:"clientes:clientes", boton:"Ir a Clientes", guia:"guiaPadron",
   listo: () => (S.clientes || []).length > 0}
];

function faltaDeArranque(){
  /* Si algo se cae al preguntar, ese paso se da por hecho: mas vale no
     enseñar la tarjeta que enseñarla con un dato inventado. */
  return PASOS_ARRANQUE.filter(p => { try { return !p.listo(); } catch(e){ return false; } });
}

function tbArranque(){
  const faltan = faltaDeArranque();
  if (!faltan.length) return "";              // ya arrancó: no se dibuja nada
  const hechos = PASOS_ARRANQUE.length - faltan.length;
  const primero = faltan[0];
  return '<div class="tb-card" style="border-left:4px solid var(--senal)">' +
    '<div class="tb-tit"><h2>Puesta en marcha</h2>' +
      '<span class="tb-sub">' + hechos + ' de ' + PASOS_ARRANQUE.length + ' listos</span></div>' +
    '<p style="font-size:14px;margin:0 0 12px">Falta esto para que el sistema quede andando. ' +
      'Van <b>en este orden</b>: cada uno necesita el anterior.</p>' +
    PASOS_ARRANQUE.map(p => {
      const hecho = faltan.indexOf(p) < 0;
      const ahora = p === primero;
      return '<div style="display:flex;gap:12px;align-items:flex-start;padding:10px 0;' +
          'border-top:1px solid var(--linea)">' +
        '<span style="flex:0 0 26px;height:26px;border-radius:50%;font-weight:800;font-size:14px;' +
          'display:flex;align-items:center;justify-content:center;' +
          (hecho ? 'background:var(--verde);color:#fff' :
           ahora ? 'background:var(--senal);color:#fff' :
                   'background:var(--linea);color:var(--tenue)') + '">' +
          (hecho ? "✓" : (PASOS_ARRANQUE.indexOf(p) + 1)) + '</span>' +
        '<div style="flex:1;min-width:0">' +
          '<div style="font-size:14.5px;font-weight:700;line-height:1.35' +
            (hecho ? ';color:var(--tenue)' : '') + '">' + escapar(p.titulo) +
            (hecho ? ' · listo' : '') + '</div>' +
          (hecho ? '' :
            '<div style="font-size:13px;color:var(--tenue);margin-top:3px">' + escapar(p.por) + '</div>' +
            /* Los botones NO se estiran: un «Ir a Ajustes» de punta a punta
               de la tarjeta parece una franja, no un botón, y encima queda
               desalineado con los pasos que llevan dos. */
            '<div class="fila" style="gap:8px;margin-top:8px;flex-wrap:wrap;justify-content:flex-start">' +
              '<button class="btn linea chico" style="width:auto;flex:0 0 auto" data-ir="' + p.ir + '"' +
                (p.foco ? ' data-foco="' + p.foco + '"' : '') + '>' +
                escapar(p.boton) + '</button>' +
              (p.guia ? '<button class="btn linea chico" style="width:auto;flex:0 0 auto" data-guia="' + p.guia +
                        '">Cómo se hace</button>' : '') +
            '</div>') +
        '</div></div>';
    }).join("") +
    '</div>';
}

function tbAcciones(){

    ["a3", "cam", "Reparto", "hoy:reparto"], ["a4", "bod", "Bodega", "hoy:existencias"],

function tbResumenMes(mes){
  const MESES = ["enero", "febrero", "marzo", "abril", "mayo", "junio", "julio", "agosto", "septiembre", "octubre", "noviembre", "diciembre"];
  const nombre = MESES[Number(mesISO().slice(5, 7)) - 1];
  if (!tablero.sello) return tbCargando("Resumen de " + nombre);
  const ventas = mes.filter(esVenta), hoy = hoyISO();
  const vendido = tbSuma(ventas, p => p.total);
  const dias = {}; ventas.forEach(p => { dias[p.fecha] = 1; });
  const nd = Math.max(1, Object.keys(dias).length);
  const prog = ventas.filter(p => p.fechaEntrega && p.fechaEntrega <= hoy).length;
  const entregados = ventas.filter(tbEntregado).length;
  const nuevos = S.clientes.filter(c => c.creadoMes === mesISO()).length;
  const activos = S.clientes.filter(c => c.activo !== false).length;
  const caja = (et, n, d, up) => '<div><div class="tb-et">' + et + '</div><div class="tb-n">' + n + '</div><div class="tb-d' + (up ? " up" : "") + '">' + d + '</div></div>';
  return '<div class="tb-card"><div class="tb-tit"><h2>Resumen de ' + nombre + '</h2><span class="tb-sel">' + nd + (nd === 1 ? " día" : " días") + ' con ventas</span></div>' +
    '<div class="tb-res4">' +
    caja("Vendido", money(vendido), money(vendido / nd) + " por día") +
    caja("Pedidos", ventas.length, (Math.round(ventas.length / nd * 10) / 10) + " por día") +
    caja("Entregados", entregados, prog ? "▲ " + Math.round(entregados / prog * 100) + "% de lo programado" : "nada programado aún", prog && entregados / prog >= 0.9) +
    caja("Clientes nuevos", nuevos, "de " + activos + " activos") +
    '</div></div>';
}

/* Un pedido en la hoja de abajo, tal como lo muestra la pestana Pedidos. */

  const sem = tbConHoy(tablero.sem), mes = tbConHoy(tablero.mes);

  const DS = ["Domingo", "Lunes", "Martes", "Miércoles", "Jueves", "Viernes", "Sábado"];

    '<div class="tb-fecha"><span>' + tbIco("cal") + '<b>' + DS[ahora.getDay()] + ' ' + ahora.getDate() + ' de ' + MS[ahora.getMonth()] + '</b> · ' +
      tbHora(ahora.getTime()) + '</span></div>' +
    /* Va ARRIBA de los números: mientras falte lo esencial, los números

    tbArranque() +

    irAPestana(d[0], d[1]);
    /* Con `data-foco`, el botón no solo lleva a la pantalla: lleva a LA
       CASILLA. Ajustes tiene quince bloques; mandar ahí a alguien que solo
       necesita el nombre de la empresa y dejarlo buscando es como no
       haberlo llevado. Se espera un pestañeo porque la pantalla se pinta

    const foco = b.dataset.foco;

/* Qué guía de Ayuda hay que dejar abierta al entrar. Se usa una vez y se
   olvida: si no, la siguiente visita a Ayuda saldría con algo abierto sin
   que nadie lo haya pedido. */
let ayudaAbrir = null;

/* Para oficina, Administrar ES una pestaña de la barra de abajo: si al
   entrar se escondiera la barra, se quedaría sin manera de volver. Para
   el preventa sigue igual que antes, porque para él Administrar es un
   botón del encabezado y la barra estorba adentro. */
let volverA = "vivo", adminAbierto = false;
$("#btn-admin").onclick = () => {
  adminAbierto = true; escucharClientes();   // aqui si se ocupan todos
  const oficina = S.rol === "admin";
  if (oficina && (S.pagina === "vivo" || S.pagina === "hoy")) volverA = S.pagina;
  if (S.pagina === "vivo") soltarVivo();
  ver("#pant-app", false); ver("#pant-ruta", false); ver("#pant-dia", false);
  ver("#pant-oficina", false);          // se quedaban las dos encimadas
  ver("#nav", false); ver("#carro", false);
  if (oficina) S.pagina = "admin";
  grupoActual = null;
  ver("#pant-admin", true); pintarAdmin();
};
/* Salir de Administrar, en un solo lugar. Antes esto vivia nada mas
   dentro del boton Volver, y el ATRAS del telefono hacia SOLO la primera
   linea: escondia Administrar y no mostraba ninguna otra pantalla, asi
   que el telefono se quedaba en blanco. Ademas dejaba adminAbierto
   prendido (siguiendo a TODOS los clientes) y la clase con-nav puesta.
   Ahora los dos caminos llaman aqui y no se pueden volver a separar. */
function salirDeAdmin(){
  /* Oficina no tiene a donde salir: Administrar es su unica pantalla.
     "Volver" (y el ATRAS del telefono) la llevan a la portada. */
  if (S.rol === "admin"){ grupoActual = null; pintarAdmin(); return; }
  ver("#pant-admin", false);
  soltarTablero();
  adminAbierto = false; escucharClientes();   // se sueltan al salir
  document.body.classList.remove("con-nav");
  irA(S.pagina === "admin" ? "catalogo" : S.pagina);
}
$("#btn-volver").onclick = salirDeAdmin;
cablearTablero();
/* El supervisor NO es oficina: manda sobre los preventas, asi que ve como va
   cada uno y que errores le han cargado, pero no toca metas, comisiones ni
   cargos: esos botones se le esconden con soloVer(). Lo que SI hace es
   armar rutas (Brayan, 03-09-2026): Clientes, Zonificador y Rutas son
   suyas, y las reglas de Firestore lo dejan escribir sectores, agenda y
   sectorId/preventaUid/orden del cliente. */
/* Las hojas de "Como se hace" son de solo leer: no tocan la base, asi que
   el supervisor tambien las ve. Le sirven para saber a que atenerse. */
/* SON DOS LISTAS DISTINTAS, y hay que tenerlas separadas.

   El SUPERVISOR arma rutas: Brayan lo aprobo. Y lleva "En vivo", que antes
   era pestana de abajo y ahora vive aqui adentro, porque la barra de abajo
   la ocupa para vender.

   El preventista con "ve al equipo" NO arma rutas. Es un vendedor al que
   se le dejo mirar como va el equipo, nada mas. Si se usara la misma
   lista, prender ese interruptor le regalaria el Zonificador y podria
   moverle los clientes a cualquiera sin que nadie lo decidiera. */
const PESTANAS_SUPERVISOR = ["tablero","vivo","metas","foco","reparto",
  "clientes","zonificar","sectores","ficha","ayuda"];
const PESTANAS_VE_EQUIPO = ["tablero","metas","foco","reparto","ayuda"];
function soloVer(){ return S.rol === "supervisor" || S.verEquipo === true; }
/* La flechita que destapa las descripciones. Una sola arriba de la lista,
   no una por opcion: siete flechitas serian otras siete cosas que ver, y
   estariamos igual. Se acuerda de como la dejo el usuario — el que esta
   aprendiendo la deja abierta, el que ya sabe la deja cerrada. */
function explicaAbierto(){
  try { return localStorage.getItem("preventa_explicar") === "1"; } catch(_){ return false; }
}
function ponerExplica(si){
  try { localStorage.setItem("preventa_explicar", si ? "1" : "0"); } catch(_){}
}
function botonExplica(){
  const a = explicaAbierto();
  return '<button type="button" class="destapa" id="adm-explicar" aria-expanded="' + a + '">' +
    '<span class="fl">\u203a</span>' + (a ? "Ocultar" : "Explicar") + '</button>';
}
/* Lo cablea quien lo pinte: al tocarlo se guarda y se vuelve a pintar. */
function cablearExplica(){
  const b = $("#adm-explicar");
  if (b) b.onclick = () => { ponerExplica(!explicaAbierto()); pintarAdmin(); };
}


function ajustarPestanas(){
  const tira = $("#pestanas");
  const g = gruposVisibles().find(x => x.id === grupoActual);
  if (!g || g.tabs.length < 2){ tira.classList.add("oculto"); tira.innerHTML = ""; return; }
  tira.classList.remove("oculto");

async function guardarCatalogo(productos, mensaje){
  const conPiso = productos.map(p => {
    const copia = Object.assign({}, p);
    const c = costoBase(p.cod);
    if (c != null){
      copia.precioMin = Math.round(c * (1 + (p.margen ?? S.ajustes.margenGeneral)/100) * 100)/100;
      copia.descMax = copia.precio ? Math.max(0, Math.round((copia.precio - copia.precioMin)/copia.precio*1000)/10) : 0;
    } else { delete copia.precioMin; delete copia.descMax; }

    version: (S.catVersion || 0) + 1,
    actualizado: firebase.firestore.FieldValue.serverTimestamp(),
    productos: conPiso
  });

}

/* ===================== Traer el catálogo de Handy =====================
   Los 113 productos de aquí tenían el costo puesto a mano y marcado como
   provisional: eran precios de venta, no costos. Handy tiene los precios
   de verdad, los que se cobran en la calle, y son 371.
   Handy NO guarda el costo de compra, así que el piso de margen sigue
   saliendo del margen general hasta que oficina mande los costos. */
let catFilas = [];

/* No es de un sistema en particular: busca la fila de encabezados que
   tenga «codigo» y «precio», y de ahi mapea los nombres de columna mas
   comunes. Por eso sirve con el Excel de cualquier proveedor. */
function leerCatalogoHandy(filas){
  let cab = -1;
  for (let i = 0; i < Math.min(filas.length, 20); i++){
    const f = (filas[i]||[]).map(sinTilde);
    if (f.indexOf("codigo") >= 0 && f.indexOf("precio") >= 0){ cab = i; break; }
  }
  if (cab < 0) return [];
  const enc = (filas[cab]||[]).map(sinTilde);
  const col = (...ns) => { for (const x of ns){ const i = enc.indexOf(x); if (i >= 0) return i; } return -1; };
  const iCod = col("codigo"), iNom = col("descripcion","nombre"), iFam = col("familia"),
        iPre = col("precio"), iMin = col("precio minimo"), iBase = col("precio base"),
        iImp = col("impuesto 1"), iUni = col("unidad de medida"), iHab = col("habilitado"),
        iBar = col("codigo de barras");
  const dato = (f,i) => (i >= 0 && f[i] != null) ? String(f[i]).trim() : "";
  const num  = x => { const v = parseFloat(String(x).replace(",",".")); return isNaN(v) ? null : v; };
  /* Muchos sistemas mandan todo en MAYUSCULA y asi se ve gritado en el
     telefono. Se pasa a mayúscula solo la inicial. */
  const chicas = ["de","del","la","el","los","las","y","con","sin","en","a","para"];
  const titulo = t => t.toLowerCase().split(/\s+/).map((w,i) =>
    (i > 0 && chicas.indexOf(w) >= 0) ? w
      : (/^[0-9]/.test(w) ? w.toUpperCase() : w.charAt(0).toUpperCase() + w.slice(1))).join(" ");
  const FAM = {"abarroteria":"Abarrotes","higiene personal":"Higiene","lacteos":"L\u00e1cteos",
               "suero electrolic":"Medicamentos","oficina":"Papeler\u00eda"};

  const out = [];
  for (let i = cab + 1; i < filas.length; i++){
    const f = filas[i]; if (!f) continue;
    const cod = dato(f, iCod); if (!cod) continue;
    if (iHab >= 0 && sinTilde(dato(f, iHab)) === "no") continue;
    const precio = num(dato(f, iPre)); if (precio == null) continue;
    const fam = dato(f, iFam);
    const p = {cod:cod, nombre:titulo(dato(f, iNom)),
      cat: FAM[sinTilde(fam)] || (fam ? fam.charAt(0) + fam.slice(1).toLowerCase() : ""),
      precio:precio, visible:true, origen:"handy"};
    const base = num(dato(f, iBase)); if (base != null) p.precioBase = Math.round(base*10000)/10000;
    if (dato(f, iImp)) p.impuesto = 13; else p.sinImpuesto = true;
    const min = num(dato(f, iMin));
    if (min != null && min < precio) p.precioMin = min;
    else if (min != null && min > precio) p.minAlReves = true;
    /* La unidad buena es la que manda oficina en su catalogo. La de Handy
       entra solo para no dejar el campo vacio mientras ese archivo llega, y
       ya no se descarta PZA: si el producto se vende por pieza, hay que
       decirlo, no callarlo. */
    const uni = dato(f, iUni); if (uni) p.unidad = uni.toUpperCase();
    const bar = dato(f, iBar); if (bar) p.codBarra = bar;
    out.push(p);
  }
  return out;
}

/* Junta el catalogo de ahora con lo que trae un Excel nuevo, sin perder
   lo que alguien corrigio a mano ni borrar lo que el archivo no trae.
   - Codigo nuevo (no estaba): entra tal como lo trae el Excel.
   - Codigo que nadie edito a mano: se actualiza con lo del Excel.
   - Codigo editado a mano (trae `editado`): se respeta la version de aqui.
     Lo que ofrece el Excel para ese codigo queda anotado en
     `pendienteExcel`, para poder verlo y soltarlo con un boton sin que se
     pierda de vista.
   - Codigo que existe aqui pero el Excel no lo trae: se queda igual. El
     export de otro sistema puede venir incompleto; ausencia no es orden
     de borrar. */
function fusionarCatalogo(actuales, nuevos){
  const porCod = {};
  (actuales || []).forEach(p => { porCod[p.cod] = Object.assign({}, p); });
  const respetados = [];
  (nuevos || []).forEach(n => {
    const actual = porCod[n.cod];
    if (!actual){
      porCod[n.cod] = Object.assign({}, n);
      return;
    }
    if (actual.editado){
      porCod[n.cod] = Object.assign({}, actual, {pendienteExcel: n});
      respetados.push(n.cod);
      return;
    }
    const fusion = Object.assign({}, actual, n);
    delete fusion.editado;
    delete fusion.pendienteExcel;
    porCod[n.cod] = fusion;
  });
  return {
    productos: Object.keys(porCod).map(k => porCod[k]),
    respetados: respetados
  };
}

          (alReves ? alReves + " producto(s) tienen el <b>precio m\u00ednimo m\u00e1s alto que el precio</b>. " +
            "Eso est\u00e1 al rev\u00e9s, as\u00ed que a esos se les ignora el m\u00ednimo." : "") +
          '</div>' : '') +
      (function(){
        /* Vista previa del fusionado, ANTES de guardar nada: cuantos son
           nuevos, cuantos se actualizan solos, y cuantos quedan respetados

        const prev = fusionarCatalogo(S.catalogo, catFilas);
        const codsActuales = {}; S.catalogo.forEach(p => codsActuales[p.cod] = true);
        const nuevos = catFilas.filter(x => !codsActuales[x.cod]).length;

          (prev.respetados.length
            ? '<b>' + prev.respetados.length + ' quedan como est\u00e1n</b> por estar editados a mano ' +

            : '0 editados a mano en conflicto') +

        const c = Object.assign({}, x);

           importacion (para contar cuantos venian exentos) y se tiraba
           antes de guardar. Pero oficina la necesita: el puente manda
           gravado por linea, y ese dato sale de aqui. Sin el, los 18
           productos exentos del catalogo saldrian facturados con 13% que
           el cliente no debe. minAlReves si se sigue tirando: esa si es
           solo un aviso de la importacion. */
        delete c.minAlReves;
        return c;
      });
      const fusion = fusionarCatalogo(S.catalogo, limpios);
      const ok = await guardarEn("configuracion", () =>
        db.collection("configuracion").doc("catalogo").set({
          version: (S.catVersion || 0) + 1,

        }), $("#cc-subir"));
      if (ok){
        catFilas = [];
        alert("Listo: " + fusion.productos.length + " productos en el cat\u00e1logo" +
          (fusion.respetados.length
            ? " (" + fusion.respetados.length + " se quedaron con la versi\u00f3n editada a mano)."
            : ".") +
          "\n\nA los tel\u00e9fonos les llega solo, no hay que hacer nada m\u00e1s.");
        pintarAdmin();
      }
    };
  };
}

async function revisarPermisos(){
  const el = $("#a-diag"); el.className = "aviso dato"; el.textContent = "Revisando…";
  const lineas = [];
  let todoBien = true;
  const paso = async (nombre, fn) => {
    try { await fn(); lineas.push("OK · " + nombre); }
    catch(e){ todoBien = false; lineas.push("FALLA · " + nombre + " [" + (e.code || e.message) + "]"); }
  };
  lineas.push("Cuenta: " + S.usuario.email);
  await paso("leer su documento en usuarios", async () => {
    const d = await db.collection("usuarios").doc(S.usuario.uid).get();
    if (!d.exists) throw new Error("no existe el documento con su UID");
    const u = d.data();
    lineas.push("   rol = " + JSON.stringify(u.rol) + " · activo = " + JSON.stringify(u.activo));
    if (u.rol !== "admin") throw new Error("rol no es admin");
    if (u.activo !== true) throw new Error("activo no es verdadero (boolean)");
  });
  await paso("leer el catálogo", () => db.collection("configuracion").doc("catalogo").get());
  await paso("leer los costos", () => db.collection("configuracion").doc("costos").get());
  el.className = "aviso" + (todoBien ? " bien" : "");
  el.innerHTML = lineas.join("<br>") + (todoBien ? "<br><br>Todo en orden: ya puede cargar el catálogo." : "");
  el.classList.remove("oculto");
}

      provisional: $("#e-prov").checked,
      /* Marca de "esto lo corrigió una persona": es lo que hace que la
         próxima carga de Excel respete este producto en vez de pisarlo. */
      editado: {por: S.nombre || "", uid: (S.usuario && S.usuario.uid) || "", en: hoyISO()}
    });
    if (!productos[i].unidad) delete productos[i].unidad;
    productos[i].docena = Math.round(productos[i].precio * 11.4 * 100)/100;
    productos[i].mayoreo = Math.round(productos[i].precio * 21.6 * 100)/100;
    const cu = parseFloat($("#e-costoult").value);
    const costos = Object.assign({}, S.costos || {});
    if (isNaN(c) && isNaN(cu)) delete costos[p.cod];
    else costos[p.cod] = {prom: isNaN(c) ? cu : c, ult: isNaN(cu) ? c : cu};
    S.costos = costos;
    await db.collection("configuracion").doc("costos").set({actualizado: firebase.firestore.FieldValue.serverTimestamp(), costos});
    await guardarCatalogo(productos);
    cerrarHoja(); pintarAdmin();
  };
  $("#fondo").classList.add("abierto"); $("#hoja").classList.add("abierta");
}

/* "Soltar": el producto quedó marcado como editado a mano, así que la
   última carga de Excel no lo tocó y dejó su versión pendiente aparte
   (pendienteExcel). Esto aplica esa versión y quita las dos marcas. */
async function soltarPendienteExcel(i){
  const p = S.catalogo[i];
  if (!p || !p.pendienteExcel) return;
  if (!confirm('¿Reemplazar "' + p.nombre + '" con los datos del último Excel? Se pierde la edición manual.')) return;
  const productos = S.catalogo.slice();
  const nuevo = Object.assign({}, p, p.pendienteExcel);
  delete nuevo.editado;
  delete nuevo.pendienteExcel;
  productos[i] = nuevo;
  await guardarCatalogo(productos, 'Listo: "' + nuevo.nombre + '" quedó con los datos del Excel.');
  pintarAdmin();
}

/* Los codigos de oficina no son BEB-001: son 300006, D100033, A200027. Por eso
   el codigo ya no se adivina por su forma, se toma la PRIMERA celda de la fila
   y los costos salen de las que siguen. El primero es el promedio y el segundo,
   si viene, el de la ultima compra. Lo que no este en el catalogo se reporta. */
function leerFilas(filas){
  const mapa = {};
  filas.forEach(f => {
    if (!f) return;
    const celdas = f.map(x => (x == null ? "" : String(x).trim())).filter(x => x !== "");
    if (celdas.length < 2) return;
    const cod = celdas[0];
    /* La celda tiene que ser un numero Y NADA MAS. Antes bastaba con que
       EMPEZARA con numero, y por eso la unidad se colaba como costo: en el
       catalogo de oficina hay unidades que se llaman "6 PACK", "4 OZ" y
       "24 UND", y de ahi salian costos de 6.00, 4.00 y 24.00. */
    const nums = celdas.slice(1)
      .map(x => String(x).replace(/[$\s,]/g,""))
      .filter(x => /^-?\d+(\.\d+)?$/.test(x))
      .map(Number)
      .filter(n => n > 0);
    if (!nums.length) return;
    const dos = x => Math.round(x*100)/100;
    mapa[cod.toUpperCase()] = {prom: dos(nums[0]), ult: dos(nums.length > 1 ? nums[1] : nums[0])};
  });
  return mapa;
}
function cargarSheetJS(){
  if (window.XLSX) return Promise.resolve();
  return new Promise((ok, mal) => {
    const s = document.createElement("script");
    s.src = "https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js";
    s.onload = ok; s.onerror = () => mal(new Error("necesita conexión para leer Excel"));
    document.head.appendChild(s);
  });
}

  $("#u-otra").onclick = () => { $("#u-clave-txt").value = claveNueva(); };

  $("#u-add").onclick = async () => {

    if (S.usuarios.some(u => (u.correo||"").toLowerCase() === correo))
      return mostrarAviso(av, "Ya hay una cuenta con ese correo.");

    if (!rol) return mostrarAviso(av, "Falta elegir el puesto. De eso depende " +
      "lo que ve la persona al entrar: un preventa ve su ruta, bodega ve la carga del día.");
    const clave = $("#u-clave-txt").value.trim();
    if (clave.length < 6) return mostrarAviso(av, "La contraseña necesita al menos 6 caracteres.");
    const btn = $("#u-add");
    btn.disabled = true; btn.textContent = "Creando…";
    let uid = null;
    try {
      uid = await crearCuenta(correo, clave);
    } catch(e){
      btn.disabled = false; btn.textContent = "Crear la cuenta";
      const m = e.code === "auth/email-already-in-use"
          ? "Ese correo ya tiene cuenta. Si es de alguien que se fue, búsquela abajo y cámbiele el nombre."
        : e.code === "auth/invalid-email" ? "Ese correo no se ve bien escrito."
        : e.code === "auth/network-request-failed" ? "Sin señal. Vuelva a intentarlo cuando tenga internet."
        : "No se pudo crear la cuenta (" + (e.code || e.message) + ").";
      return mostrarAviso(av, m);

    btn.disabled = false; btn.textContent = "Crear la cuenta";

    const ok = await guardarEn("usuarios", () => db.collection("usuarios").doc(uid).set({
      nombre: nom, rol: rol, correo: correo, activo: true,
      creado: firebase.firestore.FieldValue.serverTimestamp()

    $("#u-nom").value = ""; $("#u-correo").value = ""; $("#u-rol").value = "";

  };
