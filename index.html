/* ============ Dias propuestos para las rutas ============
   El dia de cada ruta salio de agrupar las zonas de Handy por preventista:
   cinco rutas por persona, una por dia de lunes a viernes, ordenadas de mas
   clientes a menos. NO es el dato exacto de Brayan, es un arranque para no
   tener 41 rutas sin dia. Por eso:
     - solo toca las rutas que TODAVIA no tienen dia; nunca pisa lo que
       alguien ya haya puesto a mano;
     - solo pone el DIA. El preventista a cargo se sigue asignando a mano,
       que es como Brayan lo quiere hasta tener el dato fino. */
const DIAS_PROPUESTOS = [
  {quien:"José Argueta",      nombre:"R:4 TIERRA BLANCA",          dia:1},
  {quien:"José Argueta",      nombre:"R5: EL ESPINO",              dia:2},
  {quien:"José Argueta",      nombre:"R5: EL CARMEN EL GABILAN",   dia:3},
  {quien:"José Argueta",      nombre:"R:3 JAGUEY, TAMARINDO",      dia:4},
  {quien:"José Argueta",      nombre:"R5: SOCIEDAD",               dia:5},
  {quien:"Nelson Hernández",  nombre:"Ruta Moncagua",              dia:1},
  {quien:"Nelson Hernández",  nombre:"Ruta Barrios (Quebradas)",   dia:2},
  {quien:"Nelson Hernández",  nombre:"Ruta Lolotique",             dia:3},
  {quien:"Nelson Hernández",  nombre:"Ruta San Gerardo",           dia:4},
  {quien:"Nelson Hernández",  nombre:"Ruta Amatillo, Pasaquina",   dia:5}
];

/* Los nombres vienen de Handy y los de aqui pueden traer otra puntuacion
   ("R:4 TIERRA BLANCA" contra "R4: TIERRA BLANCA"), otro acento u otro
   espaciado. Se comparan solo por letras y numeros. */
function claveRuta(s){
  return String(s || "").normalize("NFD").replace(/[̀-ͯ]/g, "")
    .toUpperCase().replace(/[^A-Z0-9]/g, "");
}

/* ====== Aviso: rutas sin camion asignado ======
   El filtro del motorista dice: "si este motorista tiene sectores
   asignados, solo ve los pedidos de SUS sectores; sin asignacion, ve todo".
   Ese "ve todo" es comodo con un solo camion y peligroso con dos: los dos
   ven la misma entrega y pueden salir los dos por ella.
   Y el sistema lo hace EN SILENCIO: nadie se entera de que esta pasando.
   Aqui se dice. */
function rutasSinCamion(){
  return (S.sectores || []).filter(x => x.activo !== false && !x.motoristaUid);
}
function bloqueSinCamion(){
  const motos = (S.usuarios || []).filter(u => u.rol === "despacho" && u.activo !== false);
  if (motos.length < 2) return "";          // con un solo camion, "ve todo" es lo correcto
  const sin = rutasSinCamion();
  if (!sin.length) return "";
  const activas = (S.sectores || []).filter(x => x.activo !== false).length;
  const todas = sin.length === activas;

  return '<div class="pasos" style="border-color:var(--c-perdido)">' +
    '<div class="eyebrow" style="color:var(--c-perdido)">Ojo con esto</div>' +
    '<p style="font-size:14px;margin:8px 0 0"><b>' +
      (todas ? "Ninguna ruta tiene camión asignado."
             : sin.length + " de " + activas + " rutas no tienen camión asignado.") +
      '</b> Y hay ' + motos.length + ' motoristas activos.</p>' +
    '<p style="font-size:14px;margin:8px 0 0">Una ruta sin camión la ve <b>' +
      'cualquier motorista</b>: los ' + motos.length + ' van a ver esas entregas en su ' +
      'pantalla, y dos pueden salir por la misma. Póngale el camión a cada una ' +
      'abajo, en <b>“Camión que lo reparte”</b>.</p>' +
    (todas ? '' :
      '<div class="conteo" style="text-align:left;margin-top:10px">Sin camión: ' +
        escapar(sin.slice(0,8).map(x => x.nombre).join(" · ")) +
        (sin.length > 8 ? " y " + (sin.length - 8) + " más" : "") + '</div>') +
  '</div>';
}

function bloqueDiasPropuestos(){
  const porClave = {};
  (S.sectores || []).forEach(x => { porClave[claveRuta(x.nombre)] = x; });
  const pendientes = DIAS_PROPUESTOS
    .map(p => ({p: p, sec: porClave[claveRuta(p.nombre)]}))
    .filter(x => x.sec && !tieneDia(x.sec));
  if (!pendientes.length) return "";

  const porQuien = {};
  pendientes.forEach(x => {
    (porQuien[x.p.quien] = porQuien[x.p.quien] || []).push(x);
  });

  return '<div class="pasos"><div class="eyebrow">Días propuestos</div>' +
    '<p style="font-size:14px;margin:8px 0 0"><b>' + pendientes.length +
      ' rutas siguen sin día.</b> Estas salieron de agrupar las zonas del padrón ' +
      'por preventista: cinco por persona, una por día, de la que más clientes ' +
      'tiene a la que menos. <b>No es su dato exacto</b>, es un arranque. Solo ' +
      'pone el día; el preventista a cargo se sigue poniendo a mano abajo, y no ' +
      'toca ninguna ruta que ya tenga día.</p>' +
    Object.keys(porQuien).map(q =>
      '<div class="conteo" style="text-align:left;margin-top:10px"><b>' + escapar(q) + '</b></div>' +
      porQuien[q].map(x =>
        '<div class="cuota-fila"><span class="quien">' + escapar(x.sec.nombre) + '</span>' +
        '<b>' + DIAS[x.p.dia] + '</b></div>').join("")
    ).join("") +
    '<button class="btn" id="se-dias" style="margin-top:14px">Poner estos ' +
      pendientes.length + ' días</button></div>';
}

/* Baja con bloqueo: el cliente no se borra, se apaga y su clave queda en
   "bloqueados". Las reglas de Firestore no dejan crear un cliente con una
   clave bloqueada, asi que no se puede reabrir con otro codigo. */
async function darDeBaja(c){
  const motivo = prompt("¿Por que se da de baja a " + c.nombre + "?\n\n" +
    "Queda anotado y el negocio no se va a poder volver a abrir con otro codigo.");
  if (motivo === null) return;
  const clave = c.clave || claveCliente(c.nombre, c.telefono);
  const ok = await guardarEn("clientes", async () => {
    await db.collection("clientes").doc(c.id).update({
      activo:false, clave:clave,
      baja:{ motivo:motivo.trim(), porUid:S.usuario.uid, porNombre:S.nombre,
             fecha:firebase.firestore.FieldValue.serverTimestamp() }
    });
    const lote = db.batch();
    lote.set(db.collection("bloqueados").doc(clave), {
      tipo:"nombre", nombre:c.nombre, telefono:c.telefono || "", motivo:motivo.trim(),
      porUid:S.usuario.uid, fecha:firebase.firestore.FieldValue.serverTimestamp()
    });
    if (c.lat != null && c.lng != null){
      celdasAlrededor(c.lat, c.lng).forEach(g => {
        lote.set(db.collection("bloqueados").doc(g), {
          tipo:"zona", nombre:c.nombre, motivo:motivo.trim(),
          porUid:S.usuario.uid, fecha:firebase.firestore.FieldValue.serverTimestamp()
        });
      });
    }
    await lote.commit();
  });
  if (ok) alert(c.nombre + " quedo de baja.\n\nBloqueado por nombre y telefono" +
    (c.lat != null ? ", y tambien la zona donde estaba." : ".\n\nOJO: no tenia punto en el mapa, " +
     "asi que solo queda bloqueado por nombre. Si lo vuelven a abrir con otro nombre va a pasar."));
}

async function reactivarCliente(c){
  if (!confirm("¿Reactivar a " + c.nombre + "?\n\nVuelve a la ruta y se desbloquea.")) return;
  const clave = c.clave || claveCliente(c.nombre, c.telefono);
  const ok = await guardarEn("clientes", async () => {
    await db.collection("clientes").doc(c.id).update({
      activo:true, baja:firebase.firestore.FieldValue.delete()
    });
    const lote = db.batch();
    lote.delete(db.collection("bloqueados").doc(clave));
    if (c.lat != null && c.lng != null)
      celdasAlrededor(c.lat, c.lng).forEach(g => lote.delete(db.collection("bloqueados").doc(g)));
    await lote.commit();
  });
  if (ok) alert(c.nombre + " esta activo otra vez.");
}

/* Dos tiendas pegadas son normales. Por eso la zona se puede liberar sin
   soltar el bloqueo por nombre, que es el que evita el truco de Handy. */
let bloqGrupos = [];
async function pintarBloqueados(){
  const cont = $("#bq-lista");
  if (!cont) return;
  let docs = [];
  try {
    const q = await db.collection("bloqueados").get();
    docs = q.docs.map(d => Object.assign({id:d.id}, d.data()));
  } catch(e){
    cont.innerHTML = "No se pudo leer (" + (e.code || e.message) + ").";
    return;
  }
  if (!docs.length){ cont.innerHTML = "Ninguno por ahora."; return; }

  const porNombre = {};
  docs.forEach(d => {
    const k = d.nombre || d.id;
    (porNombre[k] = porNombre[k] || []).push(d);
  });
  bloqGrupos = Object.keys(porNombre).map(k => ({nombre:k, docs:porNombre[k]}));

  cont.innerHTML = bloqGrupos.map((g, i) => {
    const zonas = g.docs.filter(x => x.tipo === "zona").length;
    const motivo = (g.docs.find(x => x.motivo) || {}).motivo || "";
    return '<div class="cuota-fila" style="flex-wrap:wrap;gap:6px">' +
      '<span class="quien" style="flex:1 1 100%">' + escapar(g.nombre) +
        (motivo ? ' &middot; ' + escapar(motivo) : '') +
        '<br><span style="color:var(--tenue);font-size:11px">' +
        (zonas ? "bloqueado por nombre y por zona" : "bloqueado solo por nombre") + '</span></span>' +
      (zonas ? '<button class="btn linea chico bq-zona" data-i="' + i + '" style="width:auto">Liberar la zona</button>' : '') +
      '<button class="btn linea chico bq-todo" data-i="' + i + '" style="width:auto">Quitar el bloqueo</button>' +
    '</div>';
  }).join("");

  const borrar = async (lista, aviso) => {
    const lote = db.batch();
    lista.forEach(d => lote.delete(db.collection("bloqueados").doc(d.id)));
    const ok = await guardarEn("bloqueados", () => lote.commit());
    if (ok){ alert(aviso); pintarBloqueados(); }
  };

  $$("#bq-lista .bq-zona").forEach(b => b.onclick = () => {
    const g = bloqGrupos[Number(b.dataset.i)];
    if (!confirm("¿Liberar la zona de " + g.nombre + "?\n\n" +
      "Se va a poder abrir otra tienda en ese punto. " + g.nombre + " sigue bloqueado por su nombre.")) return;
    borrar(g.docs.filter(x => x.tipo === "zona"), "Zona liberada.");
  });
  $$("#bq-lista .bq-todo").forEach(b => b.onclick = () => {
    const g = bloqGrupos[Number(b.dataset.i)];
    if (!confirm("¿Quitar el bloqueo de " + g.nombre + "?\n\n" +
      "Va a poder abrirse otra vez, con su mismo nombre y en el mismo punto.")) return;
    borrar(g.docs, "Bloqueo quitado.");
  });
}

/* Uno por uno: los dos negocios lado a lado y tres salidas.
   "Son distintos" queda anotado en los dos y no vuelve a preguntar.
   "Es el mismo" deja vivo al que usted eligio y al otro lo apaga,
   SIN meterlo a bloqueados: si se equivoca, se reactiva y ya. */
async function marcarDistintos(par){
  const ok = await guardarEn("clientes", async () => {
    const lote = db.batch();
    lote.update(db.collection("clientes").doc(par.a.id), {noDup: firebase.firestore.FieldValue.arrayUnion(par.b.id)});
    lote.update(db.collection("clientes").doc(par.b.id), {noDup: firebase.firestore.FieldValue.arrayUnion(par.a.id)});
    await lote.commit();
  });
  if (ok){ dupSello = ""; pintarAdmin(); }
}

           porUid:S.usuario.uid, porNombre:S.nombre,

}

/* ---------------- Cargar el padron de Handy ----------------
   El archivo que exporta Handy trae la coordenada de cada tienda, que es
   lo que vale oro: entran ya punteadas en el mapa y nadie tiene que salir
   a ubicarlas una por una. Lo unico que no se puede adivinar es el sector:
   las "zonas" de Handy no son los sectores de aqui, asi que se dice a mano
   que zona cae en que sector, una sola vez.                             */



const sinTilde = t => (t||"").toString().toLowerCase().normalize("NFD")
  .replace(/[\u0300-\u036f]/g,"").trim();
/* ================== Zonificador ==================
   Lo que en Handy es el Zonificador. En vez de ir cliente por cliente entre
   2.268, oficina encierra con el dedo a los que van juntos y los manda de un
   toque: sector, dia, preventista y camion. El que quedo FUERA del lazo no
   se toca: queda como estaba.
   En cada CLIENTE encerrado escribe el sectorId Y el preventaUid: el
   preventista va en el cliente porque una ruta la comparten DOS, y cada
   quien ve solo su mitad. En el SECTOR van el dia y el camion, que son de
   la ruta entera. (Antes este comentario decia lo contrario; el codigo
   siempre puso el preventa en el cliente — ver el guardado abajo.) */
var zoMapa = null, zoLazo = [], zoDentro = [], zoPuntos = [], zoModo = false;

/* Punto dentro del lazo: rayo hacia la derecha y se cuentan los cruces.
   Impar = adentro. Se hace en pixeles de pantalla, que es lo que la
   persona ve; asi lo encerrado es exactamente lo que se encerro. */
function zoAdentro(px, py, poli){
  let d = false;
  for (let i = 0, j = poli.length - 1; i < poli.length; j = i++){
    const xi = poli[i][0], yi = poli[i][1], xj = poli[j][0], yj = poli[j][1];
    if (((yi > py) !== (yj > py)) && (px < (xj - xi) * (py - yi) / (yj - yi) + xi)) d = !d;
  }
  return d;
}

function adminZonificar(m){
  const conPunto = S.clientes.filter(c => c.activo !== false && c.lat != null && c.lng != null);
  const sinPunto = S.clientes.filter(c => c.activo !== false && c.lat == null).length;

  if (!window.L || !conPunto.length){
    m.innerHTML = '<div class="pasos"><div class="eyebrow">Zonificador</div>' +
      '<p style="font-size:14px;margin:8px 0 0">' +
      (!window.L ? 'El mapa necesita conexión la primera vez. Conéctese y vuelva a entrar.'
                 : 'Todavía no hay clientes con punto en el mapa. Sin punto no se pueden encerrar.') +
      '</p></div>';
    return;
  }

  m.innerHTML =
    '<div class="conteo">' + conPunto.length + ' clientes en el mapa' +
      (sinPunto ? ' · ' + sinPunto + ' sin punto, esos no se pueden encerrar' : '') + '</div>' +
    '<div class="zo-caja" id="zo-caja">' +
      '<div id="zo-mapa"></div>' +
      '<svg class="zo-lazo" id="zo-svg"><path d=""></path></svg>' +
      '<div class="zo-cinta"><span class="txt" id="zo-txt">' +
        '<b>Mueva el mapa</b><small>acomode la vista y toque Encerrar</small></span>' +
        '<button type="button" id="zo-modo">Encerrar</button>' +
        '<button type="button" class="zo-icono" id="zo-lleno" title="Pantalla completa" ' +
          'aria-label="Pantalla completa"><svg viewBox="0 0 24 24">' +
          '<path d="M15 3h6v6M9 21H3v-6M21 3l-7 7M3 21l7-7"/></svg></button></div>' +
      '<div class="zo-hoja" id="zo-hoja"></div>' +
    '</div>';

  const caja = $("#zo-caja"), svg = $("#zo-svg"), path = svg.querySelector("path");
  const txt = $("#zo-txt"), hoja = $("#zo-hoja"), btnModo = $("#zo-modo");

  if (zoMapa){ try { zoMapa.remove(); } catch(e){} zoMapa = null; }
  /* preferCanvas: con dos mil y pico de puntos, un div por cliente pone el
     telefono de rodillas. En canvas se dibujan todos de un solo trazo. */
  zoMapa = L.map("zo-mapa", {zoomControl:false, attributionControl:false,
    maxZoom:19, preferCanvas:true});
  L.tileLayer(CAPAS.calles.url, CAPAS.calles.ops).addTo(zoMapa);
  L.control.attribution({prefix:false, position:"bottomleft"}).addTo(zoMapa);

  zoPuntos = conPunto.map(c => ({
    c: c,
    mk: L.circleMarker([c.lat, c.lng], {radius:5, weight:2, color:"#fff",
      fillColor: c.sectorId ? "#D89A16" : "#6C7689", fillOpacity:1}).addTo(zoMapa)
  }));
  try { zoMapa.fitBounds(conPunto.map(c => [c.lat, c.lng]), {padding:[30,30]}); } catch(e){}
  setTimeout(() => { try { zoMapa.invalidateSize(); } catch(e){} }, 120);

  zoLazo = []; zoDentro = []; zoModo = false;

  const pintarLazo = cerrado => {
    if (zoLazo.length < 2){ path.setAttribute("d",""); return; }
    path.setAttribute("d", zoLazo.map((p,i) =>
      (i ? "L" : "M") + p[0].toFixed(1) + " " + p[1].toFixed(1)).join(" ") + (cerrado ? " Z" : ""));
  };
  const contar = () => {
    zoDentro = zoPuntos.filter(p => {
      let q = null;
      try { q = zoMapa.latLngToContainerPoint([p.c.lat, p.c.lng]); } catch(e){}
      return q && zoAdentro(q.x, q.y, zoLazo);
    });
    zoPuntos.forEach(p => {
      try { p.mk.setStyle({fillColor: zoDentro.indexOf(p) >= 0 ? "#1F7A4D"
        : (p.c.sectorId ? "#D89A16" : "#6C7689")}); } catch(e){}
    });
    return zoDentro.length;
  };
  const limpiar = () => {
    zoLazo = []; zoDentro = []; cortado = false;
    pintarLazo(false); contar();
    hoja.classList.remove("abierta");
    txt.innerHTML = zoModo
      ? '<b>Encierre a los clientes</b><small>arrastre el dedo alrededor</small>'
      : '<b>Mueva el mapa</b><small>acomode la vista y toque Encerrar</small>';
  };

  /* Pantalla completa: el mapa se va de orilla a orilla para que el dedo
     tenga donde moverse. Se sale con la misma tecla o con Escape. */
  const btnLleno = $("#zo-lleno");
  const ponerLleno = si => {
    document.body.classList.toggle("zo-lleno", !!si);
    if (btnLleno){
      btnLleno.title = si ? "Salir de pantalla completa" : "Pantalla completa";
      btnLleno.innerHTML = si
        ? '<svg viewBox="0 0 24 24"><path d="M4 14h6v6M20 10h-6V4M14 10l7-7M3 21l7-7"/></svg>'
        : '<svg viewBox="0 0 24 24"><path d="M15 3h6v6M9 21H3v-6M21 3l-7 7M3 21l7-7"/></svg>';
      btnLleno.classList.toggle("on", !!si);
    }
    /* El recuadro cambio de tamano: Leaflet todavia cree que mide lo de
       antes. Se le avisa DESPUES de que el navegador reacomodo. */
    requestAnimationFrame(() => { try { zoMapa && zoMapa.invalidateSize(); } catch(e){} });
  };
  if (btnLleno) btnLleno.onclick = () => ponerLleno(!document.body.classList.contains("zo-lleno"));
  /* Un solo listener vivo: antes se sumaba uno cada vez que se entraba al
     zonificador y nunca se quitaba, asi que reentrar los acumulaba. */
  if (document._zoTecla) document.removeEventListener("keydown", document._zoTecla);
  document._zoTecla = e => {
    if (e.key === "Escape" && document.body.classList.contains("zo-lleno")) ponerLleno(false);
  };
  document.addEventListener("keydown", document._zoTecla);

  btnModo.onclick = () => {
    zoModo = !zoModo;
    caja.classList.toggle("encerrando", zoModo);
    btnModo.textContent = zoModo ? "Mover el mapa" : "Encerrar";
    btnModo.classList.toggle("on", zoModo);
    /* Mientras se encierra, el mapa NO se arrastra: si no, el dedo mueve el
       mapa y el lazo sale torcido. */
    try { zoModo ? zoMapa.dragging.disable() : zoMapa.dragging.enable(); } catch(e){}
    limpiar();
  };

  /* Un dedo dibuja, y solo uno. En la calle uno agarra el telefono con la
     mano y la palma roza la pantalla: ese segundo contacto borraba el lazo
     entero y lo daba por terminado a medio camino. Lo cacho Brayan
     encerrando de Perquin a Meanguera. */
  let trazando = false, dedo = null, cortado = false;
  const donde = e => {
    const r = caja.getBoundingClientRect();
    return [e.clientX - r.left, e.clientY - r.top];
  };
  svg.addEventListener("pointerdown", e => {
    if (!zoModo || trazando) return;
    trazando = true; dedo = e.pointerId;
    /* Si al gesto anterior lo corto el navegador, se SIGUE el mismo lazo
       donde quedo. De cero solo se empieza cuando el anterior cerro bien. */
    if (!cortado) zoLazo = [];
    cortado = false;
    zoLazo.push(donde(e));
    hoja.classList.remove("abierta");
    try { svg.setPointerCapture(e.pointerId); } catch(_){}
  });
  svg.addEventListener("pointermove", e => {
    if (!trazando || e.pointerId !== dedo) return;
    const p = donde(e), u = zoLazo[zoLazo.length-1];
    if (Math.abs(p[0]-u[0]) + Math.abs(p[1]-u[1]) < 3) return;
    zoLazo.push(p); pintarLazo(false);
    txt.innerHTML = '<b>' + contar() + ' clientes</b><small>siga encerrando…</small>';
  });
  const soltar = e => {
    if (!trazando || (e && e.pointerId !== dedo)) return;
    trazando = false; dedo = null;
    if (zoLazo.length < 4) return limpiar();
    pintarLazo(true);
    const n = contar();
    if (!n){
      txt.innerHTML = '<b>Ninguno adentro</b><small>vuelva a intentarlo</small>';
      return;
    }
    txt.innerHTML = '<b>' + n + ' encerrados</b><small>elija a dónde van</small>';
    abrirHoja(n);
  };
  svg.addEventListener("pointerup", soltar);
  /* Cancelar NO es terminar. El navegador corta el gesto por cualquier cosa
     (un roce, una notificacion) y antes eso CERRABA el encierre con lo que
     llevara — a veces con cero clientes adentro y la hoja abierta encima.
     Ahora se guarda lo trazado y se sigue al volver a tocar. */
  svg.addEventListener("pointercancel", e => {
    if (!trazando || (e && e.pointerId !== dedo)) return;
    trazando = false; dedo = null; cortado = zoLazo.length >= 2;
    if (cortado) txt.innerHTML = '<b>' + zoDentro.length + ' clientes</b>' +
      '<small>se interrumpi\u00f3 \u00b7 vuelva a tocar para seguir</small>';
  });

  function abrirHoja(n){
    const preventas = S.usuarios.filter(u => u.rol === "preventa" && u.activo !== false);
    const motos     = S.usuarios.filter(u => u.rol === "despacho" && u.activo !== false);
    const opc = (lista, vacio) => '<option value="">' + vacio + '</option>' +
      lista.map(u => '<option value="' + u.uid + '">' + escapar(u.nombre || u.correo || "") + '</option>').join("");
    const yaTenian = zoDentro.filter(p => p.c.sectorId).length;

    hoja.innerHTML =
      '<div class="eyebrow">Mandar a</div>' +
      '<div class="zo-cuenta">' + n + '<small>' +
        (n === 1 ? 'cliente encerrado' : 'clientes encerrados') + '</small></div>' +
      '<label class="campo"><span>Sector</span><select id="zo-sec">' +
        S.sectores.filter(x => x.activo !== false)
          .map(x => '<option value="' + x.id + '">' + escapar(x.nombre) + '</option>').join("") +
        '<option value="__nuevo">— Sector nuevo —</option></select></label>' +
      '<label class="campo oculto" id="zo-nom-caja"><span>Nombre del sector nuevo</span>' +
        '<input id="zo-nom" type="text" placeholder="Ej: R5: Sociedad"></label>' +
      '<label class="campo"><span>Día que se visita</span><select id="zo-dia">' +
        '<option value="">Todavía sin día</option>' + opcionesDia(null) + '</select></label>' +
      '<label class="campo"><span>Preventista de ESTOS clientes</span><select id="zo-pre">' +
        opc(preventas, "No cambiar (cada cliente sigue con el suyo)") + '</select></label>' +
      '<p style="font-size:12px;color:var(--tenue);margin:5px 0 0;line-height:1.4">' +
        'Se le pone a los que acaba de encerrar, no al sector. Si la ruta la ven dos, ' +
        'encierre la parte de cada uno por separado. El camión ve las dos.</p>' +
      '<label class="campo"><span>Camión que lo reparte</span><select id="zo-moto">' +
        opc(motos, "Cualquier camión") + '</select></label>' +
      (yaTenian ? '<div class="aviso dato" style="margin-top:10px">' + yaTenian +
        ' de estos ya pertenecen a otro sector. Se los va a llevar.</div>' : '') +
      '<button class="btn" id="zo-ir" style="margin-top:14px">Mandar los ' + n + '</button>' +
      '<button class="btn linea" id="zo-no" style="margin-top:9px">Cancelar</button>';
    hoja.classList.add("abierta");

    const sel = $("#zo-sec"), cajaNom = $("#zo-nom-caja");
    /* Al elegir un sector que ya existe, se muestran SUS valores: asi nadie
       le cambia el dia o el preventista sin darse cuenta. */
    const traerSector = () => {
      cajaNom.classList.toggle("oculto", sel.value !== "__nuevo");
      const sc = S.sectores.find(x => x.id === sel.value);
      $("#zo-dia").value  = sc && tieneDia(sc) ? String(sc.dia) : "";
      /* El preventista NO se lee del sector: vive en cada cliente (dos
         preventas por ruta). Se deja en "no cambiar" y solo se escribe si
         oficina escoge uno; antes se leia un campo vacio del sector y al
         Mandar se les borraba el preventista a todos los encerrados. */
      $("#zo-pre").value  = "";
      $("#zo-moto").value = (sc && sc.motoristaUid) || "";
    };
    sel.onchange = traerSector; traerSector();

    $("#zo-no").onclick = limpiar;
    $("#zo-ir").onclick = async () => {
      const b = $("#zo-ir");
      const nuevo = sel.value === "__nuevo";
      const nom = ($("#zo-nom").value || "").trim();
      if (nuevo && !nom) return alert("Escriba el nombre del sector nuevo.");
      /* El DIA y el CAMION van en el sector: son de la ruta entera.
         El PREVENTISTA va en los clientes encerrados, NO en el sector.
         Una ruta la comparten dos preventistas -uno ve el Espino, el otro
         de la salida del Espino a Agua Caliente- y el motorista ve las dos
         mitades. Si el preventista se guardara en el sector, el segundo
         dejaria de ver el sector completo, ni sus propios clientes. */
      const datos = {
        dia: $("#zo-dia").value === "" ? null : Number($("#zo-dia").value),
        motoristaUid: $("#zo-moto").value || null
      };
      const preUid = $("#zo-pre").value || null;
      const comoSeLlama = nuevo ? nom
        : ((S.sectores.find(x => x.id === sel.value) || {}).nombre || "ese sector");
      if (!confirm("Se van a mandar " + n + " clientes a “" + comoSeLlama + "”.\n\n" +
        "Los que quedaron fuera del lazo NO se tocan.\n\n¿Sigue?")) return;

      b.disabled = true; b.textContent = "Mandando…";
      let hechos = 0;
      try {
        let secId = sel.value;
        if (nuevo){
          const ref = await db.collection("sectores").add(
            Object.assign({nombre: nom, activo: true}, datos));
          secId = ref.id;
        } else {
          await db.collection("sectores").doc(secId).update(datos);
        }
        // de 400 en 400: un lote de Firestore aguanta 500 escrituras
        for (let i = 0; i < zoDentro.length; i += 400){
          const tanda = zoDentro.slice(i, i + 400);
          const lote = db.batch();
          tanda.forEach(p => lote.update(db.collection("clientes").doc(p.c.id),
            preUid ? {sectorId: secId, preventaUid: preUid} : {sectorId: secId}));
          await lote.commit();
          hechos += tanda.length;
          b.textContent = "Mandando… " + hechos + " de " + zoDentro.length;
        }
        alert("Listo: " + hechos + " clientes en “" + comoSeLlama + "”.\n\n" +
          "Los de afuera quedaron como estaban.\n\n" +
          "Si al sector le falta otro pedazo, o si la otra mitad la ve el otro " +
          "preventista, encierre ese grupo y escoja este MISMO sector en la lista.");
      } catch(e){
        alert("Se mandaron " + hechos + " y ahí se detuvo (" + (e.code || e.message) + ").\n\n" +
          "Los que entraron quedaron bien. Puede volver a encerrar los que falten.");
      }
      b.disabled = false;
      pintarAdmin();
    };
  }
}
/* ---------------- Cómo se hace ----------------
   Hay cosas que se hacen una vez al mes o una vez al ano: cuando toca,
   nadie se acuerda. En vez de una hoja impresa que se pierde, los pasos
   viven dentro del sistema, al lado del boton que hay que tocar. */
/* La pestana "Ayuda": las cuatro guias de antes, en una sola pantalla y
   plegadas. Eran cuatro pestanas para algo que se lee una vez al mes. */
function adminAyuda(m){
  const abrir = ayudaAbrir; ayudaAbrir = null;   // se usa una vez y se olvida
  m.innerHTML = Object.keys(COMO_SE).map(k => {
    const g = COMO_SE[k];
    return '<details class="pasos" style="margin-bottom:8px"' + (k === abrir ? ' open' : '') +
      '><summary style="cursor:pointer;font-weight:800">' +
        escapar(g.titulo) + '</summary>' +
      '<p style="font-size:14px;color:var(--tenue);margin:8px 0 0"><b>Cu\u00e1ndo:</b> ' + g.cuando + '</p>' +
      g.pasos.map((p, i) =>
        '<div style="display:flex;gap:12px;align-items:flex-start;margin-top:10px">' +
          '<span style="flex:0 0 26px;height:26px;border-radius:50%;background:var(--verde);color:#fff;' +
            'display:flex;align-items:center;justify-content:center;font-weight:800;font-size:13px">' + (i+1) + '</span>' +
          '<div style="flex:1;min-width:0">' +
            '<div style="font-size:14.5px;font-weight:700;line-height:1.35">' + p[0] + '</div>' +
            (p[1] ? '<div style="font-size:13px;color:var(--tenue);margin-top:3px">' + p[1] + '</div>' : '') +
          '</div></div>').join("") +
    '</details>';
  }).join("");
}

/* ===================== La ficha de una persona =====================
   Todo lo del dia de alguien junto: a que hora arranco, cuanto anduvo,
   cuantas visitas hizo, cuanto vendio y por donde paso. Antes esto
   estaba regado entre En vivo, Hoy y el tablero. */
let fichaUid = "", fichaFecha = "", mapaFicha = null;

/* ===================== Ficha por persona =====================
   El modelo es la pantalla "Detalles de usuario" de Handy, que Brayan
   mando el 3 de septiembre: cabecera con la persona y su ultima senal,
   seis cajas de actividad para un rango de fechas, pestanas Ver todo /
   Visitas / Pedidos / Entregas, y la linea del dia con cada cosa a su
   hora, incluidos los traslados entre visita y visita.

   Lecturas: una consulta por dia y por coleccion (visitas, pedidos,
   agenda, entregas, jornada), con igualdad en fecha y en la cuenta, que
   no pide indice compuesto. El rango se limita a 31 dias y el resultado
   se guarda cinco minutos, para no releer al cambiar de pestana. */
let fichaHasta = "", fichaTab = "todo", fichaDatos = null;
const FICHA_FRESCO = 5 * 60 * 1000;

function fiDias(desde, hasta){
  const l = [];
  for (let f = desde, i = 0; f <= hasta && i < 31; f = corrido(f, 1), i++) l.push(f);
  return l;
}
function fiMsDe(fecha, hhmm){
  if (!hhmm) return 0;
  const [aa, mm, dd] = fecha.split("-").map(Number);
  const [h, mi] = String(hhmm).split(":").map(Number);
  return new Date(aa, mm - 1, dd, h || 0, mi || 0).getTime();
}
function fiHora(ms){ return ms ? tbHora(ms) : ""; }
function fiDur(seg){
  seg = Math.max(0, Math.round(seg || 0));
  const h = Math.floor(seg / 3600), m = Math.floor((seg % 3600) / 60), s = seg % 60;
  return (h ? h + ":" : "") + String(m).padStart(2, "0") + ":" + String(s).padStart(2, "0");
}
function fiDurCorta(seg){
  const m = Math.round((seg || 0) / 60);
  return m >= 60 ? Math.floor(m / 60) + " h " + (m % 60) + " min" : m + " min";
}
function fiPza(p){ return (p.lineas || []).reduce((a, l) => a + (Number(l.cant) || 0), 0); }

async function cargarFicha(uid, desde, hasta){
  const clave = uid + "|" + desde + "|" + hasta;
  if (fichaDatos && fichaDatos.clave === clave && Date.now() - fichaDatos.sello < FICHA_FRESCO) return fichaDatos;
  const doc = d => Object.assign({id:d.id}, d.data());
  const traer = (col, f, campo) => db.collection(col).where("fecha", "==", f).where(campo, "==", uid).get()
    .then(s => { anotarLectura("ficha: " + col, s); return s.docs.map(doc); });
  const dias = fiDias(desde, hasta);
  const porDia = await Promise.all(dias.map(f => Promise.all([
    traer("visitas", f, "preventaUid"),
    traer("pedidos", f, "preventaUid"),
    traer("agenda", f, "preventaUid"),
    db.collection("pedidos").where("fechaEntrega", "==", f).where("entregadoPor", "==", uid).get()
      .then(s => { anotarLectura("ficha: entregas", s); return s.docs.map(doc); }),
    db.collection("jornadas").doc(f + "_" + uid).get()
      .then(d => d.exists ? Object.assign({id:d.id, fecha:f}, d.data()) : null)
  ])));
  let pos = null;
  try { const d = await db.collection("posiciones").doc(uid).get(); if (d.exists) pos = d.data(); } catch(e){}
  fichaDatos = {clave, sello: Date.now(), dias, pos,
    visitas: [].concat.apply([], porDia.map(x => x[0])),
    pedidos: [].concat.apply([], porDia.map(x => x[1])),
    agenda:  [].concat.apply([], porDia.map(x => x[2])),
    entregas:[].concat.apply([], porDia.map(x => x[3])),
    jornadas: porDia.map(x => x[4]).filter(Boolean)};
  return fichaDatos;
}

/* Lo programado para la persona en esos dias: los clientes de sus rutas
   que tocan ese dia de la semana (como Handy: visitas hechas contra la
   ruta). La agenda va aparte, en "cumplimiento de agenda". Si no tiene
   ruta con dia, se usa la agenda para no dividir entre cero. */
function fiProgramadas(uid, dias, agenda){
  let n = 0;
  dias.forEach(f => {
    const [aa, mm, dd] = f.split("-").map(Number);
    const ds = new Date(aa, mm - 1, dd).getDay();
    const secs = S.sectores.filter(x => x.activo !== false && x.preventaUid === uid && tieneDia(x) && Number(x.dia) === ds).map(x => x.id);
    if (secs.length) n += S.clientes.filter(c => c.activo !== false && secs.indexOf(c.sectorId) >= 0).length;
  });
  return n || agenda.length;
}

function fiEventos(D, uid){
  const ev = [];
  const cliVis = {};
  D.visitas.forEach(v => {
    const ms = v.inicio ? new Date(v.inicio).getTime() : 0;
    const prog = D.agenda.some(a => a.fecha === v.fecha && a.clienteId === v.clienteId);
    const vendio = v.resultado === "pedido" || D.pedidos.some(p => p.fecha === v.fecha && p.clienteId === v.clienteId && esVenta(p));
    cliVis[v.fecha + "_" + v.clienteId] = 1;
    ev.push({k:"visita", ms, fecha:v.fecha, dur:Number(v.duracionSeg) || 0, prog, vendio, v});
  });
  D.pedidos.forEach(p => ev.push({k:"pedido", ms: tbMs(p.creado) || fiMsDe(p.fecha, "23:59"), fecha:p.fecha, p}));
  D.entregas.forEach(p => { if (p.entregadoEn) ev.push({k:"entrega", ms: tbMs(p.entregadoEn), fecha:p.fechaEntrega, p}); });
  S.clientes.filter(c => c.creadoPor === uid && c.creadoEl && D.dias.indexOf(c.creadoEl) >= 0)
    .forEach(c => ev.push({k:"nuevo", ms: tbMs(c.ubicadoEn) || fiMsDe(c.creadoEl, "23:58"), fecha:c.creadoEl, c}));
  D.jornadas.forEach(j => {
    if (j.inicio) ev.push({k:"inicio", ms: fiMsDe(j.fecha, j.inicio), fecha:j.fecha, j});
    if (j.fin) ev.push({k:"fin", ms: fiMsDe(j.fecha, j.fin), fecha:j.fecha, j});
  });
  ev.sort((a, b) => a.ms - b.ms);
  /* Los traslados: el hueco entre que salio de una tienda y entro a la
     siguiente, el mismo dia. */
  const conTraslado = [];
  let ultima = null;
  ev.forEach(e => {
    if (e.k === "visita"){
      if (ultima && ultima.fecha === e.fecha){
        const seg = Math.round((e.ms - (ultima.ms + ultima.dur * 1000)) / 1000);
        if (seg > 30) conTraslado.push({k:"traslado", ms: ultima.ms + ultima.dur * 1000, fecha:e.fecha, seg, desde: ultima.v.clienteNombre, hasta: e.v.clienteNombre});
      }
      ultima = e;
    }
    if (e.k === "fin" || e.k === "inicio") ultima = null;
    conTraslado.push(e);
  });
  return {ev: conTraslado, cliVis};
}

async function adminFicha(m){

     preventas y motoristas, no a otros supervisores ni a si mismo. */

    (u.rol === "preventa" || u.rol === "despacho" || (u.rol === "supervisor" && S.rol === "admin")));
  /* Sin nadie de quien hacer ficha, la pantalla se armaba igual y salia con
     un "?" de nombre, un rol vacio y todos los numeros en cero: parecia una
     persona rota en vez de una lista vacia. En una instalacion nueva --que

      '<p style="font-size:14px;margin:8px 0 0">Todavía no hay preventistas ni motoristas. ' +

  if (!fichaFecha) fichaFecha = hoyISO();

  if (fiDias(fichaFecha, fichaHasta).length >= 31) fichaHasta = corrido(fichaFecha, 30);
  if (!fichaUid && gente.length) fichaUid = gente[0].uid;
  const quien = gente.find(u => u.uid === fichaUid) || {};

  const hoy = hoyISO();
  const rango = (a, b) => a === b ? (a === hoy ? "Hoy" : fechaBonita(a)) : fechaBonita(a) + " – " + fechaBonita(b);

  m.innerHTML =
    '<div class="fi-cab">' +

      '<div class="fi-quien"><b>' + escapar(quien.nombre || quien.correo || "—") + '</b>' +
        '<small>' + escapar(quien.correo || "") + (quien.correo ? " · " : "") + (ROL[quien.rol] || escapar(quien.rol || "")) + '</small>' +
        '<small id="fi-senal">' + (fichaUid ? "Buscando la última señal…" : "") + '</small>' +

        gente.map(u => '<option value="' + u.uid + '"' + (u.uid === fichaUid ? " selected" : "") + '>' +
          escapar(u.nombre || u.correo) + '</option>').join("") + '</select>' +
    '</div>' +
    '<div class="fi-rango">' +
      '<div class="fi-atajos">' +
        [["hoy","Hoy"],["ayer","Ayer"],["semana","Esta semana"],["mes","Este mes"]].map(x =>
          '<button data-r="' + x[0] + '">' + x[1] + '</button>').join("") + '</div>' +
      '<label>Desde <input id="fi-desde" type="date" value="' + fichaFecha + '"></label>' +
      '<label>Hasta <input id="fi-hasta" type="date" value="' + fichaHasta + '"></label>' +
    '</div>' +
    '<div id="fi-cuerpo"><div class="tb-vacio">Buscando ' + rango(fichaFecha, fichaHasta).toLowerCase() + '…</div></div>';

  $("#fi-hasta").onchange = e => { fichaHasta = e.target.value || fichaFecha; if (fichaHasta < fichaFecha) fichaFecha = fichaHasta; adminFicha(m); };
  $$("#admin-cuerpo .fi-atajos button").forEach(b => b.onclick = () => {

  const secNom = id => { const s = S.sectores.find(x => x.id === id); return s ? s.nombre : ""; };

/* ===================== Supervisores (solo oficina) =====================
   Brayan, 4 sep 2026: los supervisores vigilan a los preventas, pero
   oficina los vigila a ellos, porque "varias veces nos hemos dado cuenta
   que los supervisores no van a trabajar con los preventas". Esta pestana
   no la ve el supervisor. Cruza el recorrido GPS del supervisor con el de
   cada preventa, minuto a minuto, y dice con quien anduvo y cuanto rato.
   Desde v271 el telefono del supervisor tambien guarda su recorrido. */
let supFecha = "";
const SV_METROS = 150;   // a menos de esto, a la misma hora, "andaban juntos"

function svMinuto(h){
  if (!h) return null;
  const p = String(h).split(":").map(Number);
  return isNaN(p[0]) || isNaN(p[1]) ? null : p[0] * 60 + p[1];
}
function svHora(min){ return String(Math.floor(min / 60)).padStart(2, "0") + ":" + String(min % 60).padStart(2, "0"); }
/* El recorrido, minuto a minuto: entre dos puntos seguidos (a menos de
   15 min) se rellena en linea recta. */
function svMinutos(ruta){
  const pts = (ruta || []).map(p => ({m: svMinuto(p.h), la: Number(p.la), ln: Number(p.ln)}))
    .filter(p => p.m != null && !isNaN(p.la) && !isNaN(p.ln)).sort((a, b) => a.m - b.m);
  const out = {};
  for (let i = 0; i < pts.length; i++){
    const a = pts[i]; out[a.m] = [a.la, a.ln];
    const b = pts[i + 1]; if (!b) break;
    const gap = b.m - a.m; if (gap <= 0 || gap > 15) continue;
    for (let k = 1; k < gap; k++){ const t = k / gap; out[a.m + k] = [a.la + (b.la - a.la) * t, a.ln + (b.ln - a.ln) * t]; }
  }
  return out;
}
function svJuntos(A, B){
  const mins = [];
  Object.keys(A).forEach(m => { const b = B[m]; if (b && distMetros(A[m][0], A[m][1], b[0], b[1]) <= SV_METROS) mins.push(Number(m)); });
  mins.sort((a, b) => a - b);
  const tramos = [];
  mins.forEach(m => { const t = tramos[tramos.length - 1]; if (t && m - t[1] <= 3) t[1] = m; else tramos.push([m, m]); });
  return {min: mins.length, tramos: tramos.filter(t => t[1] - t[0] >= 4)};
}

  let J = {}, P = {}, V = {}, PE = {};

      const qv = await db.collection("visitas").where("fecha", "==", f).where("preventaUid", "==", u.uid).get();
      anotarLectura("supervisores: visitas", qv); V[u.uid] = qv.docs.map(doc);
      const qp = await db.collection("pedidos").where("fecha", "==", f).where("preventaUid", "==", u.uid).get();

    }));
  } catch(e){

  }
  if (supFecha !== f || !$("#sv-cuerpo")) return;

  const kmDe = ruta => { let km = 0; for (let i = 1; i < (ruta || []).length; i++) km += distMetros(ruta[i-1].la, ruta[i-1].ln, ruta[i].la, ruta[i].ln); return Math.round(km / 100) / 10; };
  const minTxt = n => n >= 60 ? Math.floor(n / 60) + " h " + (n % 60) + " min" : n + " min";
  const sinRuta = prevs.filter(u => !(J[u.uid] && Array.isArray(J[u.uid].ruta) && J[u.uid].ruta.length));

    const juntos = prevs.map(p => {
      const jp = J[p.uid]; const rp = (jp && Array.isArray(jp.ruta)) ? jp.ruta : [];
      return Object.assign({p}, rp.length && ruta.length ? svJuntos(A, svMinutos(rp)) : {min:0, tramos:[]});
    }).filter(x => x.min >= 5).sort((a, b) => b.min - a.min);

          '<div class="sv-n"><b>' + minTxt(x.min) + '</b>' +

    return '<div class="tb-card sv-card" data-uid="' + u.uid + '">' +

  $$("#admin-cuerpo .dup-queda").forEach(b => b.onclick = () => {

      try { cod = await reservarCodigo(); }
      catch(err){ return avisoCodigo(err); }
    }
    const datos = {
      nombre:nom, telefono:tel, clave:claveCliente(nom, tel), celda:"",
      codigo:cod,
      sectorId:$("#cl-sec").value,
      direccion:$("#cl-dir").value.trim(), referencia:$("#cl-ref").value.trim(),
      orden:Number($("#cl-ord").value)||1, activo:true,
      creadoPor:S.usuario.uid, creadoPorNombre:S.nombre,

    const sec = $("#cl-lsec").value;
    const filas = $("#cl-lista").value.split("\n").map(x => x.trim()).filter(Boolean);
    if (!filas.length) return alert("Pegue la lista.");
    /* El sector puede venir en la propia linea, como octava columna. Asi se
       carga el padron entero de una sola pegada en vez de sector por sector.
       Si no viene, manda el del desplegable, como siempre. */
    const porNombre = {};
    (S.sectores || []).forEach(x => { porNombre[sinTilde(x.nombre)] = x.id; });
    const traenSector = filas.filter(f => (f.split(";")[7] || "").trim()).length;
    if (!sec && !traenSector) return alert("Elija el sector, o ponga el nombre del sector al final de cada línea.");
    const sinSector = [];
    filas.forEach(f => {
      const nom = (f.split(";")[7] || "").trim();
      if (nom && porNombre[sinTilde(nom)] === undefined && sinSector.indexOf(nom) < 0) sinSector.push(nom);
    });
    if (sinSector.length)
      return alert("Estos sectores de la lista no existen todavía:\n\n" +
        sinSector.slice(0,8).join("\n") + (sinSector.length > 8 ? "\n…" : "") +
        "\n\nCréelos primero, o corrija el nombre.");
    if (!confirm("Se van a cargar " + filas.length + " clientes" +
      (traenSector ? " en " + Object.keys(filas.reduce((a,f) => {
        const k = (f.split(";")[7] || "").trim() || sec; a[k] = 1; return a; }, {})).length + " sectores" : "") +
      ". ¿Sigue?")) return;
    const orden = {};
    let conPunto = 0;
    /* NO se usa lote. Firestore deja solo 20 lecturas de documentos en TODO
       un lote, y la regla de clientes hace dos por cada uno: midoc() para el
       rol y exists() para la clave bloqueada. Con mas de diez clientes el
       lote entero rebota y no entra ninguno. Escritos uno por uno, cada
       cliente es un pedido aparte y el limite alcanza de sobra.
       Van de 15 en 15 en paralelo para que no tarde una eternidad. */
    const listos = [];
    filas.forEach(f => {
      const c = f.split(";").map(x => x.trim());
      const nomL = c[1]||c[0]||"Sin nombre", telL = c[2]||"";
      const secL = (c[7] ? porNombre[sinTilde(c[7])] : null) || sec;
      orden[secL] = (orden[secL] || 0) + 1;
      const dato = {codigo:c[0]||"", nombre:nomL, telefono:telL, clave:claveCliente(nomL, telL), celda:"",
        direccion:c[3]||"", referencia:c[4]||"", sectorId:secL, orden:orden[secL], activo:true};
      const la = parseFloat(c[5]), lo = parseFloat(c[6]);
      if (!isNaN(la) && !isNaN(lo) && la !== 0 && lo !== 0){
        dato.lat = la; dato.lng = lo; conPunto++;
      }
      listos.push(dato);
    });
    const boton = $("#cl-cargar");
    const textoBoton = boton.textContent;
    let bien = 0, mal = 0, primerError = "";
    boton.disabled = true;
    for (let i = 0; i < listos.length; i += 15){
      const tanda = listos.slice(i, i + 15);
      await Promise.all(tanda.map(d =>
        db.collection("clientes").add(d).then(() => { bien++; })
          .catch(e => { mal++; if (!primerError) primerError = (e && (e.code || e.message)) || "sin detalle"; })));
      boton.textContent = "Cargando… " + bien + " de " + listos.length;
    }
    boton.disabled = false;
    boton.textContent = textoBoton;
    if (bien && $("#cl-lista")) $("#cl-lista").value = "";
    alert("Cargados " + bien + " clientes.\n" + conPunto + " traían punto en el mapa." +
      (mal ? "\n\nNo entraron " + mal + " (" + primerError + ")." : ""));
  };
}

  const sinContar = conEx.filter(p => (S.existDoc[p.cod] || {}).contado === false);

    /* Sin ficha, el reparto NO puede bajar la existencia: las reglas dejan

    (sinFicha.length
      ? '<div class="pasos"><div class="eyebrow">Fichas que faltan</div>' +
        '<p style="font-size:14px;margin:8px 0 0"><b>' + sinFicha.length + ' de ' +
          S.catalogo.length + ' productos no tienen ficha de existencia.</b> ' +
          'Sin ficha, la entrega del motorista no puede bajar la existencia: las reglas ' +
          'no le dejan crearla a él. Se crean en CERO y quedan marcadas ' +
          '<b>sin contar</b>, así que no avisan "agotado" hasta que bodega cargue el ' +
          'conteo de verdad.</p>' +
        '<button class="btn" id="ex-crear" style="margin-top:14px">Crear las ' +
          sinFicha.length + ' fichas que faltan</button></div>'
      : '') +
    (sinContar.length
      ? '<div class="aviso dato" style="margin-top:10px"><b>' + sinContar.length +
        ' fichas sin contar.</b> Se mueven con el kardex, pero todavía nadie las ha ' +
        'contado en bodega, así que no avisan cuando llegan a cero.</div>'
      : '') +
    '<div class="pasos"><div class="eyebrow">Cargar existencia</div>' +
      '<p style="font-size:14px;margin:8px 0 0">Solo ponga aquí los productos escasos. El que no esté en esta lista se vende sin tope.</p>' +
      '<label class="campo"><span>Producto</span><select id="ex-prod"><option value="">Elija…</option>' +
        S.catalogo.map(p => '<option value="' + p.cod + '">' + escapar(p.cod + " · " + p.nombre) + '</option>').join("") +
      '</select></label>' +
      '<label class="campo"><span>Cantidad disponible</span><input id="ex-cant" type="number" inputmode="numeric" value="0"></label>' +
      '<button class="btn" id="ex-add" style="margin-top:14px">Guardar existencia</button></div>' +
    '<div class="conteo">' + conEx.length + ' productos con existencia controlada</div>' +
    '<table class="lista"><thead><tr><th>Producto</th><th>Quedan</th><th></th></tr></thead><tbody id="ex-cuerpo"></tbody></table>';
  const tb = $("#ex-cuerpo");
  conEx.forEach(p => {
    const tr = document.createElement("tr");
    tr.innerHTML = '<td><b>' + escapar(p.nombre) + '</b><br><span style="color:var(--tenue);font-size:11px">' + p.cod + '</span></td>' +
      '<td class="num" style="font-weight:800;color:' + (S.exist[p.cod] > 0 ? 'inherit' : 'var(--rojo)') + '">' + S.exist[p.cod] + '</td>' +
      '<td><button class="btn linea chico">Quitar tope</button></td>';
    tr.querySelector("button").onclick = async () => {
      if (!confirm("¿Quitar el tope de " + p.nombre + "? Se podrá vender sin límite.")) return;
      await db.collection("existencias").doc(p.cod).delete();
    };
    tb.appendChild(tr);
  });
  if ($("#ex-crear")) $("#ex-crear").onclick = async () => {
    /* Se vuelve a filtrar aqui, no se usa la lista de arriba: entre que se
       pinto la pantalla y el toque pudo haber entrado una ficha nueva, y
       escribirle encima le pondria la existencia en cero. */
    const faltan = S.catalogo.filter(p => S.exist[p.cod] == null);
    if (!faltan.length) return alert("Ya todos los productos tienen ficha.");
    if (!confirm("Se van a crear " + faltan.length + " fichas de existencia en CERO.\n\n" +
      "No toca ninguna de las que ya existen.\n\n" +
      "Quedan marcadas SIN CONTAR: no avisan \"agotado\" hasta que bodega les " +
      "cargue el conteo de verdad.\n\n¿Sigue?")) return;
    const b = $("#ex-crear");
    b.disabled = true; b.textContent = "Creando…";
    let hechas = 0;
    try {
      // de 400 en 400: un lote de Firestore aguanta 500 escrituras
      for (let i = 0; i < faltan.length; i += 400){
        const tanda = faltan.slice(i, i + 400);
        const lote = db.batch();
        tanda.forEach(p => lote.set(db.collection("existencias").doc(p.cod), {
          disponible: 0,
          nombre: p.nombre || "",
          unidad: p.unidad || "UNIDAD",
          contado: false,
          actualizado: firebase.firestore.FieldValue.serverTimestamp()
        }));
        await lote.commit();
        hechas += tanda.length;
        b.textContent = "Creando… " + hechas + " de " + faltan.length;
      }
      alert("Listo: " + hechas + " fichas creadas en cero.\n\n" +
        "Desde ahora las entregas del reparto sí bajan la existencia. Cuando bodega " +
        "cuente de verdad, cargue el número aquí abajo y esa ficha deja de estar sin contar.");
    } catch(e){
      alert("Se crearon " + hechas + " y ahí se detuvo (" + (e.code || e.message) + ").\n\n" +
        "Las que entraron quedaron bien. Puede volver a tocar el botón: solo crea las que falten.");
    }
    b.disabled = false;
    pintarAdmin();
  };

  $("#ex-add").onclick = async () => {
    const cod = $("#ex-prod").value;
    if (!cod) return alert("Elija el producto.");
    const p = S.catalogo.find(x => x.cod === cod) || {};
    const cant = Number($("#ex-cant").value) || 0;
    const ok = await guardarEn("existencias", () => db.collection("existencias").doc(cod).set({
      disponible: cant, nombre: p.nombre || "",
      /* Alguien la conto de verdad: desde aqui si puede avisar "agotado". */
      contado: true,
      actualizado: firebase.firestore.FieldValue.serverTimestamp()
    }), $("#ex-add"));
    if (ok && $("#ex-cant")) $("#ex-cant").value = 0;
  };
}

let pedidosFiltro = "hoy";
let pedidosDesde = "", pedidosHasta = "";
let repartoFecha = null;
function adminReparto(m){
  if (!repartoFecha) repartoFecha = hoyISO();
  const f = repartoFecha;
  m.innerHTML =
    '<div class="meta"><div class="dia">' +
      '<button id="re-ayer" style="font-size:19px;color:var(--verde);padding:0 8px">‹</button>' +
      '<span style="flex:1;text-align:center">Entregas del ' + fechaBonita(f) + '</span>' +

  $("#re-ayer").onclick = () => { repartoFecha = corrido(f,-1); pintarAdmin(); };
  $("#re-manana").onclick = () => { repartoFecha = corrido(f,1); pintarAdmin(); };

  /* El bono y los cargos son de la quincena: se miran cada quince dias, no
     cada rato. Antes se dibujaban abiertos y cobraban dos consultas enteras
     a Firestore cada vez que alguien entraba a ver como iba el reparto de
     hoy. Ahora van plegados y no leen nada hasta que se abren. */
  m.insertAdjacentHTML("beforeend",
    '<details class="pasos" id="re-quincena">' +
      '<summary style="cursor:pointer;font-weight:700">Ver la quincena</summary>' +
      '<div class="eyebrow" style="margin-top:10px">Bono de eficiencia \u00b7 quincena en curso</div>' +
      '<p style="font-size:14px;margin:8px 0 0">Devuelto a cargo de cada motorista y el bono que lleva. ' +

      '<div id="re-bonos" class="conteo" style="margin-top:8px">Cargando\u2026</div>' +
      '<div class="eyebrow" style="margin-top:16px">Cargos al preventista</div>' +
      '<p style="font-size:14px;margin:8px 0 0">Errores de pedido que el motorista mand\u00f3. ' +

      '<div id="re-cargos" class="conteo" style="margin-top:8px">Cargando\u2026</div></details>');

  if (quin) quin.ontoggle = () => { if (quin.open && !quin.dataset.leido){ quin.dataset.leido = "1"; leerQuincena(); } };
  /* Quien de verdad tiene la culpa de un cargo lo decide oficina, en
     cualquier momento (antes solo se podia cuando el preventa ya lo habia
     rechazado). Brayan, 4 sep 2026: el motorista propone, pero puede ser
     el motorista mismo quien se equivoco (dejo el pedido incompleto,
     entrego tarde, etc.) y hasta hoy solo se podia dejar en el preventa o
     en nadie. Con el campo "responsable" oficina puede mandarlo al
     motorista: ese monto le pesa en su bono de la quincena en vez de
     pesarle al preventa en su comision. */
  const RESP_TXT = {preventa:"al preventista", motorista:"al motorista", nadie:"a nadie \u00b7 quedan libres los dos"};
  function leerQuincena(){
  Promise.all([
    db.collection("entregas").where("mes","==",mesISO()).where("estado","==","no entregado").get(),
    db.collection("cargos").where("mes","==",mesISO()).get()
  ]).then(([qe, qc]) => {
      const cargosDePedido = {};
      qc.docs.forEach(d => { const c = d.data(); if (c.pedidoId) cargosDePedido[c.pedidoId] = c; });

      const bc = $("#re-bonos");
      if (bc){
        const por = {};
        qe.docs.map(d => d.data())
          .filter(e => mismaQuincena(e.fecha))
          .forEach(e => {
            /* Si oficina ya decidio de quien fue, eso manda; si no, se usa
               el motivo que escribio el motorista al cerrar, como siempre. */
            if (!culpaDelMotorista(e, cargosDePedido[e.pedidoId])) return;
            const k = e.repartoNombre || e.repartoUid || "?";
            por[k] = (por[k] || 0) + (Number(e.totalPedido != null ? e.totalPedido : e.total) || 0);
          });
        const noms = Object.keys(por).sort();
        bc.innerHTML = !noms.length ? "Sin devoluciones a cargo de motoristas esta quincena."
          : noms.map(n => {
              const dev = dosDec(por[n]), t = bonoTramo(dev);
              return '<div class="cuota-fila"><span class="quien">' + escapar(n) +
                '<br><span style="color:var(--tenue);font-size:11px">devuelto ' + money(dev) +

                '<b class="num">' + money(t.bono) + '</b></div>';
            }).join("");
      }

      const cc = $("#re-cargos");
      if (!cc) return;
      const cs = qc.docs.map(d => Object.assign({id:d.id}, d.data()))
        .sort((a,b) => (a.responsable ? 1 : 0) - (b.responsable ? 1 : 0));
      if (!cs.length){ cc.textContent = "Ninguno este mes."; return; }
      cc.innerHTML = cs.map(c =>
        '<div class="cuota-fila" style="flex-wrap:wrap;gap:6px" data-id="' + c.id + '">' +
          '<span class="quien" style="flex:1 1 100%">' + escapar(c.paraNombre || "") + ' \u00b7 ' +

            '<br><span style="color:var(--tenue);font-size:11px">' + escapar(c.motivo || "") +
            ' \u00b7 el preventa dice: ' + (c.estado === "propuesto" ? "sin responder todav\u00eda" : escapar(c.estado)) +
            (c.respuesta ? ' \u00b7 \u00abdice: ' + escapar(c.respuesta) + '\u00bb' : '') +
            ' \u00b7 lo mand\u00f3 ' + escapar(c.deNombre || "") + '</span>' +
            '<br><span style="color:var(--tenue);font-size:11px"><b>Responsable:</b> ' +
            (c.responsable ? RESP_TXT[c.responsable] + (c.resueltoPorNombre ? ' \u00b7 lo decidi\u00f3 ' + escapar(c.resueltoPorNombre) : '') : "sin decidir") +
            '</span></span>' +
          (!soloVer()
            ? '<button class="btn linea chico ca-r" data-r="preventa" style="width:auto' +
                (c.responsable === "preventa" ? ";border-color:var(--verde);color:var(--verde)" : "") + '">Al preventista</button>' +
              '<button class="btn linea chico ca-r" data-r="motorista" style="width:auto' +
                (c.responsable === "motorista" ? ";border-color:var(--verde);color:var(--verde)" : "") + '">Al motorista</button>' +
              '<button class="btn linea chico ca-r" data-r="nadie" style="width:auto;color:var(--rojo)' +
                (c.responsable === "nadie" ? ";border-color:var(--rojo)" : "") + '">A nadie</button>'
            : '') +
        '</div>').join("");
      const decidir = async (c, responsable) => {
        /* Los dos bolsillos en una sola decision: el cargo (bono del
           motorista) y el pedido (comision del preventista). Van en un
           lote: si se escribiera uno y fallara el otro, la pantalla y el
           dia de pago dirian cosas distintas, que es justo el defecto que
           esto viene a tapar. */
        const ok = await guardarEn("cargos", () => {
          const lote = db.batch();
          lote.update(db.collection("cargos").doc(c.id), {
            estado: estadoDeCargo(responsable), responsable: responsable,
            resueltoPor: S.usuario.uid, resueltoPorNombre: S.nombre,
            resueltoEn: firebase.firestore.FieldValue.serverTimestamp()
          });
          if (c.pedidoId){
            const perdon = perdonAlPreventa(responsable);
            lote.update(db.collection("pedidos").doc(c.pedidoId), {
              devolucionPerdonada: perdon,
              devolucionPerdonadaPorNombre: perdon ? S.nombre : "",
              devolucionPerdonadaEn: perdon ? firebase.firestore.FieldValue.serverTimestamp() : null
            });
          }
          return lote.commit();
        });
        if (ok) pintarAdmin();
      };
      $$("#re-cargos .ca-r").forEach(b => b.onclick = () => {
        const c = cs.find(x => x.id === b.closest("[data-id]").dataset.id);

        if (confirm("El cargo de " + money(c.monto) + " por \u00ab" + (c.motivo||"") + "\u00bb queda " +
          RESP_TXT[r] + ".\n\n" +
          (r === "motorista" ? "Le pesa al motorista en su bono de la quincena y la comisi\u00f3n le vuelve al preventista."

           : "Le pesa al preventista en su comisi\u00f3n del mes.") +
          "\n\n\u00bfSigue?")) decidir(c, r);
      });
    }).catch(() => {
      const bc = $("#re-bonos"); if (bc) bc.textContent = "No se pudo leer.";
      const cc = $("#re-cargos"); if (cc) cc.textContent = "No se pudo leer.";
    });
  }

  db.collection("pedidos").where("fechaEntrega","==",f).get().then(q => {
    const ped = q.docs.map(d => Object.assign({id:d.id}, d.data())).filter(p => p.tipo !== "cambio");

    cont.innerHTML =

          '<div class="barra chica"><i style="width:' + pct + '%"></i></div>' +

    $$("#re-cuerpo .re-carga").forEach(b => b.onclick = () =>

    $$("#re-cuerpo .re-entregas").forEach(b => b.onclick = () =>
      hojaEntregas(grupos[b.dataset.k].ped, grupos[b.dataset.k].nombre, f));
    $$("#re-cuerpo .re-tk").forEach(b => b.onclick = () =>
      hojaTickets(grupos[b.dataset.k], f));
  }).catch(e => {
    const c = $("#re-cuerpo");
    if (c) c.innerHTML = '<div class="aviso">No se pudo leer (' + (e.code||e.message) + ').</div>';
  });
}

/* En qu\u00e9 anda cada entrega de la cola.
   ====================================

   El sistema de oficina contesta con CINCO palabras, no con dos, y cada una
   dice algo distinto. Contarlas todas como «facturadas» --que es lo que
   hacia esta pantalla-- haria creer que la venta ya salio:

   - `armada`: el documento esta numerado pero SIN sello. No es una factura.
   - `prueba`: tiene sello, pero del ambiente de pruebas. Tampoco es legal.
   - `revisar`: fallo varias veces; necesita que una persona lo mire, y con
     el filtro viejo no lo veia nadie.

   🔑 **Solo `facturada` es una factura de verdad**: sello de Hacienda en
   ambiente de produccion. Esa es la palabra que contesta «¿este dato ya es
   real?», y el dia que oficina pase a produccion empieza a llegar sola. */
const ES_FACTURA_REAL = "facturada";
const ESTADOS_COLA = {
  pendiente: {corto:"por facturar", rotulo:"Por facturar",
              atender:true,  real:false, aMano:true},
  revisar:   {corto:"para revisar", rotulo:"Fall\u00f3 varias veces \u00b7 que alguien la mire",
              atender:true,  real:false, aMano:true},
  armada:    {corto:"armadas",      rotulo:"Armada \u00b7 esperando el sello",
              atender:false, real:false, aMano:true},
  prueba:    {corto:"en pruebas",   rotulo:"Sellada en PRUEBAS \u00b7 no es legal",
              atender:false, real:false, aMano:true},
  facturada: {corto:"facturadas",   rotulo:"Facturada",
              atender:false, real:true,  aMano:false}
};
/* El orden en que se miran: primero lo que hay que atender. */
const ORDEN_COLA = ["revisar", "pendiente", "armada", "prueba", "facturada"];

function estadoDeCola(x){
  /* Lo que no se reconoce se trata como pendiente, NUNCA como facturado: si
     oficina manda una palabra nueva, que se vea y que alguien pregunte. */
  const dice = (x && x.estadoFactura) || "";
  const clave = ESTADOS_COLA[dice] ? dice : "pendiente";
  return Object.assign({clave: clave}, ESTADOS_COLA[clave]);
}

/* La cola de facturaci\u00f3n: lo entregado que espera su documento fiscal. */
async function pintarPorFacturar(){
  const cont = $("#pf-lista");
  if (!cont) return;
  let cola = [];
  try {
    const q = await db.collection("porFacturar").where("mes","==",mesISO()).get();
    cola = q.docs.map(d => Object.assign({id:d.id}, d.data()));
  } catch(e){ cont.textContent = "No se pudo leer (" + (e.code||e.message) + ")."; return; }
  if (!cola.length){ cont.textContent = "Sin entregas en la cola este mes."; return; }

  const porEstado = {};
  cola.forEach(x => {
    const e = estadoDeCola(x);
    (porEstado[e.clave] = porEstado[e.clave] || []).push(x);
  });
  /* De las que ya salieron de verdad basta el numero; el detalle sirve para
     lo que TODAVIA no esta facturado, que es para lo que se abre esto. */
  const falta = [];
  ORDEN_COLA.forEach(k => {
    if (k === ES_FACTURA_REAL) return;
    (porEstado[k] || []).forEach(x => falta.push({x: x, e: ESTADOS_COLA[k], k: k}));
  });

  cont.innerHTML =
    '<div class="conteo" style="margin-bottom:6px">' +
      ORDEN_COLA.filter(k => (porEstado[k] || []).length).map(k =>
        (ESTADOS_COLA[k].atender ? "<b>" : "") +
        porEstado[k].length + " " + ESTADOS_COLA[k].corto +
        (ESTADOS_COLA[k].atender ? "</b>" : "")
      ).join(" \u00b7 ") + '</div>' +
    (falta.length ? "" : '<div class="conteo">Todo lo de este mes ya sali\u00f3 con su sello.</div>') +
    falta.map((f, i) => {
      const x = f.x, dte = x.dte || {};
      return '<div class="cuota-fila" style="flex-wrap:wrap;gap:6px' +
          (f.k === "revisar" ? ";border-left:3px solid var(--c-perdido);padding-left:8px" : "") + '">' +
        /* `.quien` viene con overflow:hidden y white-space:nowrap, que es
           para un nombre largo en UNA linea. Acá van tres renglones, y sin
           anular eso el ultimo se pinta encima del boton. */
        '<span class="quien" style="flex:1 1 100%;white-space:normal;' +
          'overflow:visible;text-overflow:clip">' + escapar(x.clienteNombre || "") +
          ' \u00b7 <b>' + money(x.total || 0) + '</b>' +
          '<br><span style="color:var(--tenue);font-size:11px">' +
            escapar(f.e.rotulo) + ' \u00b7 ' + escapar(x.fechaEntrega || "") +
            ' \u00b7 entreg\u00f3 ' + escapar(x.repartoNombre || "") +
            (x.fiscal ? ' \u00b7 CR\u00c9DITO FISCAL' : ' \u00b7 consumidor final') +
            (dte.numeroControl ? '<br>' + escapar(dte.numeroControl) : '') +
            (x.errorFactura ? '<br>' + escapar(x.errorFactura) : '') +
          '</span></span>' +
        /* En su propia fila: el span de arriba ocupa el ancho entero y con
           align-items:center el boton se le encimaba al ultimo renglon. */
        (f.e.aMano
          ? '<span style="flex:1 1 100%"><button class="btn linea chico pf-ok" data-i="' + i +
            '" style="width:auto">Marcar facturada a mano</button></span>'
          : '') +
      '</div>';
    }).join("");

  $$("#pf-lista .pf-ok").forEach(b => b.onclick = async () => {
    const x = falta[Number(b.dataset.i)].x;
    const num = prompt("N\u00famero del documento emitido (para dejar rastro):");
    if (num === null) return;
    const ok = await guardarEn("porFacturar", () => db.collection("porFacturar").doc(x.id).update({
      estadoFactura: ES_FACTURA_REAL,
      dte: {numero: (num || "").trim(), manual: true,
            porUid: S.usuario.uid,
            fecha: firebase.firestore.FieldValue.serverTimestamp()}
    }), b);
    if (ok) pintarPorFacturar();
  });
}

/* Sala de espera: lo levantado fuera de horario espera el visto bueno
   de oficina. Aprobar = entra al dia de HOY, con todo lo demas. */
async function pintarAdicionales(){
  const cont = $("#pa-lista");
  if (!cont) return;
  let ad = [];
  try {
    const q = await db.collection("pedidos").where("mes","==",mesISO()).get();
    ad = q.docs.map(d => Object.assign({id:d.id}, d.data()))
      .filter(x => x.estado === "adicional");
  } catch(e){ cont.textContent = "No se pudo leer (" + (e.code||e.message) + ")."; return; }
  if (!ad.length){ cont.textContent = "Ninguno en espera."; return; }

  cont.innerHTML = ad.map((x, i) =>
    '<div class="cuota-fila" style="flex-wrap:wrap;gap:6px">' +
      '<span class="quien" style="flex:1 1 100%">' + escapar(x.clienteNombre || "") +
        ' \u00b7 <b>' + money(x.total || 0) + '</b>' +
        '<br><span style="color:var(--tenue);font-size:11px">levant\u00f3 ' +
        escapar(x.preventaNombre || "") + ' \u00b7 ' + escapar(x.fecha || "") + '</span></span>' +
      '<button class="btn linea chico pa-ok" data-i="' + i + '" style="width:auto">Aprobar para hoy</button>' +
      '<button class="btn linea chico pa-no" data-i="' + i + '" style="width:auto;color:var(--rojo)">Rechazar</button>' +
    '</div>').join("");

  $$("#pa-lista .pa-ok").forEach(b => b.onclick = async () => {
    const x = ad[Number(b.dataset.i)];
    const ok = await guardarEn("pedidos", () => db.collection("pedidos").doc(x.id).update({
      estado: "pendiente", fechaEntrega: hoyISO(),
      aprobadoPor: S.usuario.uid,
      aprobadoEn: firebase.firestore.FieldValue.serverTimestamp()
    }), b);
    if (ok) pintarAdmin();
  });
  $$("#pa-lista .pa-no").forEach(b => b.onclick = async () => {
    const x = ad[Number(b.dataset.i)];
    if (!confirm("\u00bfRechazar el adicional de " + (x.clienteNombre||"") + "? No entra al reparto.")) return;
    const ok = await guardarEn("pedidos", () => db.collection("pedidos").doc(x.id).update({
      estado: "rechazado",
      aprobadoPor: S.usuario.uid,
      aprobadoEn: firebase.firestore.FieldValue.serverTimestamp()
    }), b);
    if (ok) pintarAdmin();
  });
}

/* Oficina confirma contra el banco. Hasta entonces el pedido no esta pagado. */
let pagosPend = [];
async function pintarTransferencias(){
  const cont = $("#pg-lista");
  if (!cont) return;
  try {
    const q = await db.collection("pedidos").where("mes","==",mesISO()).get();
    pagosPend = q.docs.map(d => Object.assign({id:d.id}, d.data()))
      .filter(x => x.pago && x.pago.estado === "reportado");
  } catch(e){
    cont.innerHTML = "No se pudo leer (" + (e.code || e.message) + ").";
    return;
  }
  if (!pagosPend.length){ cont.innerHTML = "Ninguna pendiente."; return; }

  cont.innerHTML = pagosPend.map((x, i) =>
    '<button class="pg-fila" data-i="' + i + '">' +
      '<span class="pg-arriba">' + escapar(x.clienteNombre || "") +
        '<b class="num">' + money(x.pago.monto || x.total || 0) + '</b></span>' +
      '<span class="pg-abajo">' +
        (x.pago.banco ? escapar(x.pago.banco) + ' &middot; ' : '') +
        'ref ' + escapar(x.pago.referencia || "sin n\u00famero") +
        (cuandoTexto(x.pago.reportadoEn) ? ' &middot; ' + cuandoTexto(x.pago.reportadoEn) : '') +
        (x.pago.reportadoPorNombre ? ' &middot; ' + escapar(x.pago.reportadoPorNombre) : '') +
      '</span>' +
    '</button>').join("");

  $$("#pg-lista .pg-fila").forEach(b => b.onclick = () => hojaConfirmarPago(pagosPend[Number(b.dataset.i)]));
}

/* Hora y dia de cuando el motorista la anoto, para cotejarla en el banco. */
function cuandoTexto(ts){
  try {
    const d = ts && ts.toDate ? ts.toDate() : null;
    if (!d) return "";
    const h = d.getHours(), h12 = h % 12 === 0 ? 12 : h % 12;
    return String(d.getDate()).padStart(2,"0") + "/" + String(d.getMonth()+1).padStart(2,"0") +
      " " + h12 + ":" + String(d.getMinutes()).padStart(2,"0") + " " + (h < 12 ? "a. m." : "p. m.");
  } catch(e){ return ""; }
}

/* Confirmar deja rastro: quien la dio por buena, a que hora y con que
   numero del estado de cuenta. El dia que un monto no cuadre, se sabe. */
function hojaConfirmarPago(x){
  const pg = x.pago || {};
  const cli = S.clientes.find(c => c.id === x.clienteId);
  const dato = (et, v) => v
    ? '<div class="cuota-fila"><span class="quien">' + et + '</span><b>' + v + '</b></div>' : '';

  $("#hoja-cuerpo").innerHTML =
    '<div class="eyebrow">Transferencia por confirmar</div>' +
    '<h2>' + escapar(x.clienteNombre || "") + '</h2>' +
    '<div class="meta-cifras" style="margin-top:10px">' +
      '<span class="eyebrow">Monto anotado</span>' +
      '<b class="num" style="font-size:29px">' + money(pg.monto || x.total || 0) + '</b>' +
    '</div>' +
    dato("Banco del cliente", escapar(pg.banco || "")) +
    dato("Referencia", escapar(pg.referencia || "")) +
    dato("Anotada", cuandoTexto(pg.reportadoEn)) +
    dato("La recibi&oacute;", escapar(pg.reportadoPorNombre || "")) +
    dato("C&oacute;digo del cliente", escapar((cli && cli.codigo) || "")) +
    (pg.comprobante
      ? '<img src="' + pg.comprobante + '" style="width:100%;border-radius:12px;margin-top:12px">' +
        '<p style="font-size:12px;color:var(--tenue);text-align:center;margin:6px 0 0">' +
          'Esto es una referencia, no un comprobante: b&uacute;squela en el estado de cuenta.</p>'
      : '<div class="aviso dato">No mand&oacute; foto.</div>') +
    '<label class="campo" style="margin-top:14px"><span>N&uacute;mero con que aparece en el banco (opcional)</span>' +
      '<input id="pc-ref" type="text" autocomplete="off"></label>' +
    '<button class="btn" id="pc-ok" style="margin-top:12px">Aparece en el banco &middot; confirmar</button>' +
    '<button class="btn linea" id="pc-no" style="margin-top:9px;color:var(--rojo)">No aparece en el banco</button>' +
    '<button class="btn secundario" id="pc-volver" style="margin-top:9px">Volver</button>';

  $("#fondo").classList.add("abierto");
  $("#hoja").classList.add("abierta");
  $("#pc-volver").onclick = cerrarHoja;

  const marcar = async (estado, boton) => {
    const campos = {
      "pago.estado": estado,
      "pago.revisadoPor": S.usuario.uid,
      "pago.revisadoPorNombre": S.nombre,
      "pago.revisadoEn": firebase.firestore.FieldValue.serverTimestamp()
    };
    const rb = $("#pc-ref") ? $("#pc-ref").value.trim() : "";
    if (rb) campos["pago.refBanco"] = rb;
    const ok = await guardarEn("pedidos", () =>
      db.collection("pedidos").doc(x.id).update(campos), boton);
    if (ok){ cerrarHoja(); pintarTransferencias(); }
  };
  $("#pc-ok").onclick = () => marcar("confirmado", $("#pc-ok"));
  $("#pc-no").onclick = () => {
    if (confirm("La transferencia no aparece en el banco.\n\nEl pedido queda SIN pagar y hay que cobrarle al cliente. ¿Sigue?"))
      marcar("rechazado", $("#pc-no"));
  };
}

function adminPedidos(m){
  m.innerHTML =
    '<div class="vistas">' +
      '<button data-f="hoy" aria-pressed="' + (pedidosFiltro==="hoy") + '">Hoy</button>' +
      '<button data-f="mes" aria-pressed="' + (pedidosFiltro==="mes") + '">Este mes</button>' +
      '<button data-f="rango" aria-pressed="' + (pedidosFiltro==="rango") + '">Un rango</button>' +
    '</div>' +
    (pedidosFiltro === "rango"
      ? '<div class="fila" style="gap:8px;margin:8px 0 0">' +
          '<label class="campo" style="flex:1"><span>Desde</span><input id="pe-desde" type="date" value="' + escapar(pedidosDesde) + '"></label>' +
          '<label class="campo" style="flex:1"><span>Hasta</span><input id="pe-hasta" type="date" value="' + escapar(pedidosHasta) + '"></label>' +
        '</div>'
      : '') +
    '<div class="conteo">Cargando…</div>' +
    '<div class="pasos"><div class="eyebrow">Mover la entrega</div>' +
      '<p style="font-size:14px;margin:8px 0 0">Si la ruta se adelanta o se atrasa por descanso o feriado, ' +
      'aquí se cambia la fecha de entrega de los pedidos pendientes que se ven abajo.</p>' +
      '<label class="campo"><span>Nueva fecha de entrega</span><input id="pe-fecha" type="date"></label>' +
      '<button class="btn secundario" id="pe-mover" style="margin-top:12px">Mover los pendientes</button>' +
    '</div>' +
    '<div class="pasos"><div class="eyebrow">Liquidaci&oacute;n del d&iacute;a</div>' +
      '<p style="font-size:14px;margin:8px 0 0">Cu&aacute;nto efectivo debe rendir cada repartidor: ' +
      'lo entregado menos lo que le pagaron por transferencia.</p>' +
      '<div id="liq-cuerpo" class="conteo" style="margin-top:10px">Cargando&hellip;</div></div>' +
    '<div class="pasos"><div class="eyebrow">Cola de facturaci&oacute;n</div>' +
      '<p style="font-size:14px;margin:8px 0 0">Cada entrega deja aqu\u00ed su copia para el sistema de oficina. ' +
      'Cuando ese sistema facture, escribir\u00e1 el DTE en la misma fila. Mientras el puente se conecta, ' +
      'se puede marcar a mano lo ya facturado.</p>' +
      '<div id="pf-lista" class="conteo" style="margin-top:10px">Cargando&hellip;</div></div>' +
    '<div class="pasos"><div class="eyebrow">Pedidos adicionales por aprobar</div>' +
      '<p style="font-size:14px;margin:8px 0 0">Levantados fuera del horario laboral. ' +
      'Al aprobarlos entran al reparto de HOY, al mapa del cami\u00f3n y a las hojas.</p>' +
      '<div id="pa-lista" class="conteo" style="margin-top:10px">Cargando&hellip;</div></div>' +
    '<div class="pasos"><div class="eyebrow">Transferencias por confirmar</div>' +
      '<p style="font-size:14px;margin:8px 0 0">Toque una para verla completa y cotejarla ' +
      'contra el estado de cuenta.</p>' +
      '<div id="pg-lista" class="conteo" style="margin-top:10px">Cargando&hellip;</div></div>' +
    '<button class="btn linea" id="pe-csv" style="margin-bottom:10px">Bajar en Excel (CSV)</button>' +
    '<div id="pe-cuerpo"></div>';
  pintarTransferencias();
  pintarAdicionales();
  pintarPorFacturar();
  $$("#admin-cuerpo .vistas button").forEach(b => b.onclick = () => { pedidosFiltro = b.dataset.f; pintarAdmin(); });
  if (pedidosFiltro === "rango"){
    $("#pe-desde").onchange = e => { pedidosDesde = e.target.value; pintarAdmin(); };
    $("#pe-hasta").onchange = e => { pedidosHasta = e.target.value; pintarAdmin(); };
  }
  const consulta = pedidosFiltro === "hoy"
    ? db.collection("pedidos").where("fecha","==",hoyISO())
    : pedidosFiltro === "mes"
    ? db.collection("pedidos").where("mes","==",mesISO())
    : (pedidosDesde && pedidosHasta)
    ? db.collection("pedidos").where("fecha",">=",pedidosDesde).where("fecha","<=",pedidosHasta)
    : null;
  if (!consulta){
    m.querySelector(".conteo").textContent = "Elija las dos fechas para ver el rango.";
    return;
  }
  consulta.get().then(q => {
    anotarLectura("pedidos (" + pedidosFiltro + ")", q);
    const ped = q.docs.map(d => Object.assign({id:d.id}, d.data()));
    const total = ped.reduce((a,p) => a + (Number(p.total)||0), 0);
    const c = $("#pe-cuerpo");
    if (!c) return;
    m.querySelector(".conteo").textContent = ped.length + " pedidos · " + money(total);
    $("#pe-csv").onclick = () => bajarCSV(ped);
    $("#pe-mover").onclick = async () => {
      const nf = $("#pe-fecha").value;
      if (!nf) return alert("Elija la fecha nueva.");
      const mover = ped.filter(x => x.estado === "pendiente" || x.estado === "aprobado");
      if (!mover.length) return alert("No hay pedidos pendientes que mover.");
      if (!confirm("Se van a mover " + mover.length + " pedidos a " + fechaBonita(nf) +
        ".\n\nLos ya entregados no se tocan. ¿Sigue?")) return;
      const lote = db.batch();
      mover.forEach(x => lote.update(db.collection("pedidos").doc(x.id), {fechaEntrega: nf}));
      const ok = await guardarEn("pedidos", () => lote.commit(), $("#pe-mover"));
      if (ok){ alert("Listo. Ya le aparecen al motorista ese día."); pintarAdmin(); }
    };
    /* ---- liquidación: entregado − transferencias = efectivo a rendir ---- */
    const liq = $("#liq-cuerpo");
    /* La liquidacion va por fecha de ENTREGA, no por fecha del pedido: con
       diasEntrega en 2, lo levantado hoy se entrega pasado manana, y la
       caja decia "Todavia no hay entregas hoy" con el motorista parado
       enfrente con el efectivo. */
    const fuenteLiq = pedidosFiltro === "hoy"
      ? db.collection("pedidos").where("fechaEntrega","==",hoyISO()).get()
          .then(q2 => q2.docs.map(d => Object.assign({id:d.id}, d.data())))
      : Promise.resolve(ped);
    if (liq) fuenteLiq.then(pedLiq => {
      const entregados = pedLiq.filter(x => x.entregadoPor && (Number(x.totalEntregado) || 0) > 0);
      if (!entregados.length){
        liq.textContent = "Todavía no hay entregas" + (pedidosFiltro === "hoy" ? " hoy." : " este mes.");
      } else {
        const por = {};
        entregados.forEach(x => {
          const k = x.entregadoPor;
          if (!por[k]) por[k] = {nombre: x.entregadoPorNombre || "(sin nombre)",
                                 entregado:0, confirmada:0, reportada:0};
          por[k].entregado += Number(x.totalEntregado) || 0;
          if (x.pago && x.pago.metodo === "transferencia"){
            /* El monto de la transferencia se congela al reportarla; si
               despues bajo la cantidad entregada, no se descuenta de mas. */
            const mto = Math.min(Number(x.pago.monto) || 0, Number(x.totalEntregado) || 0);
            if (x.pago.estado === "confirmado") por[k].confirmada += mto;
            if (x.pago.estado === "reportado")  por[k].reportada  += mto;
          }
        });
        liq.innerHTML = Object.keys(por).map(k => {
          const r = por[k];
          const efectivo = Math.max(0, r.entregado - r.confirmada - r.reportada);
          return '<div class="meta" style="margin-top:8px"><div class="meta-cifras">' +
            '<b style="font-size:15px">' + escapar(r.nombre) + '</b>' +
            '<b class="num" style="font-size:19px">' + money(efectivo) + ' en efectivo</b></div>' +
            '<div class="conteo" style="margin-top:4px">Entreg&oacute; ' + money(r.entregado) +
            ' &middot; transferencias ' + money(r.confirmada + r.reportada) +
            (r.reportada > 0 ? ' (' + money(r.reportada) + ' sin confirmar)' : '') +
            '</div></div>';
        }).join("");
      }
    }).catch(() => { liq.textContent = "No se pudieron leer las entregas."; });

    if (!ped.length){ c.innerHTML = '<div class="vacio"><p>Todavía no hay pedidos hoy.</p></div>'; return; }
    c.innerHTML = ped.map(p =>
      '<div class="meta"><div class="eyebrow">' + escapar(p.preventaNombre||"") + ' · ' + escapar(p.tipo) + ' · ' + escapar(p.estado) +
        (p.fechaEntrega ? ' · entrega ' + escapar(p.fechaEntrega) : '') + '</div>' +
      '<div class="meta-cifras" style="margin-top:4px"><div><b style="font-size:17px">' + escapar(p.clienteNombre) + '</b>' +
      '<span style="font-size:12px;color:var(--tenue);font-weight:700">' + escapar(p.clienteCodigo||"") +
      (p.clienteTelefono ? ' · ' + escapar(p.clienteTelefono) : '') + '</span></div>' +
      '<div style="text-align:right"><b class="num" style="font-size:21px">' + money(p.total) + '</b></div></div>' +
      p.lineas.map(l => '<div class="lin"><div><div class="n">' + escapar(l.nombre) + '</div>' +
        '<div class="d">' + l.cant + ' × ' + money(l.precio) + '</div></div>' +
        '<div class="t"><b class="num">' + money(l.total) + '</b></div></div>').join("") +
      (p.nota ? '<div class="aviso dato">' + escapar(p.nota) + '</div>' : '') +
      (p.duracionSeg != null ? '<div class="conteo">Visita de ' + Math.round(p.duracionSeg/60) + ' min' +
        (p.metrosDelCliente != null ? ' · a ' + p.metrosDelCliente + ' m del punto del cliente' : '') +
        (p.fueraDelPunto != null ? ' · abierta fuera del punto' : '') + '</div>' : '') +
      (p.foto ? '<img src="' + p.foto + '" style="width:100%;border-radius:10px;margin-top:8px" alt="">' : '') +
      '</div>').join("");
  }).catch(e => {
    m.innerHTML = '<div class="aviso">No se pudieron leer los pedidos (' + (e.code||e.message) + ').</div>';
  });
}
