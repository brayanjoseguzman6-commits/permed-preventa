function marcarUbicacion(c, boton){
  if (!navigator.geolocation) return alert("Este teléfono no da la ubicación.");
  boton.disabled = true; boton.textContent = "Buscando señal…";
  navigator.geolocation.getCurrentPosition(async pos => {
    const lat = Math.round(pos.coords.latitude * 1e6) / 1e6;
    const lng = Math.round(pos.coords.longitude * 1e6) / 1e6;
    const exacto = Math.round(pos.coords.accuracy);
    if (exacto > 80 && !confirm("La señal está en " + exacto + " metros de precisión, que es poco exacta.\n\n¿Guardar de todos modos?")){
      boton.disabled = false; boton.textContent = "Marcar ubicación"; return;
    }
    const ok = await guardarEn("clientes", () => db.collection("clientes").doc(c.id).update({
      lat: lat, lng: lng, ubicadoPor: S.usuario.uid,
      ubicadoEn: firebase.firestore.FieldValue.serverTimestamp()
    }), boton);
    boton.disabled = false;
    boton.textContent = "Marcar ubicación";
    if (ok){ c.lat = lat; c.lng = lng; hojaCliente(c); }
  }, err => {
    boton.disabled = false; boton.textContent = "Marcar ubicación";
    const m = {1:"No dio permiso de ubicación. Actívelo en los ajustes del navegador.",
               2:"No se pudo tomar la ubicación. Salga a cielo abierto y pruebe otra vez.",
               3:"Tardó demasiado. Pruebe otra vez."}[err.code] || "No se pudo tomar la ubicación.";
    alert(m);
  }, {enableHighAccuracy:true, timeout:20000, maximumAge:0});
}

/* ===== Las ultimas compras del cliente, y "lo de siempre" =====
   Es lo primero que un preventista abre en Handy: que llevo la vez pasada,
   cuanto, y un boton para repetirlo. Plegado y se lee de Firestore SOLO al
   destaparlo (una consulta por cliente y por dia, guardada en memoria):
   el proyecto esta en el plan gratuito y cada lectura cuenta. */
const HIST_CACHE = {};
function bloqueHistorial(c){
  return '<details class="plega" id="hist-caja">' +
    '<summary>Últimas compras<span class="marca-f">toque para ver</span></summary>' +
    '<div class="adentro" id="hist-cuerpo"><div class="conteo">Buscando…</div></div>' +
  '</details>';
}
function amarrarHistorial(c){
  const caja = $("#hist-caja");
  if (!caja) return;
  caja.addEventListener("toggle", () => { if (caja.open) cargarHistorial(c); });
}
async function cargarHistorial(c){
  const cuerpo = $("#hist-cuerpo");
  if (!cuerpo) return;
  try {
    if (!HIST_CACHE[c.id]){
      /* Sin orderBy: con solo clienteId no hace falta indice compuesto. Se
         ordena aqui. 40 documentos bastan para sacar los 5 ultimos. */
      const q = await db.collection("pedidos").where("clienteId","==",c.id).limit(40).get();
      HIST_CACHE[c.id] = q.docs.map(d => Object.assign({id:d.id}, d.data()))
        .filter(p => p.estado !== "rechazado" && p.tipo !== "cambio")
        .sort((a,b) => (b.fecha || "").localeCompare(a.fecha || ""))
        .slice(0, 5);
    }
    const lista = HIST_CACHE[c.id];
    if (!lista.length){
      cuerpo.innerHTML = '<div class="conteo">Todavía no le hemos vendido con la app.</div>';
      return;
    }
    const puedeRepetir = esHoy() && (S.rol === "preventa" || S.rol === "supervisor") && !estaCerrado();
    cuerpo.innerHTML = lista.map((p, i) => {
      const ent = p.estado && p.estado.indexOf("entregado") === 0;
      const monto = ent && p.totalEntregado != null ? p.totalEntregado : p.total;
      return '<div class="lin">' +
        '<div style="flex:1;min-width:0">' +
          '<div class="n">' + fechaBonita(p.fecha || "") + ' · ' + (p.lineas || []).length + ' productos' +
            (p.estado === "no entregado" ? ' · <span style="color:var(--rojo)">no se entregó</span>' : '') + '</div>' +
          '<div class="d">' + (p.lineas || []).map(l => escapar(l.nombre) + ' ×' + l.cant).join(", ").slice(0, 120) + '</div>' +
          (puedeRepetir && i === 0
            ? '<div class="acc-ped"><button class="editar hist-repetir" data-i="' + i + '">Repetir este pedido</button></div>'
            : '') +
        '</div>' +
        '<div class="t"><b class="num">' + money(monto) + '</b></div></div>';
    }).join("");
    $$("#hist-cuerpo .hist-repetir").forEach(b => b.onclick = () => {
      const p = lista[Number(b.dataset.i)];
      asegurarVisita(c, () => repetirPedido(c, p));
    });
  } catch(e){
    cuerpo.innerHTML = '<div class="conteo">No se pudieron leer las compras (' + escapar(e.code || e.message || "") + ').</div>';
  }
}
/* Arma el carrito con las MISMAS cantidades del pedido anterior, pero al
   precio de HOY (catalogo, lista o precio especial del cliente). Lo que
   ya no esta en el catalogo se avisa y se salta. */
function repetirPedido(c, p){
  arrancarPedido(c, "pedido");
  const fuera = [];
  (p.lineas || []).forEach(l => {
    const prod = (S.catalogo || []).find(x => x.cod === l.cod);
    if (!prod || prod.visible === false){ fuera.push(l.nombre); return; }
    const cant = Math.max(1, parseInt(l.cant, 10) || 1);
    const precio = Math.round(Number(precioDe(prod)) * 100) / 100;
    S.carrito.push({cod: prod.cod, nombre: prod.nombre, unidad: prod.unidad || l.unidad || "UNIDAD",
                    cant: cant, precio: precio, total: dosDec(cant * precio)});
  });
  pintarCarro();
  if (fuera.length) nota("Ya no están en el catálogo: " + fuera.join(", "), true);
  if (!S.carrito.length) return alert("Ninguno de esos productos sigue en el catálogo.");
  hojaResumen();
}

    /* "Calle" marca el camino ADENTRO de la app, desde donde esta parado
       hasta esta tienda. "Navegar", el de arriba, lo saca a Google Maps.
       Solo sale si hay mapa vivo: desde la lista de clientes no hay donde
       dibujarlo. */
    (c.lat != null && mapaVive() ? b("c-calle", "〜", "Calle", "marcar") : "") +

function fotoDelCliente(c, e){
  const f = e.target.files && e.target.files[0];
  if (!f) return;
  const img = new Image();
  img.onload = async () => {
    const max = 640, esc = Math.min(1, max/Math.max(img.width, img.height));
    const cv = document.createElement("canvas");
    cv.width = Math.round(img.width*esc); cv.height = Math.round(img.height*esc);
    cv.getContext("2d").drawImage(img, 0, 0, cv.width, cv.height);
    const dato = cv.toDataURL("image/jpeg", 0.5);
    URL.revokeObjectURL(img.src);
    const ok = await guardarEn("clientes", () => db.collection("clientes").doc(c.id)
      .update({foto: dato}), null);
    if (ok){ c.foto = dato; hojaCliente(c); }
  };
  img.src = URL.createObjectURL(f);
}

/* ------------------- geocerca -------------------
   Handy valida la presencia con un radio alrededor del punto del cliente.
   Aqui va igual, con tres modos: apagado (como siempre), avisar (deja
   pasar pero pregunta y lo deja anotado) y bloquear (no abre la visita).

   Tres cuidados, porque esto le puede arruinar el dia a un vendedor:
   - Cliente sin coordenada: no hay contra que medir, pasa.
   - Sin senal de GPS: pasa. Bloquear a ciegas dejaria al vendedor
     parado en la tienda sin poder levantar el pedido.
   - Senal imprecisa: se le suma la imprecision al radio (hasta 150 m),
     para no castigar al que tiene mal GPS y si esta donde dice. */
function geocercaCfg(){
  const g = S.ajustes.geocerca || {};
  const m = Number(g.metros);
  return {modo: g.modo || "apagado", metros: (m > 0 ? m : 300)};
}
/* Devuelve null si puede entrar sin nota, el numero de metros si entra
   fuera del punto, y false si no debe abrirse. */
function chequeoGeocerca(c, lat, lng, ex){
  const g = geocercaCfg();
  if (g.modo === "apagado") return null;
  if (c.lat == null || lat == null) return null;
  const d = distMetros(lat, lng, c.lat, c.lng);
  if (d == null) return null;
  const holgura = Math.min(Math.max(Number(ex) || 0, 0), 150);
  if (d <= g.metros + holgura) return null;
  const donde = "Est\u00e1 a " + d + " metros del punto de " + c.nombre + ".";
  if (g.modo === "bloquear"){
    alert(donde + "\n\nLa visita se abre dentro de " + g.metros +
      " metros. Ac\u00e9rquese a la tienda.\n\nSi el punto del cliente est\u00e1 mal " +
      "puesto, av\u00edsele al supervisor para que lo corrija.");
    return false;
  }
  if (!confirm(donde + "\n\n\u00bfAbrir la visita de todos modos?\n\nQueda anotado " +
    "que se abri\u00f3 fuera del punto.")) return false;
  return d;
}

/* ------------------- visita cronometrada ------------------- */
function minutosDe(desde){
  const seg = Math.max(0, Math.round((Date.now() - desde)/1000));
  const m = Math.floor(seg/60), sg = seg % 60;
  return m + ":" + String(sg).padStart(2,"0");
}
// si alguien atiende sin haber abierto la visita, se abre sola:
// así la hora y la ubicación son las de verdad, no las que uno quiera
function asegurarVisita(c, luego){
  if (S.visita && S.visita.clienteId === c.id) return luego();
  if (S.visita && S.visita.clienteId !== c.id){
    if (!confirm("Tiene abierta la visita de " + S.visita.clienteNombre +
      ".\n\n¿La cierra y empieza con " + c.nombre + "?")) return;
    cerrarVisita();
  }
  const abrir = (lat, lng, ex) => {
    /* Tambien aqui: si no, bastaba con no abrir la visita y levantar el
       pedido directo para saltarse la geocerca. */
    const fuera = chequeoGeocerca(c, lat, lng, ex);
    if (fuera === false) return;
    S.visita = {clienteId:c.id, clienteNombre:c.nombre, inicio:Date.now(),
                lat:lat, lng:lng, exactitud:ex, automatica:true, fueraDelPunto:fuera};
    S.foto = null;
    pintarCrono();
    luego();
  };
  if (!navigator.geolocation) return abrir(null, null, null);
  navigator.geolocation.getCurrentPosition(
    pos => abrir(Math.round(pos.coords.latitude*1e6)/1e6,
                 Math.round(pos.coords.longitude*1e6)/1e6,
                 Math.round(pos.coords.accuracy)),
    () => abrir(null, null, null),
    {enableHighAccuracy:true, timeout:8000, maximumAge:20000});
}

function iniciarVisita(c, boton){
  if (S.rol === "despacho" || S.rol === "bodega") return;
  /* El reloj de la visita solo camina dentro de la jornada: ni antes de
     abrir, ni despues del cierre, ni con el dia ya terminado. */
  if (S.rol === "preventa" && diaCerrado())
    return alert("Ya cerró su día. Si necesita levantar otro pedido, hable con oficina.");
  if (S.rol === "preventa" && estaCerrado())
    return alert(motivoCierre() + ".\n\nLa visita se registra dentro de la jornada.");
  const txtBoton = boton ? boton.textContent : "";
  const soltar = () => { if (boton){ boton.disabled = false; boton.textContent = txtBoton; } };
  const abrir = (lat, lng, ex) => {
    const fuera = chequeoGeocerca(c, lat, lng, ex);
    if (fuera === false) return soltar();
    S.visita = {clienteId:c.id, clienteNombre:c.nombre, inicio:Date.now(), lat:lat, lng:lng,
                exactitud:ex, fueraDelPunto:fuera};
    S.foto = null;
    if (lat != null) reportarPosicion(lat, lng, ex, true);
    else if (posYo) reportarPosicion(posYo[0], posYo[1], 0, true);
    pintarCrono();
    hojaCliente(c);
  };
  if (!navigator.geolocation) return abrir(null, null, null);
  boton.disabled = true; boton.textContent = "Tomando ubicación…";
  navigator.geolocation.getCurrentPosition(pos => {
    abrir(Math.round(pos.coords.latitude*1e6)/1e6, Math.round(pos.coords.longitude*1e6)/1e6,
          Math.round(pos.coords.accuracy));
  }, () => abrir(null, null, null), {enableHighAccuracy:true, timeout:15000});
}
function cerrarVisita(){
  if (S.tempCrono){ clearInterval(S.tempCrono); S.tempCrono = null; }
  S.visita = null; S.foto = null;
  if (posYo) reportarPosicion(posYo[0], posYo[1], 0, true);
  pintarCrono();
}
/* De donde viene el vendedor. Se guarda en el telefono (no en la nube)
   porque solo lo necesita el propio aparato para medir el traslado al
   siguiente cliente, y asi aguanta que se recargue la app a media ruta. */
function ultimoCierre(){
  try {
    const d = JSON.parse(localStorage.getItem("preventa_ultimo_cierre") || "null");
    return d && d.fecha === hoyISO() ? d : null;   // de ayer no sirve
  } catch(_){ return null; }
}
function anotarCierre(cliente){
  try {
    localStorage.setItem("preventa_ultimo_cierre", JSON.stringify({
      fecha: hoyISO(), cuando: Date.now(),
      clienteId: cliente.id, clienteNombre: cliente.nombre || "",
      lat: cliente.lat != null ? cliente.lat : null,
      lng: cliente.lng != null ? cliente.lng : null
    }));
  } catch(_){}
}

function datosVisita(cliente){
  if (!S.visita || S.visita.clienteId !== cliente.id) return {};
  const d = {
    inicio: new Date(S.visita.inicio).toISOString(),
    duracionSeg: Math.round((Date.now() - S.visita.inicio)/1000)
  };
  if (S.visita.lat != null){
    d.lat = S.visita.lat; d.lng = S.visita.lng; d.exactitud = S.visita.exactitud;
    if (cliente.lat != null) d.metrosDelCliente = distMetros(S.visita.lat, S.visita.lng, cliente.lat, cliente.lng);
  }
  /* Cuanto se tardo en llegar desde el cliente anterior, y de cual venia.
     Oficina ya lo puede calcular de las horas, pero guardarlo aqui le
     agrega la distancia y aguanta las visitas a las que les falte la
     hora del servidor. El primer cliente del dia no lleva traslado: no
     hay de donde saber a que hora salio de su casa. */
  const ant = ultimoCierre();
  if (ant && ant.clienteId !== cliente.id){
    d.trasladoSeg = Math.max(0, Math.round((S.visita.inicio - ant.cuando)/1000));
    d.desdeClienteId = ant.clienteId;
    d.desdeClienteNombre = ant.clienteNombre;
    if (ant.lat != null && cliente.lat != null)
      d.trasladoMetros = distMetros(ant.lat, ant.lng, cliente.lat, cliente.lng);
  }
  if (S.foto) d.foto = S.foto;
  if (S.visita.automatica) d.visitaAutomatica = true;
  if (S.visita.fueraDelPunto != null) d.fueraDelPunto = S.visita.fueraDelPunto;
  return d;
}
function pintarCrono(){
  let el = $("#crono");
  if (!S.visita){ if (el) el.remove(); return; }
  if (!el){
    el = document.createElement("div");
    el.className = "crono"; el.id = "crono";
    document.body.appendChild(el);
  }
  const pinta = () => {
    if (!S.visita) return;
    const dentro = $("#c-crono");
    if (dentro) dentro.textContent = minutosDe(S.visita.inicio);
    el.innerHTML = '<div><span class="eyebrow">Visita en curso</span>' +
      '<b>' + escapar(S.visita.clienteNombre) + ' · ' + minutosDe(S.visita.inicio) + '</b></div>' +
      '<button id="cr-cancelar">Cancelar</button>';
    $("#cr-cancelar").onclick = () => {
      if (confirm("¿Cancelar la visita? No queda registrada.")) cerrarVisita();
    };
  };
  pinta();
  pintarCarro();
  if (S.tempCrono) clearInterval(S.tempCrono);
  S.tempCrono = setInterval(pinta, 1000);
}

/* --- evidencia con foto --- */
function bloqueFoto(){
  return '<div class="eyebrow" style="margin-top:16px">Evidencia (opcional)</div>' +

      : '<label class="btn linea" style="margin-top:8px;display:block;text-align:center">Tomar foto' +
        '<input id="f-input" type="file" accept="image/*" capture="environment" style="display:none"></label>');
}
function cablearFoto(volverA){
  if ($("#f-quitar")) $("#f-quitar").onclick = () => { S.foto = null; volverA(); };
  if (!$("#f-input")) return;
  $("#f-input").onchange = e => {
    const f = e.target.files && e.target.files[0];
    if (!f) return;
    const img = new Image();
    img.onload = () => {
      const max = 520, esc = Math.min(1, max/Math.max(img.width, img.height));
      const cv = document.createElement("canvas");
      cv.width = Math.round(img.width*esc); cv.height = Math.round(img.height*esc);
      cv.getContext("2d").drawImage(img, 0, 0, cv.width, cv.height);
      S.foto = cv.toDataURL("image/jpeg", 0.55);
      URL.revokeObjectURL(img.src);
      volverA();
    };
    img.src = URL.createObjectURL(f);
  };
}

/* ------------------- pedido en curso ------------------- */
function arrancarPedido(c, tipo){
  // levantar pedidos es del preventa; bodega y reparto no venden
  if (S.rol === "despacho" || S.rol === "bodega") return;
  if (tipo !== "cambio") S.motivo = null;
  S.notaGuardada = "";
  /* S.editando se limpia SIEMPRE que se arranca un pedido nuevo. Si
     quedaba pegado de una edición que se abandonó tocando el fondo
     (cerrarHoja no lo toca, a propósito: "Salir" es el único que
     pregunta), guardarPedido() lo usaba para borrar el pedido VIEJO
     -de OTRO cliente- al guardar este. Un pedido real desaparecía sin
     aviso. */
  S.editando = null;
  S.cliente = c; S.tipoDoc = tipo || "pedido"; S.carrito = [];
  cerrarHoja(); irA("catalogo");
}
function soltarCliente(){
  if (S.carrito.length && !confirm("Va a salirse del pedido y se pierde lo que lleva. ¿Sigue?")) return;
  S.cliente = null; S.carrito = []; S.editando = null; S.notaGuardada = "";
  pintarCarro(); pintarLista(); irA("ruta");
}
/* El total del pedido = suma de los totales de linea YA redondeados, igual
   que totalEntrega(). Si aqui se redondeara la suma cruda, pedidos.total y
   pedidos.totalEntregado podrian salir con un centavo de diferencia en el
   MISMO pedido, entregado completo y sin cambiarle nada. Hoy da igual
   porque las cantidades son enteras; es blindaje para cuando entren
   cantidades fraccionadas (queso por libra) o precios de tres decimales. */
function totalCarrito(){
  return dosDec(S.carrito.reduce((a,l) => a + dosDec(l.cant * l.precio), 0));
}

function cablearPedido(prod, piso){
  if (!S.cliente) return;
  const cant = $("#q-cant"), pre = $("#q-precio"), av = $("#q-aviso"), tot = $("#q-total");
  const PASO = 0.05;
  /* Sin piso conocido (el catalogo no trae precioMin y en el telefono del
     vendedor no hay costos) NO se rebaja: el tope es el precio de lista.
     Antes el tope caia a un centavo y se podia vender a $0.01. */
  const tope = piso != null ? piso : (Number(prod.precio) || 0.01);
  const fijar = v => { pre.value = (Math.round(v*100)/100).toFixed(2); };
  const calc = () => {
    const q = Math.max(0, parseInt(cant.value) || 0);
    const v = parseFloat(pre.value);
    tot.textContent = money(q * (isNaN(v) ? 0 : v));
    const notas = [];
    if (piso && !isNaN(v) && v < piso) notas.push("Ese precio baja del mínimo de " + money(piso) + ".");
    const d = existAvisable(prod.cod);
    if (d != null && q > d) notas.push("Está pidiendo " + q + " y en bodega hay " + d + ".");
    if (notas.length){ av.className = "aviso"; av.innerHTML = notas.join("<br>"); }
    else av.classList.add("oculto");
    if (notas.length) av.classList.remove("oculto");
  };
  cant.addEventListener("input", calc);
  pre.addEventListener("input", calc);
  pre.addEventListener("blur", () => {
    const v = parseFloat(pre.value);
    if (isNaN(v)) return fijar(prod.precio);
    if (v < tope) fijar(tope);
    calc();
  });
  $("#q-menos").onclick = () => { cant.value = Math.max(0, (parseInt(cant.value)||0) - 1); calc(); };
  $("#q-mas").onclick   = () => { cant.value = (parseInt(cant.value)||0) + 1; calc(); };
  $("#q-pmenos").onclick = () => {
    const v = parseFloat(pre.value); const act = isNaN(v) ? prod.precio : v;
    if (act - PASO < tope - 0.001){
      fijar(tope);
      av.className = "aviso dato"; av.classList.remove("oculto");
      av.innerHTML = "Hasta ahí llega. " + money(tope) + " es el precio mínimo de este producto.";
    } else fijar(act - PASO);
    calc();
  };
  $("#q-pmas").onclick = () => {
    const v = parseFloat(pre.value); const act = isNaN(v) ? prod.precio : v;
    fijar(act + PASO); calc();
  };
  if ($("#q-ver")) $("#q-ver").onclick = () => { cerrarHoja(); hojaResumen(); };
  calc();
  $("#q-agregar").onclick = () => {
    const q = Math.max(0, parseInt(cant.value) || 0);
    const v = dosDec(parseFloat(pre.value));
    if (!q) return alert("Ponga una cantidad.");
    if (!v || v <= 0) return alert("Ponga el precio.");
    if (piso && v < piso - 0.001)
      return alert("Ese precio queda abajo del mínimo de " + money(piso) + ".\n\nSúbalo o consulte con la oficina.");
    const i = S.carrito.findIndex(l => l.cod === prod.cod);
    /* La unidad se copia a la linea igual que el precio: si manana cambia en
       el catalogo, el pedido de hoy sigue diciendo lo que se vendio hoy. */
    const linea = {cod:prod.cod, nombre:prod.nombre, cat:prod.cat||"", unidad: prod.unidad || "UNIDAD",
      cant:q, precio:v, total:dosDec(q*v)};
    if (i >= 0) S.carrito[i] = linea; else S.carrito.push(linea);
    cerrarHoja(); pintarCarro();
  };
}

  $("#hoja-cuerpo").innerHTML =

      ' · ' + escapar(S.cliente.codigo || "") + '</div>' +
    '<h2>' + escapar(S.cliente.nombre) + '</h2>' +
    '<div id="r-lineas" style="margin-top:14px"></div>' +
    '<div class="meta-cifras" style="margin-top:14px">' +
      '<span class="eyebrow">Total</span><b class="num" style="font-size:29px">' + money(totalCarrito()) + '</b>' +
    '</div>' +
    '<label class="campo"><span>Nota para bodega (opcional)</span><input id="r-nota" type="text" ' +
      'value="' + escapar(S.notaGuardada || "") + '" placeholder="Ej: entregar por la mañana"></label>' +
    bloqueFoto() +
    '<button class="btn" id="r-guardar" style="margin-top:16px">' +
      (S.editando ? "Guardar los cambios" : "Guardar " + titulo.toLowerCase()) + '</button>' +
    '<button class="btn secundario" id="r-seguir" style="margin-top:9px">Seguir agregando</button>' +
    '<div class="conteo" style="text-align:center;margin-top:10px">Se entrega el ' +
      fechaBonita(fechaEntregaDe(hoyISO())) + '</div>' +
    (S.editando ?
      '<div class="fila" style="margin-top:9px">' +
        '<button class="btn linea" id="r-borrar" style="color:var(--rojo);border-color:var(--rojo)">Eliminar</button>' +
      '</div>' : '');
  const cont = $("#r-lineas");
  if (!S.carrito.length) cont.innerHTML = '<p style="color:var(--tenue);font-size:14px">Todavía no hay productos.</p>';
  S.carrito.forEach((l, i) => {
    const prod = S.catalogo.find(x => x.cod === l.cod);
    const piso = prod ? pisoDe(prod) : null;
    const d = document.createElement("div");
    d.className = "lin";
    d.innerHTML =
      '<div style="flex:1;min-width:0">' +
        '<div class="n">' + escapar(l.nombre) + '</div>' +
        '<div class="lin-ctrl">' +
          '<button class="menos">−</button>' +
          '<input class="cant" type="number" inputmode="numeric" min="1" step="1" value="' + l.cant + '">' +
          '<button class="mas">+</button>' +
          '<span class="por">×</span>' +
          '<button class="pmenos">−</button>' +
          '<input class="pre" type="number" inputmode="decimal" step="0.01" value="' + l.precio.toFixed(2) + '">' +
          '<button class="pmas">+</button>' +
          (piso ? '<span class="tope-min">no baja de ' + money(piso) + '</span>' : '') +
        '</div>' +
      '</div>' +
      '<div class="t"><b class="num tot">' + money(l.total) + '</b>' +
      '<div class="quitar">Quitar</div></div>';

    const iC = d.querySelector(".cant"), iP = d.querySelector(".pre"), iT = d.querySelector(".tot");
    const tope = piso != null ? piso : (Number(l.precio) || 0.01);
    const refrescar = (guardar) => {
      let q = Math.max(1, parseInt(iC.value) || 1);
      let v = parseFloat(iP.value);
      if (isNaN(v) || v <= 0) v = l.precio;
      if (v < tope - 0.001) v = tope;
      v = Math.round(v*100)/100;
      iC.value = q; iP.value = v.toFixed(2);
      iT.textContent = money(q*v);
      if (guardar){
        S.carrito[i] = Object.assign({}, l, {cant:q, precio:v, total:dosDec(q*v)});
        const t = $("#hoja-cuerpo .meta-cifras b");
        if (t) t.textContent = money(totalCarrito());
        pintarCarro();
      }
    };
    iC.addEventListener("input", () => refrescar(true));
    iP.addEventListener("input", () => { iT.textContent = money((parseInt(iC.value)||1) * (parseFloat(iP.value)||0)); });
    iP.addEventListener("blur", () => refrescar(true));
    d.querySelector(".menos").onclick = () => { iC.value = Math.max(1,(parseInt(iC.value)||1)-1); refrescar(true); };
    d.querySelector(".mas").onclick   = () => { iC.value = (parseInt(iC.value)||1)+1; refrescar(true); };
    d.querySelector(".pmenos").onclick = () => {
      const v = (parseFloat(iP.value)||l.precio) - 0.05;
      if (v < tope - 0.001){ iP.value = tope.toFixed(2); alert("Hasta ahí llega. " + money(tope) + " es el mínimo."); }
      else iP.value = v.toFixed(2);
      refrescar(true);
    };
    d.querySelector(".pmas").onclick = () => {
      iP.value = ((parseFloat(iP.value)||l.precio) + 0.05).toFixed(2); refrescar(true);
    };
    d.querySelector(".quitar").onclick = () => { S.carrito.splice(i,1); pintarCarro(); hojaResumen(); };
    cont.appendChild(d);
  });
  cablearFoto(hojaResumen);
  $("#r-seguir").onclick = cerrarHoja;
  if ($("#r-borrar")) $("#r-borrar").onclick = async () => {
    const viejo = S.pedidosHoy.find(x => x.id === S.editando);
    if (!viejo) return;
    if (!confirm("¿Eliminar este " + titulo.toLowerCase() + " de " + money(viejo.total) + "?\n\nNo se puede deshacer.")) return;
    const ok = await borrarPedido(viejo, $("#r-borrar"));
    if (!ok) return;
    S.cliente = null; S.carrito = []; S.editando = null; S.notaGuardada = "";
    cerrarHoja(); pintarCarro(); irA("ruta");
  };
  $("#r-guardar").onclick = guardarPedido;
  $("#fondo").classList.add("abierto"); $("#hoja").classList.add("abierta");
}

async function guardarPedido(){
  if (!S.carrito.length) return alert("El pedido está vacío.");
  /* Fuera de horario el pedido no se pierde: entra como ADICIONAL,
     en sala de espera. Manana oficina lo aprueba y recien ahi baja
     al camion y a las hojas. */
  const adicional = estaCerrado() && S.rol === "preventa";
  const b = $("#r-guardar");
  b.disabled = true; b.textContent = "Guardando…";
  const total = totalCarrito();
  /* Se llama notaBodega y NO nota: `nota` es la funcion que avisa en
     pantalla, y una constante con el mismo nombre la tapaba. Cuando la
     visita no se podia anotar, nota(...) reventaba con "nota is not a
     function", el error subia al catch de afuera y el vendedor veia
     "No se pudo guardar" con el pedido YA guardado: lo mandaba otra vez
     y salia duplicado. */
  const notaBodega = ($("#r-nota") && $("#r-nota").value.trim()) || "";
  let sinSenal = false;
  let comprobante = null;
  try {
    const extra = datosVisita(S.cliente);
    const cli = S.cliente;
    const armar = adic => ({
      tipo: S.tipoDoc, fecha: hoyISO(), mes: mesISO(),
      estado: adic ? "adicional" : "pendiente",
      adicional: adic || false,
      fechaEntrega: adic ? null : fechaEntregaDe(hoyISO()),
      preventaUid: S.usuario.uid, preventaNombre: S.nombre,
      sectorId: S.cliente.sectorId || S.sectorSel,
      clienteId: S.cliente.id, clienteNombre: S.cliente.nombre, clienteCodigo: S.cliente.codigo || "",
      clienteTelefono: S.cliente.telefono || "", clienteDireccion: S.cliente.direccion || "",
      lineas: S.carrito, total: total,
      nota: (adic ? "PEDIDO ADICIONAL fuera del horario laboral. " : "") + notaBodega,
      motivo: S.motivo || "",
      creado: firebase.firestore.FieldValue.serverTimestamp()
    });
    /* Si el reloj del telefono y el del servidor no coinciden, el pedido NO
       se pierde: se vuelve a mandar como adicional y queda en espera. */
    /* Sin senal, Firestore guarda en el telefono y la promesa no contesta
       hasta que el servidor confirme: el boton se quedaba en "Guardando..."
       para siempre y el vendedor volvia a mandar el pedido. Ahora se espera
       unos segundos; si no contesta, el pedido ya quedo en el telefono y
       sube solo cuando vuelva la senal. */
    let ref;
    try {
      ref = db.collection("pedidos").doc();
      sinSenal = await esperarEscritura(ref.set(armar(adicional)));
    } catch(err){
      if (err.code !== "permission-denied" || adicional || S.rol !== "preventa") throw err;
      ref = db.collection("pedidos").doc();
      sinSenal = await esperarEscritura(ref.set(armar(true)));
      try { ref._adicional = true; } catch(x){}
      alert("Para el servidor la jornada ya cerró, así que el pedido quedó como ADICIONAL.\n\n" +
            "No se perdió: oficina lo aprueba y ahí baja al camión.");
    }
    /* ---- De aqui para abajo, el pedido YA ESTA GUARDADO ----
       Lo que sigue es la visita, que es el registro de que se paso por la
       tienda. Si la visita falla, el pedido no se deshace: no se puede
       borrar de vuelta y tampoco conviene. Por eso este pedazo va en su
       propio try y NUNCA tumba el guardado. Antes iba junto, y fuera de
       hora el vendedor veia "no se dejo guardar" con el pedido adentro:
       lo levantaba otra vez y quedaba duplicado. */
    const fueAdicional = adicional || (ref && ref._adicional === true);
    /* Lo que se le ensena al cliente al terminar: se arma ANTES de vaciar
       el carrito. */
    comprobante = {
      id: ref.id, cliente: cli, lineas: S.carrito.map(l => Object.assign({}, l)), total: total,
      fechaEntrega: fueAdicional ? null : fechaEntregaDe(hoyISO()), adicional: fueAdicional,
      editado: !!S.editando
    };
    try {
      const previa = visitaDe(S.cliente.id);
      if (previa && previa.resultado !== "pedido"){
        // habia quedado como no compro y al final si compro: se corrige
        await esperarEscritura(db.collection("visitas").doc(previa.id).update({
          resultado: "pedido", monto: total, pedidoId: ref.id,
          corregida: true, adicional: fueAdicional || false
        }));
      } else if (!previa){
        await esperarEscritura(db.collection("visitas").doc().set(Object.assign({
          fecha: hoyISO(), mes: mesISO(), preventaUid: S.usuario.uid, preventaNombre: S.nombre,
          /* El sector es el DEL CLIENTE, no el chip seleccionado: desde
             "Cercanos" o el buscador se abre gente de otro sector. */
          sectorId: S.cliente.sectorId || S.sectorSel, clienteId: S.cliente.id,
          clienteNombre: S.cliente.nombre, clienteCodigo: S.cliente.codigo || "",
          resultado: "pedido", monto: total, pedidoId: ref.id,
          adicional: fueAdicional || false,
          creado: firebase.firestore.FieldValue.serverTimestamp()
        }, extra)));
      }
      anotarCierre(cli);   // desde aqui se cuenta el traslado al que sigue
    } catch(ev){
      /* El pedido esta bien; solo se perdio la marca de la visita. Se
         avisa sin alarmar y SIN mandarlo a guardar de nuevo. */
      console.warn("visita no guardada", ev && (ev.code || ev.message));
      nota("El pedido qued\u00f3 guardado. La visita no se pudo anotar.");
    }
    /* La existencia ya NO baja al levantar el pedido. Un pedido es una
       promesa, no una salida: el producto sigue en el estante hasta que
       el motorista lo entrega. De eso se encarga movimientosDeEntrega(), y
       la escritura va dentro del lote de cerrarEntrega(). */
    if (false){
    }
  } catch(e){
    b.disabled = false; b.textContent = "Guardar";
    return alert(e.code === "permission-denied"
      ? "El servidor no dejó guardar el pedido.\n\nCasi siempre es la hora. El que manda " +
        "es el reloj del servidor, que va de las " + JORNADA_SERVIDOR +
        " (las horas de Ajustes solo apagan botones aquí).\n\n" +
        "Si no es eso, avísele a quien lleva el sistema."
      : "No se pudo guardar: " + (e.code || e.message));
  }
  if (S.editando){
    /* El viejo tiene que ser del MISMO cliente que se acaba de guardar.
       Es un segundo candado, no el único: arrancarPedido() ya limpia
       S.editando al arrancar un pedido nuevo. Pero si algún otro camino
       llega aquí con S.editando pegado de otro cliente, esto evita
       borrar un pedido real ajeno en vez del que de verdad se corrigió. */
    const viejo = S.pedidosHoy.find(x => x.id === S.editando && x.clienteId === S.cliente.id);
    /* Si el viejo no se deja borrar, se avisa: si no, quedan dos pedidos
       y la app ya olvido que estaba editando. */
    if (viejo && (await borrarPedido(viejo, null)) === false){
      alert("El pedido corregido quedó guardado, pero el anterior no se pudo borrar.\n\n" +
            "Bórrelo desde «Lo de hoy» para que no salga dos veces.");
    }
    S.editando = null;
  }
  S.cliente = null; S.carrito = []; S.notaGuardada = "";
  cerrarVisita(); pintarCarro(); irA("ruta");
  if (comprobante) hojaComprobantePedido(comprobante); else cerrarHoja();
  if (sinSenal) nota("Sin señal: el pedido quedó guardado en el teléfono y sube solo cuando vuelva la señal. No lo mande otra vez.");
}

/* ===== El comprobante que se le ensena al cliente =====
   Antes el pedido se guardaba en silencio y la app volvia a la ruta: el
   cliente no veia ni el total ni cuando le llega. Ahora queda una hoja con
   lo pedido, el total, la fecha de entrega y un boton para mandarselo por
   WhatsApp. */
function hojaComprobantePedido(cp){
  const c = cp.cliente || {};
  const lineas = cp.lineas || [];
  const cuando = cp.adicional
    ? "Queda en espera: oficina lo aprueba y le avisa cuándo llega."
    : "Se entrega el " + fechaBonita(cp.fechaEntrega);
  const texto = empNombre() + " · " + (cp.editado ? "Pedido corregido" : "Pedido") + " " + fechaBonita(hoyISO()) + "\n" +
    (c.nombre || "") + (c.codigo ? " (" + c.codigo + ")" : "") + "\n\n" +
    lineas.map(l => l.cant + " × " + l.nombre + " — " + money(l.total)).join("\n") +
    "\n\nTotal: " + money(cp.total) + "\n" + cuando + "\nVendedor: " + (S.nombre || "");
  const tel = String(c.telefono || "").replace(/\D/g, "");
  const wa = tel ? "https://wa.me/" + (tel.length === 8 ? "503" + tel : tel) + "?text=" + encodeURIComponent(texto) : "";
  $("#hoja-cuerpo").innerHTML =
    '<div class="eyebrow">' + (cp.editado ? "Pedido corregido" : "Pedido guardado") + ' · ' + escapar(c.codigo || "") + '</div>' +
    '<h2>' + escapar(c.nombre || "") + '</h2>' +
    '<div class="aviso bien" style="margin-top:10px">' + escapar(cuando) + '</div>' +
    '<div style="margin-top:10px">' +
      lineas.map(l => '<div class="lin"><div style="flex:1;min-width:0"><div class="n">' + escapar(l.nombre) + '</div>' +
        '<div class="d">' + l.cant + ' × ' + money(l.precio) + '</div></div>' +
        '<div class="t"><b class="num">' + money(l.total) + '</b></div></div>').join("") +
    '</div>' +
    '<div class="cifra-tot"><span class="eyebrow">Total</span><b class="num">' + money(cp.total) + '</b></div>' +
    (wa ? '<a class="btn" href="' + wa + '" target="_blank" rel="noopener" style="display:block;text-align:center;margin-top:14px">Mandar por WhatsApp</a>' : '') +
    '<button class="btn secundario" id="cp-copiar" style="margin-top:9px">Copiar el texto</button>' +
    '<button class="btn' + (wa ? ' secundario' : '') + '" id="cp-listo" style="margin-top:9px">Listo</button>';
  $("#fondo").classList.add("abierto"); $("#hoja").classList.add("abierta");
  $("#cp-listo").onclick = cerrarHoja;
  $("#cp-copiar").onclick = () => {
    try { navigator.clipboard.writeText(texto).then(() => nota("Copiado.")); }
    catch(e){ alert(texto); }
  };
}

/* ------------------- exportar ------------------- */
function bajarCSV(pedidos){
  const esc = t => '"' + String(t == null ? "" : t).replace(/"/g,'""') + '"';
  const filas = [["Fecha del pedido","Hora","Tipo","Estado","Preventista","Fecha de entrega","Motorista",
                  "Codigo cliente","Cliente","Telefono","Codigo producto","Producto",
                  "Cantidad pedida","Cantidad entregada","Precio","Total linea pedido","Total linea entregado",
                  "Total pedido","Total entregado","Forma de pago","Estado del pago","Nota"]];
  pedidos.forEach(p => {
    const cli = S.clientes.find(x => x.id === p.clienteId) || {};
    const hora = tbHora(tbMs(p.creado));
    const pago = p.pago || {};
    (p.lineas||[]).forEach(l => {
      const entregada = l.entregado != null ? l.entregado : "";
      const totalEnt = l.entregado != null ? dosDec(l.entregado * l.precio) : "";
      filas.push([p.fecha, hora, p.tipo, p.estado, p.preventaNombre, p.fechaEntrega || "",
                  p.entregadoPorNombre || "", p.clienteCodigo, p.clienteNombre, cli.telefono || "",
                  l.cod, l.nombre, l.cant, entregada, l.precio, l.total, totalEnt,
                  p.total, p.totalEntregado != null ? p.totalEntregado : "",
                  pago.metodo || "", pago.estado || "", p.nota || ""]);
    });
  });
  const txt = "\uFEFF" + filas.map(f => f.map(esc).join(";")).join("\r\n");
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([txt], {type:"text/csv;charset=utf-8"}));
  const nombre = pedidosFiltro === "hoy" ? hoyISO() : pedidosFiltro === "mes" ? mesISO()
    : pedidosDesde + "_a_" + pedidosHasta;
  a.download = "pedidos-" + nombre + ".csv";
  a.click();
}

/* ===== Respaldo completo del sistema =====
   Brayan, 4 sep 2026: si algun dia toca dejar D'Preventa o cambiar de
   sistema, hoy los datos se quedan atrapados adentro. Este boton baja
   TODO en un solo archivo: cada coleccion de Firestore, tal cual esta.
   Lee la base completa -no hay forma de evitarlo, es un respaldo- asi
   que solo se usa cuando de verdad hace falta, nunca de rutina.
   No incluye contrasenas ni cuentas de acceso: esas viven en Firebase
   Authentication, aparte, y no se pueden leer desde aqui. */
const RESPALDO_COLECCIONES = ["clientes","sectores","usuarios","pedidos","entregas","visitas",
  "jornadas","existencias","cargos","agenda","metas","foco","comisiones","contadores",
  "bloqueados","preciosCliente","listas","motivos","posiciones","bodegaDia","movimientos","porFacturar"];
const RESPALDO_CONFIG = ["ajustes","catalogo","catalogoGeo","comisiones","costos"];
async function respaldoCompleto(boton){
  if (!confirm("Esto descarga TODOS los datos del sistema en un solo archivo: clientes, pedidos, " +
    "entregas, visitas, existencias, cuentas, rutas y lo demas.\n\nLee la base completa, asi que " +
    "puede tardar y usa muchas lecturas de Firestore. Hagalo solo cuando de verdad lo necesite " +
    "(un respaldo o una migracion), no de rutina.\n\n\u00bfSigue?")) return;
  const antes = boton.textContent;
  boton.disabled = true;
  try {
    const colecciones = {};
    for (const col of RESPALDO_COLECCIONES){
      boton.textContent = "Leyendo " + col + "\u2026";
      const q = await db.collection(col).get();
      anotarLectura("respaldo: " + col, q);
      colecciones[col] = q.docs.map(d => Object.assign({id:d.id}, d.data()));
    }
    const configuracion = {};
    for (const doc of RESPALDO_CONFIG){
      boton.textContent = "Leyendo configuraci\u00f3n\u2026";
      const d = await db.collection("configuracion").doc(doc).get();
      S.lecturas = S.lecturas || {};
      S.lecturas["respaldo: configuracion/" + doc] = (S.lecturas["respaldo: configuracion/" + doc] || 0) + 1;
      if (d.exists) configuracion[doc] = d.data();
    }
    const paquete = {
      generado: new Date().toISOString(), generadoPor: S.nombre,
      nota: "No incluye contrase\u00f1as ni cuentas de acceso: eso vive en Firebase Authentication, aparte.",
      colecciones: colecciones, configuracion: configuracion
    };
    const txt = JSON.stringify(paquete, null, 1);
    const a = document.createElement("a");
    a.href = URL.createObjectURL(new Blob([txt], {type:"application/json;charset=utf-8"}));
    a.download = "respaldo-" + empNombre().toLowerCase().replace(/[^a-z0-9]+/g, "-")
      .replace(/^-|-$/g, "") + "-" + hoyISO() + ".json";
    a.click();
    boton.textContent = "Listo, se descarg\u00f3";
    setTimeout(() => { boton.disabled = false; boton.textContent = antes; }, 2500);
  } catch(e){
    boton.disabled = false; boton.textContent = antes;
    alert("No se pudo hacer el respaldo (" + (e.code||e.message) + ").");
  }
}

async function borrarPedido(ped, boton){
  const ok = await guardarEn("pedidos", async () => {
    /* Nada que devolver: al pedido nunca se le descontó existencia. */
    if (false){
    }
    await db.collection("pedidos").doc(ped.id).delete();
  }, boton);
  if (!ok) return false;
  const quedan = S.pedidosHoy.filter(x => x.clienteId === ped.clienteId && x.id !== ped.id);
  const v = S.visitasHoy.find(x => x.clienteId === ped.clienteId);
  if (v && !quedan.length){
    await db.collection("visitas").doc(v.id).delete().catch(()=>{});
  } else if (v && quedan.length){
    await db.collection("visitas").doc(v.id)
      .update({monto: quedan.reduce((a,x) => a + (Number(x.total)||0), 0)}).catch(()=>{});
  }
  return true;
}

/* ================= La firma de quien recibe =================
   Hasta hoy la firma solo existia en el ticket IMPRESO: en pantalla no habia
   donde firmar. Se guarda en el documento de la ENTREGA, no en el del pedido,
   porque la regla de pedidos trae lista blanca de campos y un campo nuevo ahi
   haria rebotar la entrega entera con permission-denied. */
function bloqueFirma(){
  if (S.firma && !S.firmaAbierta){
    return '<div class="firma-hecha">' +
      '<img src="' + S.firma + '" alt="Firma de quien recibe">' +
      '<span>Firmado</span>' +
      '<button type="button" class="f-borrar" id="fi-borrar" ' +
        'style="font:inherit;font-size:12.5px;font-weight:800;background:none;border:0;' +
        'color:var(--rojo);padding:5px 9px">Borrar</button>' +
    '</div>';
  }
  if (!S.firmaAbierta) return "";
  return '<div class="firma-caja">' +
      '<canvas id="fi-lienzo"></canvas>' +
      '<div class="firma-pie">' +
        '<small>Que firme el cliente con el dedo</small>' +
        '<button type="button" class="f-borrar" id="fi-borrar">Borrar</button>' +
        '<button type="button" class="f-listo" id="fi-listo">Listo</button>' +
      '</div>' +
    '</div>';
}

function cablearFirma(volverA){
  const bt = $("#e-firma");
  if (bt) bt.onclick = () => { S.firmaAbierta = !S.firmaAbierta; volverA(); };
  const bo = $("#fi-borrar");
  if (bo) bo.onclick = () => { S.firma = null; S.firmaAbierta = true; volverA(); };
  const li = $("#fi-listo");
  if (li) li.onclick = () => { S.firmaAbierta = false; volverA(); };

  const c = $("#fi-lienzo");
  if (!c) return;
  /* El lienzo se vuelve a crear en cada repintado (la hoja se repinta con
     cada toque en un producto), asi que lo trazado se guarda en S.firma y
     se vuelve a dibujar aqui. Si no, la firma se borraria sola. */
  const r = c.getBoundingClientRect();
  const dpr = window.devicePixelRatio || 1;
  c.width = Math.max(1, Math.round(r.width * dpr));
  c.height = Math.max(1, Math.round(r.height * dpr));
  const x = c.getContext("2d");
  x.scale(dpr, dpr);
  x.lineWidth = 2.2; x.lineCap = "round"; x.lineJoin = "round"; x.strokeStyle = "#131826";
  if (S.firma){
    const im = new Image();
    im.onload = () => { try { x.drawImage(im, 0, 0, r.width, r.height); } catch(e){} };
    im.src = S.firma;
  }
  let trazando = false, px = 0, py = 0;
  const donde = e => { const b = c.getBoundingClientRect(); return [e.clientX - b.left, e.clientY - b.top]; };
  const guardar = () => {
    /* Se guarda chico a proposito: la firma viaja dentro del documento de la
       entrega, y Firestore no admite documentos de mas de 1 MB. */
    const g = document.createElement("canvas");
    g.width = 560; g.height = Math.round(560 * (r.height / Math.max(1, r.width)));
    const gx = g.getContext("2d");
    gx.fillStyle = "#fff"; gx.fillRect(0, 0, g.width, g.height);
    gx.drawImage(c, 0, 0, g.width, g.height);
    S.firma = g.toDataURL("image/png");
  };
  c.addEventListener("pointerdown", e => {
    trazando = true; const p = donde(e); px = p[0]; py = p[1];
    try { c.setPointerCapture(e.pointerId); } catch(_){}
  });
  c.addEventListener("pointermove", e => {
    if (!trazando) return;
    const p = donde(e);
    x.beginPath(); x.moveTo(px, py); x.lineTo(p[0], p[1]); x.stroke();
    px = p[0]; py = p[1];
  });
  c.addEventListener("pointerup", () => { if (trazando){ trazando = false; guardar(); } });
  c.addEventListener("pointercancel", () => { if (trazando){ trazando = false; guardar(); } });
}

function hojaEntrega(ped, cliente){
  S.foto = null; S.firma = null; S.firmaAbierta = false;
  const pinta = () => {
    /* Cada linea con los tres botones de Handy: completo, parcial o no se
       entrego. Al elegir "parcial" se abre el contador de siempre, que es
       lo unico que Handy hace con una pantalla aparte. */
    const filas = ped.lineas.map((l, i) => {
      const q = l.entregado != null ? l.entregado : l.cant;
      const modo = q === l.cant ? "completo" : (q === 0 ? "nada" : "parcial");
      return '<div class="e-lin">' +
        '<div class="e-cab">' +
          '<div style="flex:1;min-width:0">' +
            '<div class="e-nom">' + escapar(l.nombre) + '</div>' +
            '<div class="e-cod">' + escapar(l.cod || "") + '</div>' +
          '</div>' +
          '<span class="e-pza">' + l.cant + ' ' + escapar(l.unidad || "UNIDAD") + '</span>' +
        '</div>' +
        '<div class="e-ops">' +
          '<button class="e-op" data-i="' + i + '" data-m="completo" aria-pressed="' + (modo === "completo") + '">Completo</button>' +
          '<button class="e-op" data-i="' + i + '" data-m="parcial" aria-pressed="' + (modo === "parcial") + '">Parcial</button>' +
          '<button class="e-op" data-i="' + i + '" data-m="nada" aria-pressed="' + (modo === "nada") + '">No se entregó</button>' +
        '</div>' +
        '<div class="lin-ctrl' + (modo === "parcial" ? "" : " oculto") + '" data-ctrl="' + i + '">' +
          '<button class="e-menos" data-i="' + i + '">&minus;</button>' +
          '<input class="e-cant" data-i="' + i + '" type="number" inputmode="numeric" min="0" ' +
            'max="' + l.cant + '" value="' + q + '">' +
          '<button class="e-mas" data-i="' + i + '">+</button>' +
          '<span class="tope-min">de ' + l.cant + '</span>' +
          '<b class="num e-tot" data-i="' + i + '" style="margin-left:auto">' + money(q * l.precio) + '</b>' +
        '</div>' +
      '</div>';
    }).join("");
    /* El resumen de arriba: cuantas piezas de cuantas y cuantos productos,
       igual que el renglon que Handy pone bajo el titulo. */
    const pzasTot = ped.lineas.reduce((a,l) => a + (Number(l.cant)||0), 0);
    const pzasVan = ped.lineas.reduce((a,l) => a + (l.entregado != null ? Number(l.entregado) : Number(l.cant)||0), 0);
    const prodsVan = ped.lineas.filter(l => (l.entregado != null ? l.entregado : l.cant) > 0).length;
    /* "Total a cobrar" es lo que el motorista recoge EN EFECTIVO. Si el pago
       ya se reporto por transferencia, no recoge nada, y decirle que cobre
       veinticinco dolares seria mandarlo a cobrar dos veces. */
    const pagoTransf = !!(ped.pago && ped.pago.metodo === "transferencia" &&
      (ped.pago.estado === "reportado" || ped.pago.estado === "confirmado"));
    const confirmado = totalEntrega(ped);
    const aCobrar = pagoTransf ? 0 : confirmado;
    const horaEnt = new Date().toLocaleTimeString("es-SV", {hour:"numeric", minute:"2-digit"});

    $("#hoja-cuerpo").innerHTML =
      '<div class="eyebrow">Entrega · ' + escapar(cliente.codigo || "") + '</div>' +
      '<h2>' + escapar(cliente.nombre) + '</h2>' +
      '<p style="font-size:13px;color:var(--tenue);margin:5px 0 0">Levantado por ' +
        escapar(ped.preventaNombre || "") + '</p>' +
      '<div class="e-resumen" id="e-resumen">' + pzasVan + ' de ' + pzasTot + ' piezas' +
        ' \u00b7 ' + prodsVan + ' de ' + ped.lineas.length + ' productos</div>' +
      /* Evidencia arriba y de a dos, como Handy: la foto y la firma juntas,
         antes de la lista, no escondidas hasta abajo. */
      '<div class="e-par"><div>' + bloqueFoto() + '</div>' +
        '<div><button class="btn linea" id="e-firma">' +
          (S.firma ? 'Firma \u2713' : 'Firma') + '</button></div></div>' +
      bloqueFirma() +
      '<button class="btn linea" id="e-todos" style="margin-top:10px">MARCAR TODOS</button>' +
      '<label class="campo"><span>Forma de pago</span><select id="e-pago"' +
        (pagoTransf ? ' disabled' : '') + '>' +
        '<option value="efectivo"' + (pagoTransf ? '' : ' selected') + '>Efectivo</option>' +
        '<option value="transferencia"' + (pagoTransf ? ' selected' : '') + '>Transferencia</option>' +
      '</select></label>' +
      (ped.pago && ped.pago.estado === "reportado"
        ? '<div class="aviso dato">Transferencia anotada (' + escapar(ped.pago.referencia || "") +
          '). Falta que oficina la confirme.</div>'
        : (ped.pago && ped.pago.estado === "confirmado"
          ? '<div class="aviso bien">Pago confirmado por oficina.</div>' : '')) +
      '<div style="margin-top:12px">' + filas + '</div>' +
      '<div class="e-barra">' +
        '<div>Total del pedido: <b>' + money(ped.total) + '</b></div>' +
        '<div>Total confirmado: <b class="num">' + money(confirmado) + '</b></div>' +
        '<div>Total a cobrar: <b class="num" id="e-total">' + money(aCobrar) + '</b></div>' +
        '<div class="e-modo">Tipo de pago: ' +
          (pagoTransf ? "Transferencia" : "Contado") + ' \u00b7 ' + escapar(horaEnt) + '</div>' +
      '</div>' +
      '<label class="campo"><span>Observación (opcional)</span>' +
        '<input id="e-nota" type="text" placeholder="Ej: quedó pendiente una caja"></label>' +
      '<button class="btn" id="e-guardar" style="margin-top:16px">Guardar la entrega</button>' +
      '<button class="btn linea" id="e-nada" style="margin-top:9px;color:var(--rojo);border-color:var(--rojo)">' +
        'No se pudo entregar</button>' +
      '<button class="btn secundario" id="e-volver" style="margin-top:9px">Volver</button>';

    cablearFoto(pinta);
    cablearFirma(pinta);
    if ($("#e-pago")) $("#e-pago").onchange = e => {
      if (e.target.value === "transferencia") hojaTransferencia(ped, cliente, totalEntrega(ped));
    };
    const refrescar = () => {
      $$("#hoja-cuerpo .e-cant").forEach(inp => {
        const i = Number(inp.dataset.i), l = ped.lineas[i];
        let q = Math.max(0, Math.min(l.cant, parseInt(inp.value) || 0));
        inp.value = q; l.entregado = q;
        const t = $("#hoja-cuerpo .e-tot[data-i='" + i + "']");
        if (t) t.textContent = money(q * l.precio);
      });
      $("#e-total").textContent = money(totalEntrega(ped));
      const r = $("#e-resumen");
      if (r){
        const van = ped.lineas.reduce((a,l) => a + (l.entregado != null ? Number(l.entregado) : Number(l.cant)||0), 0);
        const pv = ped.lineas.filter(l => (l.entregado != null ? l.entregado : l.cant) > 0).length;
        r.textContent = van + " de " + pzasTot + " piezas \u00b7 " + pv + " de " + ped.lineas.length + " productos";
      }
    };
    $$("#hoja-cuerpo .e-cant").forEach(inp => inp.addEventListener("input", refrescar));
    $$("#hoja-cuerpo .e-op").forEach(b => b.onclick = () => {
      const i = Number(b.dataset.i), l = ped.lineas[i];
      l.entregado = b.dataset.m === "completo" ? l.cant
                  : b.dataset.m === "nada" ? 0
                  : (l.entregado != null && l.entregado > 0 && l.entregado < l.cant ? l.entregado : Math.max(1, l.cant - 1));
      pinta();
    });
    if ($("#e-todos")) $("#e-todos").onclick = () => {
      ped.lineas.forEach(l => { l.entregado = l.cant; });
      pinta();
    };
    $$("#hoja-cuerpo .e-menos").forEach(b => b.onclick = () => {
      const inp = $("#hoja-cuerpo .e-cant[data-i='" + b.dataset.i + "']");
      inp.value = Math.max(0, (parseInt(inp.value)||0) - 1); refrescar();
    });
    $$("#hoja-cuerpo .e-mas").forEach(b => b.onclick = () => {
      const inp = $("#hoja-cuerpo .e-cant[data-i='" + b.dataset.i + "']");
      const l = ped.lineas[Number(b.dataset.i)];
      inp.value = Math.min(l.cant, (parseInt(inp.value)||0) + 1); refrescar();
    });

    $("#e-volver").onclick = () => hojaCliente(cliente);
    $("#e-guardar").onclick = () => cerrarEntrega(ped, cliente, false);
    $("#e-nada").onclick = () => hojaNoRecibio(ped, cliente);
  };
  pinta();
  $("#fondo").classList.add("abierto"); $("#hoja").classList.add("abierta");
}

/* ===================== cobro por transferencia =====================
   El caso: la tienda no tiene efectivo y quiere transferir. Antes tocaba
   llamar a oficina para pedir el numero de cuenta. Ahora va en la app.
   Transfer365 del Banco Central conecta a todos los bancos, es inmediato
   y no cobra comision, asi que da igual con quien trabaje el cliente. */
function hojaTransferencia(ped, cliente, monto){
  const cuentas = (S.ajustes.cuentas || []).filter(c => c && c.numero);
  const cuerpo = $("#hoja-cuerpo");

  if (!cuentas.length){
    cuerpo.innerHTML =
      '<div class="eyebrow">Cobro por transferencia</div><h2>Faltan las cuentas</h2>' +
      '<div class="aviso">Todav&iacute;a no hay cuentas cargadas. ' +
      'El administrador las pone en Administrar &rarr; Ajustes &rarr; Cuentas para transferencia.</div>' +
      '<button class="btn secundario" id="tr-volver" style="margin-top:14px">Volver</button>';
    $("#tr-volver").onclick = () => hojaEntrega(ped, cliente);
    return;
  }

  const textoDe = c =>
    "Pago a " + (c.titular || "Distribuidora") + "\n" +
    "Banco: " + (c.banco || "") + "\n" +
    "Cuenta: " + c.numero + (c.tipo ? " (" + c.tipo + ")" : "") +
    (c.celular ? "\nTransfer365 al celular: " + c.celular : "") +
    "\nMonto: " + money(monto) +
    "\nConcepto: " + (cliente.codigo || cliente.nombre);

  const qrDe = txt => {
    try {
      const q = qrcode(0, "M");
      q.addData(txt);
      q.make();
      return q.createSvgTag({cellSize:4, margin:8, scalable:true});
    } catch(e){ return '<div class="conteo">No se pudo dibujar el QR</div>'; }
  };

  cuerpo.innerHTML =
    '<div class="eyebrow">Cobro por transferencia</div>' +
    '<h2>' + escapar(cliente.nombre) + '</h2>' +
    '<div class="meta-cifras" style="margin-top:10px">' +
      '<span class="eyebrow">A cobrar</span>' +
      '<b class="num" style="font-size:29px">' + money(monto) + '</b>' +
    '</div>' +
    '<div class="aviso dato">Puede transferir desde cualquier banco por Transfer365. ' +
      'Es inmediato y sin comisi&oacute;n.</div>' +
    cuentas.map((c, i) =>
      '<div class="pasos">' +
        '<div class="eyebrow">' + escapar(c.banco || "Banco") + '</div>' +
        '<p style="font-size:14px;margin:6px 0 0">' + escapar(c.titular || "") + '</p>' +
        '<p class="num" style="font-size:23px;font-weight:800;margin:6px 0 0;word-break:break-all">' +
          escapar(c.numero) + '</p>' +
        (c.tipo ? '<p style="font-size:13px;color:var(--tenue);margin:2px 0 0">' + escapar(c.tipo) + '</p>' : '') +
        (c.celular ? '<p style="font-size:14px;margin:8px 0 0">Transfer365 al celular <b>' +
          escapar(c.celular) + '</b></p>' : '') +
        '<div style="max-width:220px;margin:12px auto 0">' + qrDe(textoDe(c)) + '</div>' +
        '<p style="font-size:12px;color:var(--tenue);text-align:center;margin:6px 0 0">' +
          'Escanee con la c&aacute;mara para leer los datos sin equivocarse</p>' +
        '<button class="btn linea tr-copiar" data-i="' + i + '" style="margin-top:12px">Copiar los datos</button>' +
        '<button class="btn linea tr-wa" data-i="' + i + '" style="margin-top:9px">Enviar por WhatsApp</button>' +
      '</div>').join("") +
    '<button class="btn" id="tr-listo" style="margin-top:16px">El cliente ya transfiri&oacute;</button>' +
    '<button class="btn secundario" id="tr-volver" style="margin-top:9px">Volver</button>';

  $$("#hoja-cuerpo .tr-copiar").forEach(b => b.onclick = () => {
    const t = textoDe(cuentas[Number(b.dataset.i)]);
    navigator.clipboard.writeText(t)
      .then(() => { b.textContent = "Copiado"; })
      .catch(() => { b.textContent = "No se pudo copiar"; });
  });
  $$("#hoja-cuerpo .tr-wa").forEach(b => b.onclick = () => {
    const t = textoDe(cuentas[Number(b.dataset.i)]);
    const tel = (cliente.telefono || "").replace(/\D/g,"");
    const num = tel.length === 8 ? "503" + tel : tel;
    window.open("https://wa.me/" + num + "?text=" + encodeURIComponent(t), "_blank");
  });
  $("#tr-volver").onclick = () => hojaEntrega(ped, cliente);
  $("#tr-listo").onclick = () => hojaComprobante(ped, cliente, monto);
}

/* La foto del comprobante NO es prueba de pago: se falsifica facil.
   Por eso queda como "reportado" y oficina lo confirma contra el banco. */
function hojaComprobante(ped, cliente, monto){
  S.foto = null;
  const pinta = () => {
    $("#hoja-cuerpo").innerHTML =
      '<div class="eyebrow">Transferencia recibida</div>' +
      '<h2>' + escapar(cliente.nombre) + ' · ' + money(monto) + '</h2>' +
      '<div class="aviso">Esto NO marca el pedido como pagado. Queda anotado y ' +
        'oficina lo confirma contra el estado de cuenta.</div>' +
      '<label class="campo"><span>N&uacute;mero de comprobante o referencia</span>' +
        '<input id="tc-ref" type="text" autocomplete="off"></label>' +
      '<label class="campo"><span>Banco desde el que transfiri&oacute;</span>' +
        '<input id="tc-banco" type="text" autocomplete="off"></label>' +
      bloqueFoto() +
      '<button class="btn" id="tc-guardar" style="margin-top:14px">Anotar la transferencia</button>' +
      '<button class="btn secundario" id="tc-volver" style="margin-top:9px">Volver</button>';
    cablearFoto(pinta);
    $("#tc-volver").onclick = () => hojaTransferencia(ped, cliente, monto);
    $("#tc-guardar").onclick = async () => {
      const ref = $("#tc-ref").value.trim();
      if (!ref) return alert("Escriba el n\u00famero de comprobante.");
      const ok = await guardarEn("pedidos", () => db.collection("pedidos").doc(ped.id).update({
        pago: {
          metodo: "transferencia", estado: "reportado", monto: monto,
          referencia: ref, banco: $("#tc-banco").value.trim(),
          comprobante: S.foto || null,
          reportadoPor: S.usuario.uid, reportadoPorNombre: S.nombre,
          reportadoEn: firebase.firestore.FieldValue.serverTimestamp()
        }
      }), $("#tc-guardar"));
      if (ok){
        S.foto = null;
        alert("Anotada. Oficina la confirma contra el banco.");
        hojaEntrega(ped, cliente);
      }
    };
  };
  pinta();
}

/* ============ plan de bonos del reparto ============
   Quincena 1: del 1 al 15 · Quincena 2: del 16 a fin de mes.
   El bono de eficiencia se pierde por tramos segun lo devuelto
   A CARGO del motorista (cliente ausente, sin dinero, olvido).
   Errores del preventista y producto danado van aparte. */
/* ===== El nombre de la empresa =====
   Sale de `empresa.js`, que es el unico archivo que se toca al instalar.
   Si ese archivo falta o viene a medias, la app NO se cae: contesta con
   un rotulo neutro y se sigue trabajando. Un nombre mal puesto no puede
   dejar a nadie sin vender. */
function laEmpresa(){ return (window.EMPRESA || {}); }
/* ===== El logo, que puede no existir =====
   Un paquete nuevo NO trae logo, y esta bien que no lo traiga: mandar el
   logo de otra empresa adentro es peor que no mandar ninguno. Mientras no
   este el archivo, en su lugar va el nombre de la empresa escrito. El dia
   que alguien deje `logo.png` y `logo-oscuro.png` al lado del index, el
   dibujo aparece solo y no hay que tocar codigo.
   El `onerror` es lo que lo hace posible: si la imagen no carga, se borra
   y se escribe el nombre. Sin eso quedaria el icono roto del navegador. */
function marcaImg(clase, archivo){
  return '<img' + (clase ? ' class="' + clase + '"' : '') + ' src="' + archivo +
    '" alt="" onerror="marcaSinLogo(this)" onload="marcaRevisa(this)">';
}
/* Lo que va arriba del ticket. Sale de DOS lados y en este orden: lo que
   administracion escribio en Ajustes manda, y lo que este en blanco cae
   en el arranque de empresa.js. Asi el papel sale bien desde el dia uno,
   y el dia que administracion corrija algo, su version gana.
   Un campo escrito en puros espacios cuenta como en blanco: si no,
   borrarlo dejaria el ticket sin encabezado y sin manera de recuperarlo. */
function datosTicket(){
  const base = laEmpresa().ticket || {};
  const puesto = (S.ajustes && S.ajustes.ticket) || {};
  const r = {};
  ["razon","direccion","iva","nit","giro","tel","correo"].forEach(k => {
    const v = String(puesto[k] == null ? "" : puesto[k]).trim();
    r[k] = v || String(base[k] == null ? "" : base[k]).trim();
  });
  return r;
}
function empNombre(){ return laEmpresa().nombre || "La empresa"; }
function empLargo(){ return laEmpresa().nombreLargo || empNombre(); }
function empLema(){ return laEmpresa().lema || ""; }
/* El nombre del PROGRAMA, que no es el de la empresa. Si nadie le puso
   uno, se usa el de la empresa: mejor que diga "PERMED" a que ande con
   el nombre del producto de otra. */
function empApp(){ return laEmpresa().app || empNombre(); }
function esVenta(p){ return p && p.estado !== "rechazado"; }
function quincenaDe(fecha){ return Number(fecha.slice(8,10)) <= 15 ? 1 : 2; }
function mismaQuincena(fecha){
  return fecha && fecha.slice(0,7) === mesISO() && quincenaDe(fecha) === quincenaDe(hoyISO());
}
function esCargoMotorista(motivo){
  const m = (motivo || "").toLowerCase();
  return m.indexOf("error del preventista") < 0 && m.indexOf("da\u00f1ado") < 0 && m.indexOf("danado") < 0;
}
/* ¿Este no entregado le pesa al MOTORISTA en su bono de la quincena?
   Si oficina ya decidio de quien fue la culpa, eso manda sobre el motivo
   que escribio el motorista al cerrar. Vive aparte porque lo usan los DOS
   lados --el tablero de oficina y el telefono del motorista-- y antes cada
   uno contaba por su cuenta: oficina mandaba un cargo al motorista, la
   pantalla de oficina le bajaba el bono, y en su telefono el seguia viendo
   el bono viejo. */
function culpaDelMotorista(entrega, cargo){
  if (cargo && cargo.responsable) return cargo.responsable === "motorista";
  return esCargoMotorista(entrega && entrega.motivo);
}
/* 🪤 El otro bolsillo. La comision del preventista NO la mira el cargo:
   la mira devolucionPerdonada, en el PEDIDO (cuentaDelMes). Mandar un
   cargo "Al motorista" le bajaba el bono al motorista, pero al preventista
   le seguia pesando la devolucion: la pantalla decia "anulado" y el dia de
   pago decia otra cosa. Por eso al decidir se tocan los dos. */
function perdonAlPreventa(responsable){ return responsable !== "preventa"; }
function estadoDeCargo(responsable){ return responsable === "preventa" ? "aceptado" : "anulado"; }
function bonoTramo(devuelto){
  if (devuelto <= 50)  return {bono:25,   nombre:"Excelente"};
  if (devuelto <= 100) return {bono:17.5, nombre:"Bueno"};
  if (devuelto <= 150) return {bono:10,   nombre:"Atenci\u00f3n"};
  return {bono:0, nombre:"Sin bono"};
}

/* El motorista propone el cargo; el preventista lo acepta o rechaza
   desde su propio telefono. Aceptado = constancia para el dia de pago. */
async function proponerCargo(ped, cliente, sub){
  const monto = dosDec(Number(ped.total) || 0);
  const ok = await guardarEn("cargos", () => db.collection("cargos").add({
    fecha: hoyISO(), mes: mesISO(), pedidoId: ped.id,
    clienteId: cliente.id, clienteNombre: cliente.nombre, clienteCodigo: cliente.codigo || "",
    monto: monto, motivo: sub,
    deUid: S.usuario.uid, deNombre: S.nombre,
    paraUid: ped.preventaUid || null, paraNombre: ped.preventaNombre || "",
    estado: "propuesto",
    creado: firebase.firestore.FieldValue.serverTimestamp()
  }));
  if (!ok) return;
  cerrarEntrega(ped, cliente, true, "Error del preventista \u00b7 " + sub);
}

function totalEntrega(ped){
  /* El total = suma de los totales de linea YA redondeados (dosDec por linea),
     no el redondeo de la suma cruda. Asi el pedido, la entrega y el puente
     (porFacturar) salen del MISMO calculo y dicen el mismo numero.
     Hoy da igual porque las cantidades son enteras; es blindaje para cuando
     entren cantidades fraccionadas o precios de tres decimales. (Rev. Brayan) */
  return dosDec(ped.lineas.reduce((a,l) =>
    a + dosDec((l.entregado != null ? l.entregado : l.cant) * l.precio), 0));
}

/* Lo mismo pero a prueba de pedidos viejos o a medio guardar: si no trae
   lineas, cae al total del pedido en vez de reventar. */
function montoEntregado(ped){
  if (!ped || !Array.isArray(ped.lineas)) return Number(ped && ped.total) || 0;
  /* Por linea redondeada, igual que totalEntrega(): asi "cobrado" y
     "entregado" nunca difieren un centavo en pantalla. */
  return dosDec(ped.lineas.reduce((a,l) =>
    a + dosDec((Number(l.entregado != null ? l.entregado : l.cant)||0) * (Number(l.precio)||0)), 0));
}

/* El motorista dice POR QUE no recibieron: queda en el pedido y en el

    '<button class="btn secundario" id="nr-volver" style="margin-top:9px">Volver</button>';

      '<div class="aviso dato">Se le manda el cargo de ' + money(Number(ped.total)||0) + ' a ' +
        escapar(ped.preventaNombre || "el preventista") + '. \u00c9l lo acepta o lo rechaza ' +
        'desde su tel\u00e9fono, y eso queda de constancia para el d\u00eda de pago. ' +

      '</div>' +
      '<button class="btn secundario" id="np-volver" style="margin-top:12px">Volver</button>';

    $$("#hoja-cuerpo .np-sub").forEach(b => b.onclick = () => proponerCargo(ped, cliente, b.dataset.m));
  };
}

async function cerrarEntrega(ped, cliente, ninguno, motivo){
  /* El kilometraje de salida es obligatorio antes de la primera entrega
     del día (lo pidió el jefe): sin eso nunca se sabe cuánto rodó el
     camión. Se revisa aquí porque es el único lugar por donde pasan las
     tres formas de cerrar una entrega (entregada, rechazada, error). */
  if (S.rol === "despacho" && datosCamion().kmSalida == null){
    alert("Antes de la primera entrega, anote el marcador de salida del camión.\n\n" +
      "Está en la pestaña CAMIÓN, aquí arriba.");
    cerrarHoja();
    vistaReparto = "camion";
    pintarDiaReparto();
    return;
  }
  /* Credito fiscal sin NIT o NRC: oficina no puede emitir el CCF. Antes
     nada lo frenaba y la venta llegaba a facturacion coja. Se pregunta;
     si el motorista sigue, va como consumidor final y queda dicho. */
  let comoConsumidor = false;
  if (!ninguno && esContribuyente(cliente)){
    const f = cliente.fiscal || {};
    if (!String(f.nit || "").trim() || !String(f.nrc || "").trim()){
      if (!confirm("Este cliente pide CRÉDITO FISCAL pero le falta el NIT o el NRC.\n\n" +
        "Sin eso oficina no puede emitir el crédito fiscal.\n\n" +
        "¿Entregar y facturar como CONSUMIDOR FINAL?\n\n" +
        "(Cancelar = no cerrar todavía; que el preventa complete los datos.)")) return;
      comoConsumidor = true;
    }
  }
  const lineas = ped.lineas.map(l => Object.assign({}, l,
    {entregado: ninguno ? 0 : (l.entregado != null ? l.entregado : l.cant)}));
  const total = ninguno ? 0 : totalEntrega(ped);
  const completo = lineas.every(l => l.entregado === l.cant);
  const estado = ninguno ? "no entregado" : (completo ? "entregado" : "entregado parcial");
  const nota = ($("#e-nota") && $("#e-nota").value.trim()) || "";
  const boton = ninguno ? $("#e-nada") : $("#e-guardar");
  const ahora = () => firebase.firestore.FieldValue.serverTimestamp();

  /* Las salidas de kardex se arman ANTES de escribir, para que puedan viajar
     dentro del mismo lote que el pedido, la entrega y el puente. */
  const movs = movimientosDeEntrega(ped, cliente, lineas);

  const ok = await guardarEn("pedidos", async () => {
    /* ===== UN SOLO LOTE: o entra todo, o no entra nada =====
       ANTES eran escrituras sueltas, una tras otra. Si la senal se caia en
       medio quedaba el pedido marcado como entregado SIN su copia en el
       puente: una venta real que oficina nunca facturaba, y nadie se
       enteraba hasta que echaba de menos la factura. Y el kardex se anotaba
       despues, sin esperarlo y con el error tragado.
       AHORA van juntos: pedido, entrega, puente y kardex.
       La EXISTENCIA no entra aqui a proposito: las reglas no dejan que
       reparto CREE la ficha de un producto que no la tiene, y meterla en el
       lote tumbaria la entrega entera. Va aparte, en aplicarExistencias(). */
    const lote = db.batch();

    lote.update(db.collection("pedidos").doc(ped.id), {
      estado: estado, lineas: lineas, totalEntregado: total,
      entregadoPor: S.usuario.uid, entregadoPorNombre: S.nombre,
      entregadoEn: ahora(),
      notaEntrega: nota, fotoEntrega: S.foto || null,
      motivoNoEntrega: ninguno ? (motivo || "sin motivo") : null
    });

    lote.set(db.collection("entregas").doc(), {
      fecha: hoyISO(), mes: mesISO(), pedidoId: ped.id,
      clienteId: cliente.id, clienteNombre: cliente.nombre, clienteCodigo: cliente.codigo || "",
      repartoUid: S.usuario.uid, repartoNombre: S.nombre,
      estado: estado, total: total, totalPedido: ped.total, nota: nota,
      motivo: ninguno ? (motivo || "sin motivo") : null,
      /* La firma va AQUI y no en el pedido: la regla de pedidos trae lista
         blanca de campos, y un campo nuevo alla haria rebotar la entrega
         entera con permission-denied. */
      firma: S.firma || null,
      creado: ahora()
    });

    /* ===== la cola de facturación: el puente con el sistema de oficina =====
       Una entrega real deja aqui su copia completa, lista para que el
       sistema de Abner la lea, facture y escriba de vuelta el DTE.
       El documento usa el ID DEL PEDIDO: una entrega = un documento,
       imposible facturar doble aunque el aviso llegue repetido. */
    if (!ninguno && total > 0){
      lote.set(db.collection("porFacturar").doc(ped.id), {
        pedidoId: ped.id,
        fechaEntrega: hoyISO(), mes: mesISO(),
        clienteId: cliente.id, clienteNombre: cliente.nombre,
        clienteCodigo: cliente.codigo || "", clienteTelefono: cliente.telefono || "",
        fiscal: comoConsumidor ? null : (cliente.fiscal || null),
        fiscalNota: comoConsumidor ? "Cliente de crédito fiscal sin NIT/NRC: se factura como consumidor final" : null,
        clienteDireccion: cliente.direccion || ped.clienteDireccion || "",
        ticketNo: ped.ticketNo || null,
        lineas: lineas.filter(l => l.entregado > 0).map(l => ({
          cod: l.cod, nombre: l.nombre, unidad: l.unidad || unidadDe(l.cod),
          cant: l.entregado,
          precio: l.precio, total: dosDec(l.entregado * l.precio),
          gravado: gravadoDe(l.cod)
        })),
        total: total,
        pago: ped.pago ? {metodo: ped.pago.metodo || "", estado: ped.pago.estado || ""} : {metodo: "efectivo", estado: ""},
        repartoUid: S.usuario.uid, repartoNombre: S.nombre,
        preventaUid: ped.preventaUid || null, preventaNombre: ped.preventaNombre || "",
        estadoFactura: "pendiente",
        dte: null,
        actualizado: ahora()
      });
    }

    movs.forEach(m => lote.set(db.collection("movimientos").doc(), m));

    /* Sin senal el lote queda en el telefono y sube solo; no se espera
       para siempre con el motorista parado en la puerta del cliente. */
    if (await esperarEscritura(lote.commit())){
      nota("Sin señal: la entrega quedó guardada en el teléfono y sube sola cuando vuelva la señal.");
    }
  }, boton);
  if (!ok) return;

  aplicarExistencias(movs);
  S.foto = null; S.firma = null; S.firmaAbierta = false;
  cerrarHoja(); pintarRuta();
}

/* Lo que de verdad salio de bodega: lo que el motorista entrego.
   Se anota una salida por producto, amarrada al cliente y al pedido, y la
   existencia baja sola. Bodega no teclea nada: el kardex se llena con el
   trabajo del dia. Si el cliente recibio menos, baja menos; si no recibio,
   no baja nada, porque el producto vuelve al camion y de ahi al estante.
   Aqui solo se ARMAN los documentos; quien los escribe es cerrarEntrega,
   dentro del lote. El correlativo lleva corrimiento: antes las lineas de
   una misma entrega salian todas con el MISMO numero, porque las contaba
   sobre S.movs sin haber guardado ninguna todavia. */
function movimientosDeEntrega(ped, cliente, lineas){
  const movs = [];
  (lineas || []).forEach(l => {
    const sale = Number(l.entregado != null ? l.entregado : l.cant) || 0;
    if (sale <= 0) return;
    /* Si lo que se vendio es la PRESENTACION de otro producto (un six pack,
       una caja...), el que baja de bodega es el de ABAJO (producto base),
       y baja las unidades que trae, no una por bulto. La tabla es la misma
       que usa Portafolio (equivalencias()): un solo lugar donde cargar
       "cuantas unidades trae cada presentacion". */
    const equiv = equivalencias().find(e => e.pres === l.cod);
    const factor = equiv ? equiv.factor : 1;
    const codBodega = equiv ? equiv.base : l.cod;
    movs.push(docMovimiento({
      tipo: "salida", cod: codBodega, unidades: dosDec(sale * factor),
      unidad: unidadDe(codBodega),
      presentacion: factor !== 1 ? "bulto" : "unidad", porBulto: factor, bultos: factor !== 1 ? sale : 0,
      area: "reparto",
      nota: "entrega a " + (cliente && cliente.nombre ? cliente.nombre : ped.clienteNombre || "") +
        " · pedido " + (ped.id || "").slice(0,6) +
        (factor !== 1 ? " · vendido como " + (l.nombre || l.cod) : ""),
      pedidoId: ped.id || null,
      clienteId: ped.clienteId || null
    }, movs.length));
  });
  return movs;
}

/* La existencia se mueve DESPUES del lote y a proposito fuera de el.
   Motivo: reglas-firestore deja que cualquier cuenta activa ACTUALICE una
   ficha de existencia, pero solo admin y bodega pueden CREARLA. Un producto
   sin ficha hace que la escritura sea un "create", y si eso fuera dentro del
   lote se caeria la entrega completa: el motorista no podria entregar.
   Antes el fallo se tragaba con un .catch(()=>{}) y nadie se enteraba de que
   el kardex y la existencia habian quedado diciendo cosas distintas. Ahora
   queda anotado y sale en Diagnostico, para que bodega lo cuadre. */
function aplicarExistencias(movs){
  (movs || []).forEach(m => {
    const signo = m.tipo === "salida" ? -1 : 1;
    const ref = db.collection("existencias").doc(m.cod);
    /* Sin ficha no hay nada que bajar: "lo que no aparezca se vende sin
       tope" (Bodega), y la verdad del inventario es el kardex, que ya se
       escribio en el lote. Antes se intentaba CREAR la ficha, reparto no
       tiene permiso, y el fallo quedaba guardado en el telefono como
       "pendiente" en cada entrega. */
    ref.update({
      disponible: firebase.firestore.FieldValue.increment(signo * m.unidades),
      actualizado: firebase.firestore.FieldValue.serverTimestamp()
    }).catch(e => {
      if (e && e.code === "not-found") return;
      anotarExistenciaPendiente(m, e);
    });
  });
}

/* Las existencias que no se pudieron mover quedan guardadas en el telefono
   (las ultimas 50) y salen en Diagnostico. No se pierde el dato: bodega
   sabe exactamente que producto quedo sin cuadrar y de que pedido. */
function anotarExistenciaPendiente(mov, e){
  try {
    const L = existenciasPendientes();
    L.push({cuando: new Date().toISOString(), cod: mov.cod, nombre: mov.nombre,
            tipo: mov.tipo, unidades: mov.unidades, pedidoId: mov.pedidoId || null,
            codigo: (e && (e.code || e.message)) || "desconocido"});
    localStorage.setItem("preventa_existencias_pendientes", JSON.stringify(L.slice(-50)));
  } catch(_){}
}
function existenciasPendientes(){
  try { return JSON.parse(localStorage.getItem("preventa_existencias_pendientes") || "[]"); }
  catch(_){ return []; }
}
